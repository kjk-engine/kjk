# The sim's hash moves on purpose: a stun baton (and TSL's plasma torch)
# swings KOTOR's two baton swings in turn, a new swing starting a quarter
# second after the last one's hit, each hit dealing the part of a round's
# damage its swing takes, and its on-hit properties rolling that part of
# their chance. A creature holding a baton walks up to punching distance
# instead of stopping at a sword's.
sim = "stun batons swing KOTOR's two baton swings about four times a round, each hit dealing a part of a round's damage and rolling that part of each on-hit chance; creatures with a baton walk up to punching distance"

[formats]
snapshot = "a fighter keeps when its last stun baton swing began (`Fighter::swung_at`)."

[migrations]
snapshot = "old saves read `swung_at = 0`: a baton swing under way when the game was saved deals no blow after loading"
