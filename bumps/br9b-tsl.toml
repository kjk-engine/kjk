# The sim's hash moves on purpose (beyond the snapshot bump): why.
sim = "each room keeps the clip scripts last played on it, so a script playing one room's clip no longer stops another's (104per's Harbinger)"

[formats]
snapshot = "the area's sound carries the clip scripts play on each room (`AreaSound::rooms`), not only the last one played."

[migrations]
snapshot = "old saves read as before: the one room clip's flag byte reads as a count of one"
