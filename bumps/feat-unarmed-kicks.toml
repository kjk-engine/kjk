# The sim's hash moves on purpose: under the Advanced rules a character with
# no weapon does a spin kick when it presses Kick just after a punch, a kick
# to one side between two enemies is the split kick (slowed to 60%), and the
# snapshot keeps when a character's last punch began.
sim = "under the Advanced rules, a spin kick out of a punch, and the split kick between two enemies, played at 60% speed"

[formats]
snapshot = "a fighter keeps when its last punch with bare hands began (`Fighter::punched_at`)."

[migrations]
snapshot = "old saves read `punched_at = 0`: a punch under way when the game was saved cannot be followed by a spin kick after loading"
