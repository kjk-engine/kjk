# A character's Force state keeps the window in which an attack starts the
# pull stab or the pull swing.
[formats]
snapshot = "a character's Force state keeps until when an attack starts the pull stab or the pull swing, and whether the attack key has been up since the pull (`ForceState::pull_attack_until`, `ForceState::pull_attack_released`)."
[migrations]
snapshot = "an older snapshot reads 0 and false: no pull attack is open in it"
