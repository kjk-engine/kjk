# A module's announcement tells a guest which of its script library's data
# differs from the host's.
#
# A talk-table line of only spaces now reads as no line. The sim hash does
# not move, and no format changes for it. Level digests move only on a
# machine with Aspyr's Windows K1 dialog.tlk, and only for end_m01aa,
# tar_m02af, tar_m04aa, lev_m40ac, unk_m44ac, stunt_00, stunt_03a, stunt_18
# and stunt_31b. Those digests become the ones a Mac already has. A save
# made in one of those modules on Windows is re-stamped when it loads.
[formats]
install = "the script library's digest, its digest without the game text, and the digests of the game text it reads and of its voiced lines' lengths (`Digests::scripts`)."
