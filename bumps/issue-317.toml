# The party selection screen follows KOTOR 2's executable: the screen
# opened in play changes the party in TSL, a script's screen opens with
# only its forced companions picked, and backing out cancels.
sim = "the party selection screen cancels on Back, opens with the forced companions alone, and changes the party in play in TSL"

[formats]
save = "a script's open party selection screen keeps whether the player may back out of it (`Selection::cancel`)."

[migrations]
save = "old saves read `cancel = false`: the screen's script did not allow backing out"
