sim = "TSL's wrist launcher fires what the grenade button takes: grenades as their launched rows (the executable's ConvertGrenadeSpellID), rockets and darts only with one worn; launched shots fly straight at the executable's speed for their distance and burst on what they meet, k_sup_grenade cast with the body met as its target."

[formats]
pack = "an item's kinds byte carries a wrist launcher (bit 4, `ItemFacts::launcher`: `baseitems.2da` `itemtype` 48)."

[migrations]
pack = "an old pack's kinds byte reads as before, its items no launchers (bit 4 clear); packs are built again from the install once the version moves, so Mira's launcher is read then."
