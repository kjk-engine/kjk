sim = "GetFirstPC and GetNextPC name each seat's main character, never the companion the first seat leads. Scripts that ask for GetFirstPC while a companion leads now get the main character. GetIsPC still counts the leading companion. Items now stack only when their plot flags and their charges match, as in both games. An item edited at an upgrade bench joins a matching stack, and so does a worn item its wearer can no longer wear. Loading a story no longer merges saved items of one template into a stack, and it restores each item's plot, droppable, identified and non-equippable flags."
