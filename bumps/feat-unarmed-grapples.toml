# The sim's hash moves on purpose: under the Advanced rules a character with
# bare hands grabs with the alternate attack button, and a grab that holds
# plays one of three grapple finishers on both characters.
sim = "under the Advanced rules, a grab with bare hands and three grapple finishers"

[formats]
snapshot = "a fighter keeps the grab it is in, holding or held (`Fighter::grapple`)."

[migrations]
snapshot = "old saves read `grapple = None`: no character in a save is in a grab"
