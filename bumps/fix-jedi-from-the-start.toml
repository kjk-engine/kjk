# The sim's hash moves on purpose: a script reads a class AddMultiClass gave
# at once (GetClassByPosition, GetLevelByClass, GetLevelByPosition), and a
# name a script gives a template or script is cut to the 16 characters a
# resref holds.
sim = "a class taken up counts at once, before its first level; script resrefs are cut to 16 characters; a script's delays after it shows the upgrade bench wait until the bench closes"

[formats]
save = "deferred code keeps whether it waits for the upgrade bench (`Delayed::bench`), and the scripts' state when a script showed the bench (`State::bench_up`)."

[migrations]
save = "old saves read no deferred code as waiting for the bench and no bench as up: what they hold runs as it did"
