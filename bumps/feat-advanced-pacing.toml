# The sim's hash moves on purpose: under the Advanced rules a fighter with a
# melee weapon walks near its target and keeps a sidestep or a choice for a
# while, so the fight plays out differently. A Skilled fighter also charges,
# and a fighter with a melee weapon closes on a target with a blaster in the way
# that fits what it can do.
sim = "Under the Advanced rules a fighter with a melee weapon walks near its target, keeps a sidestep for 0.5 to 1.5 seconds and keeps a choice to advance, retreat or stand for at least 0.5 seconds. It also reads its target: it presses a tired target, swings at once at a reeling target or a turned back, backs off when tired, and an Ordinary or Skilled fighter steps away from a kata. It kicks a target that has held a block for 2 seconds. A Skilled fighter charges its target: it stands in its block stance for 0.6 seconds, runs at the target and ends with a lunge or a swing made at a run, which a tired fighter cannot block. A fighter with a melee weapon closes on a target with a blaster: one that deflects bolts walks at it with its guard up, stands while a bolt is on its way and for 0.4 seconds after the target's last shot, and charges from 8 meters; one that cannot deflect runs at it. A creature with a blaster in the Advanced rules also notes the time of its last shot."

[formats]
snapshot = "a blade wielder's pace keeps when its target began to back away, when it last did and when the pace last thought, its sidestep's end and side, and when its choice may change again, since when its target has held a block, when it won its last saber lock, and whether it was in a lock, is backing off or has rested (`Pace::receding_since`, `receding_last`, `last_look`, `sidestep_until`, `sidestep_side`, `decided_until`, `decided_way`, `block_since`, `lock_won_at`, and one byte of flags for `locked`, `backing_off` and `rested`) and its keys for crouching or jumping, the alternate attack and the kick (`Keys::up`, `Keys::alt`, `Keys::kick`, and how many kicks it has pressed against the held block and when it pressed the last (`Pace::kick_tries`, `Pace::kick_last`), and its charge: how far it has come, when its wind-up ends or the run is given up, whom it is at, whether it ends with the lunge and when it may charge again (`Pace::charge`, `Pace::charge_until`, `Pace::charge_foe`, `Pace::charge_lunge`, `Pace::again_at`). A blade wielder's duel also keeps when its wind-up ends and whether its charge is under way (`Duel::windup_until`, `Duel::charging`)."
save = "the snapshot a save holds keeps the twenty-two new fields of a blade wielder's pace and the two new fields of its duel."
replay = "the snapshot a replay starts from keeps the twenty-two new fields of a blade wielder's pace and the two new fields of its duel."

[migrations]
snapshot = "old saves read the twenty-two new pace fields and the two new duel fields as zero: no sidestep, no kept choice, no backing target, no block, no won lock, no rest, no kick, no kick count, no charge and no wait before one"
save = "a save's own sections are unchanged, and the snapshot it holds is read by the snapshot's own version, so an old save loads"
