# The sim's hash moves on purpose: the session's saber rules and the duel
# modes' meters are stepped and kept.
sim = "the blades play by the session's saber rules (JA, or the duel modes MD and MDA): block button, block points, perfect blocks, mishaps, fatigue, the duel exchanges, bolts, kicks, wear, locks and creatures; under JA the duel modes' rules play no part (the m6 trace equal field for field but the encodings' hashes, before the pair and staff change below); and in every mode a creature in a fight stays in it while it keeps its foe in sight and reach, not only for 8 s after the last blow (a saber user chasing a foe out of its reach dropped it and put its blade away); under the duel modes a creature parries a blow only on KOTOR's chance to miss and turns bolts as under JA (Jedi Defense, Deflect, its arc and pause), and MDA's master discounts grow with the Jedi Defense tier, and only creatures' hilts wear (a player's never does), and a player's melee blade it is proficient with holds a block as a lightsaber does (turning no bolts), and MDA's block stance is not taken by a creature hunting its foe along a route (two such held each other off a wall's corner to the cap); and what a push's impact script defers (K1's stun 2.55 s on, timed for KOTOR's knockdown) comes due once all the throw caught stand again; and under every rule set, JA too, a blow of two blades or a double-bladed one carries the second blade's own attack (KOTOR's second attack a round: the staff's whole, the pair's 60%), and a blade's graze (under 60% of a cut) makes its target flinch only by JA's odds, no longer for certain"

[formats]
snapshot = "the world keeps the session's saber rules (`Snapshot::saber_rules`) and a saber its duel meters and timers (`SaberState::duel`: points, mishaps, the block and perfect window, fakes, stance, sprint fuel, wear, the refill and guard timers); a command its held duel bits (`Command::holds`)."
replay = "a command carries its held duel bits, block and kick (`Command::holds`)."

[migrations]
snapshot = "old saves read JA's rules and full, unhurried duel meters: no save was made under a duel mode, and a kept command held no duel bits"
