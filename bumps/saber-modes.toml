# The sim's hash moves on purpose: the session's saber rules and the duel
# modes' meters are stepped and kept.
sim = "the blades play by the session's saber rules (JA, or the duel modes MD and MDA): block button, block points, perfect blocks, mishaps, fatigue, the duel exchanges, bolts, kicks, wear, locks and creatures; under the duel modes a creature parries a blow only on KOTOR's chance to miss and turns bolts as under JA (Jedi Defense, Deflect, its arc and pause), MDA's master discounts grow with the Jedi Defense tier, only creatures' hilts wear (a player's never does), a player's melee blade it is proficient with holds a block as a lightsaber does (turning no bolts), MDA's block stance is not taken by a creature hunting its foe along a route, a blow of two blades or a double-bladed one carries the second blade's own attack (KOTOR's second attack a round: the staff's whole, the pair's 60%), and a blade's graze (under 60% of a cut) makes its target flinch only by JA's odds; a scene plays by JA's rules under every saber mode (no duel meter spent, refilled or rewarded, no stance, the Force neither held nor given); under JA (the default) nothing plays differently: the m6 trace is equal to main's field for field but the encodings' hashes"

[formats]
snapshot = "the world keeps the session's saber rules (`Snapshot::saber_rules`) and a saber its duel meters and timers (`SaberState::duel`: points, mishaps, the block and perfect window, fakes, stance, sprint fuel, wear, the refill and guard timers); a command its held duel bits (`Command::holds`)."
replay = "a command carries its held duel bits, block and kick (`Command::holds`)."

[migrations]
snapshot = "old saves read JA's rules and full, unhurried duel meters: no save was made under a duel mode, and a kept command held no duel bits"
