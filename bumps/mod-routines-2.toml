# The sim's hash moves on purpose: TSLRCM's last routines, the actions on
# items lying about and three combat effects bound as TSL's executable works
# them; the whole party's loss waits a step for the module's
# `Mod_OnPlrDeath`, which now runs as a player's character falls.
sim = "ActionForceFollowObject, ActionPickUpItem, ActionPutDownItem, DoSinglePlayerAutoSave, GetLastPlayerDied, ShowSwoopUpgradeScreen, EffectInvisibility, EffectDamageReduction and EffectDamageShield bound; Mod_OnPlrDeath runs and the loss waits a step for it"

[formats]
snapshot = "a lasting effect keeps a third integer (`Lasting::third`: a damage reduction's limit left, a damage shield's damage type), and may be an invisibility, a damage reduction or a damage shield (`Modifies::Invisibility`, `DamageReduction`, `DamageShield`)."
save = "a queued action may be a forced follow, a pick-up or a put-down (`Action::Follow`, `PickUp`, `PutDown`), and a pending effect one of three integers (`Effect::Ints`: a damage reduction, a damage shield)."

[migrations]
snapshot = "old snapshots read `third = 0` (no limit), and hold none of the new kinds, which are new indices after the old"
save = "old saves read as they are: the new actions' and the reduction's tags are new, which no old save holds"
