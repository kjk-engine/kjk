# The party attacks a placeable of a `hostile` appearance (K1's Star Forge
# stasis tanks) while its faction is hostile; scripts change the factions of
# doors and placeables; a companion made from the party table wears what it
# wore when kept, though a script gave it away from an earlier spawn.
sim = "a placeable of a hostile appearance starts hostile and the party's weapons attack it; scripts change the factions of doors and placeables; a companion spawned from the party table wears its kept items again"

[formats]
save = "the scripts' state keeps the standard factions scripts gave doors and placeables (`State::factions`)."

[migrations]
save = "old saves read no faction changes for doors and placeables: none was kept before"
