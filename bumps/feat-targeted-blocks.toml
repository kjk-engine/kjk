# The snapshot keeps one more byte for the flag, one more byte for each
# saber's camera turn, two more bytes for each slot of a fighter's held
# hits, and two more bytes for each saber's late swing. While the turn is
# tracked (targeted blocks apply, and the body holds down block), the turn
# takes 214 bytes instead of one. With the flag off,
# the Advanced rules still change in the ways the `sim` line lists.
sim = "under the Advanced rules, a swing, a fake or an unblockable blow that strikes the blade of a fighter who neither blocks nor swings goes on to the body, starts no saber lock, and nobody records a parry. The attacker loses no Stamina for a blocked swing then. In a level without stance sets, a player's held block that parries an ordinary blow shows JA's broken parry on the torso, so the pose a snapshot keeps differs. A tired player who has been knocked down can roll away from the ground. A kick no longer always knocks an NPC down. It breaks a guarding NPC's guard 40% of the time, and knocks down any other NPC 25% of the time, or 60% of the time when the NPC is tired. A player's perfect block window lasts 400 ms, 300 ms or 200 ms by difficulty instead of 250 ms, 150 ms or 50 ms, and never more than 500 ms instead of 400 ms. With targeted blocks on, the window lasts 150% of that instead of 200%. A player who presses attack within 60 ms after a held block stops a blow makes the block perfect. This works only when a perfect block at the time of the blow would have blocked the blow perfectly, so a lunge past a tired player, two swings that meet and an unblockable blow are never made perfect late. With targeted blocks on, the late press reads the side of the swing that delivered the blow, and a swing with no side needs no aim. A player's perfect block window stays open for its full length after the player lets go of attack, and closes only when its time runs out, the block ends, or the first perfect block is made in it. One press of attack makes at most one perfect block, also in a level with stance sets. The start of a scene ends a fighter's block and closes its window. While the perfect block window is open, the torso shows an attempt at a perfect block. In a level without stance sets it plays JA's top right parry (or the top left parry) from the press of attack, and in a level with stance sets it shows the set's pose for block with attack, so the pose a snapshot keeps differs. A fighter who starts a kick loses 10 Stamina, whether or not the kick hits, and no longer regains 2 Stamina when the kick hits. This counts the four kicks, the three special kicks and the four air kicks, but not a bash with the hilt. A kick that turns into another kick move loses the 10 Stamina only once. A fighter with less than 10 Stamina cannot start a kick, and an NPC with less than 10 Stamina does not choose a kick to break a block. Under the Advanced rules a swing in the fast style plays at 0.80 of its normal speed instead of 0.95, and a swing in the strong style plays at 0.90 instead of 0.80"

[formats]
snapshot = "the world keeps whether the session plays with targeted blocks (`Snapshot::targeted_blocks`), the player's choice at the start of a game, which counts only under the Advanced rules. Each saber keeps the last camera turn of the body that holds block (`SaberState::turn`), which targeted blocks read as the player's aim. Each hit a fighter's grace holds back keeps the striker's move when the blade met the body (`Held::swung`), which targeted blocks read the swing's side from. Each saber keeps the move of the swing whose ordinary block a late press of attack may still make perfect (`Duel::late_swing`)."
save = "the snapshot a save holds keeps whether the session plays with targeted blocks, each saber's camera turn, and the striker's move of each held hit, and each saber's late swing."
replay = "the snapshot a replay starts from keeps whether the session plays with targeted blocks, each saber's camera turn, and the striker's move of each held hit, and each saber's late swing."

[migrations]
snapshot = "old saves read the flag as off, so a game started before this update plays without targeted blocks, every saber reads with no camera turn, every held hit reads with the ready move, which has no side, and every saber reads with no late swing"
save = "a save's own sections are unchanged, and the snapshot it holds is read by the snapshot's own version, so an old save loads"
