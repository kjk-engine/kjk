# The sim's hash moves on purpose: a creature is talked to within the
# conversation's reach across the floor however far above (Kumus on his
# ridge); the module's acquire hook's GetEnteringObject is the item's
# possessor; TSL's SetForceAlwaysUpdate flags an object, and a
# conversation's line finds such a speaker however far from the owner
# (Dhagon's call to Iziz's throne room); a local set on OBJECT_INVALID
# is kept nowhere and reads 0 (403DXN's tr_circle took 50 XP).
sim = "Onderon and Dxun: talking across height, the acquire hook's entering object the possessor, SetForceAlwaysUpdate kept and a far speaker it flags found, no locals on OBJECT_INVALID"

[formats]
save = "the script state keeps the objects SetForceAlwaysUpdate flagged (`State::always_update`)."

[migrations]
save = "old saves read with no object flagged: none was kept before"
