sim = "A conversation node's fade ends as the next node plays, scripted Force casts play KOTOR's cast clips and land as their conjuring ends, a script's powers in a cutscene are cast as KOTOR casts them, a cleared queue leaves a conversation pause on, and CancelCombat clears all actions. A script's lit saber is one act, party sabers go out in talk, a switched-away companion's creature goes, the conversed-with owns a talk, a talk's end clears the video effect, explosion deaths fall free, cinematic talks start from 10 m, and hostiles do nothing while the player talks (their queues cleared each step, as the exes' ClearAllPlayerHostileActions). A talent's use starts a combat round, on oneself too, so its end of round runs (the Star Forge freezer engages after its Resist Force)."
