# The sim's hash moves on purpose.
sim = "GetDistanceBetweenLocations2D and GetWeaponRanged answer a script (a mod's and the games' own), where they returned an empty value before; a script of a mod's install whose spells.2da or feat.2da rows the rows-by-label map moves gets its row numbers translated, and a level's script library holds the map (`rules::rows`, `sim::script::rows`). On the unmodded installs the map is the identity and no table, routine or digest changes for it"
