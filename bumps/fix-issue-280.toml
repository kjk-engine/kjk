# The sim's hash moves on purpose: the player and the companions are solid
# to each other again, and a character that keeps running into another for
# a second walks through it until the two have parted (`world::jams`).
sim = "party members are solid to each other, and a character stuck against another for a second walks through it until they part"

[formats]
snapshot = "a body keeps the character it keeps running into and those it walks through (`MotionState::jam`)."

[migrations]
snapshot = "old saves read an empty `jam`: nobody is running into anyone, and nobody walks through anyone"
