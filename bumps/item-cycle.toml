sim = "the item keys use the kind their user chose, and a party member with more kinds than slots keeps one for each key"

[formats]
snapshot = "a sheet's choices carry the item kind picked for each key, and a pack whether a pick dropped the grenade charge (`Picks::items`, `Pack::charge_off`)."
save = "a kept companion's choices carry the item kind picked for each key (`Picks::items`)."
replay = "a seat may pick the kind its item key uses (`Action::PickItem`, a new action code, 58)."

[migrations]
snapshot = "old saves read no item picks and no dropped charge: each key uses what it did"
save = "old saves read no item picks on a kept companion's sheet: each key uses what it did"
