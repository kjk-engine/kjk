# The sim's hash moves on purpose. Worn armour now bars Force powers.
sim = "A Force power is refused when the items the caster wears bar it, as both games decide it when a cast begins. Each spells.2da row's forbiditemmask and requireitemmask are checked against the kinds of item worn in any slot: each armour class from 4 to 9 sets its own bit, and a lightsaber sets the seventh. Most powers that work on the caster or its side are barred by any armour, and the saber throw needs a lightsaber (ModuleData::power_barred, force::items_bar)."

[formats]
snapshot = "a sheet's worn gear keeps the kinds of item worn that bar or allow Force powers (`Gear::force_items`)."
save = "a party member's kept sheet keeps the kinds of item worn that bar or allow Force powers (`Gear::force_items`)."
pack = "an item template keeps the bit it sets in the mask Force powers are checked against (`ItemFacts::force_item`)."

[migrations]
snapshot = "old snapshots read no item worn that bars a power; the mask is set again the next time the character's equipment changes"
save = "old saves read no item worn that bars a power; the mask is set again the next time the character's equipment changes"
pack = "old packs read items that bar and allow no power; the import step writes the pack again"
