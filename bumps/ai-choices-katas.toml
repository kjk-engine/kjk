# The sim's hash moves on purpose: Skilled fighters, elites and companions
# start special saber moves, and they roll or cartwheel out of danger.
sim = "Skilled fighters and companions start special saber moves and escape from danger"

[formats]
snapshot = "a mind keeps the escape it presses the keys of, its side, since when, and when it may start the next (`Pace::escape`, `escape_side`, `escape_since`, `escape_after`)."

[migrations]
snapshot = "old saves read no escape under way and `escape_after = 0`: every mind may start an escape at once"
