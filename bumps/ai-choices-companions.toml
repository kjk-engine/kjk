# The sim's hash moves on purpose: companions, and every creature on a stage
# without scripts, choose their own Force powers, items and grenades.
sim = "companions choose their own powers and grenades"

[formats]
snapshot = "a mind keeps the time until which its fight is intense (`Mind::intense_until`)."

[migrations]
snapshot = "old saves read `intense_until = 0`: no fight in a save is intense when it loads, until a companion's next look finds it intense"
