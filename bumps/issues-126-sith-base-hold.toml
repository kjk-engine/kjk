sim = "An object a script destroys at once runs no more events or delayed commands that step: a trigger that destroys itself on its first enter hears no second one from a body that came in with the first (Anchorhead's Ganda made twice in co-op, issue 126). A conversation holding the world ends the fight of every commandable hostile to the player each step, not only its queue: the attack its queue began that step, its blows not yet swung and the fight its mind kept on its own go too (Taris's Sith base: the assault droid and the turrets attacking through `tar09_trap_dlg`)."
