# The sim's hash moves on purpose: a companion RemoveNPCFromPartyToBase
# sends away is gone at once for the rest of the step's scripts and
# conversations (TSL's CSWPartyTable::KillNPCObject deletes its creature:
# 403DXN's k_403_enter makes Kreia anew); DestroyObject passes over a
# creature SetIsDestroyable(FALSE) keeps (the executable's destroy event
# does: 506OND's a_end_game raises Tobin's body for Kreia's scene); TSL's
# ChangeToStandardFaction leaves the player's own character as it is (Dxun's
# battle circle had turned every Friendly 2 creature on the Exile); local
# booleans past each game's slots (K1's 96, TSL's 160) are not kept; TSL's
# death XP is its executable's (the row of the level the XP reaches, an
# autobalanced creature's CRMod, GAME_XP_General); a test's mighty blow
# counts its weapon roll ten times over before the target's guards (the
# Sky Ramp's damaged force shield, Hardness 125).
sim = "The finale: companions sent to base gone at once, kept creatures not destroyed, TSL's PC faction kept, local boolean slots, TSL's death XP, a mighty weapon roll before the guards"

[formats]
pack = "a creature template carries TSL's MultiplierSet, its autobalance.2da row (`ObjectData::multiplier_set`)."

[migrations]
pack = "old saves read a kept companion's MultiplierSet as 0: no companion is autobalanced"
