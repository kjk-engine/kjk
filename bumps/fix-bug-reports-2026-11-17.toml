sim = "the player's own character sees up to 250 m and hears up to 20 m, as ranges.2da gives the player, so its perception draws from the sim's random stream; a GIT creature with no template and no appearance of its own is not placed; a character's scripted walk to a door heads for the door's action point, a queued door opening runs while a conversation holds the world, a player's walk begun in a conversation walks on after it ends, and a companion going back to its leader keeps going until it is within 13 m of the leader; a placeable's scripted activation, deactivation, opening or closing keeps its action queue waiting for the length of its model's transition clip, as KOTOR's does, instead of one second; GetReputation reads the faction of a door or placeable, as AdjustReputation already does, instead of returning -1 when either object is not a character; a short lightsaber's blade is 83.4% as long as a regular lightsaber's blade, for its hits, blocks and saber marks, and the left blade of a pair takes its length from the left hand's own weapon; a store opens for the companion that leads the party, and that companion's buying, selling and leaving reach the store, and in the party's bases the snapshot names the companions standing out of the party; a Movie Duels stance set holds 68 sequences instead of 61, the 7 new places being the lit blade's runs and backward walks (BOTH_RUN2, BOTH_RUN_DUAL, BOTH_RUN_STAFF, BOTH_RUNBACK2, BOTH_WALKBACK2, BOTH_WALKBACK_DUAL and BOTH_WALKBACK_STAFF), so a character in a set whose skeleton gives these sequences frames of its own, such as Galen Marek's, runs and walks backward with them, while a set without its own run still plays Jedi Academy's; a droid that rolls or floats (its appearance's footsteps) cannot jump or crouch"

[formats]
snapshot = "the tail names the companions standing out of the party in one of the party's bases (`waiting`), for the in-game pages; and a part's played number counts 68 places for each stance set instead of 61 (`stance::Played`)."

