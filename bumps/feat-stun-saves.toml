# The sim's hash moves on purpose.
sim = "a stun, stasis, fear, sleep or droid stun lasts its own duration up to 30 s instead of 3 s, its target rolls its save each round to break free with +5 for each earlier roll, and the second and third recent holds last half and a quarter (`ForceState::hold`)"

[formats]
snapshot = "a fighter's hold keeps its save, its next roll and its recent holds (`ForceState::save`)."

[migrations]
snapshot = "old saves read no save and no recent holds, so a running hold keeps its end and rolls nothing"
