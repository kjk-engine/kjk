# The sim's hash moves on purpose: under the Advanced rules a character with
# bare hands punches again as soon as its last punch ends, a press during a
# punch is kept for the next one, and the movement key held as a grab begins
# picks its finisher when none is held as it reaches.
sim = "under the Advanced rules, punches with bare hands chained one after another, and the finisher picked by the keys at the grab's start too"

[formats]
snapshot = "a fighter keeps its attack button as its punches read it (`Fighter::fists`) and the finisher its keys picked as its grab began (`Fighter::grab_pick`)."

[migrations]
snapshot = "old saves read no attack held or kept and no picked finisher: a punch or a grab under way when the game was saved goes on as though no key was held"
