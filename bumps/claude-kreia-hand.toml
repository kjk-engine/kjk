# The party table keeps what scripts made of a companion's body, and every
# companion standing in a module the party leaves (TSL's executable), so
# TSL's Kreia stays one-handed after 107PER; a body's locked slots refuse
# its player's equips.
sim = "the party table keeps companions standing in a module left, with their bodies; locked slots refuse a player's equip"

[formats]
save = "the party table keeps what scripts made of a companion's body (`party::Kept::look`)."

[migrations]
save = "old saves read no body change on a kept companion: it comes back in its template's body, as it did"
