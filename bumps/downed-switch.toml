# The sim's hash moves on purpose: when the body the first seat leads
# through is downed, the next standing party member leads (K1/TSL's leader
# passing on, `world::scripts::passes_on`); a body going down or getting up
# has its effects stripped (the poison that downed it no longer ticks, the
# Aurora engines' death, `combat::effects::strip`); a downed body gets up in
# the get-up for the side its death left it on (`combat::death::getup`:
# JA's BOTH_GETUP4 on the back, BOTH_GETUP3 on the front), and a script's
# resurrection of the downed plays it too; an arena's `down N` order.
sim = "a fallen leader's control passes to the next standing party member; going down or getting up strips the body's effects; the downed get up in the get-up for the side they lie on; the arena's down order"

[formats]
replay = "an arena order knocks the seat's body out in a chosen JA death (`ArenaOrder::Down`, arena order code 3)."
