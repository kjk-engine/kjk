# The sim's hash moves on purpose: TSL's k_align_movie runs as the status
# summary closes (the Visas Marr movies and her arrival on the Ebon Hawk);
# a companion spawned again while its creature is here is that creature,
# moved (SpawnAvailableNPC); a seat playing a creature arrives with it on
# its player's spot; a dead owner's conversation talks on, its body left
# until it ends, and a dead creature starts a conversation queued for it.
sim = "Nar Shaddaa: EffectDeath keeping the body, kept bodies the module's own, k_align_movie as the status summary closes, a companion spawned again moved, the played creature on the arrival spot, the dead's conversations"

[formats]
save = "an effect value may be EffectDeath keeping the body (`Effect::DeathKept`)."
