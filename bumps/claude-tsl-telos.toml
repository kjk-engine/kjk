# The sim's hash moves on purpose: a conversation pause keeps its place in
# its caller's queue (a clear before it ran drops it); a door a script
# opens itself runs its OnOpen; the lock action locks only a Lockable
# lock; GetObjectByTag finds held items; a heavy repeater's holder answers
# a blow with no clip; a companion spawned again replaces its last
# creature (one made and destroyed in a step is never put in); the
# companion leading the party punches at its player's press; the player
# restrict mode ends with its module; a minigame's area takes no
# companions (they wait in the module left); EffectResurrection raises the
# dead; the companion led has its player's test aids; a punch thrown from
# inside a bashable body's box lands on it.
sim = "Telos: queued pauses, self-opened doors' OnOpen, Lockable locks, held items by tag, one creature a companion, the led companion's punches, restrict mode per module, no companions in a minigame, resurrection of the dead, the led companion's aids, punches from a doorway"

[formats]
save = "a queued conversation pause (`Action::Pause`, its conversation)."

[migrations]
save = "old saves read as before: a queued pause is a new action code (58) no older save holds"
