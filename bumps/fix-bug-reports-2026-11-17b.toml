# The sim's hash moves on purpose.
sim = "Flurry no longer doubles a blow's damage, so an attack after a pause in the fast style, and its critical hit, no longer deals double damage; instead a single lightsaber in the fast style deals 140% damage with Flurry (`saber_moves.styles.fast_damage`), two lightsabers, a double-bladed lightsaber and bare hands attack 40% more often with Flurry (`saber_moves.styles.flurry_speed`), and an attack in the strong style counts up to 1200 ms of time between attacks (`saber_moves.styles.strong_time_ms`); under the Jedi Academy rules a gun feat attack (Power Blast, Rapid Shot or Sniper Shot) uses only stamina, so it no longer takes 15% of a Force user's maximum Force points; a grenade that touches a body bursts where that body stands, and a blast measures its reach to the nearest point between a character's chest and the bottom of its body, so a frag grenade now reaches the Taris sewer rancor; Force Whirlwind is its own effect and not a stun, so stun immunity and Force Immunity: Stun no longer stop it; a weapon with a weaponwield of 3 in baseitems.2da counts as a double weapon and as its own balanced off-hand weapon, so its main end takes -4 to hit instead of -6 without the two-weapon feats, and a quarterstaff, gaffi stick, Wookiee warblade or force pike takes two-weapon penalties; a 2DA cell that starts with 0x reads as a hexadecimal number, so the experience table's last row no longer reads as 0 and KOTOR 2 characters stop at level 50; KOTOR 1 characters can reach level 50, with KOTOR 2's experience formula and class rows for levels 21 to 50"
