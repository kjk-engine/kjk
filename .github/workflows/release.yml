# The player's packages (docs/RELEASE.md). A `v*` tag, which only the owner
# pushes, builds them and puts them on a draft Release with SHA256SUMS; the
# owner reviews the draft and publishes it. Run by hand, it builds the same
# packages as the run's artifacts and makes no Release.
#
# macOS on Apple silicon only so far; Windows, Intel Macs and Linux are to
# come. Nothing is signed (the owner's call; the player's readme says how
# to open the app).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: package (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` names the package by the tag.
          fetch-depth: 0

      # rust-toolchain.toml pins the version; this installs it.
      - name: Toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      # The dist profile's build, the icon, the crates' licences, packed.
      - name: package
        run: cargo xtask dist

      - name: check the package
        run: |
          cd target/packages
          tar -tzf kjk-*-macos-aarch64.tar.gz | sort
          for f in kjk.app/Contents/MacOS/kjk kjk.app/Contents/Info.plist \
                   kjk.app/Contents/Resources/kjk.icns README.txt LICENSE.txt \
                   NOTICE.txt THIRD-PARTY-LICENSES.html; do
            tar -tzf kjk-*-macos-aarch64.tar.gz | grep -q "/$f$" || { echo "missing $f"; exit 1; }
          done
          plutil -lint kjk-*-macos-aarch64/kjk.app/Contents/Info.plist
          codesign --verify --strict -vv kjk-*-macos-aarch64/kjk.app
          file kjk-*-macos-aarch64/kjk.app/Contents/MacOS/kjk
          kjk-*-macos-aarch64/kjk.app/Contents/MacOS/kjk --help

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: target/packages/*.tar.gz
          if-no-files-found: error

  release:
    name: draft release
    needs: [macos-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: checksums
        working-directory: packages
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" packages/*
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "kjk $GITHUB_REF_NAME"
          --notes "Unsigned builds. Read README.txt in the package first; SHA256SUMS lists each file's checksum."
