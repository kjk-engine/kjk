# The player's packages (docs/RELEASE.md). A `v*` tag, which only the owner
# pushes, builds and attests them (build provenance) and puts them on a
# draft Release with SHA256SUMS; the
# owner reviews the draft and publishes it; a tag with a suffix
# (`v0.14.0-rc.1`) is drafted as a pre-release. Run by hand, it builds the
# same packages as the run's artifacts and makes no Release, unless
# "pre-release" is ticked: then the branch it ran on gets a draft
# pre-release, tagged `pre-<branch>-<git describe>` when published.
#
# One package for each OS: macOS on Apple silicon (no Intel build), Windows
# and Linux on x86-64 (Linux on Ubuntu 22.04's older glibc, so it runs on
# newer systems and the Steam Deck too). Nothing is signed (the
# owner's call; the player's readme says how to open the app).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      prerelease:
        description: Also draft a pre-release of this branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # The attestation's signing identity and its store.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, runner: macos-15, artifact: macos-arm64 }
          - { name: Windows x86-64, runner: windows-latest, artifact: windows-x86_64 }
          - { name: Linux x86-64, runner: ubuntu-22.04, artifact: linux-x86_64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` names the package by the tag.
          fetch-depth: 0

      # rust-toolchain.toml pins the version; this installs it.
      - name: Toolchain
        run: rustup toolchain install

      # Bevy's window crates and the sound device (cpal) link these.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      # The sim steps alike on every OS (the pinned hash), or a player's
      # recording would not replay on another's machine: a release whose
      # sim differs here is not packed.
      - name: sim determinism
        run: cargo test --release -p approved_tests --test approved sim_determinism

      # The dist profile's build (the icon on macOS), the crates' licences,
      # packed. PowerShell, so Windows packs with its own tar (zips), not
      # Git Bash's.
      - name: package
        shell: pwsh
        run: cargo xtask dist

      - name: check the package
        run: |
          cd target/packages
          ls -la
          stage=$(ls -d kjk-*/ | head -n 1)
          for f in README.txt LICENSE.txt NOTICE.txt THIRD-PARTY-LICENSES.html THIRD-PARTY-LICENSES-save-editor.html; do
            test -f "$stage$f" || { echo "missing $f"; exit 1; }
          done
          # kjk and the save editor beside it, each started once.
          for pair in "kjk.app:kjk" "kjk Save Editor.app:kjk-save-editor"; do
            app="${stage}${pair%%:*}"
            binary="${pair##*:}"
            case "$RUNNER_OS" in
              macOS)
                plutil -lint "$app/Contents/Info.plist"
                test -f "$app/Contents/Resources/kjk.icns"
                codesign --verify --strict -vv "$app"
                program="$app/Contents/MacOS/$binary" ;;
              Windows) program="${stage}${binary}.exe" ;;
              *) program="${stage}${binary}" ;;
            esac
            file "$program" || true
            "$program" --help
          done

      # Proof the package came from this repository's workflow at this
      # commit: a Sigstore-signed provenance anyone can check with
      # `gh attestation verify <file> --repo kjk-engine/kjk`. Hand runs
      # attest too, so a package added to a Release later is covered.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/packages/*.tar.gz
            target/packages/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/packages/*.tar.gz
            target/packages/*.zip
          if-no-files-found: error

  # Drafted with the packages that built: GitHub's macOS arm64 runners are at
  # times not given at all ("not acquired ... after multiple attempts"), and
  # one OS missing should not hold back the others. The notes name what is
  # missing; it can be built and added to the draft later (docs/RELEASE.md).
  release:
    name: draft release
    needs: [package]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A pre-release is named by `git describe`, as its packages are.
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: checksums
        working-directory: packages
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built="" missing=""
          for pair in "macos-aarch64:macOS (Apple silicon)" "windows-x86_64:Windows (x86-64)" "linux-x86_64:Linux (x86-64)"; do
            label=${pair#*:}
            if compgen -G "packages/kjk-*-${pair%%:*}.*" >/dev/null; then
              built+="${built:+, }$label"
            else
              missing+="${missing:+, }$label"
              echo "::warning::no $label package: it is not on the draft"
            fi
          done
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A branch's pre-release: its tag is made at this commit when the
            # draft is published, and never starts with `v`, so it is not taken
            # for a release (`git describe --match 'v*'`) or start this workflow.
            version=$(git describe --tags --match 'v*' --always)
            slug=$(printf %s "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')
            tag="pre-$slug-$version"
            title="kjk $version ($GITHUB_REF_NAME)"
            intro="A pre-release of the branch \`$GITHUB_REF_NAME\` at ${GITHUB_SHA:0:7}, for testing: not a release, and not checked against earlier releases' saves as a release is. "
            how=(--target "$GITHUB_SHA" --prerelease)
          else
            tag=$GITHUB_REF_NAME
            title="kjk $tag"
            intro=""
            how=(--verify-tag)
            # `v0.14.0-rc.1`, `v0.14.0-beta`: a pre-release of a version.
            case $tag in *-*) how+=(--prerelease) ;; esac
          fi
          notes="${intro}Unsigned builds for $built. Read README.txt in the package first; SHA256SUMS lists each file's checksum; \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\` proves a package was built by this repository's release workflow."
          [ -z "$missing" ] || notes+=" The $missing build is not here yet."
          gh release create "$tag" packages/* \
            --repo "$GITHUB_REPOSITORY" --draft "${how[@]}" \
            --title "$title" --notes "$notes"
