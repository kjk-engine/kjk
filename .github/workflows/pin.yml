name: pin

# The merge's half of bumps/README.md: the bump files that reached main get
# their format versions and the sim hash's pin (`cargo xtask pin`), tested
# and put on the `pin` branch's pull request, as main's ruleset takes no
# push. A merge or push to main starts it by its paths. One at a time,
# never cancelled: each run takes every bump file on main as it finds it
# and makes `pin` again from main, so the open pull request always holds
# every pending file; a run that finds none does nothing (merging the pull
# request's own run among them). A pull request opened with this run's
# token starts no workflow, so the run starts ci on `pin` itself, for the
# checks main's ruleset requires.
on:
  push:
    branches: [main]
    paths: ["bumps/*.toml"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  pin:
    runs-on: ubuntu-latest
    concurrency:
      group: pin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The order the bump files were added in.
          fetch-depth: 0

      - name: Bump files
        id: pending
        run: |
          if compgen -G "bumps/*.toml" > /dev/null; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "no bump files on main"
          fi

      - name: Toolchain
        if: steps.pending.outputs.any
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: steps.pending.outputs.any

      - name: cargo xtask pin
        if: steps.pending.outputs.any
        run: cargo xtask pin --message "$RUNNER_TEMP/pin-message"

      - name: approved tests
        if: steps.pending.outputs.any
        run: cargo test --release -p approved_tests

      - name: Pull request
        if: steps.pending.outputs.any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qa -F "$RUNNER_TEMP/pin-message"
          git push -f origin HEAD:refs/heads/pin
          files=$(git show --name-only --diff-filter=D --format= HEAD -- 'bumps/*.toml' | wc -l | tr -d ' ')
          title="Pinned at merge: $files bump files"
          git log -1 --format=%B > "$RUNNER_TEMP/pin-body"
          if [ -n "$(gh pr list --head pin --state open --json number --jq '.[].number')" ]; then
            gh pr edit pin --title "$title" --body-file "$RUNNER_TEMP/pin-body"
          elif ! gh pr create --base main --head pin --title "$title" --body-file "$RUNNER_TEMP/pin-body"; then
            echo "::error::no pull request (Settings → Actions → General: allow GitHub Actions to create pull requests); open one from the pin branch"
            exit 1
          fi
          gh workflow run ci.yml --ref pin
