<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 760" width="1360" height="760" role="img" aria-label="kjk controller layout (Xbox-style pad)">
<title>kjk controller layout (Xbox-style pad)</title>
<style>
  svg { --bg:#ffffff; --ink:#1b1f24; --dim:#5b6470; --body:#eef1f4; --edge:#9aa4af;
        --part:#d9dee4; --line:#7c8794; --accent:#2f6fde; --a:#3a9a4a; --b:#c94a3f; --x:#2f6fde; --y:#c99a1c; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#0f1419; --ink:#e6e9ed; --dim:#9aa4af; --body:#1d242c; --edge:#55606c;
          --part:#2b343e; --line:#7c8794; --accent:#6aa0ff; }
  }
  .bg { fill: var(--bg); }
  .body { fill: var(--body); stroke: var(--edge); stroke-width: 2; }
  .part { fill: var(--part); stroke: var(--edge); stroke-width: 1.5; }
  .hole { fill: none; stroke: var(--edge); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .glyph { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  .lead { fill: none; stroke: var(--line); stroke-width: 1.2; }
  .dot { fill: var(--line); }
  .main { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .sub { font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
  .key { font: 700 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--accent); }
  .title { font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .note { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
  .box { fill: none; stroke: var(--edge); stroke-width: 1; rx: 8; }
</style>
<rect class="bg" width="1360" height="760"/>
<text x="24" y="34" class="title" text-anchor="start">kjk · controller</text>
<text x="24" y="56" class="note" text-anchor="start">Xbox names; PlayStation: L1 R1 L2 R2 · Cross Circle Square Triangle</text>
<g transform="translate(80 40)">
<rect class="part" x="440" y="88" width="80" height="36" rx="12"/>
<rect class="part" x="680" y="88" width="80" height="36" rx="12"/>
<rect class="part" x="430" y="126" width="110" height="20" rx="10"/>
<rect class="part" x="660" y="126" width="110" height="20" rx="10"/>
<path class="body" d="M 455 190 C 520 178 680 178 745 190 C 800 200 835 225 850 270 C 875 345 905 440 900 480 C 895 515 860 530 835 510 C 805 485 780 440 745 420 C 700 405 500 405 455 420 C 420 440 395 485 365 510 C 340 530 305 515 300 480 C 295 440 325 345 350 270 C 365 225 400 200 455 190 Z"/>
<circle class="part" cx="470" cy="265" r="30"/>
<circle cx="470" cy="265" r="18.0" fill="none" stroke="var(--edge)" stroke-width="1.2"/>
<rect class="part" x="519.0" y="315" width="22" height="60" rx="4"/>
<rect class="part" x="500" y="334.0" width="60" height="22" rx="4"/>
<rect x="520.0" y="335.0" width="20" height="20" fill="var(--part)"/>
<circle class="part" cx="670" cy="345" r="30"/>
<circle cx="670" cy="345" r="18.0" fill="none" stroke="var(--edge)" stroke-width="1.2"/>
<circle cx="730" cy="237" r="13" fill="var(--y)" fill-opacity="0.22" stroke="var(--y)" stroke-width="1.8"/>
<text x="730" y="237" class="glyph">Y</text>
<circle cx="758" cy="265" r="13" fill="var(--b)" fill-opacity="0.22" stroke="var(--b)" stroke-width="1.8"/>
<text x="758" y="265" class="glyph">B</text>
<circle cx="730" cy="293" r="13" fill="var(--a)" fill-opacity="0.22" stroke="var(--a)" stroke-width="1.8"/>
<text x="730" y="293" class="glyph">A</text>
<circle cx="702" cy="265" r="13" fill="var(--x)" fill-opacity="0.22" stroke="var(--x)" stroke-width="1.8"/>
<text x="702" y="265" class="glyph">X</text>
<rect class="part" x="556" y="257" width="18" height="11" rx="5"/>
<rect class="part" x="626" y="257" width="18" height="11" rx="5"/>
<circle class="part" cx="600" cy="222" r="13"/>
<text x="480" y="106" class="glyph" text-anchor="middle">LT</text>
<text x="720" y="106" class="glyph" text-anchor="middle">RT</text>
<text x="485" y="136" class="glyph" text-anchor="middle">LB</text>
<text x="715" y="136" class="glyph" text-anchor="middle">RB</text>
</g>
<text x="360" y="100" class="main" text-anchor="end"><tspan class="key">LT</tspan>  Alt attack (kick, special)</text>
<polyline class="lead" points="368,96 525,146"/>
<circle class="dot" cx="525" cy="146" r="3"/>
<text x="360" y="160" class="main" text-anchor="end"><tspan class="key">LB</tspan>  Hold: the second layer (LB+…)</text>
<text x="360" y="178" class="sub" text-anchor="end">Menus: previous tab</text>
<polyline class="lead" points="368,156 512,176"/>
<circle class="dot" cx="512" cy="176" r="3"/>
<text x="360" y="285" class="main" text-anchor="end"><tspan class="key">Left stick</tspan>  Move: push further to run</text>
<text x="360" y="303" class="sub" text-anchor="end">Click: stealth · LB+click: next Form</text>
<polyline class="lead" points="368,281 520,305"/>
<circle class="dot" cx="520" cy="305" r="3"/>
<text x="335" y="340" class="glyph" style="font-size:15px">↑</text>
<text x="316" y="345" class="main" text-anchor="end">Next Force power</text>
<text x="316" y="363" class="sub" text-anchor="end">LB: energy shield</text>
<text x="335" y="380" class="glyph" style="font-size:15px">↓</text>
<text x="316" y="385" class="main" text-anchor="end">Previous Force power</text>
<text x="316" y="403" class="sub" text-anchor="end">LB: stim</text>
<text x="335" y="420" class="glyph" style="font-size:15px">←</text>
<text x="316" y="425" class="main" text-anchor="end">Medpac</text>
<text x="316" y="443" class="sub" text-anchor="end">LB: target&#x27;s action back</text>
<text x="335" y="460" class="glyph" style="font-size:15px">→</text>
<text x="316" y="465" class="main" text-anchor="end">Grenade (hold to charge)</text>
<text x="316" y="483" class="sub" text-anchor="end">LB: target&#x27;s action on</text>
<polyline class="lead" points="368,400 582,385"/>
<circle class="dot" cx="582" cy="385" r="3"/>
<text x="1000" y="100" class="main" text-anchor="start"><tspan class="key">RT</tspan>  Attack</text>
<polyline class="lead" points="992,96 835,146"/>
<circle class="dot" cx="835" cy="146" r="3"/>
<text x="1000" y="160" class="main" text-anchor="start"><tspan class="key">RB</tspan>  Force power: cast the selected one</text>
<text x="1000" y="178" class="sub" text-anchor="start">Grip, lightning, drain: hold · LB+RB: next feat attack · Menus: next tab</text>
<polyline class="lead" points="992,156 848,176"/>
<circle class="dot" cx="848" cy="176" r="3"/>
<circle cx="1025" cy="215" r="10" fill="var(--a)" fill-opacity="0.22" stroke="var(--a)" stroke-width="1.6"/>
<text x="1025" y="215" class="glyph">A</text>
<text x="1044" y="220" class="main" text-anchor="start">Jump</text>
<text x="1044" y="238" class="sub" text-anchor="start">LB: holster</text>
<circle cx="1025" cy="255" r="10" fill="var(--b)" fill-opacity="0.22" stroke="var(--b)" stroke-width="1.6"/>
<text x="1025" y="255" class="glyph">B</text>
<text x="1044" y="260" class="main" text-anchor="start">Crouch (hold) · leave a talk</text>
<text x="1044" y="278" class="sub" text-anchor="start">LB: lay a mine</text>
<circle cx="1025" cy="295" r="10" fill="var(--x)" fill-opacity="0.22" stroke="var(--x)" stroke-width="1.6"/>
<text x="1025" y="295" class="glyph">X</text>
<text x="1044" y="300" class="main" text-anchor="start">Use: the target&#x27;s action</text>
<text x="1044" y="318" class="sub" text-anchor="start">LB: Security</text>
<circle cx="1025" cy="335" r="10" fill="var(--y)" fill-opacity="0.22" stroke="var(--y)" stroke-width="1.6"/>
<text x="1025" y="335" class="glyph">Y</text>
<text x="1044" y="340" class="main" text-anchor="start">Switch party leader</text>
<text x="1044" y="358" class="sub" text-anchor="start">LB: switch weapons</text>
<polyline class="lead" points="992,270 825,305"/>
<circle class="dot" cx="825" cy="305" r="3"/>
<text x="1000" y="410" class="main" text-anchor="start"><tspan class="key">Right stick</tspan>  Look and aim (held over: turns faster)</text>
<text x="1000" y="428" class="sub" text-anchor="start">Click: saber style · LB+click: follow (watching) / end a join</text>
<polyline class="lead" points="992,406 776,395"/>
<circle class="dot" cx="776" cy="395" r="3"/>
<polyline class="lead" points="645,302 645,560"/>
<circle class="dot" cx="645" cy="560" r="3"/>
<text x="635" y="580" class="main" text-anchor="end"><tspan class="key">View</tspan>  Inventory (LB / RB: the other tabs)</text>
<text x="635" y="598" class="sub" text-anchor="end">LB+View: ready / accept a join request</text>
<polyline class="lead" points="715,302 715,560"/>
<circle class="dot" cx="715" cy="560" r="3"/>
<text x="725" y="580" class="main" text-anchor="start"><tspan class="key">Menu</tspan>  Game menu</text>
<text x="725" y="598" class="sub" text-anchor="start">LB+Menu: quick save</text>
<rect class="box" x="24" y="640" width="1312" height="96"/>
<text x="44" y="668" class="main" text-anchor="start">Menus and conversations</text>
<text x="44" y="692" class="note" text-anchor="start">D-pad or left stick: move · A: choose · X: use / buy / equip the row · B: back · LB / RB: tabs · right stick: scroll · A, B or Menu skips a movie</text>
<text x="44" y="714" class="note" text-anchor="start">LB+ means hold LB, then press. Rebind anything: Options → Gameplay → Keymap → Controller. Look speed, invert, dead zone, vibration: Options → Gameplay → Controller.</text>
</svg>
