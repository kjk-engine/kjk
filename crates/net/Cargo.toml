[package]
name = "net"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
miniz_oxide.workspace = true
sim.workspace = true
# The co-op lobby's state (`session::lobby`), which the lobby messages carry.
session.workspace = true
# Steam's relayed peer-to-peer messages (`io::steam`), beside UDP.
steamworks = { workspace = true, optional = true }

# The socket's receive buffer (`io::udp`), which std has no word for.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }

[features]
# The probes (`kjk <layer> probes`): checks, not the game.
probes = []
# Players join through Steam (`io::steam`) as well as by address.
steam = ["dep:steamworks"]

[lints]
workspace = true
