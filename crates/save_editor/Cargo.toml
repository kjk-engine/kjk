[package]
name = "save_editor"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "kjk's save editor: a kjk save opened, changed by kjk's own rules (crates/edit) and written back after its checks."

# The window is the `app` feature's (eframe, egui); the model under it (finding
# saves and installs, names and icons, the editing session, the write) builds
# without, so the approved test `save_edits` checks it with no window.
[[bin]]
name = "kjk-save-editor"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
asset_odyssey.workspace = true
blake3.workspace = true
edit.workspace = true
fmt_odyssey.workspace = true
saves.workspace = true
serde_json.workspace = true
session.workspace = true
sim.workspace = true
store.workspace = true
vfs.workspace = true
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
egui_extras = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
image = { workspace = true, optional = true }

[features]
default = ["app"]
app = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd", "dep:image"]
# The checks (the approved test `save_edits`), not the editor.
probes = ["sim/probes", "saves/probes", "edit/probes"]

[lints]
workspace = true
