[package]
name = "original_hook"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The library `kjk original` loads into the original games (`src/lib.rs`),
# and the program that loads it on Windows (`src/bin/kjk-inject.rs`). Both
# do their work only when built for a game's own architecture: x86_64 macOS
# for the Mac ports, 32-bit Windows for the Windows ones. Built for any other
# target, as the workspace's own builds do, they are empty.
[lib]
name = "kjk_original"
crate-type = ["cdylib"]

[[bin]]
name = "kjk-inject"
path = "src/bin/kjk-inject.rs"

[dependencies]
# Decodes the game's code, to find its functions and fields (`src/find.rs`).
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[lints]
workspace = true
