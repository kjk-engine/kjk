[package]
name = "approved_tests"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The owner-approved test scenarios, and nothing else (docs/TESTS.md)."

# The scenarios are the layers' probes (their `probes` feature).
[dependencies]
asset_odyssey.workspace = true
bumps.workspace = true
collision = { workspace = true, features = ["probes"] }
# The command language and the camera moves, without the Bevy runtime.
console = { path = "../console", default-features = false }
collision_odyssey = { workspace = true, features = ["probes"] }
fmt_odyssey.workspace = true
net = { workspace = true, features = ["probes"] }
ragdoll = { workspace = true, features = ["probes"] }
rules.workspace = true
saves = { workspace = true, features = ["probes"] }
script_ncs = { workspace = true, features = ["probes"] }
session.workspace = true
store.workspace = true
sim = { workspace = true, features = ["probes"] }
ui = { workspace = true, features = ["probes"] }
vfs = { workspace = true, features = ["probes"] }
# The rig's timelines live in kjk's library and the weapon holdings in the
# game's, both of which build Bevy: only with `--features rig`
# (timeline_jolt_ceilings, weapon_holdings), never in CI.
launcher = { path = "../launcher", optional = true }
game = { workspace = true, optional = true }
# The save editor's API: only with `--features editor` (save_edits), run by
# editor.yml when the editor changes, never by the engine's own suite.
edit = { workspace = true, features = ["probes"], optional = true }
save_editor = { workspace = true, features = ["probes"], optional = true }

[features]
rig = ["dep:launcher", "dep:game"]
editor = ["dep:edit", "dep:save_editor"]

[lints]
workspace = true
