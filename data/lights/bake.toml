# How bright the baked lightmaps of each module are
# (`tools/light-kinds/bake.sh`, docs/LIGHTING-PLAN.md step 10).
#
# The bake makes lightmaps from the fitted lights alone and then scales each
# room to a level. A module's entry says where that level comes from.
#
# - `share` and `ceiling`. A room aims at `share` times its level, and at
#   most at `ceiling`. A module with no `ceiling` has none.
# - `of` says which level of the room that is. `"original"` is the mean of
#   the room's stored lightmaps: what the game shows today. `"lit"` is that
#   level where the game lights the room: each texel counts by its own
#   stored level, in the room's level and in the bake's. A bake that only
#   reaches the plain mean looks darker than today, because it spreads its
#   light into the corners the stored lightmaps leave black. `"live"` is
#   the mean level the room shows under the live fitted lights
#   (`KJK_FITTED_LIGHTS=on`). It is `"original"` when left out.
# - `levels`. A file of this folder with one line for each room: its name
#   and the level it aims at. It holds the levels the owner approved in a
#   walk, so a later change to the live lights does not move them. `of`
#   beside it says which level of the room the file holds.
#
# - `sun`. The area's sun and sky. The games' files hold neither, so an area
#   under the open sky gets them here. `toward` is the way to the sun in
#   game space. `colour` is the stored level a surface that faces the sun
#   squarely shows of it, and `sky` is the stored level a surface that sees
#   the whole sky shows of it. `detail-bake --gpu --sun-fit` prints the ways
#   that fit the area's stored lightmaps best, with the stored colour in the
#   sun and out of it. The sun and the sky are not scaled to a room's level.
#   Only the room's lamps are. `toward2` and `colour2` give a second sun,
#   for an area whose sky shows two. An opening in a roof shines down with the
#   light that falls on it from the sun and the sky. In a room under a roof
#   it shines 8 times as strongly, and in a courtyard 4 times (`ROOF_GAIN`
#   and `OPENING_GAIN` in `crates/launcher/src/detail_bake/gpu.rs`).
#   `skylights` names the meshes that send the
#   sun's and the sky's light down into their room, by their node's name: a
#   ceiling that the stored lightmaps treat as open. It sends the light
#   evenly to every side. `--sun-fit` prints what is over each room's
#   floor, with the floor's stored level, and a skylight shows there as a
#   mesh over a floor as bright as one under the open sky.
#
# - `even = false`. No room of the module takes the even light. A room
#   whose lamps cannot reach its level otherwise takes an even light on
#   every texel for the rest. Without it such a room stays darker, and its
#   light lies where its lamps and its openings put it.
#
# A module that is not listed takes `[default]`: each room as bright as
# today where the game lights it.

[default]
share = 1.0
of = "lit"

# Peragus. The owner called its rooms "too bright" and "too evenly
# illuminated", and said a darker Peragus "would be cool, and fitting"
# (18 November 2026). The share is of the live level, because that is what
# the bakes he has seen were made from.
[modules.101per]
share = 0.6
ceiling = 0.22
of = "live"

[modules.103per]
share = 0.6
ceiling = 0.22
of = "live"

# The Harbinger. The owner walked this bake and said "Looks good"
# (18 November 2026).
[modules.152har]
levels = "levels/152har.txt"

# The Endar Spire. The owner walked this bake and said "looks good!"
# (18 November 2026).
[modules.end_m01aa]
levels = "levels/end_m01aa.txt"

# The Dantooine enclave. The owner walked its first bake and said "without
# the sun its all very dark" and "we should add the sun" (18 November 2026).
# The way is the best fit of `--sun-fit` (0.746). The stored lightmaps under
# the open sky are 0.93, 0.84, 0.54 in the sun and 0.34, 0.36, 0.24 out of
# it, and the two colours are worked out from those.
# He walked the bake with the sun and said: "the openings should shine light
# down through them, and we shouldnt have so much artificial light generated
# for the rooms. we want them naturally dark in the sides and then have the
# skylight come down in the middle and scatter". So there is no even light,
# and no ceiling is a skylight: the training room, the council chamber and
# the bedrooms have real openings.
# He walked that bake and said "approved!" (19 November 2026). Its levels are
# held in the file: each room's level where the game lights it.
[modules.danm13]
levels = "levels/danm13.txt"
of = "lit"
even = false
sun = { toward = [0.383, 0.663, 0.643], colour = [1.07, 0.96, 0.60], sky = [0.42, 0.44, 0.30] }

# Anchorhead on Tatooine. Its sky shows two suns, and the area's own files
# hold a hidden light that reaches 18,000 metres in the way of each
# (`detail-bake` prints the ways). The stored lightmaps were made with one
# sun between the two and above them: the best fit of `--sun-fit` is 0.837,
# 0.224, 0.500. The owner saw a bake with that one sun and said: "general
# lighting looks good! but it doesnt look like shadows are aligned with the
# actual suns" (19 November 2026). So the bake has the sky's two suns.
# The stored lightmaps under the open sky are 0.91, 0.84, 0.71 in the sun
# and 0.24, 0.21, 0.17 out of it. Each sun gives level ground half of the
# difference, and the sky's colour is worked out as the enclave's was. That
# gives 1.00, 0.93, 0.79 and 1.16, 1.07, 0.91 for the suns and 0.30, 0.25,
# 0.21 for the sky, and a town as bright as today. The colours below are 1.3
# times those. The owner had said of a brighter bake "it was good when it
# was bright". He walked the brighter one and said: "overall brightness is
# good now!" (19 November 2026).
# `width` is half of each sun's width in radians. With it the suns' shadows
# are sharp: a texel's rays start from places spread over its own square.
# Without it a sun is 0.04 wide and each ray starts at the texel's middle,
# as in the enclave. The owner said of Anchorhead's shadows under that:
# "why is the shadow from this wall so scattered at the edge?", "shadow
# here looks blocky like a staircase" and "why is no shadow cast from that
# tower?" (19 November 2026).
# There is no even light, by the owner's words on the enclave.
[modules.tat_m17aa]
share = 1.0
of = "lit"
even = false
sun = { toward = [0.826, 0.412, 0.385], colour = [1.30, 1.21, 1.03], toward2 = [0.959, -0.029, 0.282], colour2 = [1.51, 1.39, 1.18], sky = [0.39, 0.33, 0.27], width = 0.01 }

# The Dune Sea on Tatooine (`tat_m18aa`) has no entry, because it has no
# lightmap to bake. None of the 78 meshes of its five rooms names one, and
# `detail-bake` stops with "no lightmap on a room". Anchorhead's entry was
# tried on it unchanged on 19 November 2026.

# The Sand People Enclave on Tatooine. Anchorhead's entry does not fit it.
# The enclave's sky shows the two suns low in the south-east, about 53
# degrees to the right of where Anchorhead's sky shows them, and its stored
# lightmaps are darker. A bake with Anchorhead's entry unchanged was 1.7
# times as bright as today (a mean of 80 against 47 over 14 views), and its
# shadows fell away from the suns in the sky.
# So the entry has the enclave's own numbers, made by Anchorhead's method.
# The two ways are measured from pictures of the sky. The area's files hold
# a hidden light that reaches 18,000 metres within 3 degrees of the lower
# sun, and the best fit of `--sun-fit` is 0.612, -0.612, 0.500, between the
# two suns and above them (fit 0.662).
# The stored lightmaps under the open sky are 0.535, 0.491, 0.404 in the sun
# and 0.194, 0.176, 0.155 out of it. Each sun gives level ground half of
# the difference, and the colours are 1.3 times that, as in Anchorhead.
[modules.tat_m20aa]
share = 1.0
of = "lit"
even = false
sun = { toward = [0.831, -0.418, 0.367], colour = [0.76, 0.70, 0.57], toward2 = [0.594, -0.749, 0.292], colour2 = [0.84, 0.78, 0.63], sky = [0.31, 0.28, 0.25], width = 0.01 }
