# The lights of the games' own light fittings (docs/LIGHTING-PLAN.md).
#
# A kind of fitting is a texture that glows: every mesh of a room or of a
# placeable that carries it. `kjk light-kinds` surveys the kinds of both
# games. The owner approved, as pictures, what each common kind does
# (16 and 17 November 2026). This file holds what he approved:
#
# - `[rules]`: the general rules. They give most kinds their light from the
#   kind's own facts, and they hold for a texture this file does not name.
# - `[[fitting]]`: a kind that differs from the general rules, with why.
# - `[[placed]]`: a light placed by hand in one area, with why.
#
# `tools/light-kinds/propose.py` applies the rules to the survey.
# `tools/light-kinds/kinds.py` writes each game's kinds, one entry each,
# into `data/lights/<game>.toml` from this file and the survey.

[rules]
# A texture that glows less than this is a wall, a floor, a door or trim
# that the survey took for a fitting. It is not a lamp and lights nothing.
low_glow = 0.1
# The strength of a lamp's light, and of a faint light.
strong = 1.1
faint = 0.4
# A lamp's light reaches as far as the files' own lamp at it does, or
# `reach_least` metres more than the square root of its area (m2). The
# reach is never less than `reach_least` or more than `reach_most` metres.
reach_least = 2.5
reach_most = 5.0
# How far a faint light reaches (metres).
faint_reach = 2.0
# A faint kind whose name holds one of `screen_names` is a screen or a
# display. It is this strong and reaches this far (metres). It was as any
# faint light until the owner walked the Endar Spire on 17 November 2026
# and said: "these orange rectangular displays should emit more light" and
# "there is too little light emitted from the screens, light panels etc.
# we should get some atmospheric light from the sources here".
screen = 0.5
screen_reach = 3.0
screen_names = ["scre", "mon", "comp", "holo", "map", "pnl", "panl", "term"]
# A kind is flat when more than this share of its surfaces is flat. A flat
# fitting shines the way it faces, in a cone this narrow (`cone`), and
# never onto the panel it sits on.
flat_share = 0.5
cone = 0.2
# A kind faces down when more than this share of its surfaces does. It is
# a spotlight straight down, in a cone this narrow.
down_share = 0.5
down_cone = 0.7
# A kind is faint when its usual surface is larger than `faint_area` (m2),
# or when its name holds one of `faint_names` (a screen, a sign, a crystal,
# a fire, a kolto tank), or when the files give it no lamp and the stored
# lightmap near it is dark. "No lamp" is fewer than `with_lamp_share` of
# its surfaces with a lamp of the files. "Dark" is a lightmap near it
# under `near_bake`.
faint_area = 40.0
with_lamp_share = 0.1
near_bake = 0.9
faint_names = ["scre", "mon", "sign", "comp", "holo", "map", "btl", "pnl", "panl", "term", "crystal", "fire", "lvl", "kol", "bike"]
# A kind whose usual piece is at least this long from its middle (metres)
# is a strip that lights along its length.
strip_half = 2.0

