# The stories of the screens in crates/ui/src/screens/upgrade.rs (docs/UI.md, "UI catalogue").
status = "not started"
notes = "Its stories start from captures of play: the bench a script opens, with five items the party carries that take upgrades. On the bench, the white panel stands where play draws the item's 3D model, which the catalogue does not draw."

[[story]]
name = "At rest"
screen = "upgrade_select"

[[story]]
name = "Items to upgrade"
screen = "upgrade_select"
capture = { k1 = "taris-upgrade", tsl = "telos-upgrade" }
pad_capture = { k1 = "taris-upgrade-pad", tsl = "telos-upgrade-pad" }

[[story]]
name = "An item on the bench"
screen = "upgrade_select"
capture = { k1 = "taris-upgrade", tsl = "telos-upgrade" }
pad_capture = { k1 = "taris-upgrade-pad", tsl = "telos-upgrade-pad" }
steps = ["key Activate"]

[[story]]
name = "Upgrading an item"
screen = "upgrade_select"
capture = { k1 = "taris-upgrade", tsl = "telos-upgrade" }
pad_capture = { k1 = "taris-upgrade-pad", tsl = "telos-upgrade-pad" }
steps = ["key Activate", "press BTN_UPGRADEITEMS"]
