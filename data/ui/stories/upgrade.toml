# The stories of the screens in crates/ui/src/screens/upgrade.rs (docs/UI.md, "UI catalogue").
status = "not started"
notes = "Its stories start from captures of play: the bench a script opens, with five items the party carries that take upgrades. The pistol and the lightsaber on the bench start from stand-ins. In the pictures of `kjk gui story`, a white panel stands where play draws the item's 3D model. The catalogue in the game draws the model."

[[story]]
name = "At rest"
screen = "upgrade_select"

[[story]]
