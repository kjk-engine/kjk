[defence]
title = "Blocking"
summary = """
A character who is not attacking blocks attacks, blaster bolts and thrown
lightsabers that come from within the character's block arc. The block arc
is the area in front of the character where blocks are possible. The arc is
wider at a higher defense level. It is also wider against blades than
against bolts. A character with no defense level does not block.
"""
detail = """
A character wielding a lightsaber has defense level 1 with Jedi Defense,
level 2 with Advanced Jedi Defense and level 3 with Master Jedi Defense. A
character wielding a melee weapon they are proficient with has defense
level 1. A character cannot block while attacking, while knocked down, while
recovering from a broken parry, or without a lit blade in hand.
"""
applies = ["kind:lightsaber", "kind:melee", "feat:JEDI_DEFENSE", "feat:ADVANCED_JEDI_DEFENSE", "feat:MASTER_JEDI_DEFENSE"]

[defence.arc]
name = "Block Arc"
value = [0.9, 0.6, 0.3]
labels = ["defense level 1", "defense level 2", "defense level 3"]
range = [-1.0, 1.0]
summary = "A character blocks an attack when the cosine of the angle between the attack and the character's facing is above a limit. The limit is {sabers.defence.arc[0]} at defense level 1, {sabers.defence.arc[1]} at level 2 and {sabers.defence.arc[2]} at level 3. A lower limit means a wider arc."
source = "JA: whether a blade can block"
see = "sim::combat::saber::defence::in_arc"
applies = ["kind:lightsaber", "kind:melee", "feat:JEDI_DEFENSE", "feat:ADVANCED_JEDI_DEFENSE", "feat:MASTER_JEDI_DEFENSE"]

[defence.against_blades]
name = "Block Arc Against Blades"
value = 0.25
range = [0.0, 1.0]
summary = "Against a blade or a thrown lightsaber, the block arc's limit is {sabers.defence.against_blades} lower, so the arc is wider."
source = "JA: whether a blade can block"
see = "sim::combat::saber::defence::in_arc"
applies = ["kind:lightsaber", "kind:melee"]

[defence.parry_edge]
name = "Parry Side"
value = [0.3, 0.1]
labels = ["above the eye", "just below it"]
range = [0.0, 1.0]
summary = "A character parries an attack above the eyes high on that side when the sine of the attack's angle from the view is above {sabers.defence.parry_edge[0]}. An attack just below the eyes is parried high on that side when the sine is above {sabers.defence.parry_edge[1]}. An attack nearer the middle is parried overhead."
source = "JA: blocks that are not left to chance"
see = "sim::combat::saber::defence::parry_for"

[defence.parry_low]
name = "Low Parry"
value = 20.0
unit = "units"
range = [0.0, 64.0]
summary = "A character parries an attack that comes more than {sabers.defence.parry_low:m} below the eyes low on that side."
source = "JA: blocks that are not left to chance"
see = "sim::combat::saber::defence::parry_for"

[bolts]
title = "Deflecting Blaster Bolts"
summary = """
A character with a lightsaber blocks blaster bolts at a bolt level. The
bolt level starts at the character's defense level. The lightsaber's
deflection bonus raises or lowers it. The bolt level is 1 lower while the
character jumps or moves backward. At bolt level 1 the blade absorbs the
bolt. At level 2 the blade deflects the bolt in the direction the character
is looking. At level 3 the blade reflects the bolt back at the shooter.
"""
detail = """
A bolt that hits a lit lightsaber blade is always turned away, even at
bolt level 0. Ion bolts burst on the blade. Melee weapons do not block
bolts.
"""
applies = ["kind:lightsaber", "kind:blaster", "feat:JEDI_DEFENSE", "feat:ADVANCED_JEDI_DEFENSE", "feat:MASTER_JEDI_DEFENSE"]

[bolts.deflect_per_level]
name = "Deflection Bonus"
value = 5
unit = "points"
range = [1, 50]
summary = "Every {sabers.bolts.deflect_per_level} of deflection bonus on a lightsaber raises its bolt level by 1. A penalty lowers it."
source = "ours"
see = "sim::combat::saber::defence::bolt_level"
applies = ["kind:lightsaber"]

[bolts.cooldown_ms]
name = "Deflection Recovery"
type = "u64"
value = 350
unit = "ms"
range = [0, 2000]
summary = "After blocking a bolt, a character cannot block another for {sabers.bolts.cooldown_ms:s}, less {sabers.bolts.cooldown_per_level:s} per bolt level. At level 3 there is no delay."
source = "JA (rulebook 7.5)"
see = "sim::combat::saber::defence::bolt"
applies = ["kind:lightsaber", "kind:blaster"]

[bolts.cooldown_per_level]
name = "Recovery per Level"
type = "u64"
value = 100
unit = "ms"
range = [0, 175]
summary = "Each bolt level shortens the delay between bolt blocks by {sabers.bolts.cooldown_per_level:s}."
source = "JA (rulebook 7.5)"
see = "sim::combat::saber::defence::bolt"
applies = ["kind:lightsaber", "kind:blaster"]

[bolts.deflect_spread]
name = "Deflection Spread"
value = 1.0
range = [0.0, 4.0]
summary = "A deflected bolt strays from the direction the character is looking by up to {sabers.bolts.deflect_spread} on each axis."
source = "JA: bolt impacts"
see = "sim::combat::saber::defence::bolt"
applies = ["kind:lightsaber", "kind:blaster"]

[bolts.reflect_spread]
