summary = "A stroke of strength above {sabers.smash.threshold} knocks a thrown lightsaber out of the air."
source = "JA (rulebook 10.6)"
see = "sim::world::sabers"

[lag]
title = "Lag"
summary = """
In co-op, a player on another machine sees the world a little late. The
game checks that player's shots and blades against other characters where
the player saw them, up to {sabers.lag.rewind_ms:s} in the past. When a
blade hits a player who could block it, the game waits up to
{sabers.lag.grace_ms:s} for that player's block.
"""
detail = """
The game never checks attacks by computer-controlled creatures in the
past. If the player blocks in time, the delayed hit becomes a block. If the
player does not, the hit takes effect when the wait ends.
"""
applies = ["kind:lightsaber", "kind:melee", "kind:player"]

[lag.rewind_ms]
name = "Lag Allowance"
type = "u64"
value = 400
unit = "ms"
range = [0, 512]
summary = "A player's attacks are checked against the world as that player saw it, up to {sabers.lag.rewind_ms:s} ago."
source = "ours"
see = "sim::world::history::History::view_tick"
applies = ["kind:player"]

[lag.grace_ms]
name = "Block Allowance"
type = "u16"
value = 100
unit = "ms"
range = [0, 400]
summary = "A blade's hit on a player on another machine waits up to {sabers.lag.grace_ms:s} for that player's block."
source = "ours"
see = "sim::combat::saber::grace::wait"
applies = ["kind:player", "kind:lightsaber", "kind:melee"]
