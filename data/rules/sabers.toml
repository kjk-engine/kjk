[chapter]
title = "Lightsabers and Melee Weapons"
order = 20
summary = """
A lightsaber, sword, vibroblade or staff deals damage with its blade: a
swing harms whatever the blade passes through, and can be blocked by a
blade held ready or met by another blade in a clash. The weapon's damage
roll, feats and chance to hit decide how much damage a cut deals.
"""

[ja]
title = "Saber Frame"
summary = """
Swing strength, saber lock pushes and the split kick are counted in saber
frames.
"""

[ja.frame_ms]
name = "Saber Frame"
type = "u32"
value = 25
unit = "ms"
range = [5, 100]
summary = """
A saber frame lasts {sabers.ja.frame_ms:s}. Swing strength is measured by
how far the hilt moves in one frame, and a saber lock advances at most once
a frame.
"""
source = "JA's 40 Hz server frame; the scaling ours"
see = "sim::combat::saber::power::attack"
applies = ["kind:lightsaber", "kind:melee"]

[blades]
title = "Blades"
summary = """
A blade runs from the hilt in the character's hand and follows the body's
animations. A single lightsaber is held in the right hand, a second in the
left. A double-bladed lightsaber has a blade at each end. Swords,
vibroblades and staves have blades of fixed length.
"""
applies = ["kind:lightsaber", "kind:melee"]

[blades.melee_length]
name = "Sword Blade Length"
value = 32.0
unit = "units"
range = [8.0, 80.0]
summary = "The blade of a sword or vibroblade is {sabers.blades.melee_length:m} long."
source = "ours (a delegated stand-in)"
see = "sim::combat::saber::blades::slots"
applies = ["kind:melee", "baseitem:Long_Sword", "baseitem:Vibro_Sword", "baseitem:Short_Sword", "baseitem:Vibro_Blade"]

[blades.melee_staff_length]
name = "Staff Blade Length"
value = 28.0
unit = "units"
range = [8.0, 80.0]
summary = "Each end of a quarterstaff, double-bladed sword or vibro double-blade is {sabers.blades.melee_staff_length:m} long."
source = "ours (a delegated stand-in)"
see = "sim::combat::saber::blades::slots"
applies = ["kind:melee", "baseitem:Quarter_Staff", "baseitem:Double_Bladed_Sword", "baseitem:Vibro_Double_Blade"]

[blades.blend_ms]
name = "Animation Blend"
type = "u32"
value = 150
unit = "ms"
range = [0, 500]
summary = "A character's body eases into each new move over {sabers.blades.blend_ms:s}, and its blades with it."
source = "JA: animation timing"
see = "sim::combat::saber::blades::Posed::follow"

[blades.trail_ms]
name = "Blade Trail"
type = "u64"
value = 100
unit = "ms"
range = [10, 1000]
summary = "A blade whose last position is older than {sabers.blades.trail_ms:s} starts its next sweep from where it is."
source = "JA (rulebook 5.1)"
see = "sim::combat::saber::blades::fresh"

[blades.push_frames]
name = "Blade Lead"
value = 1.6
unit = "×"
range = [0.0, 4.0]
summary = "A moving character's blades are placed {sabers.blades.push_frames:bare} frames ahead along its movement."
source = "JA (1.6 frames); taken over the sim's tick, ours"
see = "sim::combat::saber::blades::push_per_speed"

[blades.near]
name = "Blade Range"
value = 192.0
unit = "units"
range = [64.0, 1024.0]
summary = "A character's blades are placed only when another character is within {sabers.blades.near:m}."
source = "ours"
see = "sim::world::sabers"

[blades.bolt_near]
name = "Blade Range, Bolts"
value = 320.0
unit = "units"
range = [64.0, 2048.0]
summary = "A character's blades are also placed when a blaster bolt, a thrown lightsaber or a breakable object is within {sabers.blades.bolt_near:m}."
source = "ours"
see = "sim::world::sabers"

[look]
title = "Turning the Body"
summary = """
A character's legs turn toward the direction of movement, while the spine,
neck and head turn toward the view. A blade is held where the turned body
holds it, so turning during a swing changes where the swing lands. In the
air, rolling, during a special or in a saber lock, the legs face the view.
"""

[look.lean]
name = "Leg Turn"
value = 60.0
unit = "°"
range = [0.0, 90.0]
summary = "The legs turn up to {sabers.look.lean} from the view toward the direction of movement."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[look.spine_pitch]
name = "Spine Pitch"
value = 0.5
range = [0.0, 1.0]
summary = "The spine bends {sabers.look.spine_pitch} of the way up or down with the view."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[look.lower_lumbar]
name = "Lower Back"
value = [0.40, 0.45]
labels = ["of the pitch", "of the yaw and roll"]
range = [0.0, 1.0]
summary = "The lower back takes {sabers.look.lower_lumbar[0]} of the spine's pitch and {sabers.look.lower_lumbar[1]} of its yaw and roll."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[look.upper_lumbar]
