source = "JA: bolt impacts"
see = "sim::combat::saber::defence::bolt"
applies = ["kind:lightsaber", "kind:blaster"]

[clash]
title = "Clashes"
summary = """
When two blades meet, or a character blocks an attack, the game goes
through the outcomes below in order. The first outcome that applies
happens. First, the defender may knock the attack away. Second, the
attacker may break the defender's parry. Third, the attacker may bounce off
a strong parry. Fourth, if both characters are attacking, the one with more
power breaks the other's attack or makes it bounce. If none of these
happens, the defender parries. A strong enough attacker then crushes the
parry, and a weaker one is turned aside.
"""
detail = """
The game checks for a saber lock before any of these outcomes. A
knockaway or a broken parry may disarm the losing character.
"""
applies = ["kind:lightsaber", "kind:melee"]

[clash.strong]
name = "Strong Blow"
value = 3
range = [1, 16]
summary = "An attack of power {sabers.clash.strong:bare} or more is strong. A strong attack can break or crush a parry, and it bounces off a strong parry. A defender with this much power can knock attacks away."
source = "JA: the choice of blocking a bolt at Force level 3"
see = "sim::combat::saber::clash::resolve"

[clash.knock_late]
name = "Knockaway, Weak Blow"
value = 7
unit = "in 10"
range = [0, 10]
summary = "An attack of power below {sabers.clash.strong:bare} is knocked away {sabers.clash.knock_late} times. This happens only when the defender has power {sabers.clash.strong:bare} or more, or defense level {sabers.clash.knock_defence}."
source = "JA"
see = "sim::combat::saber::clash::resolve"

[clash.knock_strong]
name = "Knockaway, Strong Defender"
value = 1
unit = "in 10"
range = [0, 10]
summary = "A defender of power {sabers.clash.strong:bare} or more knocks away a strong attack {sabers.clash.knock_strong} times."
source = "JA"
see = "sim::combat::saber::clash::resolve"

[clash.knock_defence]
name = "Knockaway by Defense"
value = 3
range = [0, 3]
summary = "A defender of defense level {sabers.clash.knock_defence} can knock an attack away even with power below {sabers.clash.strong:bare}. The game rolls a number from 0 to the defender's power, and the knockaway fails if the roll is 0."
source = "JA"
see = "sim::combat::saber::clash::resolve"

[clash.parry_break]
name = "Parry Break at Equal Level"
value = 1.5
unit = "×"
range = [0.0, 10.0]
summary = "A strong attacker whose power equals the defender's defense level breaks the parry when a roll of 1 to 10 is at least {sabers.clash.parry_break:bare} times the defender's power. A strong attacker whose power is above the defender's defense level always breaks the parry."
source = "JA"
see = "sim::combat::saber::clash::resolve"

[clash.contest_margin]
name = "Clash Margin"
value = 1
range = [0, 10]
summary = "When both characters are attacking, the game adds each one's move power and style level. If the attacker is ahead by more than {sabers.clash.contest_margin}, the attacker breaks the defender's attack. If the attacker is ahead by less, the defender's attack bounces. If the attacker is not ahead, the attacker's own attack is broken."
source = "JA"
see = "sim::combat::saber::clash::resolve"

[clash.crush_tie]
name = "Crush at Equal Power"
value = 2
unit = "in 10"
range = [0, 10]
summary = "When the defender is also attacking and both have equal power, the defender's parry is crushed {sabers.clash.crush_tie} times. Otherwise both attacks bounce."
source = "JA"
see = "sim::combat::saber::clash::resolve"

[smash]
title = "Striking a Thrown Lightsaber"
summary = """
A swinging blade can knock a thrown lightsaber out of the air. The thrown
lightsaber flies off in the direction the striking character faces, at
{saber_throw.down.knocked_speed:m}. A spin, a kata or the jump attack of
two weapons always knocks it away. Any other swing knocks it away only when
the stroke is strong enough.
"""
detail = """
A stroke's strength starts at {sabers.smash.per_power:bare} for each
point of move power. The game multiplies it by
{sabers.smash.outside_duel:bare}, by the length of blade that hit, by how
far the blade moved in one saber frame, by {sabers.smash.scale:bare} and by
{sabers.smash.share:bare}. The result is rounded up.
"""
applies = ["kind:lightsaber", "spell:FORCE_POWER_LIGHT_SABER_THROW", "spell:FORCE_POWER_LIGHT_SABER_THROW_ADVANCED"]

[smash.reach]
name = "Strike Reach"
