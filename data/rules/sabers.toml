summary = "The head turns from the view {sabers.look.head_reach[0]} to {sabers.look.head_reach[1]} in pitch, {sabers.look.head_reach[2]} to {sabers.look.head_reach[3]} in yaw and {sabers.look.head_reach[4]} to {sabers.look.head_reach[5]} in roll."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[look.cranium]
name = "Skull"
value = [0.4, 0.6]
labels = ["of the pitch", "of the yaw and roll"]
range = [0.0, 1.0]
summary = "The skull takes {sabers.look.cranium[0]} of the head's pitch and {sabers.look.cranium[1]} of its yaw and roll."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[look.cervical]
name = "Neck"
value = [0.2, 0.3]
labels = ["of the pitch", "of the yaw and roll"]
range = [0.0, 1.0]
summary = "The neck takes {sabers.look.cervical[0]} of the head's pitch and {sabers.look.cervical[1]} of its yaw and roll."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[look.thoracic_head]
name = "Chest, Head Turn"
value = [0.4, 0.1]
labels = ["of the pitch", "of the yaw and roll"]
range = [0.0, 1.0]
summary = "The chest takes {sabers.look.thoracic_head[0]} of the head's pitch and {sabers.look.thoracic_head[1]} of its yaw and roll, averaged with its share of the spine's turn."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[sweep]
title = "Cuts"
summary = """
A swinging blade damages every body it passes through. Each attack deals
at most one damage roll of the weapon to each target. A blade must pass
through {sabers.sweep.nominal:m} of a body to deal the full roll; any cut
deals at least {sabers.sweep.least_share:pct} of it. The damage is dealt
when the blade leaves the body or the attack ends.
"""
detail = """
The damage roll is the weapon's own, with its properties and the saber
style's feat, scaled by the chance to hit. A block or a clash can stop a
blow only if the attack roll against that target misses.
"""
applies = ["kind:lightsaber", "kind:melee"]

[sweep.step]
name = "Blade Check Spacing"
value = 8.0
unit = "units"
range = [1.0, 32.0]
summary = "A blade is checked for hits every {sabers.sweep.step:m} along its length."
source = "JA (rulebook 5.2)"
see = "sim::combat::saber::sweep::segments"
applies = ["kind:lightsaber", "kind:melee"]

[sweep.extrapolate]
name = "Clash Reach"
value = 16.0
unit = "units"
range = [0.0, 64.0]
summary = "Two blades clash when they pass within {sabers.sweep.extrapolate:m} of each other's tip and path."
source = "JA (rulebook 5.7)"
see = "sim::combat::saber::sweep::sweep_quad"
applies = ["kind:lightsaber", "kind:melee"]

[sweep.arc_step]
name = "Swing Arc"
value = 0.33
range = [0.01, 1.0]
summary = "A blade that turns far in one moment is checked along its arc in steps of {sabers.sweep.arc_step} of the turn."
source = "JA: saber swings"
see = "sim::combat::saber::sweep::segments"
applies = ["kind:lightsaber", "kind:melee"]

[sweep.nominal]
name = "Full Cut"
value = 160.0
unit = "units"
range = [16.0, 1000.0]
summary = "A blade must pass through {sabers.sweep.nominal:m} of a body in one attack to deal its full damage roll."
source = "ours (I22 C5, a delegated number)"
see = "sim::combat::saber::sweep::Contact::due_share"
applies = ["kind:lightsaber", "kind:melee"]

[sweep.least_share]
name = "Graze Damage"
type = "u32"
value = 500
unit = "‰"
range = [1, 1000]
summary = "A blade's first cut on a target deals at least {sabers.sweep.least_share:pct} of the damage roll. Further cuts in the same attack add the rest, up to the full roll."
source = "the owner's balance, 2026-10-15"
see = "sim::combat::saber::sweep::Contact::due_share"
applies = ["kind:lightsaber", "kind:melee"]

[sweep.melee_box]
name = "Blade Width"
value = 2.0
unit = "units"
range = [0.0, 8.0]
summary = "An attacking blade strikes anything within {sabers.sweep.melee_box:m} of its edge."
source = "JA"
see = "sim::world::sabers"
applies = ["kind:lightsaber", "kind:melee"]

[power]
title = "Attack Power"
summary = """
When blades meet, each side's power decides the outcome. An attacking
blade's power is its style's level ×{sabers.power.attacking_times:bare}
+{sabers.power.attacking_plus:bare}, +1 for each step of swing its hilt
moves in a saber frame, from {sabers.power.least:bare} to
{sabers.power.most:bare}. A move's own power depends on the move and how
far into it the character is.
"""
detail = """
A blade that is not attacking, or whose move has no power, deals no damage.
A special has power only during part of its move.
"""
applies = ["kind:lightsaber", "kind:melee"]

[power.style_level]
name = "Style Level"
value = [1, 2, 3]
labels = ["fast", "medium, two weapons and double-bladed", "strong"]
range = [1, 5]
summary = "The fast style is level {sabers.power.style_level[0]}, the medium style level {sabers.power.style_level[1]} and the strong style level {sabers.power.style_level[2]}. Two weapons and a double-bladed lightsaber count as medium."
source = "JA: a blade's attack power in a lock"
see = "sim::combat::saber::power::style_level"
applies = ["kind:lightsaber", "kind:melee"]

[power.attacking_times]
