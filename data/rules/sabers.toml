[defence]
title = "Blocking"
summary = """
A character who is not attacking blocks blows, blaster bolts and thrown
lightsabers that come at it from within its block arc. The arc widens with
defense level and is wider against blades than against bolts. A character
with no defense level does not block.
"""
detail = """
Defense level is 1 with Jedi Defense, 2 with Advanced Jedi Defense and 3
with Master Jedi Defense while wielding a lightsaber, and 1 with any melee
weapon the character is proficient with. A character cannot block while
attacking, knocked down, recovering from a broken parry, or without a lit
blade in hand.
"""
applies = ["kind:lightsaber", "kind:melee", "feat:JEDI_DEFENSE", "feat:ADVANCED_JEDI_DEFENSE", "feat:MASTER_JEDI_DEFENSE"]

[defence.arc]
name = "Block Arc"
value = [0.9, 0.6, 0.3]
labels = ["defense level 1", "defense level 2", "defense level 3"]
range = [-1.0, 1.0]
summary = "An attack is blocked when the cosine of its angle from the blocker's facing is above {sabers.defence.arc[0]} at defense level 1, {sabers.defence.arc[1]} at level 2 and {sabers.defence.arc[2]} at level 3."
source = "JA: whether a blade can block"
see = "sim::combat::saber::defence::in_arc"
applies = ["kind:lightsaber", "kind:melee", "feat:JEDI_DEFENSE", "feat:ADVANCED_JEDI_DEFENSE", "feat:MASTER_JEDI_DEFENSE"]

[defence.against_blades]
name = "Block Arc Against Blades"
value = 0.25
range = [0.0, 1.0]
summary = "Against a blade or a thrown lightsaber, the block arc's cosine is {sabers.defence.against_blades} lower."
source = "JA: whether a blade can block"
see = "sim::combat::saber::defence::in_arc"
applies = ["kind:lightsaber", "kind:melee"]

[defence.parry_edge]
name = "Parry Side"
value = [0.3, 0.1]
labels = ["above the eye", "just below it"]
range = [0.0, 1.0]
summary = "A blow above the eyes is parried high on its side when the sine of its angle from the view is above {sabers.defence.parry_edge[0]}, a blow just below the eyes when above {sabers.defence.parry_edge[1]}. A blow nearer the middle is parried overhead."
source = "JA: blocks that are not left to chance"
see = "sim::combat::saber::defence::parry_for"

[defence.parry_low]
name = "Low Parry"
value = 20.0
unit = "units"
range = [0.0, 64.0]
summary = "A blow more than {sabers.defence.parry_low:m} below the eyes is parried low on its side."
source = "JA: blocks that are not left to chance"
see = "sim::combat::saber::defence::parry_for"

[bolts]
title = "Deflecting Blaster Bolts"
summary = """
A lightsaber blocks blaster bolts at a level equal to its wielder's defense
level, adjusted by the lightsaber's deflection bonus, and 1 lower while
jumping or moving backward. At level 1 the bolt is absorbed, at level 2 it
is deflected along the Jedi's view, and at level 3 it is reflected back at
the shooter.
"""
detail = """
A bolt that strikes a lit lightsaber blade is always turned, even at level
0. Ion bolts burst on the blade. Melee weapons do not block bolts.
"""
applies = ["kind:lightsaber", "kind:blaster", "feat:JEDI_DEFENSE", "feat:ADVANCED_JEDI_DEFENSE", "feat:MASTER_JEDI_DEFENSE"]

[bolts.deflect_per_level]
name = "Deflection Bonus"
value = 5
unit = "points"
range = [1, 50]
summary = "Every {sabers.bolts.deflect_per_level} of deflection bonus on a lightsaber raises its bolt level by 1. A penalty lowers it."
source = "I22 C6, ours"
see = "sim::combat::saber::defence::bolt_level"
applies = ["kind:lightsaber"]

[bolts.cooldown_ms]
name = "Deflection Recovery"
type = "u64"
value = 350
unit = "ms"
range = [0, 2000]
summary = "After blocking a bolt, a character cannot block another for {sabers.bolts.cooldown_ms:s}, less {sabers.bolts.cooldown_per_level:s} per bolt level. At level 3 there is no delay."
source = "JA (rulebook 7.5)"
see = "sim::combat::saber::defence::bolt"
applies = ["kind:lightsaber", "kind:blaster"]

[bolts.cooldown_per_level]
name = "Recovery per Level"
type = "u64"
value = 100
unit = "ms"
range = [0, 175]
summary = "Each bolt level shortens the delay between bolt blocks by {sabers.bolts.cooldown_per_level:s}."
source = "JA (rulebook 7.5)"
see = "sim::combat::saber::defence::bolt"
applies = ["kind:lightsaber", "kind:blaster"]

[bolts.deflect_spread]
name = "Deflection Spread"
value = 1.0
range = [0.0, 4.0]
summary = "A deflected bolt strays from the Jedi's view by up to {sabers.bolts.deflect_spread} on each axis."
source = "JA: bolt impacts"
see = "sim::combat::saber::defence::bolt"
applies = ["kind:lightsaber", "kind:blaster"]

[bolts.reflect_spread]
name = "Reflection Spread"
value = 0.2
range = [0.0, 4.0]
summary = "A reflected bolt strays from the shooter by up to {sabers.bolts.reflect_spread} on each axis."
source = "JA: bolt impacts"
see = "sim::combat::saber::defence::bolt"
applies = ["kind:lightsaber", "kind:blaster"]

[clash]
title = "Clashes"
summary = """
When two blades meet, or a blow is blocked, the first that applies of
these happens: the defender knocks the attack away; the attacker breaks the
defender's parry; the attacker bounces off a strong parry; if both are
attacking, the side with more power breaks or bounces the other's attack;
otherwise the defender parries, and a strong enough attacker crushes the
parry or glances off it.
"""
detail = """
A saber lock is checked first. A knockaway or broken parry may disarm the
loser.
"""
applies = ["kind:lightsaber", "kind:melee"]

[clash.strong]
name = "Strong Blow"
value = 3
range = [1, 16]
summary = "A blow of power {sabers.clash.strong:bare} or more is strong: it can break or crush a parry and bounces off a strong parry. A defender of this power can knock attacks away."
source = "JA: the choice of blocking a bolt at Force level 3"
see = "sim::combat::saber::clash::resolve"

[clash.knock_late]
name = "Knockaway, Weak Blow"
value = 7
unit = "in 10"
range = [0, 10]
summary = "A blow of power below {sabers.clash.strong:bare} that is blocked late is knocked away {sabers.clash.knock_late} times."
source = "JA"
see = "sim::combat::saber::clash::resolve"

[clash.knock_strong]
name = "Knockaway, Strong Defender"
value = 1
unit = "in 10"
range = [0, 10]
summary = "A defender of power {sabers.clash.strong:bare} or more knocks an attack away {sabers.clash.knock_strong} times."
source = "JA"
see = "sim::combat::saber::clash::resolve"

[clash.knock_defence]
name = "Knockaway by Defense"
value = 3
range = [0, 3]
summary = "A defender of defense level {sabers.clash.knock_defence} can knock an attack away even with power below {sabers.clash.strong:bare}, unless a roll of 0 to its power comes up 0."
source = "JA"
see = "sim::combat::saber::clash::resolve"

[clash.parry_break]
name = "Parry Break at Equal Level"
value = 1.5
unit = "×"
range = [0.0, 10.0]
summary = "An attacker whose power equals the defender's defense level breaks the parry when a roll of 1-10 is at least {sabers.clash.parry_break:bare} times the defender's power."
source = "JA"
see = "sim::combat::saber::clash::resolve"

[clash.contest_margin]
name = "Clash Margin"
value = 1
range = [0, 10]
summary = "When both sides are attacking, the side ahead by more than {sabers.clash.contest_margin} (move power plus style level) breaks the other's attack; ahead by less, the other's attack bounces; not ahead, the swinger's own attack is broken."
source = "JA"
see = "sim::combat::saber::clash::resolve"

[clash.crush_tie]
name = "Crush at Equal Power"
value = 2
unit = "in 10"
range = [0, 10]
summary = "A defender who is attacking with the attacker's power has its parry crushed {sabers.clash.crush_tie} times."
source = "JA"
see = "sim::combat::saber::clash::resolve"

[smash]
title = "Striking a Thrown Lightsaber"
summary = """
A swinging blade that meets a thrown lightsaber knocks it out of the air,
in the direction the striker faces at
{saber_throw.down.knocked_speed:m}, during a spin, a kata or the jump
attack of two weapons, or when the stroke is strong enough.
"""
detail = """
A stroke's strength is {sabers.smash.per_power:bare} per point of move
power, ×{sabers.smash.outside_duel:bare}, times the length of blade that
struck and how far it moved in a saber frame, ×{sabers.smash.scale:bare}
and ×{sabers.smash.share:bare}, rounded up.
"""
applies = ["kind:lightsaber", "spell:FORCE_POWER_LIGHT_SABER_THROW", "spell:FORCE_POWER_LIGHT_SABER_THROW_ADVANCED"]

[smash.reach]
name = "Strike Reach"
value = 2.0
unit = "units"
range = [0.0, 16.0]
summary = "A blade strikes a thrown lightsaber that passes within {sabers.smash.reach:m} of it."
source = "ours"
see = "sim::world::sabers"

[smash.per_power]
name = "Strength per Power"
value = 2.5
range = [0.0, 10.0]
summary = "A stroke's strength is {sabers.smash.per_power} per point of move power."
source = "JA (rulebook 6.2)"
see = "sim::world::sabers"

[smash.outside_duel]
name = "Strength Multiplier"
value = 2.0
unit = "×"
range = [1.0, 4.0]
summary = "A stroke's strength is multiplied by {sabers.smash.outside_duel:bare}."
source = "JA (rulebook 6.2)"
see = "sim::world::sabers"

[smash.scale]
name = "Blade Scale"
value = 0.1
range = [0.0, 1.0]
summary = "A stroke's strength is multiplied by {sabers.smash.scale}."
source = "JA (rulebook 6.2)"
see = "sim::world::sabers"

[smash.share]
name = "Blade Share"
value = 0.33
range = [0.0, 1.0]
summary = "A stroke's strength is multiplied again by {sabers.smash.share}."
source = "JA (rulebook 6.2)"
see = "sim::world::sabers"

[smash.threshold]
name = "Strike Threshold"
value = 10.0
range = [0.0, 100.0]
summary = "A stroke of strength above {sabers.smash.threshold} knocks a thrown lightsaber out of the air."
source = "JA (rulebook 10.6)"
see = "sim::world::sabers"

[lag]
title = "Lag"
summary = """
A player on another machine sees the world a little late. Shots and blades
are checked against other characters where that player saw them, up to
{sabers.lag.rewind_ms:s} back. A hit on a player who could block it waits
up to {sabers.lag.grace_ms:s} for that player's block.
"""
detail = """
Attacks by creatures are never checked late. A held hit becomes a block if
the player blocked in time; otherwise it lands when the wait ends.
"""
applies = ["kind:lightsaber", "kind:melee", "kind:player"]

[lag.rewind_ms]
name = "Lag Allowance"
type = "u64"
value = 400
unit = "ms"
range = [0, 512]
summary = "A player's attacks are checked against the world as that player saw it, up to {sabers.lag.rewind_ms:s} ago."
source = "I25, ours"
see = "sim::world::history::History::view_tick"
applies = ["kind:player"]

[lag.grace_ms]
name = "Block Allowance"
type = "u16"
value = 100
unit = "ms"
range = [0, 400]
summary = "A blade's hit on a player on another machine waits up to {sabers.lag.grace_ms:s} for that player's block."
source = "I22 C19, ours"
see = "sim::combat::saber::grace::wait"
applies = ["kind:player", "kind:lightsaber", "kind:melee"]
