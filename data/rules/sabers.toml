value = 0.20
range = [0.0, 1.0]
summary = "The chest takes {sabers.look.thoracic} of the spine's turn on every axis, averaged with its share of the head's turn."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[look.head_reach]
