[chapter]
title = "Lightsabers and Melee Weapons"
order = 20
summary = """
A lightsaber, sword, vibroblade or staff deals damage with its blade. A
swing damages every character and object the blade passes through. A
defender can block the swing with a blade held ready, and two blades that
meet can clash. The weapon's damage roll, the attacker's feats and the
chance to hit decide how much damage each cut deals.
"""

[ja]
title = "Saber Frame"
summary = """
A saber frame is a short, fixed span of time taken from Jedi Academy. The
game measures swing strength, the pushes in a saber lock and the split kick
in saber frames.
"""

[ja.frame_ms]
name = "Saber Frame"
type = "u32"
value = 25
unit = "ms"
range = [5, 100]
summary = """
A saber frame lasts {sabers.ja.frame_ms:s}. A swing's strength depends on
how far the hilt moves in one saber frame. A saber lock moves forward at
most once in each saber frame.
"""
source = "JA's 40 Hz server frame; the scaling ours"
see = "sim::combat::saber::power::attack"
applies = ["kind:lightsaber", "kind:melee"]

[blades]
title = "Blades"
summary = """
A blade starts at the hilt in the character's hand and moves with the
character's animations. A character with one lightsaber holds it in the
right hand. A second lightsaber goes in the left hand. A double-bladed
lightsaber has a blade at each end. Swords, vibroblades and staves have
blades of a fixed length.
"""
applies = ["kind:lightsaber", "kind:melee"]

[blades.melee_length]
name = "Sword Blade Length"
value = 32.0
unit = "units"
range = [8.0, 80.0]
summary = "The blade of a sword or vibroblade is {sabers.blades.melee_length:m} long."
source = "ours (a delegated stand-in)"
see = "sim::combat::saber::blades::slots"
applies = ["kind:melee", "baseitem:Long_Sword", "baseitem:Vibro_Sword", "baseitem:Short_Sword", "baseitem:Vibro_Blade"]

[blades.melee_staff_length]
name = "Staff Blade Length"
value = 28.0
unit = "units"
range = [8.0, 80.0]
summary = "Each end of a quarterstaff, double-bladed sword or vibro double-blade is {sabers.blades.melee_staff_length:m} long."
source = "ours (a delegated stand-in)"
see = "sim::combat::saber::blades::slots"
applies = ["kind:melee", "baseitem:Quarter_Staff", "baseitem:Double_Bladed_Sword", "baseitem:Vibro_Double_Blade"]

[blades.blend_ms]
name = "Animation Blend"
type = "u32"
value = 150
unit = "ms"
range = [0, 500]
summary = "A character's body blends into each new move over {sabers.blades.blend_ms:s}. The character's blades follow the body during the blend."
source = "JA: animation timing"
see = "sim::combat::saber::blades::Posed::follow"

[blades.trail_ms]
name = "Blade Trail"
type = "u64"
value = 100
unit = "ms"
range = [10, 1000]
summary = "The game checks a blade for hits along the path it moved since its last known position. If that position is older than {sabers.blades.trail_ms:s}, the next check starts from where the blade is now."
source = "JA (rulebook 5.1)"
see = "sim::combat::saber::blades::fresh"

[blades.push_frames]
name = "Blade Lead"
value = 1.6
unit = "×"
range = [0.0, 4.0]
summary = "When a character moves, the game places the character's blades ahead of the body. The blades are placed as far ahead as the character moves in {sabers.blades.push_frames:bare} frames."
source = "JA (1.6 frames); taken over the sim's tick, ours"
see = "sim::combat::saber::blades::push_per_speed"

[blades.near]
name = "Blade Range"
value = 192.0
unit = "units"
range = [64.0, 1024.0]
summary = "The game tracks a character's blades only when another character is within {sabers.blades.near:m}."
source = "ours"
see = "sim::world::sabers"

[blades.bolt_near]
name = "Blade Range, Bolts"
value = 320.0
unit = "units"
range = [64.0, 2048.0]
summary = "The game also tracks a character's blades when a blaster bolt, a thrown lightsaber or a breakable object is within {sabers.blades.bolt_near:m}."
source = "ours"
see = "sim::world::sabers"

[look]
title = "Turning the Body"
summary = """
A character's legs turn toward the direction the character is moving. The
spine, neck and head turn toward the view, which is the direction the
character is looking. The blade moves with the turned body, so turning
during a swing changes where the swing hits. While the character is in the
air, rolling, making a special attack or in a saber lock, the legs face the
view as well.
"""

[look.lean]
name = "Leg Turn"
value = 60.0
unit = "°"
range = [0.0, 90.0]
summary = "A character's legs turn up to {sabers.look.lean} away from the view, toward the direction the character is moving."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[look.spine_pitch]
name = "Spine Pitch"
value = 0.5
range = [0.0, 1.0]
summary = "When the character looks up or down, the spine bends {sabers.look.spine_pitch} of the way with the view."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[look.lower_lumbar]
name = "Lower Back"
value = [0.40, 0.45]
labels = ["of the pitch", "of the yaw and roll"]
range = [0.0, 1.0]
summary = "The lower back bends by {sabers.look.lower_lumbar[0]} of the spine's turn up or down (pitch). It turns by {sabers.look.lower_lumbar[1]} of the spine's turn to the side and its tilt (yaw and roll)."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[look.upper_lumbar]
name = "Upper Back"
value = [0.40, 0.35]
labels = ["of the pitch", "of the yaw and roll"]
range = [0.0, 1.0]
summary = "The upper back bends by {sabers.look.upper_lumbar[0]} of the spine's pitch. It turns by {sabers.look.upper_lumbar[1]} of the spine's yaw and roll."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[look.thoracic]
name = "Chest"
value = 0.20
range = [0.0, 1.0]
summary = "The chest turns by {sabers.look.thoracic} of the spine's turn in every direction. The game averages this with the chest's part of the head's turn."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[look.head_reach]
name = "Head Turn"
value = [-25.0, 50.0, -55.0, 50.0, -10.0, 10.0]
labels = ["pitch, least", "pitch, most", "yaw, least", "yaw, most", "roll, least", "roll, most"]
unit = "°"
range = [-90.0, 90.0]
summary = "The head turns away from the view by {sabers.look.head_reach[0]} to {sabers.look.head_reach[1]} up and down (pitch). It turns by {sabers.look.head_reach[2]} to {sabers.look.head_reach[3]} to the side (yaw) and tilts by {sabers.look.head_reach[4]} to {sabers.look.head_reach[5]} (roll)."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[look.cranium]
name = "Skull"
value = [0.4, 0.6]
labels = ["of the pitch", "of the yaw and roll"]
range = [0.0, 1.0]
summary = "The skull bends by {sabers.look.cranium[0]} of the head's pitch. It turns by {sabers.look.cranium[1]} of the head's yaw and roll."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[look.cervical]
name = "Neck"
value = [0.2, 0.3]
labels = ["of the pitch", "of the yaw and roll"]
range = [0.0, 1.0]
summary = "The neck bends by {sabers.look.cervical[0]} of the head's pitch. It turns by {sabers.look.cervical[1]} of the head's yaw and roll."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[look.thoracic_head]
name = "Chest, Head Turn"
value = [0.4, 0.1]
labels = ["of the pitch", "of the yaw and roll"]
range = [0.0, 1.0]
summary = "The chest bends by {sabers.look.thoracic_head[0]} of the head's pitch. It turns by {sabers.look.thoracic_head[1]} of the head's yaw and roll. The game averages this with the chest's part of the spine's turn."
source = "JA: the body's turn to the view"
see = "sim::combat::saber::look::facing"

[sweep]
title = "Cuts"
summary = """
A swinging blade damages every character it passes through. A single
attack deals at most one damage roll of the weapon to each target. The
blade must pass through {sabers.sweep.nominal:m} of the target's body to
deal the full damage roll. Any cut deals at least
{sabers.sweep.least_share:pct} of the damage roll. The target takes the
damage when the blade leaves the body or when the attack ends.
"""
detail = """
The damage roll is the weapon's own damage roll. It includes the weapon's
properties and the bonus of the saber style's feat. The damage is then
multiplied by the attacker's chance to hit. A block or a clash can stop an
attack only if the attack roll against that target misses.
"""
applies = ["kind:lightsaber", "kind:melee"]

[sweep.step]
name = "Blade Check Spacing"
value = 8.0
unit = "units"
range = [1.0, 32.0]
summary = "A blade is checked for hits every {sabers.sweep.step:m} along its length."
source = "JA (rulebook 5.2)"
see = "sim::combat::saber::sweep::segments"
applies = ["kind:lightsaber", "kind:melee"]

[sweep.extrapolate]
name = "Clash Reach"
value = 16.0
unit = "units"
range = [0.0, 64.0]
summary = "Two blades clash when they pass within {sabers.sweep.extrapolate:m} of each other's tip and path."
source = "JA (rulebook 5.7)"
see = "sim::combat::saber::sweep::sweep_quad"
applies = ["kind:lightsaber", "kind:melee"]

[sweep.arc_step]
name = "Swing Arc"
value = 0.33
range = [0.01, 1.0]
summary = "When a blade turns through a wide angle in a single moment, the game checks for hits along the arc. Each check is {sabers.sweep.arc_step} of the turn further along."
source = "JA: saber swings"
see = "sim::combat::saber::sweep::segments"
applies = ["kind:lightsaber", "kind:melee"]

[sweep.nominal]
name = "Full Cut"
value = 160.0
unit = "units"
range = [16.0, 1000.0]
summary = "A blade must pass through {sabers.sweep.nominal:m} of a body in one attack to deal its full damage roll."
source = "ours"
see = "sim::combat::saber::sweep::Contact::due_share"
applies = ["kind:lightsaber", "kind:melee"]

[sweep.least_share]
name = "Graze Damage"
type = "u32"
value = 500
unit = "‰"
range = [1, 1000]
summary = "A blade's first cut on a target deals at least {sabers.sweep.least_share:pct} of the damage roll. Further cuts in the same attack add the rest, up to the full roll."
source = "the owner's balance, 2026-10-15"
see = "sim::combat::saber::sweep::Contact::due_share"
applies = ["kind:lightsaber", "kind:melee"]

[sweep.pass_gap_ms]
name = "Swing Gap"
type = "u64"
value = 150
unit = "ms"
range = [0, 1000]
summary = "Some moves swing the blade through a target several times. These are the katas, the butterflies, the spins and the jump attacks of two weapons and of the double-bladed lightsaber. In these moves, each time the blade goes through a target counts as one pass. A blade that goes back into the target within {sabers.sweep.pass_gap_ms:s} of leaving it is still in the same pass."
source = "ours; JA hits again 100 ms after a hit"
see = "sim::combat::saber::sweep::Swing::pass_share"
applies = ["kind:lightsaber", "kind:melee"]

[sweep.pass_blows]
name = "Swing Damage"
type = "u32"
value = 1500
unit = "‰"
range = [100, 5000]
summary = "In a move of several swings, each pass of the blade through a target deals up to {sabers.sweep.pass_blows:pct} of the damage of an ordinary attack. This way, every swing that hits the target deals damage."
source = "the owner's balance, 2026-11-05 (JA: every hit of a kata is a whole hit)"
see = "sim::combat::saber::sweep::Swing::pass_share"
applies = ["kind:lightsaber", "kind:melee"]

[sweep.several_budget]
name = "Combo Damage Limit"
type = "u32"
value = 1500
unit = "‰"
range = [1000, 5000]
summary = "A move of several swings deals at most {sabers.sweep.several_budget:pct} of one ordinary attack's damage to each target, even when every swing hits. The extra damage makes up for the longer time the move keeps the attacker busy."
source = "the owner's balance, 2026-11-05 (JA: katas hit harder and cost Force)"
see = "sim::combat::saber::sweep::Swing::budget"
applies = ["kind:lightsaber", "kind:melee"]

[sweep.melee_box]
name = "Blade Width"
value = 2.0
unit = "units"
range = [0.0, 8.0]
summary = "An attacking blade hits any character or object within {sabers.sweep.melee_box:m} of its edge."
source = "JA"
see = "sim::world::sabers"
applies = ["kind:lightsaber", "kind:melee"]

[power]
title = "Attack Power"
summary = """
Power is a number that decides who wins when two blades meet. An
attacking blade's power is its style's level multiplied by
{sabers.power.attacking_times:bare}, plus {sabers.power.attacking_plus:bare}.
The blade gains 1 more power for each step of distance its hilt moves in
one saber frame. Attack power is never below {sabers.power.least:bare} and
never above {sabers.power.most:bare}. Each move also has a move power of its
own. The move power depends on the move and on how far into the move the
character is.
"""
detail = """
A blade that is not attacking deals no damage. A blade whose move has no
power deals no damage either. A special attack has power only during part
of its move.
"""
applies = ["kind:lightsaber", "kind:melee"]

[power.style_level]
name = "Style Level"
value = [1, 2, 3]
labels = ["fast", "medium, two weapons and double-bladed", "strong"]
range = [1, 5]
summary = "The fast style is level {sabers.power.style_level[0]}, the medium style level {sabers.power.style_level[1]} and the strong style level {sabers.power.style_level[2]}. Two weapons and a double-bladed lightsaber count as medium."
source = "JA: a blade's attack power in a lock"
see = "sim::combat::saber::power::style_level"
applies = ["kind:lightsaber", "kind:melee"]

[power.attacking_times]
