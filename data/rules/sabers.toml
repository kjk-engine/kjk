{sabers.power.super_break:bare} and cuts through blades, but only in the
middle of its move. Its timing depends on the two fighters' weapons and
whether the lock is high or to the side. The other super-breaks deal damage
for their whole move.
"""
detail = "With two weapons against a single lightsaber, only the right-hand blade cuts."
applies = ["kind:lightsaber"]

[breaks.s_side]
