see = "sim::world::grapples"
applies = ["kind:unarmed"]

[grab.victim_extra_ms]
name = "Victim Held Longer"
type = "i32"
value = 200
unit = "ms"
summary = "The victim's finisher clip is held {duel.grab.victim_extra_ms} past its end."
source = "code/game/wp_saber.cpp:3420-3421"
see = "sim::world::grapples"
applies = ["kind:unarmed"]

[grab.end_ms]
name = "Finisher End"
type = "i32"
value = 100
unit = "ms"
summary = "A victim whose finisher clip has {duel.grab.end_ms} left is let go. After the first finisher it is thrown back and knocked down. After the third it is thrown and flies through the air before it lands."
source = "code/game/g_active.cpp:3057 and 3072-3113"
see = "sim::world::grapples"
applies = ["kind:unarmed"]

[grab.blows_1]
name = "First Finisher's Blows"
type = "i32"
value = [3150, 1150, 100]
unit = "ms"
summary = "The first finisher strikes the victim when {duel.grab.blows_1[0]}, {duel.grab.blows_1[1]} and {duel.grab.blows_1[2]} of the victim's clip are left. Each blow deals one unarmed hit's damage, and it always hits."
