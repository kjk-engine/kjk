summary = "The first and the third finisher throw the victim away from the grabber a little upward. The throw tips {duel.grab.throw[1]:bare} degrees from level, and it lifts the victim at {duel.grab.throw[0]:bare} units a second for each unit of that tip's height."
source = "G_Throw(ent, throwDir, -100) with the view tipped 10 degrees in code/game/g_active.cpp:3076-3081, worked out by G_Throw in code/game/wp_saber.cpp:504-507 with g_knockback 1000 and a mass of 200"
