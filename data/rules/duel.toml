[npc]
title = "NPC Saber Fighters"
summary = "Under the Advanced rules, NPCs with lightsabers block whenever they can. They take a block stance when an enemy is close, and they meditate to restore Stamina."

[npc.stance]
name = "Block Stance"
type = "f32"
value = [40.0, 1.5, 16.0, 32.0]
labels = ["a blade's length", "times the body's half width", "plus", "kept until this much farther"]
unit = "units"
summary = "An NPC takes a block stance facing a melee fighter who is within a blade's length ({duel.npc.stance[0]}) plus {duel.npc.stance[1]:bare} times half its body width plus {duel.npc.stance[2]}. It keeps the stance until the melee fighter is {duel.npc.stance[3]} farther away. The NPC stands its ground only within that distance and steps back in when pushed out of it, so its swings can still reach. An NPC with no straight path to its enemy takes no stance, and neither does an NPC in a scene (see Scene Calm)."
source = "docs/SABER-RULES.md 10"
see = "sim::world::minds"

[npc.meditate]
name = "Meditation"
type = "i32"
value = [30, 25]
labels = ["under", "restores"]
unit = "points"
summary = "An idle NPC with less than {duel.npc.meditate[0]:bare} Stamina meditates when no melee fighter is within {duel.npc.meditate_far}. Meditating restores {duel.npc.meditate[1]:bare} Stamina."
source = "docs/SABER-RULES.md 10"
see = "sim::world::minds"

[npc.meditate_far]
name = "Meditation Distance"
type = "f32"
value = 256.0
unit = "units"
summary = "An NPC meditates only when every melee fighter is at least {duel.npc.meditate_far} away."
source = "docs/SABER-RULES.md 10"
see = "sim::world::minds"

[npc.meditate_ms]
name = "Meditation Wait"
type = "u64"
value = [15000, 25000]
labels = ["least", "most"]
unit = "ms"
summary = "After meditating, an NPC waits between {duel.npc.meditate_ms[0]} and {duel.npc.meditate_ms[1]} before it can meditate again."
source = "docs/SABER-RULES.md 10"
see = "sim::world::minds"

[targeted]
title = "Targeted Blocks"
summary = "With the Targeted blocks setting on, under the Advanced rules, a player's perfect block also needs aim. The player turns the camera toward the side that the attack comes from. The sides are left, right and above."

[targeted.turn_deg]
name = "Camera Turn"
type = "f32"
value = 1.5
unit = "°"
range = [0.0, 45.0]
summary = "While a player holds block, the game adds up how far the camera turned over the last {duel.targeted.turn_ms:bare} ms. When that turn is longer than {duel.targeted.turn_deg}, its direction becomes the player's aim. A shorter turn leaves the aim as it was."
source = "ours: the targeted blocks spec"
see = "sim::combat::saber::duel::aim::Turn"

[targeted.turn_ms]
name = "Camera Turn Time"
type = "u64"
value = 200
unit = "ms"
range = [50, 1000]
summary = "The camera turn that sets a player's aim is added up over the last {duel.targeted.turn_ms:bare} ms."
source = "ours: the targeted blocks spec"
see = "sim::combat::saber::duel::aim::Turn"

[targeted.side_on]
name = "Side-On Swing"
type = "f32"
value = 0.3
unit = "×"
range = [0.0, 1.0]
summary = "A swing that starts on the attacker's left or right comes from the blocker's left or right only when the dot product of that direction with the blocker's right is more than {duel.targeted.side_on:bare} away from zero. Otherwise the attacker stands side-on, and the swing has no side."
source = "ours: the targeted blocks spec"
see = "sim::combat::saber::duel::aim::swing_side"

[targeted.window_percent]
name = "Targeted Perfect Block Window"
type = "u64"
value = 150
unit = "%"
range = [100, 400]
summary = "With Targeted blocks on, a player's perfect block window lasts {duel.targeted.window_percent:bare}% of its normal length, so that the player has time to aim."
source = "ours: the targeted blocks spec"
see = "sim::combat::saber::duel::aim::window_ms"

[targeted.threat_m]
name = "Threat Distance"
type = "f32"
value = 4.0
unit = "m"
range = [0.0, 20.0]
summary = "The reticule shows the side of a swing by a hostile fighter in front of the player within {duel.targeted.threat_m:bare} meters."
source = "ours: the targeted blocks spec"
see = "sim::combat::saber::duel::aim::threat_range"
