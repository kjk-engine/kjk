source = "46 units in code/game/wp_saber.cpp:3145, scaled by the bodies' size (1.25 for Carth and a Sith trooper) and fitted on those two bodies so their hands come nearest Jedi Academy's touches (the probe gap_fitted, 19 November 2026)"
