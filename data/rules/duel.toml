[chapter]
title = "Duel Saber Rules"
order = 88
summary = """The rules the blades play by when a session picks the duel mode, Movie Duels Advanced (MDA), instead of JA's: the block button, block points, perfect blocks, mishaps and fatigue (`docs/SABER-RULES.md`)."""
detail = """
A "meter" below is the block points. The Force, where a rule names it, is
counted in hundredths of the pool (a point is 1% of it). Every rule here is
read only under the duel mode; JA's rules are untouched by this chapter.
"""

[meters]
title = "Meters"
summary = """What a saber user's blocks are paid from: block points of their own, so the Force pool is left to the powers."""

[meters.points_max]
name = "Block Points"
type = "u8"
value = 100
unit = "count"
range = [10, 255]
summary = """A full meter of block points: {duel.meters.points_max}; every saber starts a fight with it full."""
source = "the duel mode's behaviour spec, docs/SABER-RULES.md section 1"
see = "sim::combat::saber::duel::Duel::FRESH"
applies = ["kind:lightsaber"]

[slow_motion]
title = "Perfect-Block Slow Motion"
summary = """With the "Perfect block slow motion" option on (on by default), the player's own perfect block slows the world for a moment. Only in a game played alone: a session of more than one player never slows."""

[slow_motion.scale]
name = "Slow-Motion Pace"
type = "f32"
value = 0.3
unit = "×"
range = [0.05, 1.0]
summary = """The world runs at {duel.slow_motion.scale:bare} of its pace while a perfect block slows it."""
source = "the duel mode's behaviour spec, docs/SABER-RULES.md section 3"
see = "game::sim_host::Slowed"
applies = ["kind:lightsaber"]

[slow_motion.ms]
name = "Slow-Motion Time"
type = "u32"
value = 200
unit = "ms"
range = [0, 2000]
summary = """A perfect block slows the world for {duel.slow_motion.ms} of real time."""
source = "the duel mode's behaviour spec, docs/SABER-RULES.md section 3"
see = "game::sim_host::Slowed"
applies = ["kind:lightsaber"]

[hud]
title = "Duel Bars"
summary = """What the HUD shows of the duel meters while the duel mode is played: block points and stamina, by the player's own bars and, with the "Overhead duel bars" option, over every saber user's head."""

[hud.stamina_steps]
name = "Stamina Steps"
type = "u8"
value = 16
range = [1, 255]
summary = """The stamina bar is the mishap count turned upside down: full at none, losing one {duel.hud.stamina_steps:bare}th for each mishap."""
source = "the duel mode's behaviour spec, docs/SABER-RULES.md sections 1.1 and 12"
see = "game::duel_view::stamina"
applies = ["kind:lightsaber"]

[hud.lamps]
name = "Stamina Warnings"
type = "u8"
value = [2, 6, 10, 12]
labels = ["green", "blue", "magenta", "red"]
range = [0, 15]
summary = """The stamina bar flashes once the mishap count is above {duel.hud.lamps[0]:bare} (green), above {duel.hud.lamps[1]:bare} (blue), above {duel.hud.lamps[2]:bare} (magenta) and above {duel.hud.lamps[3]:bare} (red, where swings tire)."""
source = "the duel mode's behaviour spec, docs/SABER-RULES.md sections 5.4 and 12"
see = "game::duel_view::stamina"
applies = ["kind:lightsaber"]

[hud.lamp_ms]
name = "Stamina Flash"
type = "u32"
value = 600
unit = "ms"
range = [100, 5000]
summary = """A flashing stamina bar goes off and on again every {duel.hud.lamp_ms}."""
source = "the duel mode's behaviour spec, docs/SABER-RULES.md section 12"
see = "game::duel_view::stamina"
applies = ["kind:lightsaber"]

[hud.gauge_bands]
name = "Block Point Colours"
type = "u8"
value = [20, 50, 75]
labels = ["red under", "purple under", "dark purple under"]
unit = "points"
range = [0, 255]
summary = """The block-point bar is red under {duel.hud.gauge_bands[0]:bare} points, purple under {duel.hud.gauge_bands[1]:bare}, dark purple under {duel.hud.gauge_bands[2]:bare}, and bright magenta above."""
source = "the duel mode's behaviour spec, docs/SABER-RULES.md section 12"
see = "game::duel_view::points"
applies = ["kind:lightsaber"]

[hud.gauge_flash]
name = "Block Points Low"
type = "u8"
value = 7
unit = "points"
range = [0, 255]
summary = """Under {duel.hud.gauge_flash:bare} block points the bar flashes, off and on every {duel.hud.gauge_flash_ms}."""
source = "the duel mode's behaviour spec, docs/SABER-RULES.md section 12"
see = "game::duel_view::points"
applies = ["kind:lightsaber"]

[hud.gauge_flash_ms]
name = "Block Points Flash"
type = "u32"
value = 400
unit = "ms"
range = [100, 5000]
summary = """A low block-point bar goes off and on again every {duel.hud.gauge_flash_ms}."""
source = "the duel mode's behaviour spec, docs/SABER-RULES.md section 12"
see = "game::duel_view::points"
applies = ["kind:lightsaber"]

[meters.least]
name = "Meter to Block"
type = "i32"
value = 1
unit = "points"
summary = "The block button blocks, with a lightsaber or a melee blade its holder is proficient with, only with at least {duel.meters.least} in the meter (and as much Force)."
source = "docs/SABER-RULES.md 2.2"
see = "sim::combat::saber::duel::can_hold"

[meters.run_least]
name = "Running Block"
type = "i32"
value = 5
unit = "points"
summary = "Holding block while running sprints only with at least {duel.meters.run_least} in the meter."
source = "docs/SABER-RULES.md 2.2"
see = "sim::combat::saber::duel::can_hold"

[meters.fatigued]
name = "Fatigue Mark"
type = "i32"
value = 20
unit = "%"
summary = "At or under {duel.meters.fatigued} of the Force pool a saber user is fatigued: it cannot block lunges or spins, a player gets up from a fall without the Force, and a creature cannot absorb kicks. It recovers once the pool is above it again."
source = "docs/SABER-RULES.md 1.4"
see = "sim::combat::saber::duel::meter::settle"

[meters.fatigued_drain]
name = "Spent Mark"
type = "i32"
value = 10
unit = "points"
summary = "A cost that leaves the meter at or under {duel.meters.fatigued_drain} makes its payer fatigued too."
source = "docs/SABER-RULES.md 1.4"
see = "sim::combat::saber::duel::meter::spend"

[meters.drained]
name = "Drained Mark"
type = "i32"
value = 20
unit = "points"
summary = "A cost that leaves the meter under {duel.meters.drained} drains its payer: it cannot block lunges or spins until the meter is above it again."
source = "docs/SABER-RULES.md 1.4"
see = "sim::combat::saber::duel::meter::spend"

[meters.drained_points]
name = "Drained Points"
type = "i32"
value = 10
unit = "points"
summary = "A saber user with block points under {duel.meters.drained_points} is drained, and is no more once they are above it."
source = "docs/SABER-RULES.md 1.4"
see = "sim::combat::saber::duel::meter::settle"

[costs]
title = "Costs"
summary = "What starting a move costs."

[costs.swing]
name = "Swing Cost"
type = "i32"
value = 1
unit = "points"
summary = "A player starting a plain swing pays {duel.costs.swing} from the meter."
source = "docs/SABER-RULES.md 1.2"
see = "sim::combat::saber::duel::meter::started"

[costs.pair_knockaway]
name = "Two-Blade Knockaway"
type = "i32"
value = 2
unit = "points"
summary = "A creature starting a knockaway with a staff or a pair pays {duel.costs.pair_knockaway}."
source = "docs/SABER-RULES.md 1.2"
see = "sim::combat::saber::duel::meter::started"

[costs.parry]
name = "Parry Cost"
type = "i32"
value = 1
unit = "points"
summary = "A creature starting a parry or a knockaway with one blade pays {duel.costs.parry} block point."
source = "docs/SABER-RULES.md 1.2"
see = "sim::combat::saber::duel::meter::started"

[master]
title = "Masters"
summary = """KOTOR's masters of the blade: a character with Master Jedi Defense, or of level {duel.master.level} or more. They pay less for their blocks and get their block points back sooner. A Jedi on the way takes part of it: nothing at Jedi Defense, half at Advanced Jedi Defense."""

[master.defense]
name = "Master's Defense"
type = "u8"
value = 3
summary = "The tier of the Jedi Defense feats that makes its holder a master: {duel.master.defense} (Master Jedi Defense)."
source = "ours: the spec's master classes as KOTOR's top blocking feat"
see = "sim::combat::saber::duel::master"

[master.level]
name = "Master's Level"
type = "u8"
value = 20
summary = "A character of level {duel.master.level} or more is a master whatever its feats (KOTOR's last level, the duellists its stories end on)."
source = "ours: the spec's master classes as KOTOR's levels"
see = "sim::combat::saber::duel::master"

[master.saber_share]
name = "Master's Block Price"
type = "i32"
value = 80
unit = "%"
summary = "A master pays {duel.master.saber_share} of what blocking a blade costs (rounded, at least a point)."
source = "docs/SABER-RULES.md 1.2"
see = "sim::combat::saber::duel::meter::price"

[master.bolt_share]
name = "Master's Deflection Price"
type = "i32"
value = 60
unit = "%"
summary = "A master pays {duel.master.bolt_share} of what turning a bolt costs (rounded, at least a point)."
source = "docs/SABER-RULES.md 1.2"
see = "sim::combat::saber::duel::meter::price"

[master.wait_share]
name = "Master's Recovery"
type = "u64"
value = 80
unit = "%"
summary = "A master's block points come back after {duel.master.wait_share} of the usual wait."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::meter::refill"

[refill]
title = "Refill"
summary = "How the meters come back."

[refill.tick_ms]
name = "Refill Tick"
type = "u64"
value = 100
unit = "ms"
summary = "A player's block points come back a point every {duel.refill.tick_ms} while it walks or stands and neither swings nor blocks."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::meter::refill"

[refill.gain]
name = "Refill Point"
type = "i32"
value = 1
unit = "points"
summary = "Each refill tick gives {duel.refill.gain} (and takes a crouching player's mishaps down as many)."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::meter::refill"

[refill.slow_ms]
name = "Refill Wait"
type = "u64"
value = 2000
unit = "ms"
summary = "The next block point waits {duel.refill.slow_ms} longer when the points are above {duel.refill.slow_above}, the saber is away or the player stands idle."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::meter::refill"

[refill.slow_above]
name = "Refill Slows"
type = "i32"
value = 75
unit = "points"
summary = "Above {duel.refill.slow_above} block points the refill slows."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::meter::refill"

[refill.crouch]
name = "Crouched Refill"
type = "i32"
value = 2
unit = "points"
summary = "A player crouching gains {duel.refill.crouch} more each tick, Force and block points, and its mishaps fall a step."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::meter::refill"

[refill.force_hold_ms]
name = "Block Holds the Force"
type = "u64"
value = 2000
unit = "ms"
summary = "While block is held the Force comes back a point every {duel.refill.force_hold_ms}, and only that long after it is let go."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::meter::refill"

[refill.creature_busy_ms]
name = "Busy Creature's Force"
type = "u64"
value = 2000
unit = "ms"
summary = "A creature's Force waits {duel.refill.creature_busy_ms} after it throws its saber."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::meter::refill"

[refill.creature_every_ms]
name = "Creature's Refill"
type = "u64"
value = 1000
unit = "ms"
summary = "A creature with its saber lit gains {duel.refill.creature_gain} block point every {duel.refill.creature_every_ms}, not while staggered, down or just after a block."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::meter::refill"

[refill.creature_gain]
name = "Creature's Gain"
type = "i32"
value = 1
unit = "points"
summary = "What a creature's refill gives each time: {duel.refill.creature_gain}."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::meter::refill"

[gains]
title = "Gains"
summary = "What fighting well gives back."

[gains.perfect]
name = "Perfect Block Reward"
type = "i32"
value = 15
unit = "points"
summary = "A perfect block gives its blocker {duel.gains.perfect}."
source = "docs/SABER-RULES.md 3"
see = "sim::combat::saber::duel::exchange::resolve"

[gains.disarmed]
name = "Disarmed"
type = "i32"
value = 20
unit = "points"
summary = "A fighter disarmed gets {duel.gains.disarmed} block points back, and so does one so spent a block would disarm it but who keeps its saber."
source = "docs/SABER-RULES.md 1.3, 4.6"
see = "sim::combat::saber::duel::exchange::resolve"

[gains.kill]
name = "Kill Reward"
type = "i32"
value = 10
unit = "points"
summary = "A kill gives a saber user {duel.gains.kill} ({duel.gains.kill_blocking} to a player holding block)."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::meter::rewarded"

[gains.kill_blocking]
name = "Kill While Blocking"
type = "i32"
value = 5
unit = "points"
summary = "A kill made with block held gives only {duel.gains.kill_blocking}."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::meter::rewarded"

[gains.hurt_lethal]
name = "Lethal Hit Reward"
type = "i32"
value = 5
unit = "points"
summary = "At the easy and normal difficulties a player's killing hit gives {duel.gains.hurt_lethal} more."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::meter::rewarded"

[gains.hurt]
name = "Hit Reward"
type = "i32"
value = 3
unit = "points"
summary = "At the easy and normal difficulties a player's hit gives {duel.gains.hurt} ({duel.gains.hurt_blocking} with block held)."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::meter::rewarded"

[gains.hurt_blocking]
name = "Hit While Blocking"
type = "i32"
value = 2
unit = "points"
summary = "A hit or killing hit made with block held gives {duel.gains.hurt_blocking}."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::meter::rewarded"

[gains.hurt_easiest]
name = "Rewarded Difficulties"
type = "usize"
value = 1
summary = "Hits are rewarded at the difficulties up to {duel.gains.hurt_easiest} (0 the easiest)."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::meter::rewarded"

[gains.kick]
name = "Kick Reward"
type = "i32"
value = 2
unit = "points"
summary = "A kick that lands gives its kicker {duel.gains.kick}."
source = "docs/SABER-RULES.md 1.3"
see = "sim::world::sabers"

[gains.fake_parried]
name = "Fake Parried"
type = "i32"
value = 10
unit = "points"
summary = "Parrying an attack fake with a perfect or a creature's block gives {duel.gains.fake_parried} Force (1% of the pool a point), in both modes."
source = "docs/SABER-RULES.md 1.3"
see = "sim::combat::saber::duel::exchange::resolve"

[gains.spam]
name = "Blocked Creature's Refill"
type = "i32"
value = [20, 10]
labels = ["at or under the low mark", "above it"]
unit = "points"
summary = "A creature whose swing a held block stops gets {duel.gains.spam[0]} back when at or under {duel.gains.spam_low}, else {duel.gains.spam[1]}."
source = "docs/SABER-RULES.md 4.1"
see = "sim::combat::saber::duel::exchange::resolve"

[gains.spam_low]
name = "Blocked Creature's Low Mark"
type = "i32"
value = 20
unit = "points"
summary = "At or under {duel.gains.spam_low} a blocked creature gets the larger refill."
source = "docs/SABER-RULES.md 4.1"
see = "sim::combat::saber::duel::exchange::resolve"

[gains.thrown_disarm]
name = "Disarmed by a Throw"
type = "i32"
value = 10
unit = "points"
summary = "A fighter a thrown saber disarms gets {duel.gains.thrown_disarm} block points back."
source = "docs/SABER-RULES.md 4.7"
see = "sim::world::sabers"

[perfect]
title = "Perfect Block"
summary = "Pressing attack with block held opens a short window; a blow met inside it is blocked perfectly."

[perfect.window_ms]
name = "Perfect Window"
type = "u64"
value = [250, 150, 50]
labels = ["easy", "normal", "difficult"]
unit = "ms"
summary = "The perfect window lasts {duel.perfect.window_ms[0]} on easy, {duel.perfect.window_ms[1]} on normal and {duel.perfect.window_ms[2]} on difficult."
source = "docs/SABER-RULES.md 3"
see = "sim::combat::saber::duel::window"

[perfect.attacker_cost]
name = "Perfectly Blocked Cost"
type = "i32"
value = [10, 20]
labels = ["player", "creature"]
unit = "points"
summary = "A swing perfectly blocked costs a player {duel.perfect.attacker_cost[0]} and a creature {duel.perfect.attacker_cost[1]}."
source = "docs/SABER-RULES.md 3"
see = "sim::combat::saber::duel::exchange::resolve"

[perfect.attacker_mishap]
name = "Perfectly Blocked Mishaps"
type = "i32"
value = [5, 10]
labels = ["player", "creature"]
unit = "count"
summary = "A swing perfectly blocked adds {duel.perfect.attacker_mishap[0]} mishaps to a player and {duel.perfect.attacker_mishap[1]} to a creature."
source = "docs/SABER-RULES.md 3"
see = "sim::combat::saber::duel::exchange::resolve"

[perfect.blocker_mishap]
name = "Perfect Block Calm"
type = "i32"
value = 5
unit = "count"
summary = "A perfect block takes {duel.perfect.blocker_mishap} mishaps off its blocker."
source = "docs/SABER-RULES.md 3"
see = "sim::combat::saber::duel::exchange::resolve"

[perfect.roll_from]
name = "Perfectly Blocked Roll"
type = "u8"
value = 13
unit = "count"
summary = "A perfectly blocked attacker with {duel.perfect.roll_from} mishaps or more rolls for a mishap; one with fewer is staggered."
source = "docs/SABER-RULES.md 3"
see = "sim::combat::saber::duel::exchange::resolve"

[perfect.riposte_freeze_ms]
name = "Riposte Freeze"
type = "i32"
value = 350
unit = "ms"
summary = "A perfectly blocked attacker is held {duel.perfect.riposte_freeze_ms} and its chain ends."
source = "docs/SABER-RULES.md 3"
see = "sim::world::sabers"

[perfect.riposte_ms]
name = "Riposte Window"
type = "u64"
value = 500
unit = "ms"
summary = "A perfect blocker's next attack within {duel.perfect.riposte_ms} plays quicker."
source = "docs/SABER-RULES.md 3"
see = "sim::world::sabers"

[perfect.riposte_time]
name = "Riposte Pace"
type = "f32"
value = 0.87
unit = "×"
summary = "A riposte takes {duel.perfect.riposte_time} of its swing's time."
source = "docs/SABER-RULES.md 3"
see = "sim::combat::saber::duel::play_speed"

[perfect.held_long_ms]
name = "Held Too Long"
type = "u64"
value = 3000
unit = "ms"
summary = "Block and attack held together {duel.perfect.held_long_ms} or more make turning bolts cost twice as much."
source = "docs/SABER-RULES.md 2.5"
see = "sim::combat::saber::duel::shots::cost"

[block]
title = "Blocks"
summary = "What a block of a blade costs and plays, by how the blocker blocks. A creature parries only the blows KOTOR's attack roll misses (the attacker's attack bonus against its defence, as under JA); a player blocks by its button."

[block.low]
name = "Low Meter"
type = "i32"
value = 20
unit = "points"
summary = "A blocker with {duel.block.low} or less in the meter is knocked aside by the blow (paying {duel.block.low_cost})."
source = "docs/SABER-RULES.md 4.1"
see = "sim::combat::saber::duel::exchange::resolve"

[block.lowest]
name = "Spent Meter"
type = "i32"
value = 10
unit = "points"
summary = "A blocker with {duel.block.lowest} or less is disarmed (a player) or rolls for a mishap (a creature); an unblockable blow disarms one under it."
source = "docs/SABER-RULES.md 4.1, 4.2"
see = "sim::combat::saber::duel::exchange::resolve"

[block.low_cost]
name = "Knocked Aside Cost"
type = "i32"
value = 4
unit = "points"
summary = "Being knocked aside by a blow costs {duel.block.low_cost}."
source = "docs/SABER-RULES.md 4.1"
see = "sim::combat::saber::duel::exchange::resolve"

[block.weary_parry]
name = "Weary Parry"
type = "i32"
value = 50
unit = "points"
summary = "A blocker holding block with {duel.block.weary_parry} or less parries wearily."
source = "docs/SABER-RULES.md 4.1"
see = "sim::combat::saber::duel::exchange::resolve"

[block.creature_bands]
name = "Creature's Parries"
type = "i32"
value = [40, 75]
labels = ["weary up to", "plain up to"]
unit = "points"
summary = "A creature parries wearily up to {duel.block.creature_bands[0]}, plainly up to {duel.block.creature_bands[1]}, and well above."
source = "docs/SABER-RULES.md 4.1"
see = "sim::combat::saber::duel::exchange::resolve"

[block.held]
name = "Held Block Cost"
type = "i32"
value = [5, 0]
labels = ["player", "creature"]
unit = "points"
summary = "A block held costs a player {duel.block.held[0]}; with attack too it costs anyone {duel.block.held[0]}."
source = "docs/SABER-RULES.md 4.1"
see = "sim::combat::saber::duel::exchange::resolve"

[block.creature_parry]
name = "Creature's Parry Cost"
type = "i32"
value = [2, 3, 10]
labels = ["weary", "plain", "good"]
unit = "points"
summary = "A creature's weary parry costs {duel.block.creature_parry[0]}, a plain one {duel.block.creature_parry[1]}, a good one {duel.block.creature_parry[2]}."
source = "docs/SABER-RULES.md 4.1"
see = "sim::combat::saber::duel::exchange::resolve"

[block.player_good]
name = "Player's Good Parry"
type = "i32"
value = 3
unit = "points"
