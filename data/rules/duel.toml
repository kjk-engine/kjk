value = [3800, 3100, 1650]
unit = "ms"
summary = "The third finisher strikes the victim when {duel.grab.blows_3[0]}, {duel.grab.blows_3[1]} and {duel.grab.blows_3[2]} of the victim's clip are left. The victim then flies, and it is struck once more when {duel.grab.end_ms} of its flight is left."
source = "code/game/g_active.cpp:2989-3048"
see = "sim::world::grapples"
applies = ["kind:unarmed"]

[grab.throw]
