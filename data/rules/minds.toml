summary = "In a saber lock, a creature presses attack for {minds.guarding.lock_tap_ms:s}, then releases for as long, over and over."
source = "ours"
see = "sim::world::minds::think"

[powers]
title = "Force Powers"
summary = """
A creature uses the power its script chooses once it is within the power's
range of the target, no more than once a round. Choke, Force Lightning and
Drain Life are held. Where no scripts run, a creature chooses for
itself. It heals when hurt, uses Choke, lightning or drain within range,
pushes a nearby enemy, stuns an enemy not already stunned, slows a living
enemy, breaks an enemy's Force powers and raises a protective power it
lacks. After a power, it waits {minds.powers.cast_wait_ms:s} plus up to
{minds.powers.cast_spread_ms:s} more. After a held power, it waits
{minds.powers.hold_wait_ms:s} plus up to as much again.
"""
applies = ["kind:force", "kind:creature", "kind:companion"]

