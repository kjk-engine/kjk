[chapter]
title = "Perception and Tactics"
order = 41
summary = """
A creature notices its enemies, chooses whom to fight, then attacks, gives
chase, follows its leader or stands idle. Its scripts choose whom it attacks
and every Force power, feat, grenade and item it uses. Where no scripts run,
it chooses for itself.
"""

[looking]
title = "Perception"
summary = """
A creature fights the target its script attacks, even out of sight, or else
the enemy it is already fighting while that enemy stays hostile and in
sight. Where no scripts run, it fights the nearest hostile creature it can
see. A creature in Stealth Mode is seen only if its Stealth loses to the
searcher's Awareness, each taking 10 on the roll. A party member who sees no
enemy goes to the nearest enemy fighting the party. A creature that spots an
enemy outside combat is caught unaware for a moment and can be sneak
attacked. Damage ends this at once.
"""
applies = ["kind:creature", "kind:companion", "skill:Awareness", "kind:stealth"]

[looking.look_every_ms]
name = "Perception Rate"
type = "u64"
value = 200
unit = "ms"
range = [16, 5000]
summary = "A creature looks for enemies every {minds.looking.look_every_ms:s}. It chooses its own Force powers at the same time."
source = "ours"
see = "sim::world::minds::think"

[looking.sight]
name = "Sight Range"
value = 1200.0
unit = "units"
range = [0.0, 8192.0]
summary = "A creature with no perception range of its own sees {minds.looking.sight:m}."
source = "ours"
see = "sim::world::minds::think"

[looking.reaction_ms]
name = "Reaction Time"
type = "u64"
value = 1500
unit = "ms"
range = [0, 10000]
summary = "A creature that spots an enemy outside combat acts after {minds.looking.reaction_ms:s}, less {minds.looking.reaction_per_rank_ms:s} for each rank of Awareness."
source = "ours (I22 section 5)"
see = "sim::combat::ai::reaction_ms"
applies = ["skill:Awareness"]

[looking.reaction_per_rank_ms]
name = "Awareness Reaction Bonus"
type = "u64"
value = 150
unit = "ms"
range = [0, 1000]
summary = "Each rank of Awareness lets a creature act {minds.looking.reaction_per_rank_ms:s} sooner on an enemy it spots."
source = "ours (I22 section 5)"
see = "sim::combat::ai::reaction_ms"
applies = ["skill:Awareness"]

[tasks]
title = "Combat Tactics"
summary = """
A creature with a target attacks it. A creature that loses its target goes
to where it last saw it while combat lasts. A party member with nothing to
do follows its leader. A creature with a melee weapon runs to a distant or
hidden target, and closes from one side so a group attacks from the flanks
rather than in a line. No creature steps off walkable ground. In solo mode,
party members stay where they are.
"""
applies = ["kind:creature", "kind:companion"]

[tasks.leash]
name = "Leash"
value = 1024.0
unit = "units"
range = [64.0, 8192.0]
summary = "A party member more than {minds.tasks.leash:m} from its leader breaks off combat and returns."
source = "ours"
see = "sim::world::minds::think"
applies = ["kind:companion"]

[tasks.follow_near]
name = "Following Distance"
value = 192.0
unit = "units"
range = [16.0, 2048.0]
summary = "A party member follows its leader once it is more than {minds.tasks.follow_near:m} away."
source = "ours"
see = "sim::world::minds::think"
applies = ["kind:companion"]

[tasks.follow_replan]
name = "Following Path"
value = 96.0
unit = "units"
range = [1.0, 2048.0]
summary = "A following party member finds a new path when its leader moves {minds.tasks.follow_replan:m}."
source = "ours"
see = "sim::world::minds::think"
applies = ["kind:companion"]

[tasks.follow_back]
name = "Formation Depth"
value = 64.0
unit = "units"
range = [16.0, 512.0]
summary = "A following party member keeps {minds.tasks.follow_back:m} behind its leader, a second pair twice as far."
source = "ours (owner, 2026-10-27)"
see = "sim::world::minds::follow_slot"
applies = ["kind:companion"]

[tasks.follow_side]
name = "Formation Width"
value = 48.0
unit = "units"
range = [0.0, 512.0]
summary = "Following party members keep {minds.tasks.follow_side:m} to their leader's left and right, one on each side."
source = "ours (owner, 2026-10-27)"
see = "sim::world::minds::follow_slot"
applies = ["kind:companion"]

[tasks.follow_apart]
