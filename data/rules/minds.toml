value = 40.0
unit = "units"
range = [8.0, 512.0]
summary = "A following party member nearer than {minds.tasks.follow_apart:m} to another moves to its own place beside the leader."
source = "ours (owner, 2026-10-27)"
see = "sim::world::minds::follow_slot"
applies = ["kind:companion"]

[tasks.replan]
name = "Pursuit Path"
