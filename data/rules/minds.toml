name = "Guard Duration"
type = "u64"
value = 700
unit = "ms"
range = [50, 10000]
summary = "A creature that guards does so for {minds.guarding.guard_ms:s} at a time."
source = "ours"
see = "sim::world::minds::think"

[guarding.guard_share]
name = "Guard Chance"
value = 0.3
range = [0.0, 1.0]
summary = "A creature that can block guards {minds.guarding.guard_share} of the time."
