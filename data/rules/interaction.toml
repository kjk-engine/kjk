[chapter]
title = "Doors, Locks and Bashing"
order = 52
summary = """
[Use] opens doors and containers, uses placeables and starts conversations.
A placeable is an object in the world that a character can use, such as a
computer panel or a footlocker. A locked door or container can be opened
with its key, with the Security skill, or by bashing it open.
"""

[checks]
title = "Skill Checks"
summary = """
A skill check is a d{interaction.checks.die:bare} roll plus the character's
skill total, against a difficulty class (DC). The check succeeds if the
result is equal to or higher than the DC. Out of combat, the character does
not roll, and the roll counts as {interaction.checks.taken:bare}.
"""
detail = """
The feedback screen shows the result of each check. It lists the skill, the
roll or "Take 20", the DC, and whether the check succeeded.
"""
applies = ["skill:Security", "skill:Demolitions"]

[checks.die]
name = "Die Roll"
type = "u32"
value = 20
range = [2, 100]
summary = "Skill checks, attack rolls, critical hits and saving throws are rolled on a d{interaction.checks.die:bare}."
source = "K1's executable (KOTOR's d20)"
see = "sim::world::locks::unlock, sim::combat::damage::assess, sim::world::powers"
applies = ["skill:Security", "skill:Demolitions", "kind:weapon", "kind:grenade", "kind:force"]

[checks.taken]
name = "Take 20"
type = "u8"
value = 20
range = [1, 100]
summary = "Out of combat, a skill check counts as a roll of {interaction.checks.taken:bare}."
source = "K1's executable; TSL's (CSWSObject::AIActionUnlockObject: 20 out of combat, 1 + rand % 20 in it, plus GetSkillRank's total and the spike's bonus, against GetOpenLockDC)"
see = "sim::traps::sum"
applies = ["skill:Security", "skill:Demolitions"]

[security]
title = "Locks and Security"
summary = """
A locked door or container opens if a party member has its key. Otherwise
a character can use the Security skill, which takes
{interaction.security.unlock_ms:s}. The character makes a Security check,
adds the bonus of the security spike used, and compares the result with the
lock's DC. The spike is used up only if the attempt fails.
"""
detail = """
Only a character with ranks in the Security skill can try. Some locks can
only be opened with their key. A character can try again after a failed
attempt. As in KOTOR, a message above the character shows why an attempt
failed. In combat, the message is *failure*. Out of combat, the message is
*Skill Too Low* when taking 20 is not enough. For a lock of DC
{interaction.security.impossible_dc:bare} or more, the message is
*Impossible*.
"""
applies = ["skill:Security", "baseitem:Security_Spikes", "kind:door", "kind:container"]

[security.unlock_ms]
name = "Unlock Time"
type = "u64"
value = 1500
unit = "ms"
range = [0, 30000]
summary = "Using Security on a lock takes {interaction.security.unlock_ms:s}."
source = "K1's executable (its open-lock action)"
see = "sim::world::locks::begin"
applies = ["skill:Security", "kind:door", "kind:container"]

[security.impossible_dc]
name = "Impossible Lock"
type = "u8"
value = 60
range = [0, 255]
summary = "When taking 20 does not open a lock of DC {interaction.security.impossible_dc:bare} or more, the message Impossible appears."
source = "K1's executable (its open-lock action's feedback)"
see = "sim::locks::floats"
applies = ["skill:Security", "kind:door", "kind:container"]

[security.rated_dc]
name = "Rated Lock Difficulty"
type = "u8"
value = 21
range = [0, 255]
summary = """
In KOTOR 2, every lock has a difficulty level as well as a DC. A lock of
difficulty level 0, 1 or 2 has a DC of {interaction.security.rated_dc:bare}
plus the lock's own modifier. The game ignores the DC written on the lock.
Security checks and the blast of a mine both use this DC. KOTOR 1 always
uses the DC written on the lock.
"""
source = "KOTOR 2's executable (the lock difficulty of doors and placeables, on the Normal difficulty setting; Easy is 16 and Difficult is 26)"
see = "sim::module::Lock::difficulty"
applies = ["skill:Security", "skill:Demolitions", "kind:door", "kind:container"]

[security.scaled_class]
name = "Scaled Lock Level"
type = "u8"
value = 3
range = [0, 255]
summary = """
In KOTOR 2, a lock of difficulty level {interaction.security.scaled_class:bare}
becomes harder as the player gains levels. Its DC is the DC of a level 0 to
2 lock, plus the lock's own modifier, plus
{interaction.security.scaled_bonus:bare}, plus the player's level.
"""
source = "KOTOR 2's executable (the lock difficulty of doors and placeables)"
see = "sim::module::Lock::difficulty"
applies = ["skill:Security", "skill:Demolitions", "kind:door", "kind:container"]

[security.scaled_bonus]
name = "Scaled Lock Bonus"
type = "u8"
value = 7
range = [0, 255]
summary = "A KOTOR 2 lock of difficulty level {interaction.security.scaled_class:bare} adds {interaction.security.scaled_bonus:bare} and the player's level to its DC."
source = "KOTOR 2's executable (the lock difficulty of doors and placeables)"
see = "sim::module::Lock::difficulty"
applies = ["skill:Security", "skill:Demolitions", "kind:door", "kind:container"]

[security.plain_class]
name = "Plain Lock Level"
type = "u8"
value = 4
range = [0, 255]
summary = "A KOTOR 2 lock of difficulty level {interaction.security.plain_class:bare} uses the DC written on the lock, like every lock in KOTOR 1."
source = "KOTOR 2's executable (the lock difficulty of doors and placeables)"
see = "sim::module::Lock::difficulty"
applies = ["skill:Security", "skill:Demolitions", "kind:door", "kind:container"]

[security.unrated_class]
name = "Default Lock Level"
type = "u8"
value = 1
range = [0, 255]
summary = "A KOTOR 2 door or container whose data sets no difficulty level counts as level {interaction.security.unrated_class:bare}."
source = "KOTOR 2's executable (a new door or placeable starts with this class)"
see = "session::objects"
applies = ["kind:door", "kind:container"]

[skill_uses]
title = "Using Skills"
summary = """
Using Security, disarming or recovering a mine, and laying a mine all take
time. The attempt is cancelled if the character moves more than
{interaction.skill_uses.stay_m:bare} meters, attacks or falls.
"""
applies = ["skill:Security", "skill:Demolitions"]

[skill_uses.stay_m]
name = "Skill Use Movement"
type = "f32"
value = 0.5
unit = "m"
range = [0.0, 5.0]
summary = "A skill use in progress is cancelled if the character moves more than {interaction.skill_uses.stay_m:bare} meters."
source = "ours"
see = "sim::world::traps::skill_uses"
applies = ["skill:Security", "skill:Demolitions"]

[using]
title = "Use"
summary = """
[Use] uses the first door, container, placeable or creature in view within
{interaction.using.distance:m}. A creature can be spoken to from farther
away. If the player keeps [Use] pressed, it tries again every
{interaction.using.every_ms:s} until it uses something. The target must be
within {interaction.using.height_reach_m:bare} meters above or below the
character, and nothing may block the view of it.
"""
applies = ["kind:door", "kind:container"]

[using.distance]
name = "Use Range"
type = "f32"
value = 64.0
unit = "units"
range = [16.0, 400.0]
summary = "[Use] reaches a door, container or placeable within {interaction.using.distance:m}."
source = "JA's use distance"
see = "sim::world::key_use"
applies = ["kind:door", "kind:container"]

[using.slack_m]
name = "Placeable Depth"
type = "f32"
value = 1.0
unit = "m"
range = [0.0, 5.0]
summary = "A placeable set into a wall can be used if its center is no more than {interaction.using.slack_m:bare} meters inside the wall."
source = "ours"
see = "sim::world::key_use"
applies = ["kind:container"]

[using.every_ms]
name = "Use Repeat"
type = "u64"
value = 100
unit = "ms"
range = [10, 2000]
summary = "If [Use] is kept pressed and finds nothing, it tries again every {interaction.using.every_ms:s}."
source = "JA's use delay"
see = "sim::world::interact"
applies = ["kind:door", "kind:container"]

[using.middle_m]
name = "Target Height"
type = "f32"
value = 1.0
unit = "m"
range = [0.0, 3.0]
summary = "A door or container can only be used if the point {interaction.using.middle_m:bare} meters above its base is in view."
source = "ours"
see = "sim::world::uses::Target::new"
applies = ["kind:door", "kind:container"]

[using.action_sight_m]
name = "Action Point Height"
type = "f32"
value = 1.5
unit = "m"
range = [0.0, 3.0]
summary = "An action point is a spot where a character stands to use a placeable. A placeable with action points can only be used if its nearest action point is in view, {interaction.using.action_sight_m:bare} meters above the ground. A cage or rail around the placeable therefore does not stop a character who stands beside it."
detail = "The crosshair checks the same point, so the player can aim at such a placeable through the cage or rail."
source = "TSL's executable (CSWSCreature::GetIsInUseRange: the line of sight to CSWSPlaceable::GetNearestActionPoint, 1.5 up at both ends) [verify in K1's]"
see = "sim::world::uses::Target::aimed, sim::target::seen_at_action_point"
applies = ["kind:container"]

[using.door_point_reach_m]
name = "Door Use Range"
type = "f32"
value = 0.75
unit = "m"
range = [0.1, 3.0]
summary = "A character uses a door from the door's action point on the character's side. Each door has one action point in front and one behind, taken from the door's walkmesh. The character must be within {interaction.using.door_point_reach_m:bare} meters of that point, plus the radius of the character's body."
detail = """
The character walks to that point rather than to the middle of the door,
so it never walks into the face of a wide door. A character can still use a
door from up to {scripts.moves.door_reach:bare} meters from its middle.
"""
source = "K1's and TSL's executables (CSWSCreature::GetUseRange: the user's personal space plus 0.75 from CSWSDoor::GetNearestActionPoint, the closed walkmesh's use positions, a walkable one first)"
see = "sim::target::Spot::of"
applies = ["kind:door"]

[using.height_reach_m]
name = "Use Height"
type = "f32"
value = 2.5
unit = "m"
range = [0.5, 10.0]
summary = "A character can use a target up to {interaction.using.height_reach_m:bare} meters above or below it."
source = "ours"
see = "sim::world::uses::may_use"
applies = ["kind:door", "kind:container"]

[bashing]
title = "Bashing"
summary = """
A locked door or container can be broken open by attacking it with a
lightsaber, a melee weapon, fists, a blaster or a grenade. Each hit deals
its damage minus the object's hardness, multiplied by
{interaction.bashing.times:bare}. When its vitality points reach 0, the
door or container breaks open.
"""
detail = """
Plot doors and containers cannot be bashed. Only the party's attacks damage
doors and containers, unless a script orders a creature to bash one.
"""
applies = ["kind:door", "kind:container", "kind:weapon", "kind:grenade"]

[bashing.times]
name = "Bash Damage"
type = "i32"
value = 7
unit = "×"
range = [1, 50]
summary = "Damage against a door or container is multiplied by {interaction.bashing.times:bare}."
source = "the owner's pace (2026-10-06)"
see = "sim::world::objects::objects"
applies = ["kind:door", "kind:container", "kind:weapon", "kind:grenade"]

[bashing.object_defence]
name = "Object Defense"
type = "i8"
value = -10
range = [-10, 30]
summary = "A door or container has a {interaction.bashing.object_defence:bare} modifier to its base Defense of 10, so only a roll of 1 misses."
source = "K1's executable"
see = "sim::world::objects::stand_in"
applies = ["kind:door", "kind:container"]
