[chapter]
title = "Time and Messages"
order = 95
summary = """
The game advances in steps of equal length. The steps are the same for every
player. Messages over characters and objects stay on screen for a set time.
"""

[tick]
title = "Game Steps"
summary = """
The game advances {engine.tick.hz} times per second. When the game falls
behind, it makes up at most {engine.tick.most_catch_up:bare} steps at once.
The rest of the missed time is skipped.
"""

[tick.hz]
name = "Steps per Second"
type = "u32"
value = 125
range = [60, 250]
summary = "The game advances {engine.tick.hz} times per second. Every movement, attack, effect and script runs in these steps."
source = "the owner's Decision 3 (`ROADMAP.md`), after JA's"
see = "sim::rate::TICK_HZ"

[tick.most_catch_up]
name = "Most Steps at Once"
type = "u32"
value = 8
unit = "ticks"
range = [1, 125]
summary = "When the game falls behind, for example after a stutter or a slow load, it makes up at most {engine.tick.most_catch_up:bare} steps at once. The rest of the missed time is skipped."
source = "ours"
see = "sim::rate::Accumulator::advance"

[shown]
title = "Messages"
summary = """
Three kinds of messages stay on screen for a set time. The first is a fade
that the game lifts on its own. The second is a feedback message over a
character or object. The third is the experience gained for a kill.
"""

[shown.fade_lift_ms]
name = "Fade In"
type = "u32"
value = 1000
unit = "ms"
range = [0, 10000]
summary = "When an area has loaded or a conversation begins, the screen fades in over {engine.shown.fade_lift_ms:s}. This applies only to the fades that the game lifts on its own."
source = "ours [verify in the game]"
see = "sim::snapshot::LIFT_MS"

[shown.feedback_ms]
name = "Feedback"
type = "u64"
value = 5000
unit = "ms"
range = [500, 30000]
summary = "A feedback message such as \"Resisted\", \"Immune\" or \"Saved\" stays over its character or object for {engine.shown.feedback_ms:s}."
source = "KOTOR's executable (`CSWCObject::SetFeedbackInfo`)"
see = "sim::snapshot::Feedback::SHOWN_MS"

[shown.kill_xp_ms]
name = "Experience for a Kill"
type = "u64"
value = 3000
unit = "ms"
range = [500, 30000]
summary = "The experience gained for a kill is shown over the body for {engine.shown.kill_xp_ms:s}."
source = "KOTOR's"
see = "sim::snapshot::Kill::SHOWN_MS"
