[stores]
title = "Stores"
summary = """
A merchant sells an item for its value plus the store's markup. A merchant
buys an item for its value minus the store's markdown. The player cannot sell
plot items or equipped items. Some merchants never run out of certain items.
"""

[workbench]
title = "Workbench and Lab Station"
summary = """
At a workbench, a character can break items down into components and build
new items from components. A lab station works the same way with chemicals.
Each item has a price in components, which is worked out from its value and
is at least 1. Building the item costs that price. Breaking the item down
returns that price, or less if the character's skill is low.
"""
detail = """
At the workbench, breaking items down uses the Repair skill. At the lab
station, it uses the Treat Injury skill. A character can build a recipe once
their skill reaches the recipe's requirement.
"""
applies = ["skill:REPAIR", "skill:TREAT_INJURY"]

[workbench.price_share]
name = "Component Price"
type = "u32"
value = 20
range = [1, 1000]
summary = "An item's price in components is its value divided by {items.workbench.price_share:bare}, and at least 1."
source = "TSL's executable"
see = "sim::inventory::workshop::Workshop::price"

[workbench.full_yield_ranks]
name = "Full Breakdown"
value = 20.0
unit = "points"
range = [1.0, 100.0]
summary = "A character with a skill of {items.workbench.full_yield_ranks:bare} or more gets the item's full price back when breaking it down. A character with a lower skill gets back part of the price in proportion to the skill. For example, half that skill returns half the price. Breaking an item down always returns at least 1."
source = "TSL's executable"
see = "sim::inventory::workshop::Workshop::yields"

[workbench.listed_above]
name = "Recipes Shown"
type = "u16"
value = 8
unit = "points"
range = [0, 50]
summary = "A recipe whose skill requirement is up to {items.workbench.listed_above:bare} points above the character's skill is shown in the list, but the character cannot build it yet. A recipe with a higher requirement is not shown."
source = "TSL's executable"
see = "sim::inventory::workshop::Recipe::listed"

[workbench.most]
name = "Component Limit"
type = "i32"
value = 999_999_999
range = [0, 2147483647]
summary = "The party can have at most {items.workbench.most:bare} components and at most {items.workbench.most:bare} chemicals."
source = "TSL's executable (its cap)"
see = "sim::script::workbench"

[remains]
title = "Remains"
summary = """
A slain creature's body fades away shortly after death. The creature's items
are left behind as a pile of remains where it fell. The player can search the
remains.
"""
applies = ["kind:creature", "kind:container"]

[remains.destroy_ms]
name = "Body Removal"
type = "u32"
value = 3000
unit = "ms"
range = [0, 60000]
summary = "A body is removed {items.remains.destroy_ms:s} after death. Some creature types set their own delay instead."
source = "reone"
see = "sim::world::remains::DESTROY_MS"

[remains.fade_ms]
name = "Body Fade"
type = "u32"
value = 1000
unit = "ms"
range = [0, 10000]
summary = "A body fades out over {items.remains.fade_ms:s}. Some creature types set their own fade time instead."
source = "ours [verify]"
see = "sim::world::remains::FADE_MS"

[remains.bag_after_ms]
name = "Remains Delay"
type = "u32"
value = 500
unit = "ms"
range = [0, 10000]
summary = "The remains appear at least {items.remains.bag_after_ms:s} after the body is removed."
source = "the engines (reone)"
see = "sim::world::remains::BAG_AFTER_MS"

[containers]
title = "Containers"
summary = "A character can open a container when standing near it and facing it."
applies = ["kind:container"]

[containers.reach]
name = "Container Range"
value = 2.5
unit = "m"
range = [0.0, 20.0]
summary = "A character can open a container whose center is within {items.containers.reach:bare} meters, measured across the floor."
source = "ours"
see = "sim::world::containers::REACH"

[containers.facing]
name = "Container Facing"
value = 0.5
range = [-1.0, 1.0]
summary = "A container must be in front of the character to be opened. The cosine of the angle between the way the character faces and the direction to the container must be at least {items.containers.facing:bare}. A value of 1 would mean straight ahead only, and a value of 0 would allow a container directly to the side."
source = "ours"
see = "sim::world::containers::ahead"
