see = "sim::combat::gear::DRAIN_MS"

[alignment]
title = "Alignment Restrictions"
summary = """
Some items and workbench recipes can be used only by characters of one
alignment. Alignment goes from 0, the most Dark Side, to 100, the most Light
Side. For these restrictions, a character with an alignment of
{items.alignment.dark_most:bare} or lower counts as Dark Side. A character
with an alignment of {items.alignment.light_least:bare} or higher counts as
Light Side. A character in between counts as neutral.
"""

[alignment.dark_most]
name = "Dark Side Alignment"
type = "u8"
value = 40
range = [0, 100]
summary = "A character with an alignment of {items.alignment.dark_most:bare} or lower counts as Dark Side for item restrictions."
source = "the executables' item rules"
see = "sim::combat::gear::sides::of"

[alignment.light_least]
