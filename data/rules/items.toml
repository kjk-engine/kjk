[alignment]
title = "Alignment Restrictions"
summary = """
For items and workbench recipes, a character with an alignment of
{items.alignment.dark_most:bare} or lower is Dark Side, one of
{items.alignment.light_least:bare} or higher is Light Side, and one between
is neutral. Alignment runs from 0 (Dark Side) to 100 (Light Side).
"""

