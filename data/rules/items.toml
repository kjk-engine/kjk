[upgrades]
title = "Upgrades"
summary = """
An upgrade's properties apply only while the upgrade is fitted to an item. A
lightsaber has room for one color crystal and {items.upgrades.crystals:bare}
power crystals. Any other item has room for {items.upgrades.others:bare}
upgrade of each kind.
"""
