[properties]
title = "Item Properties"
summary = """
When one item has several bonuses of the same kind, only the highest bonus
applies. Every penalty on the item applies. Bonuses from different items add
together. Defense bonuses always add together. The totals cannot go past the
effect limits described below.
"""
detail = """
A damage bonus of a different type than the weapon's own damage is rolled as
extra damage of that type. When a character has several resistances to the
same damage type, only the best one applies.
"""

[properties.keen]
name = "Keen"
type = "u8"
value = 2
unit = "×"
range = [1, 10]
summary = "A weapon with the Keen property has its critical threat range multiplied by {items.properties.keen:bare}."
source = "the item property's description (Keen, 28)"
see = "sim::inventory::properties::make"
applies = ["kind:weapon"]

[properties.regenerate_ms]
name = "Regeneration"
type = "u64"
value = 6000
unit = "ms"
range = [100, 60000]
summary = "An item with Regeneration restores vitality points to its wearer every {items.properties.regenerate_ms:s}. In TSL, an item with Force point regeneration restores Force points on the same schedule."
source = "KOTOR's round of 6 s (NWN's regeneration beat)"
see = "sim::combat::gear::REGENERATE_EVERY_MS"

[properties.drain_ms]
