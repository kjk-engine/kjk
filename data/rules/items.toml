type = "u8"
value = [10, 20, 30]
labels = ["Medpac", "Advanced Medpac", "Life Support Pack"]
unit = "HP"
range = [0, 255]
summary = "Medpacs heal {items.medpacs.points[0]:bare}, {items.medpacs.points[1]:bare} or {items.medpacs.points[2]:bare} vitality points, before WIS modifier and Treat Injury."
source = "K1's `k_sup_healing`"
see = "sim::combat::items::use_of"

[medpacs.per_rank]
