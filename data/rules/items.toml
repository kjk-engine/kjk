[containers]
title = "Containers"
summary = "A character can open a container it stands near and faces."
applies = ["kind:container"]

[containers.reach]
name = "Container Range"
value = 2.5
unit = "m"
range = [0.0, 20.0]
summary = "A character can open a container within {items.containers.reach:bare} meters of its center."
source = "ours"
see = "sim::world::containers::REACH"

[containers.facing]
name = "Container Facing"
value = 0.5
range = [-1.0, 1.0]
summary = "A container must be in front of the character: the cosine of the angle from its facing must be at least {items.containers.facing:bare}."
source = "ours"
see = "sim::world::containers::ahead"
