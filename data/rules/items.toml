name = "Medpac Healing"
type = "u8"
value = [10, 20, 30]
labels = ["Medpac", "Advanced Medpac", "Life Support Pack"]
unit = "HP"
range = [0, 255]
summary = "A medpac heals {items.medpacs.points[0]:bare} vitality points. An advanced medpac heals {items.medpacs.points[1]:bare}, and a life support pack heals {items.medpacs.points[2]:bare}. The user's Wisdom modifier and Treat Injury skill are added on top."
source = "K1's `k_sup_healing`"
see = "sim::combat::items::use_of"

[medpacs.per_rank]
name = "Medpac Healing per Rank"
type = "u8"
value = [1, 2, 3]
labels = ["Medpac", "Advanced Medpac", "Life Support Pack"]
unit = "HP"
range = [0, 20]
summary = "Each rank of Treat Injury adds {items.medpacs.per_rank[0]:bare} vitality points to a medpac's healing. It adds {items.medpacs.per_rank[1]:bare} to an advanced medpac's and {items.medpacs.per_rank[2]:bare} to a life support pack's."
source = "K1's `k_sup_healing`"
see = "sim::combat::items::use_of"

[repair_kits]
title = "Repair Kits"
summary = """
A repair kit restores {items.repair_kits.points[0]:bare} vitality points,
plus the user's Intelligence modifier, plus
{items.repair_kits.per_rank[0]:bare} for each rank the user has in Repair. An
advanced repair kit restores {items.repair_kits.points[1]:bare} vitality
points, plus the user's Intelligence modifier, plus
{items.repair_kits.per_rank[1]:bare} for each rank in Repair. A construction
kit restores {items.repair_kits.points[2]:bare} vitality points, plus the
user's Intelligence modifier, plus {items.repair_kits.per_rank[2]:bare} for
each rank in Repair. Only droids can use repair kits.
"""
applies = ["kind:repairkit", "kind:droid", "spell:ITEM_ABILITY_DROID_REPAIR_KIT", "spell:ITEM_ABILITY_DROID_REPAIR_KIT_ADV", "spell:ITEM_ABILITY_DROID_CONSTRUCTION_KIT", "skill:REPAIR"]

