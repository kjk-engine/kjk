[chapter]
title = "Items"
order = 13
summary = """
Medpacs, repair kits, stims and energy shields; item properties and their
limits; upgrades; stores and the workbench; and what the dead leave behind.
"""

[using]
title = "Using Items in Combat"
summary = """
A medpac, stim or energy shield is used from its own key. The medpac key
uses an antidote kit if the character is poisoned or weakened, otherwise a
medpac (a repair kit for a droid), otherwise a squad recovery stim. The
character injects a medpac, antidote or stim, or switches on an energy
shield at the wrist; the item is used up as that begins and takes effect
when it is done. Being stunned, choked, knocked down or downed meanwhile
stops it; being hit or moving does not. A weapon change or a Force power
waits until it is done.
"""
detail = """
Only one energy shield and one stim can be active at a time. Opponents also
use medpacs, shields and stims in combat.
"""
applies = ["kind:medpac", "kind:repairkit", "kind:shield", "kind:stim", "kind:antidote"]

[using.heal_ms]
name = "Healing Time"
type = "u64"
value = 1500
unit = "ms"
range = [0, 10000]
summary = "Using a medpac or repair kit takes {items.using.heal_ms:s} for a character with no skill ranks."
source = "I22 section 5 (ours)"
see = "sim::combat::items::heal_ms"
applies = ["kind:medpac", "kind:repairkit"]

[using.per_rank_ms]
name = "Healing Time per Rank"
type = "u64"
value = 100
unit = "ms"
range = [0, 1000]
summary = "Each rank of Treat Injury (Repair for a droid) takes {items.using.per_rank_ms:s} off the time to use a medpac or repair kit."
source = "I22 section 5 (ours)"
see = "sim::combat::items::heal_ms"
applies = ["kind:medpac", "kind:repairkit", "skill:TREAT_INJURY", "skill:REPAIR"]

[using.least_ms]
name = "Fastest Healing"
type = "u64"
value = 500
unit = "ms"
range = [0, 10000]
summary = "Using a medpac or repair kit always takes at least {items.using.least_ms:s}."
source = "I22 section 5 (ours)"
see = "sim::combat::items::heal_ms"
applies = ["kind:medpac", "kind:repairkit"]

[using.use_ms]
name = "Item Use Time"
type = "u64"
value = 1500
unit = "ms"
range = [0, 10000]
summary = "Using an energy shield, stim, antidote kit or squad recovery stim takes {items.using.use_ms:s}; it takes effect at the end."
source = "spells.2da (K1 and TSL): every item row's conjtime 170 + casttime 1330, its impact script run at the cast's end"
see = "sim::combat::items::USE_MS"
applies = ["kind:shield", "kind:stim", "kind:antidote"]

[medpacs]
title = "Medpacs"
summary = """
Medpacs heal {items.medpacs.points[0]:bare} vitality points + WIS modifier
+ user's skill in Treat Injury. Advanced medpacs heal
{items.medpacs.points[1]:bare} vitality points + WIS modifier +
({items.medpacs.per_rank[1]:bare} x user's skill in Treat Injury). Life
support packs heal {items.medpacs.points[2]:bare} vitality points + WIS
modifier + ({items.medpacs.per_rank[2]:bare} x user's skill in Treat
Injury). They cannot be used by droids. An antidote kit cures poison and
restores lost attributes.
"""
applies = ["kind:medpac", "spell:ITEM_ABILITY_MED_PACK", "spell:ITEM_ABILITY_ADVANCED_MED_PACK", "spell:ITEM_ABILITY_LIFE_SUPPORT_KIT", "skill:TREAT_INJURY"]

