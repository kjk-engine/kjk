[stims]
title = "Stims"
summary = """
An adrenal strength stim raises Strength. An adrenal alacrity stim raises
Dexterity. An adrenal stamina stim raises Constitution. A battle stimulant
grants a bonus to attack and damage. It also grants bonus vitality points.
Damage removes these bonus points before the character's own vitality
points, and any that are left disappear when the stimulant wears off. A
character can have only one stim active at a time.
"""
applies = ["kind:stim", "kind:adrenal", "spell:ITEM_ABILITY_ADRENAL_SHOT_STRENGTH", "spell:ITEM_ABILITY_ADRENAL_SHOT_ALACRITY", "spell:ITEM_ABILITY_ADRENAL_SHOT_STAMINA", "spell:ITEM_ABILITY_HYPER_ADRENAL_SHOT_STRENGTH", "spell:ITEM_ABILITY_HYPER_ADRENAL_SHOT_ALACRITY", "spell:ITEM_ABILITY_HYPER_ADRENAL_SHOT_STAMINA", "spell:ITEM_ABILITY_COMBAT_SHOT_1", "spell:ITEM_ABILITY_COMBAT_SHOT_2", "spell:ITEM_ABILITY_COMBAT_SHOT_3"]

