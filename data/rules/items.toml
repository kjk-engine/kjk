type = "u8"
value = [15, 25, 35]
labels = ["Repair Kit", "Advanced Repair Kit", "Construction Kit"]
unit = "HP"
range = [0, 255]
summary = "A repair kit restores {items.repair_kits.points[0]:bare} vitality points. An advanced repair kit restores {items.repair_kits.points[1]:bare}, and a construction kit restores {items.repair_kits.points[2]:bare}. The user's Intelligence modifier and Repair skill are added on top."
source = "K1's `k_sup_healing`"
see = "sim::combat::items::use_of"

