[chapter]
title = "Items"
order = 13
summary = """
This chapter covers medpacs, repair kits, stims and energy shields. It also
covers item properties and their limits, upgrades, stores, the workbench, and
the items that slain creatures leave behind.
"""

[using]
title = "Using Items in Combat"
summary = """
Use from the action bar or power wheel. The item is consumed when you start
and takes effect when finished; moving or taking a hit does not interrupt
it, but being stunned, choked, knocked down, or downed does.
"""
detail = """
Using the medpac slot while poisoned or attribute-drained uses an antidote
kit; otherwise it uses a medpac (repair kit for droids), falling back to a
squad recovery stim. Only one energy shield and one stim can be active at a
time. Offensive droid items (shock arm, stun ray, flame thrower) have a
one-round ({combat.timing.round_ms:s}) cooldown.
"""
applies = ["kind:medpac", "kind:repairkit", "kind:shield", "kind:stim", "kind:antidote"]

[using.heal_ms]
name = "Healing Time"
type = "u64"
value = 1500
unit = "ms"
range = [0, 10000]
summary = "Takes {items.using.heal_ms:s} to use, minus {items.using.per_rank_ms:s} per rank in Treat Injury (or Repair for droids), down to {items.using.least_ms:s}."
source = "ours"
see = "sim::combat::items::heal_ms"
applies = ["kind:medpac", "kind:repairkit"]

[using.per_rank_ms]
name = "Healing Time per Rank"
type = "u64"
value = 100
unit = "ms"
range = [0, 1000]
summary = "Each rank in Treat Injury (or Repair for droids) speeds up medpac / repair kit use by {items.using.per_rank_ms:s}."
source = "ours"
see = "sim::combat::items::heal_ms"
applies = ["skill:TREAT_INJURY", "skill:REPAIR"]

[using.least_ms]
name = "Fastest Healing"
type = "u64"
value = 500
unit = "ms"
range = [0, 10000]
summary = "Medpac and repair kit use always takes at least {items.using.least_ms:s}."
source = "ours"
see = "sim::combat::items::heal_ms"

[using.use_ms]
name = "Item Use Time"
type = "u64"
value = 1500
unit = "ms"
range = [0, 10000]
summary = "Takes {items.using.use_ms:s} to activate."
source = "spells.2da (K1 and TSL): every item row's conjtime 170 + casttime 1330, its impact script run at the cast's end"
see = "sim::combat::items::USE_MS"
applies = ["kind:shield", "kind:stim", "kind:antidote"]

[medpacs]
title = "Medpacs"
summary = """
Heals {items.medpacs.points[0]:bare} (Medpac), {items.medpacs.points[1]:bare}
(Advanced), or {items.medpacs.points[2]:bare} (Life Support Pack) Vitality,
plus your Wisdom mod and +{items.medpacs.per_rank[0]:bare} /
+{items.medpacs.per_rank[1]:bare} / +{items.medpacs.per_rank[2]:bare} per
rank in Treat Injury. Cannot be used by droids. Antidote kits cure poison
and restore drained attributes.
"""
