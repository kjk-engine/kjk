[chapter]
title = "Items"
order = 13
summary = """
This chapter covers medpacs, repair kits, stims and energy shields. It also
covers item properties and their limits, upgrades, stores, the workbench, and
the items that slain creatures leave behind.
"""

[using]
title = "Using Items in Combat"
summary = """
Medpacs, stims and energy shields each have their own key. When the character
is poisoned or has a lowered attribute, the medpac key uses an antidote kit.
Otherwise it uses a medpac, or a repair kit for a droid. If the character has
neither, it uses a squad recovery stim. The character injects a medpac,
antidote kit or stim, and switches on an energy shield at the wrist. The item
is used up when the character begins, and it takes effect when the character
is done. If the character is stunned, choked, knocked down or downed before
then, the use stops. Being hit or moving does not stop it. A weapon change or
a Force power waits until the use is done.
"""
detail = """
A character can have only one energy shield and one stim active at a time.
Enemies also use medpacs, energy shields and stims in combat.
"""
applies = ["kind:medpac", "kind:repairkit", "kind:shield", "kind:stim", "kind:antidote"]

[using.heal_ms]
name = "Healing Time"
type = "u64"
value = 1500
unit = "ms"
range = [0, 10000]
summary = "Using a medpac or repair kit takes {items.using.heal_ms:s} for a character with no ranks in Treat Injury or Repair."
source = "ours"
see = "sim::combat::items::heal_ms"
applies = ["kind:medpac", "kind:repairkit"]

[using.per_rank_ms]
name = "Healing Time per Rank"
type = "u64"
value = 100
unit = "ms"
range = [0, 1000]
summary = "Each rank of Treat Injury makes using a medpac {items.using.per_rank_ms:s} faster. For a droid, each rank of Repair makes using a repair kit {items.using.per_rank_ms:s} faster."
source = "ours"
see = "sim::combat::items::heal_ms"
applies = ["kind:medpac", "kind:repairkit", "skill:TREAT_INJURY", "skill:REPAIR"]

[using.least_ms]
name = "Fastest Healing"
type = "u64"
value = 500
unit = "ms"
range = [0, 10000]
summary = "Using a medpac or repair kit always takes at least {items.using.least_ms:s}."
source = "ours"
see = "sim::combat::items::heal_ms"
applies = ["kind:medpac", "kind:repairkit"]

[using.use_ms]
name = "Item Use Time"
type = "u64"
value = 1500
unit = "ms"
range = [0, 10000]
summary = "Using an energy shield, stim, antidote kit or squad recovery stim takes {items.using.use_ms:s}. The item takes effect at the end of that time."
source = "spells.2da (K1 and TSL): every item row's conjtime 170 + casttime 1330, its impact script run at the cast's end"
see = "sim::combat::items::USE_MS"
applies = ["kind:shield", "kind:stim", "kind:antidote"]

[medpacs]
title = "Medpacs"
summary = """
A medpac heals {items.medpacs.points[0]:bare} vitality points, plus the
user's Wisdom modifier, plus {items.medpacs.per_rank[0]:bare} for each rank
the user has in Treat Injury. An advanced medpac heals
{items.medpacs.points[1]:bare} vitality points, plus the user's Wisdom
modifier, plus {items.medpacs.per_rank[1]:bare} for each rank in Treat
Injury. A life support pack heals {items.medpacs.points[2]:bare} vitality
points, plus the user's Wisdom modifier, plus
{items.medpacs.per_rank[2]:bare} for each rank in Treat Injury. Droids cannot
use medpacs. An antidote kit cures poison and restores attributes that were
lowered.
"""
applies = ["kind:medpac", "spell:ITEM_ABILITY_MED_PACK", "spell:ITEM_ABILITY_ADVANCED_MED_PACK", "spell:ITEM_ABILITY_LIFE_SUPPORT_KIT", "skill:TREAT_INJURY"]

