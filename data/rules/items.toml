summary = "Each rank of Treat Injury adds {items.medpacs.per_rank[0]:bare}, {items.medpacs.per_rank[1]:bare} or {items.medpacs.per_rank[2]:bare} vitality points to a medpac's healing."
source = "K1's `k_sup_healing`"
see = "sim::combat::items::use_of"

[repair_kits]
title = "Repair Kits"
summary = """
Repair kits repair {items.repair_kits.points[0]:bare} vitality points + INT
modifier + user's skill in Repair. Advanced repair kits repair
{items.repair_kits.points[1]:bare} vitality points + INT modifier +
({items.repair_kits.per_rank[1]:bare} x user's skill in Repair).
Construction kits repair {items.repair_kits.points[2]:bare} vitality points
+ INT modifier + ({items.repair_kits.per_rank[2]:bare} x user's skill in
Repair). They can only be used by droids.
"""
applies = ["kind:repairkit", "kind:droid", "spell:ITEM_ABILITY_DROID_REPAIR_KIT", "spell:ITEM_ABILITY_DROID_REPAIR_KIT_ADV", "spell:ITEM_ABILITY_DROID_CONSTRUCTION_KIT", "skill:REPAIR"]

