[chapter]
title = "Targeting"
order = 73
summary = """
The target is the object under the crosshair within
{targeting.pick.range:bare} meters. If there is none, it is the object
nearest the crosshair within {targeting.pick.cone_degrees}, or else the
nearest object at the character's feet. Each target offers its own actions:
open, use, talk, unlock, disarm, revive and so on. If the target is out of
reach, the character walks to it first.
"""
detail = """
Doors, usable placeables, living creatures outside the party, detected traps
and downed party members can be targeted.
"""

[pick]
title = "Selecting a Target"
applies = ["kind:player", "kind:door", "kind:container"]
summary = """
The crosshair selects the nearest object it points at, unless a wall is in
the way. A target stays selected for {targeting.pick.hold_ms:s} after the
crosshair leaves it.
"""

[pick.range]
name = "Targeting Range"
value = 10.0
unit = "m"
range = [1.0, 50.0]
summary = "An object can be targeted from up to {targeting.pick.range:bare} meters away."
source = "ours (measured on Taris)"
see = "sim::target::pick"

[pick.cone_degrees]
name = "Targeting Assist"
value = 4.0
unit = "°"
range = [0.0, 45.0]
summary = "When the crosshair points at nothing, an object up to {targeting.pick.cone_degrees} off the crosshair can be targeted."
source = "ours"
see = "sim::target::pick"

[pick.hold_ms]
name = "Target Hold"
type = "u64"
value = 200
unit = "ms"
range = [0, 2000]
summary = "A target stays selected for {targeting.pick.hold_ms:s} after the crosshair leaves it."
source = "ours"
see = "sim::target::Hold::update"

[pick.eyes]
name = "Eye Height"
value = 1.6
unit = "m"
range = [0.5, 3.0]
summary = "An object at the character's feet must be in sight of eyes {targeting.pick.eyes:bare} meters above the floor."
source = "ours"
see = "sim::target::pick"

[volumes]
title = "Target Size"
summary = """
Each kind of object is targeted within an upright cylinder standing on its
base. A door is targeted on its own surfaces.
"""

[volumes.creature_radius]
name = "Creature Radius"
value = 0.4
unit = "m"
range = [0.1, 3.0]
summary = "A creature can be targeted within {targeting.volumes.creature_radius:bare} meters of its center."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:creature"]

[volumes.creature_height]
name = "Creature Height"
value = 1.9
unit = "m"
range = [0.1, 5.0]
summary = "A creature can be targeted up to {targeting.volumes.creature_height:bare} meters above its feet."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:creature"]

[volumes.placeable_radius]
name = "Placeable Radius"
value = 0.5
unit = "m"
range = [0.1, 3.0]
summary = "A usable placeable can be targeted within {targeting.volumes.placeable_radius:bare} meters of its center."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:container"]

[volumes.placeable_height]
name = "Placeable Height"
value = 1.5
unit = "m"
range = [0.1, 5.0]
summary = "A usable placeable can be targeted up to {targeting.volumes.placeable_height:bare} meters above its base."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:container"]

[volumes.door_radius]
name = "Door Radius"
value = 1.0
unit = "m"
range = [0.1, 5.0]
summary = "A closed door can also be targeted within {targeting.volumes.door_radius:bare} meters of its center."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:door"]

[volumes.door_height]
name = "Door Height"
value = 2.5
unit = "m"
range = [0.1, 10.0]
summary = "A door can be targeted up to {targeting.volumes.door_height:bare} meters above its base."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:door"]

[volumes.body_radius]
name = "Downed Party Member Radius"
value = 0.8
unit = "m"
range = [0.1, 3.0]
summary = "A downed party member can be targeted within {targeting.volumes.body_radius:bare} meters of its center."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:companion"]

[volumes.body_height]
name = "Downed Party Member Height"
value = 0.5
unit = "m"
range = [0.1, 3.0]
summary = "A downed party member can be targeted up to {targeting.volumes.body_height:bare} meters above the floor."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:companion"]

[volumes.trap_radius]
name = "Mine Radius"
value = 1.5
unit = "m"
range = [0.1, 3.0]
summary = "A detected mine can be targeted anywhere over its area, within {targeting.volumes.trap_radius:bare} meters of its center."
source = "ours (KOTOR's mines are picked by their whole drawn area; K1's all have a 1.5 m radius)"
see = "sim::target::candidates"
applies = ["kind:mine"]

[volumes.trap_height]
name = "Mine Height"
value = 0.3
unit = "m"
range = [0.05, 3.0]
summary = "A detected mine can be targeted up to {targeting.volumes.trap_height:bare} meters above the floor."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:mine"]

[walk]
title = "Moving to a Target"
summary = """
If the chosen action is out of reach, the character walks to the target
first. Moving, jumping or attacking cancels the walk.
"""

[walk.arrive]
name = "Action Reach"
value = 0.8
unit = "×"
range = [0.1, 1.0]
summary = "A character within {targeting.walk.arrive:bare} times an action's reach performs it without walking."
source = "ours"
see = "sim::target::Walk::near"

[walk.share]
name = "Stopping Distance"
value = 0.5
unit = "×"
range = [0.0, 1.0]
summary = "A character walking to a target stops at {targeting.walk.share:bare} times the reach it acts from."
source = "ours"
see = "sim::target::stand_off"

[walk.trap_clear_m]
name = "Mine Standing Distance"
type = "f32"
value = 0.6
unit = "m"
range = [0.3, 3.0]
summary = "A character walking to disarm or recover a mine stops {targeting.walk.trap_clear_m:bare} meters outside the mine's {world.ranges.trap_radius_m:bare} meter radius, beside the mine, never on it."
source = "ours (KOTOR disarms from beside a mine; a run's stop slides on)"
see = "sim::target::stand_off"
applies = ["kind:mine", "skill:Demolitions"]

[walk.trap_arrive_m]
name = "Mine Arrival"
type = "f32"
value = 0.7
unit = "m"
range = [0.0, 2.0]
summary = "A character walking to a mine has arrived within {targeting.walk.trap_arrive_m:bare} meters of where it stops, and stops there before acting."
source = "ours (beyond a walk's own arrival, {walking.route.arrived:bare} × {walking.route.reached:m}, so a short walk arrives too)"
see = "sim::target::Walk::near"
applies = ["kind:mine", "skill:Demolitions"]

[walk.walk_ms]
name = "Walk Time Limit"
type = "u64"
value = 10_000
unit = "ms"
range = [1000, 60000]
summary = "A walk to a target is canceled after {targeting.walk.walk_ms:s}."
source = "ours"
see = "sim::target::Walk::stride"

[walk.stalls]
name = "Walk Blocked"
type = "u8"
value = 3
range = [1, 50]
summary = "A walk to a target is canceled after it is blocked {targeting.walk.stalls:bare} times."
source = "ours"
see = "sim::target::Walk::stride"

[walk.moved]
name = "Moving Target"
value = 1.0
unit = "m"
range = [0.0, 10.0]
summary = "A target that moves more than {targeting.walk.moved:bare} meters makes the character find a new path to it."
source = "ours"
see = "sim::target::Walk::stride"

[revive]
title = "Reviving"
summary = """
A downed party member is revived by holding Use on it. The character looks
down at the body and stays still until it stands.
"""
applies = ["kind:companion"]

[revive.wait_ms]
name = "Revive Wait"
type = "u64"
value = 1000
unit = "ms"
range = [0, 10000]
summary = "If a revive has not begun within {targeting.revive.wait_ms:s}, it is canceled: another player is reviving the body, or it is out of reach."
source = "ours"
see = "sim::target::Reviving::keep"

[revive.pitch]
name = "Revive View"
value = 20.0
unit = "°"
range = [-90.0, 90.0]
summary = "A character reviving a party member looks down {targeting.revive.pitch} at the body."
source = "ours"
see = "sim::target::Reviving::keep"

[transition]
title = "Area Transitions"
summary = """
A door or an area exit that leads to another area names that area at the
top of the screen while the character faces it: the nearest one in sight
that the line the character faces meets within
{targeting.transition.reach:bare} meters. A door is met by its pick volume,
an exit by its outline. The name shown is the part after the first dash
("Taris - Upper City South" shows "Upper City South").
"""

[transition.reach]
name = "Area Transition Reach"
value = 8.0
unit = "m"
range = [1.0, 50.0]
summary = "An area's door or exit is named once the line the character faces meets it within {targeting.transition.reach:bare} meters."
source = "KOTOR's executable (the client's doors and triggers offering the area transition panel)"
see = "sim::transition::faced"
