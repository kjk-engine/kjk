[chapter]
title = "Targeting"
order = 73
summary = """
The character's target is the object under the crosshair, up to
{targeting.pick.range:bare} meters away. If the crosshair points at
nothing, the target is the object nearest the crosshair within
{targeting.pick.cone_degrees} of it. If there is no such object either, the
target is the nearest object at the character's feet. Each target offers
its own actions, such as open, use, talk, unlock, disarm and revive. If the
target is out of reach, the character walks to it first.
"""
detail = """
A character can target doors, usable objects, living creatures outside the
party, detected mines and downed party members.
"""

[pick]
title = "Selecting a Target"
applies = ["kind:player", "kind:door", "kind:container"]
summary = """
The crosshair selects the nearest object it points at, unless a wall is in
the way. A target stays selected for {targeting.pick.hold_ms:s} after the
crosshair moves off it.
"""

[pick.range]
name = "Targeting Range"
value = 10.0
unit = "m"
range = [1.0, 50.0]
summary = "A character can target an object up to {targeting.pick.range:bare} meters away."
source = "ours (measured on Taris)"
see = "sim::target::pick"

[pick.cone_degrees]
name = "Targeting Assist"
value = 4.0
unit = "°"
range = [0.0, 45.0]
summary = "When the crosshair points at nothing, the character can still target an object up to {targeting.pick.cone_degrees} away from the crosshair."
source = "ours"
see = "sim::target::pick"

[pick.hold_ms]
name = "Target Delay"
type = "u64"
value = 200
unit = "ms"
range = [0, 2000]
summary = "A target stays selected for {targeting.pick.hold_ms:s} after the crosshair moves off it."
source = "ours"
see = "sim::target::Hold::update"

[pick.eyes]
name = "Eye Height"
value = 1.6
unit = "m"
range = [0.5, 3.0]
summary = "A character can target an object at its feet only if the object can be seen from {targeting.pick.eyes:bare} meters above the floor, the height of the character's eyes."
source = "ours"
see = "sim::target::pick"

[pick.sight_slack]
name = "Line of Sight Margin"
value = 0.05
unit = "m"
range = [0.0, 0.14]
summary = "An object counts as in sight if nothing blocks the line to its middle or its top, except in the last {targeting.pick.sight_slack:bare} meters before the object. This way a console is not hidden by its own body or by the bench it stands on. The same rule applies when a character uses an object. A panel set flush into a wall can therefore be used whenever the crosshair selects it. Placeables never block the line, because the original game's line of sight for selecting an object stops only at the level's walls and at closed doors. A character inside a cage can therefore be selected through the cage's walls."
source = "ours (under the 0.15 m a wall must hide what stands behind it); placeables passed as TSL's executable passes them when it selects an object [verify in K1's]"
see = "sim::target::in_sight_near"

[volumes]
title = "Target Size"
summary = """
Each kind of object can be targeted anywhere inside an upright cylinder
that stands on the object's base. A door can also be targeted anywhere on
its own surfaces.
"""

[volumes.creature_radius]
name = "Creature Radius"
value = 0.4
unit = "m"
range = [0.1, 3.0]
summary = "A creature can be targeted up to {targeting.volumes.creature_radius:bare} meters from its center."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:creature"]

[volumes.creature_height]
name = "Creature Height"
value = 1.9
unit = "m"
range = [0.1, 5.0]
summary = "A creature can be targeted up to {targeting.volumes.creature_height:bare} meters above its feet."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:creature"]

[volumes.placeable_radius]
name = "Object Radius"
value = 0.5
unit = "m"
range = [0.1, 3.0]
summary = "A usable object can be targeted up to {targeting.volumes.placeable_radius:bare} meters from its center."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:container"]

[volumes.placeable_height]
name = "Object Height"
value = 1.5
unit = "m"
range = [0.1, 5.0]
summary = "A usable object can be targeted up to {targeting.volumes.placeable_height:bare} meters above its base."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:container"]

[volumes.door_radius]
name = "Door Radius"
value = 1.0
unit = "m"
range = [0.1, 5.0]
summary = "A closed door can also be targeted up to {targeting.volumes.door_radius:bare} meters from its center."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:door"]

[volumes.door_height]
name = "Door Height"
value = 2.5
unit = "m"
range = [0.1, 10.0]
summary = "A door can be targeted up to {targeting.volumes.door_height:bare} meters above its base."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:door"]

[volumes.body_radius]
name = "Downed Party Member Radius"
value = 0.8
unit = "m"
range = [0.1, 3.0]
summary = "A downed party member can be targeted up to {targeting.volumes.body_radius:bare} meters from the center of the body."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:companion"]

[volumes.body_height]
name = "Downed Party Member Height"
value = 0.5
unit = "m"
range = [0.1, 3.0]
summary = "A downed party member can be targeted up to {targeting.volumes.body_height:bare} meters above the floor."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:companion"]

[volumes.trap_radius]
name = "Mine Radius"
value = 1.5
unit = "m"
range = [0.1, 3.0]
summary = "A detected mine can be targeted anywhere over its area, up to {targeting.volumes.trap_radius:bare} meters from its center."
source = "ours (KOTOR's mines are picked by their whole drawn area; K1's all have a 1.5 m radius)"
see = "sim::target::candidates"
applies = ["kind:mine"]

[volumes.trap_height]
name = "Mine Height"
value = 0.3
unit = "m"
range = [0.05, 3.0]
summary = "A detected mine can be targeted up to {targeting.volumes.trap_height:bare} meters above the floor."
source = "ours"
see = "sim::target::candidates"
applies = ["kind:mine"]

[walk]
title = "Moving to a Target"
summary = """
If the chosen action is out of reach, the character walks to the target
first. The player cancels the walk by moving, jumping or attacking.
"""

[walk.arrive]
name = "Action Reach"
value = 0.8
unit = "×"
range = [0.1, 1.0]
summary = "A character who is within {targeting.walk.arrive:bare} times an action's reach performs the action without walking. A character whose walk gets no closer for {walking.route.stall_ms:s}, while still within the action's full reach, performs the action where it stands. For example, a character can talk to a shopkeeper across a counter this way."
source = "ours"
see = "sim::target::Walk::near"

[walk.share]
name = "Stopping Distance"
value = 0.5
unit = "×"
range = [0.0, 1.0]
summary = "A character walking to a target stops at {targeting.walk.share:bare} times the reach of the action."
source = "ours"
see = "sim::target::Spot::stand_off"

[walk.trap_clear_m]
name = "Mine Standing Distance"
type = "f32"
value = 0.6
unit = "m"
range = [0.3, 3.0]
summary = "A character walking to disarm or recover a mine stops beside the mine, never on it. The character stops {targeting.walk.trap_clear_m:bare} meters outside the mine's edge, which is {world.ranges.trap_radius_m:bare} meters from its center."
source = "ours (KOTOR disarms from beside a mine; a run's stop slides on)"
see = "sim::target::Spot::stand_off"
applies = ["kind:mine", "skill:Demolitions"]

[walk.trap_arrive_m]
name = "Mine Arrival"
type = "f32"
value = 0.7
unit = "m"
range = [0.0, 2.0]
summary = "A character walking to a mine counts as arrived once it is within {targeting.walk.trap_arrive_m:bare} meters of the spot where it should stop. The character comes to a full stop there before it acts."
source = "ours (beyond a walk's own arrival, {walking.route.arrived:bare} × {walking.route.reached:m}, so a short walk arrives too)"
see = "sim::target::Walk::near"
applies = ["kind:mine", "skill:Demolitions"]

[walk.walk_ms]
name = "Walk Time Limit"
type = "u64"
value = 10_000
unit = "ms"
range = [1000, 60000]
summary = "A walk to a target is canceled if it lasts longer than {targeting.walk.walk_ms:s}."
source = "ours"
see = "sim::target::Walk::stride"

[walk.stalls]
name = "Walk Blocked"
type = "u8"
value = 3
range = [1, 50]
summary = "A walk to a target is canceled once something has blocked it {targeting.walk.stalls:bare} times."
source = "ours"
see = "sim::target::Walk::stride"

[walk.moved]
name = "Moving Target"
value = 1.0
unit = "m"
range = [0.0, 10.0]
summary = "When a target moves more than {targeting.walk.moved:bare} meters, the character finds a new path to it."
source = "ours"
see = "sim::target::Walk::stride"

[walk.exit_margin_m]
name = "Exits on the Way"
type = "f32"
value = 0.5
unit = "m"
range = [0.0, 3.0]
summary = "A walk to a target never takes the character into another area. The character stops before any door or exit on the way that leads to another area, unless that door is the target. The character stops early enough that, after sliding to a halt, it ends at least {targeting.walk.exit_margin_m:bare} meters from the exit. If the target is within reach from there, the character performs the action. Otherwise the walk is canceled."
source = "KOTOR (a click on a creature or object never leaves the area; only a click on the transition does)"
see = "sim::target::Walk::stride"

[revive]
title = "Reviving"
summary = """
A character revives a downed party member by holding Use on the body. The
character looks down at the body and stays still until the party member
stands up.
"""
applies = ["kind:companion"]

[revive.wait_ms]
name = "Revive Wait"
type = "u64"
value = 1000
unit = "ms"
range = [0, 10000]
summary = "If a revive has not started within {targeting.revive.wait_ms:s}, it is canceled. This happens when another player is already reviving the same party member, or when the body is out of reach."
source = "ours"
see = "sim::target::Reviving::keep"

[revive.pitch]
name = "Revive View"
value = 20.0
unit = "°"
range = [-90.0, 90.0]
summary = "A character who revives a party member looks down at the body by {targeting.revive.pitch}."
source = "ours"
see = "sim::target::Reviving::keep"

[transition]
title = "Area Transitions"
summary = """
While the character faces a door or exit that leads to another area, the
name of that area appears at the top of the screen. The game picks the
nearest such door or exit in sight that lies straight ahead of the
character, up to {targeting.transition.reach:bare} meters away. A door
counts anywhere in the space where it can be targeted. An exit counts
anywhere over its outline. Only the part of the name after the first dash
is shown. For example, "Taris - Upper City South" appears as "Upper City
South".
"""

[transition.reach]
name = "Area Transition Reach"
value = 8.0
unit = "m"
range = [1.0, 50.0]
summary = "The name of the next area appears once a door or exit to it lies straight ahead of the character, up to {targeting.transition.reach:bare} meters away."
source = "KOTOR's executable (the client's doors and triggers offering the area transition panel)"
see = "sim::transition::faced"
