summary = "The grip seizes a target up to {force.grip.range:m} away in line of sight. It lets go when the target moves farther away than that."
source = "JA"
see = "sim::world::powers::Cast::squeeze"
applies = ["spell:FORCE_POWER_WOUND", "spell:FORCE_POWER_CHOKE", "spell:FORCE_POWER_KILL", "spell:FORCE_POWER_FORCE_CRUSH"]

[grip.points]
