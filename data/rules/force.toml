{force.protect.rate[2]:pct} under Force Armor.
"""
source = "JA (I23 4.6.10)"
see = "sim::combat::force::protect"
applies = ["spell:FORCE_POWER_FORCE_AURA", "spell:FORCE_POWER_FORCE_SHIELD", "spell:FORCE_POWER_FORCE_ARMOR"]

[protect.cap]
name = "Damage Counted"
type = "i64"
value = [100, 200, 400]
unit = "points"
labels = ["Force Aura", "Force Shield", "Force Armor"]
range = [0, 1000]
