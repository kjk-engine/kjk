range = [0, 5]
summary = "Regenerate Vitality Points adds {force.tsl_regeneration.healing_feat_rate:bare} to the rate at which vitality points regenerate."
source = "TSL's executable (`CSWSCreature`'s regeneration)"
see = "sim::world::powers::regenerate"
applies = ["feat:REGENERATE_VITALITY_POINTS"]

