"""
source = "TSL's executable (`HandleFPRegeneration`)"
see = "sim::combat::force::regenerate_tsl"
applies = ["kind:force"]

[tsl_regeneration.light_from]
name = "Light Side Alignment"
type = "u8"
value = 60
range = [0, 100]
summary = """
A character with an alignment of {force.tsl_regeneration.light_from:bare}
or more is of the light side: the Force rating of an area speeds his or
her Force point regeneration.
"""
source = "TSL's executable (`HandleFPRegeneration`)"
see = "sim::combat::force::regenerate_tsl"
applies = ["kind:force"]

[tsl_regeneration.healing_feat_rate]
name = "Regenerate Vitality Points"
value = 0.5
range = [0, 5]
summary = "Regenerate Vitality Points adds {force.tsl_regeneration.healing_feat_rate:bare} to the rate at which vitality points regenerate."
source = "TSL's executable (`CSWSCreature`'s regeneration)"
see = "sim::world::powers::regenerate"
applies = ["feat:REGENERATE_VITALITY_POINTS"]

