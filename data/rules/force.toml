summary = "Deals its scripted hit immediately, then once every {force.channel.impact_every_ms:s} while held."
source = "ours"
see = "sim::world::powers::Cast::run"
applies = ["spell:FORCE_POWER_SHOCK", "spell:FORCE_POWER_LIGHTNING", "spell:FORCE_POWER_FORCE_STORM", "spell:FORCE_POWER_DRAIN_LIFE", "spell:FORCE_POWER_DEATH_FIELD"]

[push]
title = "Force Push, Force Whirlwind and Force Wave"
summary = """
Throws enemies backward and off their feet; closer targets are thrown
harder. Force Push hits one target up to {force.push.aimed_reach:m} away.
Force Whirlwind and Force Wave hit every enemy in front of you up to
{force.push.area_reach:m} away. Force Pull works the same way in reverse,
sharing your Force Push rank and Force cost.
"""
detail = """
Each rank pushes at {force.push.strength:m}, losing {force.push.falloff:bare}
m/s per meter of distance (minimum {force.push.least_shove:m}). A target
that knows Force Push and stands on the ground with a free hand pushes back
and resists any throw of its own rank or lower (moving targets count as one
rank lower). Already knocked-down targets are not thrown. You can break free
from an enemy's grip by pushing them with a Force Push of the grip's rank or
higher.
"""
applies = ["spell:FORCE_POWER_FORCE_PUSH", "spell:FORCE_POWER_FORCE_WHIRLWIND", "spell:FORCE_POWER_FORCE_WAVE"]

[push.aimed_reach]
name = "Force Push Range"
value = 512.0
unit = "units"
range = [64, 4096]
summary = "Force Push and Force Pull reach a single target up to {force.push.aimed_reach:m} away in line of sight."
source = "JA"
see = "sim::world::powers::Cast::push_pull"

