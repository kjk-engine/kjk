[rage]
title = "Fury"
summary = """
Lasts {force.rage.length_ms[0]:s} (Fury), {force.rage.length_ms[1]:s}
(Improved Fury), or {force.rage.length_ms[2]:s} (Master Fury). Increases
your movement speed to {force.rage.speed:bare}×, speeds up attacks to
{force.rage.refire:bare}× normal time, and cuts incoming damage (divided by
rank + 1). Drains {force.rage.hp:bare}% of your max Vitality every
{force.rage.hp_every_ms[0]:s} / {force.rage.hp_every_ms[1]:s} /
{force.rage.hp_every_ms[2]:s} down to {force.rage.floor_hp:bare} HP
(requires at least {force.rage.least:bare}% Vitality to activate). When
Fury ends, you recover for {force.rage.recover_ms:s} at
{force.rage.recover_speed:bare}× move speed and
{force.rage.recover_refire:bare}× attack time, and cannot reactivate Fury.
"""
detail = """
Enemy hits can still kill you while Fury is active. When the power's script
runs, each kill under Fury adds +1 weapon damage up to
+{force_effects.fury.most:bare}.
"""
applies = ["spell:FORCE_POWER_FURY", "spell:FORCE_POWER_IMPROVED_FURY", "spell:FORCE_POWER_MASTER_FURY"]

[rage.length_ms]
name = "Fury Duration"
type = "u64"
value = [8000, 14_000, 20_000]
unit = "ms"
labels = ["Fury", "Improved Fury", "Master Fury"]
range = [1000, 120_000]
summary = "Lasts {force.rage.length_ms[0]:s} (Fury), {force.rage.length_ms[1]:s} (Improved Fury), or {force.rage.length_ms[2]:s} (Master Fury)."
source = "JA"
see = "sim::world::powers::toggle_length"

[rage.hp_every_ms]
name = "Fury Vitality Loss Interval"
type = "u64"
value = [150, 300, 450]
unit = "ms"
labels = ["Fury", "Improved Fury", "Master Fury"]
range = [10, 10_000]
summary = "Drains Vitality every {force.rage.hp_every_ms[0]:s} (Fury), {force.rage.hp_every_ms[1]:s} (Improved Fury), or {force.rage.hp_every_ms[2]:s} (Master Fury)."
source = "JA"
see = "sim::world::powers::Cast::rage"

[rage.hp]
name = "Fury Vitality Loss"
value = 2
unit = "points"
range = [0, 50]
summary = "Drains {force.rage.hp:bare}% of your max Vitality per tick."
source = "JA"
see = "sim::world::powers::Cast::rage"

[rage.least]
name = "Fury Minimum Vitality"
value = 10
unit = "points"
range = [0, 100]
summary = "Requires at least {force.rage.least:bare}% of your max Vitality to activate."
source = "JA"
see = "sim::world::powers::Cast::toggle"

[rage.floor_hp]
name = "Fury Vitality Floor"
value = 1
unit = "HP"
range = [1, 100]
summary = "Fury's own drain stops at {force.rage.floor_hp:bare} Vitality and ends Fury."
source = "JA"
see = "sim::world::powers::Cast::rage"

[rage.recover_ms]
name = "Fury Recovery"
type = "u64"
value = 10_000
unit = "ms"
range = [0, 60_000]
summary = "After Fury ends, you recover for {force.rage.recover_ms:s}."
source = "JA"
see = "sim::world::powers::Cast::rage"

[rage.speed]
name = "Fury Speed"
value = 1.3
unit = "×"
range = [0.5, 3]
summary = "Moves at {force.rage.speed:bare}× normal speed while Fury is active."
source = "JA"
see = "sim::world::powers::Cast::upkeep"

[rage.recover_speed]
name = "Recovery Speed"
value = 0.75
unit = "×"
range = [0.1, 2]
summary = "Moves at {force.rage.recover_speed:bare}× normal speed while recovering from Fury."
source = "JA"
see = "sim::world::powers::Cast::upkeep"

[rage.refire]
name = "Fury Attack Speed"
value = 0.75
unit = "×"
range = [0.1, 2]
