summary = """
A toggled power lasting {force.protect.length_ms:s}. Each hit to the
Jedi's vitality is reduced by a share, up to a maximum of damage counted,
and the Jedi pays Force points for the damage counted. These powers,
Force Resistance and Fury cannot be active together. The Defense and
saving throw bonus is listed with the power's effects.
"""
detail = """
Damage beyond the maximum counted is suffered as normal. Damage the Jedi
cannot pay for is suffered as normal.
"""
applies = ["spell:FORCE_POWER_FORCE_AURA", "spell:FORCE_POWER_FORCE_SHIELD", "spell:FORCE_POWER_FORCE_ARMOR"]

[protect.length_ms]
name = "Protection Duration"
type = "u64"
value = 20_000
unit = "ms"
range = [1000, 120_000]
summary = """
Force Aura, Force Shield, Force Armor, Force Resistance and Force Immunity
last {force.protect.length_ms:s}, as does any toggled power without a
duration of its own.
"""
source = "JA (I23 4.6.10, 4.6.13)"
see = "sim::world::powers::toggle_length"
applies = ["spell:FORCE_POWER_FORCE_AURA", "spell:FORCE_POWER_FORCE_SHIELD", "spell:FORCE_POWER_FORCE_ARMOR", "spell:FORCE_POWER_RESIST_FORCE", "spell:FORCE_POWER_FORCE_IMMUNITY"]

