unit = "points"
range = [0, 50]
summary = "The Jedi regains {force.absorb.throw_gain:bare}% of his or her maximum Force points from each push or pull, for each rank of the power."
source = "JA"
see = "sim::world::powers::Cast::push_pull"
applies = ["spell:FORCE_POWER_RESIST_FORCE", "spell:FORCE_POWER_FORCE_IMMUNITY"]

[absorb.tick_gain]
