[rolls]
title = "Saving Throws and Force Resistance"
summary = """
A Force power that allows a save is resisted at a DC of
{force.rolls.dc_base:bare} + the attacking character's level + the
attacking character's Wisdom and Charisma modifiers + the Force Focus
bonus. Before the save, a target under Force Resistance or Force Immunity
has a Force resistance of {force.rolls.resistance_base:bare} +
{force.rolls.resistance_per_tier:bare} per rank of the power + its
character level, or a higher resistance from an item or effect. The power
has no effect unless the attacker's d20 + level equals or exceeds it.
"""
detail = """
Force resistance guards against stun, fear and droid powers, Slow,
Affliction, Plague and Force Whirlwind. Force Suppression and Force Breach
cannot be resisted. A natural 1 always fails a save and a natural 20
always succeeds.
"""
applies = ["kind:force", "feat:FORCE_FOCUS", "feat:FORCE_FOCUS_ADVANCED", "feat:FORCE_FOCUS_MASTERY", "spell:FORCE_POWER_RESIST_FORCE", "spell:FORCE_POWER_FORCE_IMMUNITY"]

[rolls.dc_base]
name = "Force Power DC"
value = 5
range = [0, 30]
summary = """
A Force power's save DC is {force.rolls.dc_base:bare} + the attacking
character's level + the attacking character's Wisdom and Charisma
modifiers + the Force Focus bonus.
"""
source = "KOTOR's engine (`GetSpellSaveDC`; StrategyWiki's K1 rule)"
see = "sim::combat::force::save_dc"
applies = ["kind:force", "feat:FORCE_FOCUS", "feat:FORCE_FOCUS_ADVANCED", "feat:FORCE_FOCUS_MASTERY"]

[rolls.resistance_base]
