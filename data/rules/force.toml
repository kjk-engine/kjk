applies = ["feat:FORCE_JUMP", "feat:FORCE_JUMP_ADVANCED", "feat:FORCE_JUMP_MASTERY"]

[tsl_regeneration]
title = "Regeneration in TSL"
summary = """
In TSL only the Force users of the party regenerate Force points. The
rate is the base rate in or out of combat, + the Wisdom modifier's bonus,
+ {force.tsl_regeneration.force_feat_rate:bare} with Regenerate Force
Points, + the bonuses of items and effects, +
{forms.focus.fp_bonus:bare} under Force Focus. Niman and Force Affinity
raise the base rate in combat. The Force rating of an area lowers the
rate for a dark side character (alignment below
{force.tsl_regeneration.dark_below:bare}) and raises it for a light side
character ({force.tsl_regeneration.light_from:bare} or more).
"""
detail = """
Wounded party members also regain vitality points over time, faster with
Constitution, Treat Injury (Repair for droids) and Regenerate Vitality
Points (+{force.tsl_regeneration.healing_feat_rate:bare}). Each vitality
regeneration effect on the character doubles the rate.
"""
applies = ["kind:force", "feat:REGENERATE_FORCE_POINTS", "feat:REGENERATE_VITALITY_POINTS"]

[tsl_regeneration.force_feat_rate]
name = "Regenerate Force Points"
