[chapter]
title = "The Force"
order = 30
summary = """
Characters use Force powers in real time. In this chapter, the Jedi is the
character who uses a power, and the target is the character the power
affects. This chapter lists the range, area and timing of each power. A
power's damage, saving throw and other effects are those its own
description lists. Each use of a power costs the Force points that its
description lists.
"""
detail = """
Many powers come in three ranks. A character's rank in a group of powers is
the highest power of that group the character knows. For example, Force
Push is rank 1, Force Whirlwind is rank 2 and Force Wave is rank 3. Most
powers run the game's own script for their effects. When a power's script
does not run, the rules below set its damage and healing as a percentage of
the target's maximum vitality points or Force points.
"""

[pool]
title = "Force Points"
summary = """
In KOTOR 1, a character's Force points regenerate 1 point at a time. An
empty pool refills completely in {force.pool.refill_ms:s}, whatever its
size. Force points do not regenerate while the character has a power
active. In KOTOR 2, the party regenerates Force points by KOTOR 2's own
rule, described at the end of this chapter.
"""
detail = """
Force points also stop regenerating while the character makes a Force Jump,
makes a lightsaber special attack or has a thrown lightsaber in the air. A
drain power does not stop regeneration in this way. Each drain strike
pauses it instead, as described under Drain Life. After a pause, the next
point returns one full regeneration interval later. A power that the
character keeps going by keeping its key pressed costs its Force points
once for the first {force.channel.run_ms:s}. After that, it costs the same
amount again for every second it continues.
"""
applies = ["kind:force"]

[pool.refill_ms]
name = "Force Point Regeneration"
type = "u64"
value = 20_000
unit = "ms"
range = [1000, 120_000]
summary = "An empty pool of Force points refills in {force.pool.refill_ms:s}, whatever its size. The points return 1 at a time."
source = "ours, after JA's 20 s for a full pool"
see = "sim::combat::force::regen_every"
applies = ["kind:force"]

[casting]
title = "Using Force Powers"
summary = """
Most powers take effect at once. A toggled power stays active for its
duration. The toggled powers are the speed powers, Force Aura, Force
Shield, Force Armor, Force Resistance, Force Immunity, Affect Mind,
Dominate Mind, Fury and Force Sight. If the Jedi uses a toggled power again
at the same rank after {force.casting.toggle_min_ms:s}, the power ends. If
the Jedi uses a different rank of it, the new rank replaces the old one.
While the Jedi's hand is raised for one power, the Jedi cannot use another
power that needs a free hand.
"""
applies = ["kind:force"]

[casting.toggle_min_ms]
name = "Toggle Delay"
type = "u64"
value = 1500
unit = "ms"
range = [0, 10_000]
summary = "A toggled power must be active for at least {force.casting.toggle_min_ms:s}. After that, using the power again ends it."
source = "JA"
see = "sim::world::powers::Cast::toggle"
applies = ["kind:force"]

[casting.hand_ms]
name = "Raised Hand Time"
type = "u64"
value = 1000
unit = "ms"
range = [0, 5000]
summary = """
After using Affect Mind, a stun or fear power, Valor, Energy Resistance,
Slow, Affliction, Plague, Force Suppression, Force Breach or Fury, the
Jedi keeps a hand raised for {force.casting.hand_ms:s}. During that time
the Jedi cannot use another power that needs a free hand, and cannot fire
a weapon.
"""
source = "JA (mind trick 1000 ms)"
see = "sim::world::powers::Cast::trick"
applies = ["kind:force"]

[channel]
title = "Lightning and Drain"
summary = """
Lightning and drain powers strike once every {force.channel.tick_ms:s}
while they are active. One use lasts {force.channel.run_ms:s}. At ranks 2
and 3, the Jedi can keep the power going by keeping its key pressed. At
ranks 1 and 2, the power strikes the first target in the Jedi's line of
sight, up to {force.channel.line_range:m} away. At rank 3, it strikes
everyone in a cone in front of the Jedi.
"""
detail = """
Shock, Force Lightning, Force Storm, Drain Life and Death Field run the
power's own script when it is available. The script then sets the damage.
The power strikes at once, and then once every
{force.channel.impact_every_ms:s} for as long as the key stays pressed.
"""
applies = ["spell:FORCE_POWER_SHOCK", "spell:FORCE_POWER_LIGHTNING", "spell:FORCE_POWER_FORCE_STORM", "spell:FORCE_POWER_DRAIN_LIFE", "spell:FORCE_POWER_DEATH_FIELD", "spell:FORCE_POWER_DRAIN_FORCE", "spell:FORCE_POWER_IMPROVED_DRAIN_FORCE", "spell:FORCE_POWER_MASTER_DRAIN_FORCE"]

[channel.tick_ms]
name = "Strike Interval"
type = "u64"
value = 50
unit = "ms"
range = [10, 1000]
summary = "Hits every {force.channel.tick_ms:s} while active."
source = "JA"
see = "sim::world::powers::Cast::run"

[channel.run_ms]
name = "Lightning and Drain Duration"
type = "u64"
value = 500
unit = "ms"
range = [50, 5000]
summary = """
A tap lasts {force.channel.run_ms:s}. Hold the key to keep channeling — you
pay the Force cost up front for the first {force.channel.run_ms:s}, then
again for each second you hold it.
"""
detail = "Applies to lightning, drain, and grip powers. If a target resists Choke, it ends after this time."
source = "JA"
see = "sim::combat::force::channel_cost"
applies = ["spell:FORCE_POWER_SHOCK", "spell:FORCE_POWER_LIGHTNING", "spell:FORCE_POWER_FORCE_STORM", "spell:FORCE_POWER_DRAIN_LIFE", "spell:FORCE_POWER_DEATH_FIELD", "spell:FORCE_POWER_WOUND", "spell:FORCE_POWER_CHOKE", "spell:FORCE_POWER_KILL", "spell:FORCE_POWER_FORCE_CRUSH", "spell:FORCE_POWER_DRAIN_FORCE", "spell:FORCE_POWER_IMPROVED_DRAIN_FORCE", "spell:FORCE_POWER_MASTER_DRAIN_FORCE"]

[channel.delay_ms]
name = "Lightning and Drain Delay"
type = "u64"
value = [3000, 1500]
unit = "ms"
labels = ["rank 1", "ranks 2 and 3"]
range = [0, 20_000]
summary = """
Cooldown after ending: {force.channel.delay_ms[0]:s} (rank 1) or
{force.channel.delay_ms[1]:s} (ranks 2 and 3).
"""
source = "JA"
see = "sim::world::powers::Cast::end"
applies = ["spell:FORCE_POWER_SHOCK", "spell:FORCE_POWER_LIGHTNING", "spell:FORCE_POWER_FORCE_STORM", "spell:FORCE_POWER_DRAIN_LIFE", "spell:FORCE_POWER_DEATH_FIELD", "spell:FORCE_POWER_DRAIN_FORCE", "spell:FORCE_POWER_IMPROVED_DRAIN_FORCE", "spell:FORCE_POWER_MASTER_DRAIN_FORCE"]

