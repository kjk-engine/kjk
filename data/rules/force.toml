range = [0, 4000]
summary = """
Force Jump lifts with a strength of {force.jump.strengths:bare} (rank 1,
2 and 3). A tenth of it, scaled by the share of the height still to rise,
is added to the jump's speed.
"""
source = "JA (I23 4.6.1)"
see = "sim::motion::force_jump"
applies = ["feat:FORCE_JUMP", "feat:FORCE_JUMP_ADVANCED", "feat:FORCE_JUMP_MASTERY"]

