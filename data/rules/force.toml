the Force and fails its save is held for at most {force.crowd.hold_ms:s},
and cannot be held again for {force.crowd.immune_ms:s}. Fear ends when the
target takes damage.
"""
detail = """
Fear powers allow a Will save, the others a Fortitude save. Disable Droid
and Destroy Droid also affect all droids within
{force.crowd.disable_splash_m:bare} and
{force.crowd.destroy_splash_m:bare} meters of the target droid.
"""
applies = ["spell:FORCE_POWER_STUN", "spell:FORCE_POWER_STASIS", "spell:FORCE_POWER_MASS_STASIS", "spell:FORCE_POWER_FEAR", "spell:FORCE_POWER_HORROR", "spell:FORCE_POWER_INSANITY", "spell:FORCE_POWER_DROID_STUN", "spell:FORCE_POWER_DROID_DISABLE", "spell:FORCE_POWER_DROID_DESTROY", "spell:FORCE_POWER_FORCE_SCREAM", "spell:FORCE_POWER_IMPROVED_FORCE_SCREAM", "spell:FORCE_POWER_MASTER_FORCE_SCREAM"]

[crowd.reach]
name = "Force Power Range"
value = 1024.0
unit = "units"
range = [64, 8192]
summary = """
Stun, fear and droid powers reach {force.crowd.reach:m}, as do Slow,
Affliction, Plague, Force Suppression, Force Breach, Mind Trick and Force
Confusion.
"""
