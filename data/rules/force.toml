{force.mind_trick.confuse_ms[2]:s} at rank 3.
"""
source = "JA"
see = "sim::world::powers::Cast::trick"
applies = ["spell:FORCE_POWER_AFFECT_MIND", "spell:FORCE_POWER_DOMINATE"]

[crowd]
title = "Stun, Stasis, Fear and the Droid Powers"
summary = """
A single-target power affects one target up to {force.crowd.reach:m} away.
An area power affects every enemy within that range, within
{force.crowd.area_field} of the Jedi's aim and in front of the Jedi. A
target is affected only if it is not immune, does not resist the Force and
fails its saving throw. The power's effect on a target lasts at most
{force.crowd.hold_ms:s}. After that, the target cannot be affected again
for {force.crowd.immune_ms:s}. Fear ends when the frightened target takes
damage.
"""
