"""
source = "JA"
see = "sim::world::powers::Cast::upkeep"
applies = ["spell:FORCE_POWER_WOUND", "spell:FORCE_POWER_CHOKE", "spell:FORCE_POWER_KILL", "spell:FORCE_POWER_FORCE_CRUSH"]

[speed]
title = "Burst of Speed, Knight Speed and Master Speed"
summary = """
These are toggled powers. In combat, the Jedi moves
{force.speed.scale:bare} times as fast. Out of combat, the Jedi moves
{walking.pace.most_multiplier:bare} times as fast. Burst of Speed lasts
{force.speed.length_ms[0]:s}, Knight Speed lasts
{force.speed.length_ms[1]:s} and Master Speed lasts
{force.speed.length_ms[2]:s}. Force points do not regenerate while a speed
power is active. The power's description lists its Defense bonus and its
extra attacks.
"""
detail = """
In combat, this speed replaces the movement bonus in the power's
description. Out of combat, the Jedi moves by that bonus instead, as in
KOTOR. That bonus is the fastest movement in the game,
{walking.pace.most_multiplier:bare} times the character's normal walk and
run. Force Suppression ends Burst of Speed and Knight Speed. Force Breach
ends all three speed powers.
"""
applies = ["spell:FORCE_POWER_SPEED_BURST", "spell:FORCE_POWER_KNIGHT_SPEED", "spell:FORCE_POWER_SPEED_MASTERY"]

[speed.scale]
name = "Speed Bonus"
value = 1.15
unit = "×"
range = [1, 3]
summary = "In combat, every rank of the speed powers makes the Jedi move {force.speed.scale:bare} times as fast."
source = "the owner's call, over JA's 1.7"
see = "sim::world::powers::Cast::upkeep"
applies = ["spell:FORCE_POWER_SPEED_BURST", "spell:FORCE_POWER_KNIGHT_SPEED", "spell:FORCE_POWER_SPEED_MASTERY"]

[speed.length_ms]
