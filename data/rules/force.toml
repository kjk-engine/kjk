vitality points when one is healed, {force.heal.points[1]:bare}% when two
are and {force.heal.points[2]:bare}% when three or more are.
"""
source = "JA (I23 4.6.8)"
see = "sim::world::powers::Cast::heal"
applies = ["spell:FORCE_POWER_CURE", "spell:FORCE_POWER_HEAL", "spell:FORCE_POWER_MASTER_HEAL"]

[mind_trick]
title = "Affect Mind, Dominate Mind, Mind Trick and Force Confusion"
summary = """
A toggled power. Rank 1 affects the target within
{force.mind_trick.aimed_reach:m}; rank 2 affects every enemy within
