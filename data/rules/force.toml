source = "JA (I23 4.6.4)"
see = "sim::world::powers::Cast::squeeze"
applies = ["spell:FORCE_POWER_CHOKE", "spell:FORCE_POWER_KILL", "spell:FORCE_POWER_FORCE_CRUSH"]

[grip.front_dot]
name = "Grip Arc"
value = 0.9
range = [-1, 1]
summary = """
At ranks 1 and 2 the grip ends when the target leaves the Jedi's front.
Arc: {force.grip.front_dot} (1 is a straight line, 0 is everything in
