[sight]
title = "Force Sight"
summary = """
Lasts {force.sight.length_ms[0]:s} (rank 1), {force.sight.length_ms[1]:s}
(rank 2), or {force.sight.length_ms[2]:s} (rank 3). Lets you see characters
through walls and see through Affect Mind.
"""
detail = "When the power's script runs, your screen also shows Force Sight's visual effect."
applies = ["spell:FORCE_POWER_FORCE_SIGHT"]

[sight.length_ms]
name = "Force Sight Duration"
type = "u64"
value = [10_000, 20_000, 30_000]
unit = "ms"
labels = ["rank 1", "rank 2", "rank 3"]
range = [1000, 120_000]
summary = "Lasts {force.sight.length_ms[0]:s} (rank 1), {force.sight.length_ms[1]:s} (rank 2), or {force.sight.length_ms[2]:s} (rank 3)."
source = "JA"
see = "sim::world::powers::toggle_length"

[rolls]
title = "Saving Throws and Force Resistance"
summary = """
Save DC: {force.rolls.dc_base:bare} + level + Wisdom mod + Charisma mod +
Force Focus bonus. Before a save, Force Resistance or Force Immunity can
block the power outright if your d20 + level is below the target's Force
resistance ({force.rolls.resistance_base:bare} +
{force.rolls.resistance_per_tier:bare} per rank + level, or higher from
gear).
"""
detail = """
Force resistance protects against stun, fear, and droid powers, Slow,
Affliction, Plague, and Force Whirlwind. Force Suppression and Force Breach
cannot be resisted. A natural 1 always fails and a natural 20 always
succeeds.
"""
applies = ["kind:force", "feat:FORCE_FOCUS", "feat:FORCE_FOCUS_ADVANCED", "feat:FORCE_FOCUS_MASTERY", "spell:FORCE_POWER_RESIST_FORCE", "spell:FORCE_POWER_FORCE_IMMUNITY"]

[rolls.dc_base]
name = "Force Power DC"
value = 5
range = [0, 30]
summary = "Force power save DC is {force.rolls.dc_base:bare} + level + Wisdom mod + Charisma mod + Force Focus."
source = "KOTOR's engine (`GetSpellSaveDC`; StrategyWiki's K1 rule)"
see = "sim::combat::force::save_dc"

[rolls.resistance_base]
name = "Force Resistance Base"
value = 5
range = [0, 30]
summary = "Force resistance is {force.rolls.resistance_base:bare} + {force.rolls.resistance_per_tier:bare} per rank + character level."
source = "K1's descriptions of Resist Force and Force Immunity"
see = "sim::combat::force::resistance"

[rolls.resistance_per_tier]
name = "Force Resistance per Rank"
value = 5
range = [0, 30]
summary = "Each rank of Force Resistance / Immunity adds +{force.rolls.resistance_per_tier:bare} to Force resistance."
source = "K1's descriptions of Resist Force and Force Immunity"
see = "sim::combat::force::resistance"

[jump]
title = "Force Jump"
summary = """
Every character can jump. A character with Force Jump, and any character
who has Force points, can also make a Force Jump. A character who has
Force points but not the feat jumps at rank 1. When the character keeps
the jump key pressed while rising, the Force lifts the character toward
the height of his or her rank above the takeoff point. The lift is
stronger the farther the character still is below that height. Once the
character rises above the height of a normal jump, the Force Jump is
active. The character then flips in the direction of the movement key
pressed. From rank 2, a character who presses no movement key leaps in the
direction he or she is already moving. Force points do not regenerate
during a Force Jump, and the character spends Force points while rising.
"""
detail = """
The Force Jump stays active until the character lands or falls below the
takeoff point. If the character releases the jump key or runs out of Force
points, the character rises no faster than in a normal jump.
"""
applies = ["feat:FORCE_JUMP", "feat:FORCE_JUMP_ADVANCED", "feat:FORCE_JUMP_MASTERY", "kind:force"]

[jump.heights]
name = "Jump Height"
value = [32.0, 96.0, 192.0, 384.0]
unit = "units"
labels = ["normal jump", "rank 1", "rank 2", "rank 3"]
range = [0, 2048]
summary = """
A normal jump rises {force.jump.heights[0]:m} above the takeoff point.
Force Jump rises {force.jump.heights[1]:m} at rank 1,
{force.jump.heights[2]:m} at rank 2 and {force.jump.heights[3]:m} at rank
3.
"""
source = "JA"
see = "sim::motion::force_jump"
applies = ["feat:FORCE_JUMP", "feat:FORCE_JUMP_ADVANCED", "feat:FORCE_JUMP_MASTERY"]

[jump.strengths]
name = "Jump Strength"
value = [420.0, 590.0, 840.0]
labels = ["rank 1", "rank 2", "rank 3"]
range = [0, 4000]
summary = """
Force Jump lifts with a strength of {force.jump.strengths:bare} at ranks
1, 2 and 3. The character rises at a normal jump's speed plus a tenth of
this strength. That tenth is multiplied by the fraction of the jump height
still left to rise.
"""
source = "JA"
see = "sim::motion::force_jump"
applies = ["feat:FORCE_JUMP", "feat:FORCE_JUMP_ADVANCED", "feat:FORCE_JUMP_MASTERY"]

[jump.pay_every_ms]
name = "Jump Cost Interval"
type = "u64"
value = [200, 300]
unit = "ms"
labels = ["rank 1", "ranks 2 and 3"]
range = [10, 5000]
summary = """
An active Force Jump spends Force points every
{force.jump.pay_every_ms[0]:s} at rank 1 and every
{force.jump.pay_every_ms[1]:s} at ranks 2 and 3.
"""
source = "JA"
see = "sim::motion::force_jump"
applies = ["feat:FORCE_JUMP", "feat:FORCE_JUMP_ADVANCED", "feat:FORCE_JUMP_MASTERY"]

[jump.cost_above]
name = "Jump Cost Speeds"
value = [250.0, 200.0, 150.0, 100.0, 50.0, 0.0]
unit = "units/s"
labels = ["fastest", "faster", "fast", "slow", "slower", "slowest"]
range = [0, 2000]
summary = """
The amount a Force Jump spends depends on how fast the character is
rising. The six amounts apply above rising speeds of
{force.jump.cost_above:m}, from the fastest to the slowest. A falling
character spends nothing.
"""
source = "JA"
see = "sim::motion::force_jump"
applies = ["feat:FORCE_JUMP", "feat:FORCE_JUMP_ADVANCED", "feat:FORCE_JUMP_MASTERY"]

[jump.cost_points]
name = "Jump Cost"
value = [20, 16, 12, 8, 6, 4]
unit = "points"
labels = ["fastest", "faster", "fast", "slow", "slower", "slowest"]
range = [0, 100]
summary = """
Each time, a Force Jump spends {force.jump.cost_points:bare}% of the
character's maximum Force points, from the fastest rise to the slowest.
The amount is divided by the character's Force Jump rank.
"""
source = "JA"
see = "sim::motion::force_jump"
applies = ["feat:FORCE_JUMP", "feat:FORCE_JUMP_ADVANCED", "feat:FORCE_JUMP_MASTERY"]

[tsl_regeneration]
title = "Regeneration in KOTOR 2"
summary = """
In KOTOR 2, only the party's Force users regenerate Force points. The
regeneration rate is the sum of several parts. The first part is the base
rate, which is different in and out of combat. Niman and Force Affinity
raise the base rate in combat. The Wisdom modifier adds a bonus. Regenerate
Force Points adds {force.tsl_regeneration.force_feat_rate:bare}. Items and
effects add their own bonuses. The Force Focus form adds
{forms.focus.fp_bonus:bare}. Finally, every area has a Force rating. The
area's Force rating lowers the rate for a dark side character, whose
alignment is below {force.tsl_regeneration.dark_below:bare}. It raises the
rate for a light side character, whose alignment is
{force.tsl_regeneration.light_from:bare} or more.
"""
detail = """
Wounded party members also regain vitality points over time. They regain
them faster with a higher Constitution, with more ranks in Treat Injury
(Repair for droids), and with Regenerate Vitality Points, which adds
{force.tsl_regeneration.healing_feat_rate:bare} to the rate. Each vitality
regeneration effect on the character doubles the rate.
"""
applies = ["kind:force"]

[tsl_regeneration.force_feat_rate]
name = "Regenerate Force Points"
value = 0.25
range = [0, 5]
summary = "Regenerate Force Points adds {force.tsl_regeneration.force_feat_rate:bare} to the rate at which Force points regenerate."
source = "TSL's executable (`HandleFPRegeneration`)"
see = "sim::combat::force::regenerate_tsl"
applies = ["feat:REGENERATE_FORCE_POINTS"]

[tsl_regeneration.dark_below]
name = "Dark Side Alignment"
type = "u8"
value = 41
range = [0, 100]
summary = """
A character with an alignment below
{force.tsl_regeneration.dark_below:bare} belongs to the dark side. An
area's Force rating slows his or her Force point regeneration.
"""
source = "TSL's executable (`HandleFPRegeneration`)"
see = "sim::combat::force::regenerate_tsl"
applies = ["kind:force"]

[tsl_regeneration.light_from]
name = "Light Side Alignment"
type = "u8"
value = 60
range = [0, 100]
summary = """
A character with an alignment of {force.tsl_regeneration.light_from:bare}
or more belongs to the light side. An area's Force rating speeds up his or
her Force point regeneration.
"""
source = "TSL's executable (`HandleFPRegeneration`)"
see = "sim::combat::force::regenerate_tsl"
applies = ["kind:force"]

[tsl_regeneration.healing_feat_rate]
name = "Regenerate Vitality Points"
value = 0.5
range = [0, 5]
summary = "Regenerate Vitality Points adds {force.tsl_regeneration.healing_feat_rate:bare} to the rate at which vitality points regenerate."
source = "TSL's executable (`CSWSCreature`'s regeneration)"
see = "sim::world::powers::regenerate"
applies = ["feat:REGENERATE_VITALITY_POINTS"]

[k1_regeneration]
title = "Regeneration Feats in KOTOR 1"
summary = """
KOTOR 1 keeps its own regeneration, and the two regeneration feats add to
it what they add in KOTOR 2. A character who knows Regenerate Force Points
regains {force.tsl_regeneration.force_feat_rate:bare} of the Force point
pool every {force.k1_regeneration.force_time_s} on top of KOTOR 1's
refill. A party member who knows Regenerate Vitality Points regains
{force.tsl_regeneration.healing_feat_rate:bare} vitality points every
{force.k1_regeneration.healing_time_s} on top of KOTOR 1's healing, in
combat and out of it.
"""
applies = ["feat:REGENERATE_FORCE_POINTS", "feat:REGENERATE_VITALITY_POINTS"]

[k1_regeneration.force_time_s]
name = "Force Regeneration Time"
value = 90.0
unit = "s"
range = [1.0, 600.0]
summary = "In KOTOR 1, Regenerate Force Points adds its share of the pool once every {force.k1_regeneration.force_time_s}."
source = "KOTOR 2's regeneration.2da (fpregentime)"
see = "sim::combat::force::regen_every"
applies = ["feat:REGENERATE_FORCE_POINTS"]

[k1_regeneration.healing_time_s]
name = "Healing Time"
value = 6.0
unit = "s"
range = [1.0, 600.0]
summary = "In KOTOR 1, Regenerate Vitality Points adds its vitality points once every {force.k1_regeneration.healing_time_s}."
source = "KOTOR 2's regeneration.2da (timeperhp)"
see = "sim::script::HealthRegeneration::every_ms"
applies = ["feat:REGENERATE_VITALITY_POINTS"]

