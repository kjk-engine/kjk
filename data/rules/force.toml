Cure reaches {force.heal.reach[0]:m}, Heal {force.heal.reach[1]:m} and
Master Heal {force.heal.reach[2]:m} around the Jedi.
"""
source = "JA (I23 4.6.8)"
see = "sim::world::powers::Cast::heal"
applies = ["spell:FORCE_POWER_CURE", "spell:FORCE_POWER_HEAL", "spell:FORCE_POWER_MASTER_HEAL"]

[heal.points]
name = "Vitality Healed"
value = [50, 33, 25]
unit = "points"
labels = ["one", "two", "three or more"]
