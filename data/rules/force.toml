see = "sim::combat::force::resistance"
applies = ["spell:FORCE_POWER_RESIST_FORCE", "spell:FORCE_POWER_FORCE_IMMUNITY"]

[jump]
title = "Force Jump"
summary = """
Every character can jump. A character with Force Jump, or any Force user
at rank 1, who holds the jump key while rising is lifted toward the
rank's height above the takeoff point. The lower the character still is,
the stronger the lift. Above a normal jump's height the Force Jump is
active: the character flips or, from rank 2, leaps in the held direction,
Force points do not regenerate, and Force points are spent while rising.
"""
detail = """
The Force Jump stays active until the character lands or falls below the
takeoff point. If the key is released or Force points run out, the rise
slows to a normal jump's.
"""
applies = ["feat:FORCE_JUMP", "feat:FORCE_JUMP_ADVANCED", "feat:FORCE_JUMP_MASTERY", "kind:force"]

[jump.heights]
name = "Jump Height"
value = [32.0, 96.0, 192.0, 384.0]
unit = "units"
labels = ["normal jump", "rank 1", "rank 2", "rank 3"]
range = [0, 2048]
summary = """
A normal jump rises {force.jump.heights[0]:m} above the takeoff point.
Force Jump rises {force.jump.heights[1]:m} at rank 1,
{force.jump.heights[2]:m} at rank 2 and {force.jump.heights[3]:m} at rank
3.
"""
source = "JA (I23 4.6.1)"
see = "sim::motion::force_jump"
applies = ["feat:FORCE_JUMP", "feat:FORCE_JUMP_ADVANCED", "feat:FORCE_JUMP_MASTERY"]

[jump.strengths]
