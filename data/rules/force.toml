[lightning]
title = "Shock, Force Lightning and Force Storm"
summary = """
Repeatedly zaps enemies while active, dealing {force.lightning.points:bare}%
(plus up to {force.lightning.extra:bare}% extra) of the target's max
Vitality as electrical damage per tick and pushing them back. Energy shields
absorb this damage. Force Storm hits every enemy in a
{force.lightning.radius:m} cone in front of you.
"""
detail = """
Force Resistance of a lower rank than the power reduces each tick to
{force.lightning.points:bare}%, with no extra damage. Force Resistance of
the same rank or higher stops the damage completely. In both cases the
target regains Force points from each tick. When the power's script runs,
the script sets the damage.
"""
applies = ["spell:FORCE_POWER_SHOCK", "spell:FORCE_POWER_LIGHTNING", "spell:FORCE_POWER_FORCE_STORM"]

