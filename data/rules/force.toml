range = [0, 4000]
summary = """
For each 1% of maximum vitality points that the power counts, the Jedi
loses part of 1% of maximum Force points. Force Aura uses up
{force.protect.rate[0]:pct} of that 1%, Force Shield uses up
{force.protect.rate[1]:pct}, and Force Armor uses up
{force.protect.rate[2]:pct}.
"""
source = "JA"
see = "sim::combat::force::protect"
applies = ["spell:FORCE_POWER_FORCE_AURA", "spell:FORCE_POWER_FORCE_SHIELD", "spell:FORCE_POWER_FORCE_ARMOR"]

[protect.cap]
name = "Damage Counted"
type = "i64"
value = [100, 200, 400]
unit = "points"
labels = ["Force Aura", "Force Shield", "Force Armor"]
range = [0, 1000]
summary = """
From a single hit, Force Aura counts at most {force.protect.cap[0]:bare}%
of the Jedi's maximum vitality points. Force Shield counts at most
{force.protect.cap[1]:bare}%, and Force Armor at most
{force.protect.cap[2]:bare}%.
"""
source = "JA"
see = "sim::combat::force::protect"
applies = ["spell:FORCE_POWER_FORCE_AURA", "spell:FORCE_POWER_FORCE_SHIELD", "spell:FORCE_POWER_FORCE_ARMOR"]

[absorb]
