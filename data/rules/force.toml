summary = """
Fury is a toggled power. While Fury is active, the character moves
{force.rage.speed:bare} times as fast. The character's attacks and shots
take {force.rage.refire:bare} times the normal time. Damage dealt to the
character by another character is divided by the power's rank plus 1. Fury
takes {force.rage.hp:bare}% of the character's maximum vitality points at
regular intervals. Fury ends when the character's vitality points fall to
{force.rage.floor_hp:bare}. The character cannot activate Fury with less
than {force.rage.least:bare}% of maximum vitality points. After Fury ends,
the character recovers for {force.rage.recover_ms:s}. During that time the
character moves at {force.rage.recover_speed:bare} times normal speed,
attacks and fires in {force.rage.recover_refire:bare} times the normal
time, and cannot use Fury.
"""
detail = """
A hit can still kill the character while Fury is active. When the power's
script runs, Fury works as its description says. Each kill the character
makes under Fury then adds to the character's damage, up to
+{force_effects.fury.most:bare}.
"""
applies = ["spell:FORCE_POWER_FURY", "spell:FORCE_POWER_IMPROVED_FURY", "spell:FORCE_POWER_MASTER_FURY"]

