Burst of Speed lasts {force.speed.length_ms[0]:s}, Knight Speed lasts
{force.speed.length_ms[1]:s} and Master Speed lasts
{force.speed.length_ms[2]:s}.
"""
source = "JA"
see = "sim::world::powers::toggle_length"
applies = ["spell:FORCE_POWER_SPEED_BURST", "spell:FORCE_POWER_KNIGHT_SPEED", "spell:FORCE_POWER_SPEED_MASTERY"]

[protect]
title = "Force Aura, Force Shield and Force Armor"
summary = """
These are toggled powers that last {force.protect.length_ms:s}. Each time
the Jedi takes damage to vitality points, the power prevents part of it.
In exchange, the Jedi loses Force points. The power counts only damage up
to a limit for each hit. Force Aura, Force Shield, Force Armor, Force
Resistance and Fury cannot be active at the same time. The power's
description lists its bonus to Defense and saving throws.
"""
detail = """
Damage above the limit for one hit is not reduced. If the Jedi runs short
of Force points, the damage that the missing Force points would have
prevented is not reduced either.
"""
applies = ["spell:FORCE_POWER_FORCE_AURA", "spell:FORCE_POWER_FORCE_SHIELD", "spell:FORCE_POWER_FORCE_ARMOR"]

[protect.length_ms]
name = "Protection Duration"
type = "u64"
value = 20_000
unit = "ms"
range = [1000, 120_000]
summary = """
Force Aura, Force Shield, Force Armor, Force Resistance and Force Immunity
last {force.protect.length_ms:s}. Any other toggled power without a
duration of its own lasts as long.
"""
source = "JA"
see = "sim::world::powers::toggle_length"
applies = ["spell:FORCE_POWER_FORCE_AURA", "spell:FORCE_POWER_FORCE_SHIELD", "spell:FORCE_POWER_FORCE_ARMOR", "spell:FORCE_POWER_RESIST_FORCE", "spell:FORCE_POWER_FORCE_IMMUNITY"]

