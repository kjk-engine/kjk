value = 1024.0
unit = "units"
range = [64, 4096]
summary = "Force Whirlwind and Force Wave hit enemies up to {force.push.area_reach:m} away."
detail = "When their impact scripts run, Force Push and Force Whirlwind also pick targets within this range."
source = "JA"
see = "sim::world::powers::Cast::push_pull"

