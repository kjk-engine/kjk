summary = "Each strike that takes Force points stops the target's Force point regeneration for {force.drain.victim_wait_ms:s}."
source = "JA"
see = "sim::world::powers::Cast::drain"
applies = ["spell:FORCE_POWER_DRAIN_LIFE", "spell:FORCE_POWER_DEATH_FIELD", "spell:FORCE_POWER_DRAIN_FORCE", "spell:FORCE_POWER_IMPROVED_DRAIN_FORCE", "spell:FORCE_POWER_MASTER_DRAIN_FORCE"]

[grip]
title = "Wound, Choke, Kill and Force Crush"
summary = """
The Jedi keeps these powers going by keeping the key pressed. The Jedi
seizes one target up to {force.grip.range:m} away, unless the target is
under Force Resistance or is already seized. The target suffers
{force.grip.points:bare}% of its maximum vitality points as damage every
{force.grip.squeeze_every_ms:s}. At rank 1 the target stays on the ground.
At rank 2 the target is also lifted into the air. At rank 3 the Jedi moves
the target to a point in front of him or her. At ranks 2 and 3 the grip
also crushes the target once, {force.grip.crush_ms:s} after it begins.
While gripping, the Jedi moves at {force.grip.gripping_scale:bare} times
normal speed. The seized target moves at
{force.grip.gripped_scale[0]:bare} times normal speed, or
{force.grip.gripped_scale[1]:bare} times if it is under a speed power.
"""
detail = """
The grip ends when the target dies, moves out of range, or moves out of
the Jedi's line of sight. At ranks 1 and 2, it also ends when the target
leaves the area in front of the Jedi. It also ends when the target's Force
Resistance cancels it completely. When the power's script runs, the grip
lasts until the script deals its last damage. If the Jedi lets go early,
the target does not suffer the rest of that damage.
"""
applies = ["spell:FORCE_POWER_WOUND", "spell:FORCE_POWER_CHOKE", "spell:FORCE_POWER_KILL", "spell:FORCE_POWER_FORCE_CRUSH"]

[grip.range]
name = "Grip Range"
value = 256.0
