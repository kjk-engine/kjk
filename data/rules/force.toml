unit = "points"
range = [0, 50]
summary = "Each squeeze inflicts {force.grip.points:bare}% of the target's maximum vitality points."
source = "JA (I23 4.6.4)"
see = "sim::world::powers::Cast::squeeze"
applies = ["spell:FORCE_POWER_WOUND", "spell:FORCE_POWER_CHOKE", "spell:FORCE_POWER_KILL", "spell:FORCE_POWER_FORCE_CRUSH"]

[grip.squeeze_every_ms]
