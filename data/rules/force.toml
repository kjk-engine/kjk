{force.tsl_regeneration.dark_below:bare} belongs to the dark side. An
area's Force rating slows his or her Force point regeneration.
"""
source = "TSL's executable (`HandleFPRegeneration`)"
see = "sim::combat::force::regenerate_tsl"
applies = ["kind:force"]

[tsl_regeneration.light_from]
name = "Light Side Alignment"
type = "u8"
value = 60
range = [0, 100]
summary = """
A character with an alignment of {force.tsl_regeneration.light_from:bare}
or more belongs to the light side. An area's Force rating speeds up his or
her Force point regeneration.
"""
source = "TSL's executable (`HandleFPRegeneration`)"
see = "sim::combat::force::regenerate_tsl"
applies = ["kind:force"]

[tsl_regeneration.healing_feat_rate]
