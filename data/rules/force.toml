range = [0, 4000]
summary = """
Force Jump lifts with a strength of {force.jump.strengths:bare} at ranks
1, 2 and 3. The character rises at a normal jump's speed plus a tenth of
this strength. That tenth is multiplied by the fraction of the jump height
still left to rise.
"""
source = "JA"
see = "sim::motion::force_jump"
applies = ["feat:FORCE_JUMP", "feat:FORCE_JUMP_ADVANCED", "feat:FORCE_JUMP_MASTERY"]

