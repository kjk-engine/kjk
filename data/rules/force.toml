Jedi's aim. Affected players cannot see the Jedi for the duration. An
affected creature that is not a Force user loses track of its enemy.
"""
detail = """
The effect ends when the Jedi attacks, or when a player uses
Force Sight. Mind Trick and Force Confusion act as their own descriptions
say, on the target within {force.crowd.reach:m}.
"""
applies = ["spell:FORCE_POWER_AFFECT_MIND", "spell:FORCE_POWER_DOMINATE", "spell:FORCE_POWER_MIND_TRICK", "spell:FORCE_POWER_CONFUSION"]

[mind_trick.aimed_reach]
name = "Affect Mind Range"
value = 256.0
unit = "units"
range = [64, 2048]
summary = "Rank 1 reaches a target up to {force.mind_trick.aimed_reach:m} away in line of sight."
source = "JA (I23 4.6.11)"
see = "sim::world::powers::Cast::trick"
applies = ["spell:FORCE_POWER_AFFECT_MIND", "spell:FORCE_POWER_MIND_TRICK"]

[mind_trick.area_reach]
name = "Dominate Mind Range"
value = 512.0
unit = "units"
range = [64, 4096]
