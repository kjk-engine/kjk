summary = "Each blocked path is tried again at {force.routines.destination_shorter:bare} times its length."
source = "TSL's executable"
see = "sim::script::force::random_destination"

[routines.destination_turn_m]
name = "Random Movement Turn"
value = 2.5
unit = "m"
range = [0, 50]
summary = "When a path becomes shorter than {force.routines.destination_turn_m:bare} meters, the creature tries turning left, right or back instead."
source = "TSL's executable"
see = "sim::script::force::random_destination"

[routines.destination_least_m]
