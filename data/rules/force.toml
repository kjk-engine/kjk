[chapter]
title = "The Force"
order = 30
summary = """
Force powers are used in real time. The area, throw and timing of each
power are given here; its damage, saving throws and effects are those of
the power's own description, and it costs the Force points the
description lists.
"""
detail = """
A character's highest power in a line sets its rank: Force Push is rank
1, Force Whirlwind rank 2 and Force Wave rank 3. Where the power's script
does not run, its damage and healing are a share of the target's maximum
vitality points or Force points, as given below.
"""

[pool]
title = "Force Points"
summary = """
In K1 an empty pool of Force points refills in {force.pool.refill_ms:s},
whatever its size, 1 point at a time. Force points do not regenerate while
a power is active. The party in TSL regenerates by TSL's own rule.
"""
detail = """
Regeneration also stops during a Force jump, a lightsaber special attack
or a thrown lightsaber, but not during Drain, and resumes a full period
later. A held power pays its cost again every second after the first
{force.channel.run_ms:s}.
"""
applies = ["kind:force"]

[pool.refill_ms]
name = "Force Point Regeneration"
type = "u64"
value = 20_000
unit = "ms"
range = [1000, 120_000]
summary = "An empty pool of Force points refills in {force.pool.refill_ms:s}, whatever its size, 1 point at a time."
source = "I22 C13 (JA's 20 s for a full pool)"
see = "sim::combat::force::regen_every"
applies = ["kind:force"]

[casting]
title = "Using Force Powers"
summary = """
Most powers take effect at once. A toggled power (the speed powers, Force
Aura, Force Shield, Force Armor, Force Resistance, Force Immunity, Affect
Mind, Dominate Mind, Fury and Force Sight) lasts for its duration. Used
again at the same rank after {force.casting.toggle_min_ms:s}, it is
deactivated; another rank replaces it. While the Jedi's hand is out for
one power, no other power of the hand can be used.
"""
applies = ["kind:force"]

[casting.toggle_min_ms]
name = "Toggle Delay"
type = "u64"
value = 1500
unit = "ms"
range = [0, 10_000]
summary = "A toggled power must be active for {force.casting.toggle_min_ms:s} before using it again deactivates it."
source = "JA (I23 4.3)"
see = "sim::world::powers::Cast::toggle"
applies = ["kind:force"]

[casting.hand_ms]
name = "Power Gesture"
type = "u64"
value = 1000
unit = "ms"
range = [0, 5000]
summary = """
After Affect Mind, a stun or fear power, Valor, Energy Resistance, Slow,
Affliction, Plague, Force Suppression, Force Breach or Fury, the Jedi's
hand stays out for {force.casting.hand_ms:s}. No other power of the hand
and no shot can be used meanwhile.
"""
source = "JA (I23 4.3: mind trick 1000 ms)"
see = "sim::world::powers::Cast::trick"
applies = ["kind:force"]

[channel]
title = "Lightning and Drain"
summary = """
Lightning and drain powers strike every {force.channel.tick_ms:s} while
active. One use lasts {force.channel.run_ms:s}; at ranks 2 and 3, holding
the key keeps the power going. Ranks 1 and 2 strike the first target in
line of sight, up to {force.channel.line_range:m} away; rank 3 strikes
everyone in a cone before the Jedi.
"""
detail = """
When the power's script runs (Shock, Force Lightning, Force Storm, Drain
Life, Death Field), the script sets the damage and strikes once every
{force.channel.impact_every_ms:s} held, the first at once.
"""
applies = ["spell:FORCE_POWER_SHOCK", "spell:FORCE_POWER_LIGHTNING", "spell:FORCE_POWER_FORCE_STORM", "spell:FORCE_POWER_DRAIN_LIFE", "spell:FORCE_POWER_DEATH_FIELD", "spell:FORCE_POWER_DRAIN_FORCE", "spell:FORCE_POWER_IMPROVED_DRAIN_FORCE", "spell:FORCE_POWER_MASTER_DRAIN_FORCE"]

[channel.tick_ms]
name = "Strike Rate"
type = "u64"
value = 50
unit = "ms"
range = [10, 1000]
summary = "Held lightning and drain strike every {force.channel.tick_ms:s}."
source = "JA (I23 4.6.5, 4.6.6)"
see = "sim::world::powers::Cast::run"
applies = ["spell:FORCE_POWER_SHOCK", "spell:FORCE_POWER_LIGHTNING", "spell:FORCE_POWER_FORCE_STORM", "spell:FORCE_POWER_DRAIN_LIFE", "spell:FORCE_POWER_DEATH_FIELD", "spell:FORCE_POWER_DRAIN_FORCE", "spell:FORCE_POWER_IMPROVED_DRAIN_FORCE", "spell:FORCE_POWER_MASTER_DRAIN_FORCE"]

[channel.run_ms]
name = "Held Power Duration"
type = "u64"
value = 500
unit = "ms"
range = [50, 5000]
summary = """
One use of lightning or drain lasts {force.channel.run_ms:s}. Every held
power, Choke included, pays its cost for the first
{force.channel.run_ms:s}, then again every second it is held.
"""
detail = "A Choke the target resisted ends after this time."
source = "JA (I23 4.6.5); I22 C12"
see = "sim::combat::force::channel_cost"
applies = ["spell:FORCE_POWER_SHOCK", "spell:FORCE_POWER_LIGHTNING", "spell:FORCE_POWER_FORCE_STORM", "spell:FORCE_POWER_DRAIN_LIFE", "spell:FORCE_POWER_DEATH_FIELD", "spell:FORCE_POWER_WOUND", "spell:FORCE_POWER_CHOKE", "spell:FORCE_POWER_KILL", "spell:FORCE_POWER_FORCE_CRUSH", "spell:FORCE_POWER_DRAIN_FORCE", "spell:FORCE_POWER_IMPROVED_DRAIN_FORCE", "spell:FORCE_POWER_MASTER_DRAIN_FORCE"]

[channel.delay_ms]
name = "Lightning and Drain Delay"
type = "u64"
value = [3000, 1500]
unit = "ms"
labels = ["rank 1", "ranks 2 and 3"]
range = [0, 20_000]
summary = """
After lightning or drain ends, it cannot be used again for
{force.channel.delay_ms[0]:s} at rank 1 and {force.channel.delay_ms[1]:s}
at ranks 2 and 3.
"""
source = "JA (I23 4.6.5, 4.6.6)"
see = "sim::world::powers::Cast::end"
applies = ["spell:FORCE_POWER_SHOCK", "spell:FORCE_POWER_LIGHTNING", "spell:FORCE_POWER_FORCE_STORM", "spell:FORCE_POWER_DRAIN_LIFE", "spell:FORCE_POWER_DEATH_FIELD", "spell:FORCE_POWER_DRAIN_FORCE", "spell:FORCE_POWER_IMPROVED_DRAIN_FORCE", "spell:FORCE_POWER_MASTER_DRAIN_FORCE"]

[channel.line_range]
name = "Lightning and Drain Range"
value = 2048.0
unit = "units"
range = [256, 8192]
summary = "Rank 1 and 2 lightning and drain reach {force.channel.line_range:m} in line of sight."
source = "JA (I23 4.6.5)"
see = "sim::world::powers::Cast::caught"
applies = ["spell:FORCE_POWER_SHOCK", "spell:FORCE_POWER_LIGHTNING", "spell:FORCE_POWER_DRAIN_LIFE", "spell:FORCE_POWER_DRAIN_FORCE", "spell:FORCE_POWER_IMPROVED_DRAIN_FORCE"]

[channel.cone_dot]
name = "Rank 3 Cone"
value = 0.5
range = [-1, 1]
summary = """
Rank 3 lightning and drain strike everyone in a cone before the Jedi.
Cone width: {force.channel.cone_dot} (1 is a straight line, 0 is
everything in front).
"""
source = "JA (I23 4.6.5)"
see = "sim::world::powers::Cast::caught"
applies = ["spell:FORCE_POWER_FORCE_STORM", "spell:FORCE_POWER_DEATH_FIELD", "spell:FORCE_POWER_MASTER_DRAIN_FORCE"]

[channel.impact_every_ms]
name = "Scripted Strike Rate"
type = "u64"
value = 1000
unit = "ms"
range = [50, 5000]
summary = "When the power's script runs, held lightning and drain strike with it at once and then every {force.channel.impact_every_ms:s}."
source = "ours (C10 with C12's pace)"
see = "sim::world::powers::Cast::run"
applies = ["spell:FORCE_POWER_SHOCK", "spell:FORCE_POWER_LIGHTNING", "spell:FORCE_POWER_FORCE_STORM", "spell:FORCE_POWER_DRAIN_LIFE", "spell:FORCE_POWER_DEATH_FIELD"]

[push]
title = "Force Push, Force Whirlwind and Force Wave"
summary = """
Force Push (rank 1) throws the target within {force.push.aimed_reach:m}.
Force Whirlwind (rank 2), Force Wave and Force Repulsion (rank 3) throw
every enemy in front of the Jedi within {force.push.area_reach:m}. A
target is thrown at {force.push.strength:m} for each rank, less
{force.push.falloff:bare} meters per second for every meter of distance,
and at least {force.push.least_shove:m}, and leaves the ground. Force Pull
is the same throw toward the Jedi, known at Force Push's rank and costing
as much.
"""
detail = """
A target that knows Force Push and stands with a free hand resists a
throw of its own rank or lower. A target already on the ground is not
thrown, and a strong enough push frees the Jedi from a Choke.
"""
applies = ["spell:FORCE_POWER_FORCE_PUSH", "spell:FORCE_POWER_FORCE_WHIRLWIND", "spell:FORCE_POWER_FORCE_WAVE", "spell:FORCE_POWER_FORCE_REPULSION"]

[push.aimed_reach]
name = "Force Push Range"
value = 512.0
unit = "units"
range = [64, 4096]
summary = "Force Push and Force Pull reach a target up to {force.push.aimed_reach:m} away in line of sight."
source = "JA (I23 4.6.3)"
see = "sim::world::powers::Cast::push_pull"
applies = ["spell:FORCE_POWER_FORCE_PUSH"]

[push.area_reach]
name = "Area Throw Range"
value = 1024.0
unit = "units"
range = [64, 4096]
summary = """
Force Whirlwind, Force Wave and Force Repulsion reach
{force.push.area_reach:m} around the Jedi. Force Push and Force Whirlwind
choose their target within the same range.
"""
source = "JA (I23 4.6.3)"
see = "sim::world::powers::Cast::push_pull"
applies = ["spell:FORCE_POWER_FORCE_WHIRLWIND", "spell:FORCE_POWER_FORCE_WAVE", "spell:FORCE_POWER_FORCE_REPULSION"]

[push.field]
name = "Area Throw Arc"
value = [30.0, 90.0]
unit = "°"
labels = ["rank 2", "rank 3"]
range = [0, 180]
summary = """
Area throws reach targets up to {force.push.field[0]} (rank 2) or
{force.push.field[1]} (rank 3) to either side of, above or below the
Jedi's aim.
"""
source = "JA (I23 4.6.3)"
see = "sim::world::powers::Cast::push_pull"
applies = ["spell:FORCE_POWER_FORCE_WHIRLWIND", "spell:FORCE_POWER_FORCE_WAVE", "spell:FORCE_POWER_FORCE_REPULSION"]

[push.front_dot]
name = "Front Arc"
value = 0.6
range = [-1, 1]
summary = """
Area throws and area stun and fear powers affect only targets in front of
the Jedi. Arc: {force.push.front_dot} (1 is a straight line, 0 is
everything in front).
"""
source = "JA (I23 4.6.3)"
see = "sim::world::powers::Scene::around"
applies = ["spell:FORCE_POWER_FORCE_WHIRLWIND", "spell:FORCE_POWER_FORCE_WAVE", "spell:FORCE_POWER_FORCE_REPULSION", "spell:FORCE_POWER_MASS_STASIS", "spell:FORCE_POWER_HORROR", "spell:FORCE_POWER_INSANITY", "spell:FORCE_POWER_FORCE_SCREAM", "spell:FORCE_POWER_IMPROVED_FORCE_SCREAM", "spell:FORCE_POWER_MASTER_FORCE_SCREAM"]

[push.strength]
name = "Throw Strength"
value = 256.0
unit = "units/s"
range = [0, 2048]
summary = "Each rank of a throw pushes the target at {force.push.strength:m}, less the loss with distance."
source = "JA (I23 4.6.3)"
see = "sim::world::powers::Cast::push_pull"
applies = ["spell:FORCE_POWER_FORCE_PUSH", "spell:FORCE_POWER_FORCE_WHIRLWIND", "spell:FORCE_POWER_FORCE_WAVE", "spell:FORCE_POWER_FORCE_REPULSION"]

[push.falloff]
name = "Throw Falloff"
value = 0.7
range = [0, 4]
summary = "A throw loses {force.push.falloff:bare} meters per second for every meter between the Jedi and the target."
source = "JA (I23 4.6.3)"
see = "sim::world::powers::Cast::push_pull"
applies = ["spell:FORCE_POWER_FORCE_PUSH", "spell:FORCE_POWER_FORCE_WHIRLWIND", "spell:FORCE_POWER_FORCE_WAVE", "spell:FORCE_POWER_FORCE_REPULSION"]

[push.least_shove]
name = "Minimum Throw"
value = 16.0
unit = "units/s"
range = [0, 512]
summary = "A throw that reaches a target pushes it at least {force.push.least_shove:m}, however far."
source = "JA (I23 4.6.3)"
see = "sim::world::powers::Cast::push_pull"
applies = ["spell:FORCE_POWER_FORCE_PUSH", "spell:FORCE_POWER_FORCE_WHIRLWIND", "spell:FORCE_POWER_FORCE_WAVE", "spell:FORCE_POWER_FORCE_REPULSION"]

[push.least_lift]
name = "Throw Lift"
value = 128.0
unit = "units/s"
range = [0, 1024]
summary = "A thrown target leaves the ground, rising at {force.push.least_lift:m} or more."
source = "JA (I23 4.6.3)"
see = "sim::world::powers::Cast::push_pull"
applies = ["spell:FORCE_POWER_FORCE_PUSH", "spell:FORCE_POWER_FORCE_WHIRLWIND", "spell:FORCE_POWER_FORCE_WAVE", "spell:FORCE_POWER_FORCE_REPULSION"]

[push.push_hand_ms]
name = "Force Push Gesture"
type = "u64"
value = 1000
unit = "ms"
range = [0, 5000]
summary = "The Jedi's hand stays out for {force.push.push_hand_ms:s} after a push, or after resisting one with a push."
source = "JA (I23 4.3)"
see = "sim::world::powers::Cast::push_pull"
applies = ["spell:FORCE_POWER_FORCE_PUSH", "spell:FORCE_POWER_FORCE_WHIRLWIND", "spell:FORCE_POWER_FORCE_WAVE", "spell:FORCE_POWER_FORCE_REPULSION"]

[push.pull_hand_ms]
name = "Force Pull Gesture"
type = "u64"
value = 400
unit = "ms"
range = [0, 5000]
summary = "The Jedi's hand stays out for {force.push.pull_hand_ms:s} after a pull."
source = "JA (I23 4.3)"
see = "sim::world::powers::Cast::push_pull"
applies = ["spell:FORCE_POWER_FORCE_PUSH"]

[push.push_cooldown_ms]
name = "Force Push Delay"
type = "u64"
value = 1100
unit = "ms"
range = [0, 10_000]
summary = "After a push, the next push or pull cannot be used for {force.push.push_cooldown_ms:s}."
source = "JA (I23 4.3)"
see = "sim::world::powers::Cast::push_pull"
applies = ["spell:FORCE_POWER_FORCE_PUSH", "spell:FORCE_POWER_FORCE_WHIRLWIND", "spell:FORCE_POWER_FORCE_WAVE", "spell:FORCE_POWER_FORCE_REPULSION"]

[push.pull_cooldown_ms]
name = "Force Pull Delay"
type = "u64"
value = 600
unit = "ms"
range = [0, 10_000]
summary = "After a pull, the next push or pull cannot be used for {force.push.pull_cooldown_ms:s}."
source = "JA (I23 4.3)"
see = "sim::world::powers::Cast::push_pull"
applies = ["spell:FORCE_POWER_FORCE_PUSH"]

[push.countered]
name = "Resisted Throw"
value = [0.0, 0.2, 0.6]
unit = "×"
labels = ["same rank or higher", "one rank lower", "two or more ranks lower"]
range = [0, 1]
summary = """
A target that resists a throw with Force Push of its own takes
{force.push.countered[0]:bare} times its strength at the thrower's rank or
higher, {force.push.countered[1]:bare} times one rank lower and
{force.push.countered[2]:bare} times two or more ranks lower.
"""
source = "JA: countering a throw (I23 4.6.3)"
see = "sim::world::powers::Cast::countered"
applies = ["spell:FORCE_POWER_FORCE_PUSH", "spell:FORCE_POWER_FORCE_WHIRLWIND", "spell:FORCE_POWER_FORCE_WAVE", "spell:FORCE_POWER_FORCE_REPULSION"]

[push.knockdown_ms]
name = "Throw Knockdown"
type = "u64"
value = 700
unit = "ms"
range = [0, 5000]
summary = "A rank 3 throw knocks down a target of lower rank for {force.push.knockdown_ms:s}. The target gets up faster than from a blow."
source = "JA (I23 5.2)"
see = "sim::world::powers::Cast::push_pull"
applies = ["spell:FORCE_POWER_FORCE_WAVE", "spell:FORCE_POWER_FORCE_REPULSION"]

[push.knockdown_reach]
name = "Knockdown Range"
value = 64.0
unit = "units"
range = [0, 512]
summary = """
A rank 3 throw knocks down a target within {force.push.knockdown_reach:m}
for each rank by which its own Force Push falls short of rank 2. A target
with rank 2 or higher is never knocked down.
"""
source = "JA (I23 4.6.3)"
see = "sim::world::powers::Cast::push_pull"
applies = ["spell:FORCE_POWER_FORCE_WAVE", "spell:FORCE_POWER_FORCE_REPULSION"]

[push.whirlwind]
title = "Force Whirlwind Damage"
summary = """
When the power's script does not run, Force Whirlwind holds an enemy
unless it resists the Force or makes a Reflex save, and inflicts damage
equal to the Jedi's level divided by
{force.push.whirlwind.level_divisor:bare}, at least
{force.push.whirlwind.least_damage:bare}.
"""
applies = ["spell:FORCE_POWER_FORCE_WHIRLWIND"]

[push.whirlwind.level_divisor]
name = "Whirlwind Damage"
type = "u16"
value = 3
range = [1, 20]
summary = "Force Whirlwind inflicts damage equal to the Jedi's level divided by {force.push.whirlwind.level_divisor:bare}."
source = "K1's description (`spells.2da` `spelldesc`)"
see = "sim::world::powers::Cast::whirlwind"
applies = ["spell:FORCE_POWER_FORCE_WHIRLWIND"]

[push.whirlwind.least_damage]
name = "Whirlwind Minimum Damage"
type = "u16"
value = 1
unit = "HP"
range = [0, 100]
summary = "Force Whirlwind inflicts at least {force.push.whirlwind.least_damage:bare} point of damage."
source = "ours"
see = "sim::world::powers::Cast::whirlwind"
applies = ["spell:FORCE_POWER_FORCE_WHIRLWIND"]

[lightning]
title = "Shock, Force Lightning and Force Storm"
summary = """
Held. Each strike deals {force.lightning.points:bare}% of the target's
maximum vitality points, plus up to {force.lightning.extra:bare}% more,
and pushes it back. Force Storm strikes everyone within
{force.lightning.radius:m} in a cone before the Jedi. The damage is
electrical: energy shields absorb it.
"""
detail = """
Against Force Resistance of a lower rank the strike deals only
{force.lightning.points:bare}%, and against an equal or higher rank
nothing; the target gains Force points either way. When the power's
script runs, the script sets the damage.
"""
applies = ["spell:FORCE_POWER_SHOCK", "spell:FORCE_POWER_LIGHTNING", "spell:FORCE_POWER_FORCE_STORM"]

[lightning.radius]
name = "Force Storm Range"
value = 300.0
unit = "units"
range = [64, 2048]
summary = "Force Storm reaches {force.lightning.radius:m} around the Jedi, in its cone."
source = "JA (I23 4.6.5)"
see = "sim::world::powers::Cast::lightning"
applies = ["spell:FORCE_POWER_FORCE_STORM"]

[lightning.points]
name = "Lightning Damage"
value = 1
unit = "points"
range = [0, 20]
summary = "Each lightning strike deals {force.lightning.points:bare}% of the target's maximum vitality points."
source = "JA (I23 4.6.5: a random 1 or 2)"
see = "sim::world::powers::Cast::lightning"
applies = ["spell:FORCE_POWER_SHOCK", "spell:FORCE_POWER_LIGHTNING", "spell:FORCE_POWER_FORCE_STORM"]

[lightning.extra]
name = "Lightning Bonus Damage"
type = "u8"
value = 1
unit = "points"
range = [0, 20]
summary = "Each lightning strike may deal up to {force.lightning.extra:bare}% more of the target's maximum vitality points."
source = "JA (I23 4.6.5: a random 1 or 2)"
see = "sim::world::powers::Cast::lightning"
applies = ["spell:FORCE_POWER_SHOCK", "spell:FORCE_POWER_LIGHTNING", "spell:FORCE_POWER_FORCE_STORM"]

[drain]
title = "Drain Life, Death Field and Drain Force"
summary = """
Held. Each strike drains a share of the maximum Force points of every
Force user struck and heals the Jedi by the same share of his or her
maximum vitality points. Only Force points are drained, never vitality.
Death Field and Master Drain Force strike everyone within
{force.drain.radius:m} in a cone before the Jedi.
"""
detail = """
Against Force Resistance, each strike drains 1% for each rank of the drain
above the resistance's rank, and the target gains Force points. When the
power's script runs, the script sets the damage and healing.
"""
applies = ["spell:FORCE_POWER_DRAIN_LIFE", "spell:FORCE_POWER_DEATH_FIELD", "spell:FORCE_POWER_DRAIN_FORCE", "spell:FORCE_POWER_IMPROVED_DRAIN_FORCE", "spell:FORCE_POWER_MASTER_DRAIN_FORCE"]

[drain.radius]
name = "Rank 3 Drain Range"
value = 512.0
unit = "units"
range = [64, 2048]
summary = "Death Field and Master Drain Force reach {force.drain.radius:m} around the Jedi, in its cone."
source = "JA (I23 4.6.6)"
see = "sim::world::powers::Cast::drain"
applies = ["spell:FORCE_POWER_DEATH_FIELD", "spell:FORCE_POWER_MASTER_DRAIN_FORCE"]

[drain.points]
name = "Force Drained"
value = [2, 3, 4]
unit = "points"
labels = ["rank 1", "rank 2", "rank 3"]
range = [0, 50]
summary = """
Each strike drains {force.drain.points[0]:bare}% of the target's maximum
Force points at rank 1, {force.drain.points[1]:bare}% at rank 2 and
{force.drain.points[2]:bare}% at rank 3, and heals the Jedi by the same
share of his or her maximum vitality points.
"""
source = "JA (I23 4.6.6)"
see = "sim::world::powers::Cast::drain"
applies = ["spell:FORCE_POWER_DRAIN_LIFE", "spell:FORCE_POWER_DEATH_FIELD", "spell:FORCE_POWER_DRAIN_FORCE", "spell:FORCE_POWER_IMPROVED_DRAIN_FORCE", "spell:FORCE_POWER_MASTER_DRAIN_FORCE"]

[drain.caster_wait_ms]
name = "Drain Regeneration Pause"
type = "u64"
value = 500
unit = "ms"
range = [0, 5000]
summary = "Each drain strike stops the Jedi's own Force point regeneration for {force.drain.caster_wait_ms:s}."
source = "JA (I23 4.4)"
see = "sim::world::powers::Cast::drain"
applies = ["spell:FORCE_POWER_DRAIN_LIFE", "spell:FORCE_POWER_DEATH_FIELD", "spell:FORCE_POWER_DRAIN_FORCE", "spell:FORCE_POWER_IMPROVED_DRAIN_FORCE", "spell:FORCE_POWER_MASTER_DRAIN_FORCE"]

[drain.victim_wait_ms]
name = "Drained Regeneration Pause"
type = "u64"
value = 800
unit = "ms"
range = [0, 5000]
summary = "Each strike that drains Force points stops the target's Force point regeneration for {force.drain.victim_wait_ms:s}."
source = "JA (I23 4.4)"
see = "sim::world::powers::Cast::drain"
applies = ["spell:FORCE_POWER_DRAIN_LIFE", "spell:FORCE_POWER_DEATH_FIELD", "spell:FORCE_POWER_DRAIN_FORCE", "spell:FORCE_POWER_IMPROVED_DRAIN_FORCE", "spell:FORCE_POWER_MASTER_DRAIN_FORCE"]

[grip]
title = "Wound, Choke, Kill and Force Crush"
summary = """
Held. The Jedi seizes the target within {force.grip.range:m}, unless it is
under Force Resistance or already seized, and inflicts
{force.grip.points:bare}% of its maximum vitality points every
{force.grip.squeeze_every_ms:s}. At rank 1 the target is held; at rank 2
it is also lifted; at rank 3 it is carried before the Jedi. Ranks 2 and 3
crush the target once after {force.grip.crush_ms:s}. The Jedi moves at
{force.grip.gripping_scale:bare} times normal speed, the target at
{force.grip.gripped_scale[0]:bare} times ({force.grip.gripped_scale[1]:bare}
times under a speed power).
"""
detail = """
The grip ends when the target dies, moves out of range or out of sight,
leaves the Jedi's front (ranks 1 and 2), or resists it completely. When
the power's script runs, the grip lasts until the script's last damage,
and releasing it early cancels the damage still to come.
"""
applies = ["spell:FORCE_POWER_WOUND", "spell:FORCE_POWER_CHOKE", "spell:FORCE_POWER_KILL", "spell:FORCE_POWER_FORCE_CRUSH"]

[grip.range]
