range = [64, 2048]
summary = "Force Storm reaches {force.lightning.radius:m} in a cone in front of you."
source = "JA"
see = "sim::world::powers::Cast::lightning"

[lightning.points]
name = "Lightning Damage"
value = 1
unit = "points"
