value = [20_000, 25_000, 30_000]
unit = "ms"
labels = ["rank 1", "rank 2", "rank 3"]
range = [1000, 120_000]
summary = """
The power lasts, and affected players cannot see the Jedi, for
{force.mind_trick.length_ms[0]:s} at rank 1,
{force.mind_trick.length_ms[1]:s} at rank 2 and
{force.mind_trick.length_ms[2]:s} at rank 3.
"""
source = "JA (I23 4.6.11)"
see = "sim::world::powers::toggle_length"
applies = ["spell:FORCE_POWER_AFFECT_MIND", "spell:FORCE_POWER_DOMINATE"]

[mind_trick.confuse_ms]
name = "Confusion Duration"
type = "u64"
value = [5000, 10_000, 15_000]
unit = "ms"
labels = ["rank 1", "rank 2", "rank 3"]
range = [0, 60_000]
summary = """
An affected creature that is not a Force user loses track of its enemy
for {force.mind_trick.confuse_ms[0]:s} at rank 1,
{force.mind_trick.confuse_ms[1]:s} at rank 2 and
{force.mind_trick.confuse_ms[2]:s} at rank 3.
"""
source = "JA (I23 4.6.11)"
see = "sim::world::powers::Cast::trick"
applies = ["spell:FORCE_POWER_AFFECT_MIND", "spell:FORCE_POWER_DOMINATE"]

[crowd]
title = "Stun, Stasis, Fear and the Droid Powers"
summary = """
These powers affect the target within {force.crowd.reach:m}, or, for area
powers, every enemy within that range, within {force.crowd.area_field} of
