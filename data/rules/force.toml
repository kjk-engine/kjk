value = 0.5
range = [-1, 1]
summary = """
At rank 3, lightning and drain powers strike everyone in a cone in front
of the Jedi. The number {force.channel.cone_dot} sets the cone's width. A
value of 1 is a straight line, and a value of 0 covers everything in front
of the Jedi.
"""
source = "JA"
see = "sim::world::powers::Cast::caught"
applies = ["spell:FORCE_POWER_FORCE_STORM", "spell:FORCE_POWER_DEATH_FIELD", "spell:FORCE_POWER_MASTER_DRAIN_FORCE"]

[channel.impact_every_ms]
name = "Scripted Strike Interval"
type = "u64"
value = 1000
unit = "ms"
range = [50, 5000]
summary = "When the power's script runs, a lightning or drain power strikes at once, and then once every {force.channel.impact_every_ms:s} while the key stays pressed."
source = "ours"
see = "sim::world::powers::Cast::run"
applies = ["spell:FORCE_POWER_SHOCK", "spell:FORCE_POWER_LIGHTNING", "spell:FORCE_POWER_FORCE_STORM", "spell:FORCE_POWER_DRAIN_LIFE", "spell:FORCE_POWER_DEATH_FIELD"]

[push]
title = "Force Push, Force Whirlwind and Force Wave"
summary = """
Force Push (rank 1) throws one target up to {force.push.aimed_reach:m}
away. Force Whirlwind (rank 2), Force Wave and Force Repulsion (rank 3)
throw every enemy in front of the Jedi up to {force.push.area_reach:m}
away. Each rank of the power throws the target at {force.push.strength:m}.
The throw is {force.push.falloff:bare} meters per second slower for every
meter between the Jedi and the target, but never slower than
{force.push.least_shove:m}. A thrown target leaves the ground. Force Pull
throws the target toward the Jedi in the same way. A character knows Force
Pull at the same rank as Force Push, and it costs the same Force points.
"""
detail = """
A target that knows Force Push and stands on the ground with a free hand
pushes back. It resists a throw of its own rank or lower completely. A
target that is moving counts as one rank lower. A target that is already
knocked down is not thrown. A Jedi seized by an enemy's grip breaks free
by pushing that enemy with a Force Push of the grip's rank or higher.
"""
applies = ["spell:FORCE_POWER_FORCE_PUSH", "spell:FORCE_POWER_FORCE_WHIRLWIND", "spell:FORCE_POWER_FORCE_WAVE", "spell:FORCE_POWER_FORCE_REPULSION"]

