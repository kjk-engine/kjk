[rage]
title = "Fury"
summary = """
A toggled power. The character moves {force.rage.speed:bare} times as fast
and attacks and fires in {force.rage.refire:bare} times the normal time.
Damage dealt to the character by another character is divided by the rank
+ 1. Fury costs {force.rage.hp:bare}% of maximum vitality points at
intervals and ends at {force.rage.floor_hp:bare} vitality point; it cannot
be activated with less than {force.rage.least:bare}% of maximum vitality
points. For {force.rage.recover_ms:s} afterward, the character moves at
{force.rage.recover_speed:bare} times normal speed, attacks and fires in
{force.rage.recover_refire:bare} times the normal time and cannot use
Fury.
"""
detail = """
A hit can still kill the character. When the power's script runs, Fury
acts as its description says, and its kills add damage up to
+{force_effects.fury.most:bare}.
"""
applies = ["spell:FORCE_POWER_FURY", "spell:FORCE_POWER_IMPROVED_FURY", "spell:FORCE_POWER_MASTER_FURY"]

[rage.length_ms]
name = "Fury Duration"
type = "u64"
value = [8000, 14_000, 20_000]
unit = "ms"
labels = ["Fury", "Improved Fury", "Master Fury"]
range = [1000, 120_000]
summary = """
Fury lasts {force.rage.length_ms[0]:s}, Improved Fury
{force.rage.length_ms[1]:s} and Master Fury {force.rage.length_ms[2]:s}.
"""
source = "JA (I23 4.6.9)"
see = "sim::world::powers::toggle_length"
applies = ["spell:FORCE_POWER_FURY", "spell:FORCE_POWER_IMPROVED_FURY", "spell:FORCE_POWER_MASTER_FURY"]

