[absorb.throw_gain]
name = "Force Gained from Throws"
value = 6
unit = "points"
range = [0, 50]
summary = "The Jedi gains {force.absorb.throw_gain:bare}% of his or her maximum Force points from each push or pull, for each rank of the power."
source = "JA (I23 4.5)"
see = "sim::world::powers::Cast::push_pull"
applies = ["spell:FORCE_POWER_RESIST_FORCE", "spell:FORCE_POWER_FORCE_IMMUNITY"]

[absorb.tick_gain]
name = "Force Gained from Strikes"
value = 1
unit = "points"
range = [0, 20]
summary = "The Jedi gains {force.absorb.tick_gain:bare}% of his or her maximum Force points from each lightning or drain strike."
