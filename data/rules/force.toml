type = "i64"
value = [1000, 500, 250]
unit = "‰"
labels = ["Force Aura", "Force Shield", "Force Armor"]
range = [0, 4000]
summary = """
Each 1% of maximum vitality points counted costs the Jedi
{force.protect.rate[0]:pct} of 1% of maximum Force points under Force
