value = 1.0
unit = "m"
range = [0, 50]
summary = "When a path becomes shorter than {force.routines.destination_least_m:bare} meters, the creature stops trying and stays where it stands."
source = "TSL's executable"
see = "sim::script::force::random_destination"

[routines.camouflage_stealth]
