range = [0, 5]
summary = "Regenerate Force Points adds {force.tsl_regeneration.force_feat_rate:bare} to the rate at which Force points regenerate."
source = "TSL's executable (`HandleFPRegeneration`)"
see = "sim::combat::force::regenerate_tsl"
applies = ["feat:REGENERATE_FORCE_POINTS"]

