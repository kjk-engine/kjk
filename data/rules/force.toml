Force Resistance and Force Immunity grant a Force resistance of
{force.rolls.resistance_base:bare} + {force.rolls.resistance_per_tier:bare}
per rank + the character's level.
"""
source = "K1's descriptions of Resist Force and Force Immunity"
see = "sim::combat::force::resistance"
applies = ["spell:FORCE_POWER_RESIST_FORCE", "spell:FORCE_POWER_FORCE_IMMUNITY"]

[rolls.resistance_per_tier]
