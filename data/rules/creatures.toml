[chapter]
title = "Beasts and Fists"
order = 53
summary = """
A beast with no weapon attacks once a round with its claws, bite or gore. A
humanoid with no weapon fights with its fists.
"""

[beasts]
title = "Beasts"
summary = """
A creature with no humanoid skeleton (beasts, droids and many aliens) and
no weapon in hand attacks once a round when its target is within reach. The
blow lands at the point in its attack animation where it strikes, if the
target is still in reach, and deals the damage of its creature weapon.
"""
detail = """
A creature that is flinching, knocked down or stunned loses its blow. Such
a creature holding a weapon, such as a Gamorrean's axe, fights as a
humanoid does.
"""
applies = ["kind:creature"]

[fists]
title = "Fists"
summary = """
A humanoid with no weapon in hand punches, left then right, once a round.
Each punch deals 1-3 bludgeoning damage to an opponent in front of the
attacker within {creatures.fists.reach_m:bare} meters of its body.
"""
detail = """
With friendly fire off, a punch passes through party members. Fists can
also bash open doors and containers.
"""
applies = ["kind:unarmed"]

[fists.reach_m]
name = "Punch Reach"
type = "f32"
value = 0.5
unit = "m"
range = [0.0, 3.0]
summary = "A punch reaches {creatures.fists.reach_m:bare} meters past the attacker's body."
source = "ours (about JA's punch)"
see = "sim::world::strikes::fists"
applies = ["kind:unarmed"]

[fists.human_space_m]
name = "Humanoid Body Size"
type = "f32"
value = 0.35
unit = "m"
range = [0.1, 2.0]
summary = "A humanoid's body extends {creatures.fists.human_space_m:bare} meters from its center when its appearance gives no size."
source = "K1's appearance.2da"
see = "sim::world::strikes::humanoid_space"
applies = ["kind:unarmed", "kind:player"]

[fists.front]
name = "Punch Arc"
type = "f32"
value = 0.707
range = [-1.0, 1.0]
summary = "A punch strikes only an opponent in front of the attacker, where the cosine of the angle from its facing is at least {creatures.fists.front:bare}."
source = "ours"
see = "sim::world::strikes::in_front"
applies = ["kind:unarmed"]

[ground]
title = "Leaning with the floor"
summary = """
A droid or beast whose appearance says so (T3-M4, the astromechs, the Mark
Two and Four droids, banthas, dewbacks and rontos) leans with the floor
under it: on a ramp it tilts to the slope and stands on it, instead of
staying upright as if the floor were flat.
"""
detail = """
The lean is how it is drawn; where it walks and what it touches are the
same as upright. It follows the floor under its middle, eased over
{creatures.ground.ease_ms}, and goes back upright where no walkable floor
lies within {creatures.ground.reach_m} below its feet.
"""
applies = ["kind:creature"]

[ground.ease_ms]
name = "Lean Ease"
type = "f32"
value = 120.0
unit = "ms"
range = [1.0, 2000.0]
summary = "A leaning body takes about {creatures.ground.ease_ms} to settle to a new slope."
source = "ours [verify against K1]"
see = "game::ground_lean::Lean::stand"
applies = ["kind:creature"]

[ground.reach_m]
name = "Lean Floor Reach"
type = "f32"
value = 0.75
unit = "m"
range = [0.0, 3.0]
summary = "A leaning body looks for the floor under its middle up to {creatures.ground.reach_m} below its feet."
detail = "Enough for a body's box resting on the high side of a steep ramp, its middle over the slope well below."
source = "ours"
see = "game::ground_lean::floor_under"
applies = ["kind:creature"]

[ground.level_normal_z]
name = "Level Floor"
type = "f32"
value = 0.999
range = [0.0, 1.0]
summary = "A floor whose slope's cosine is at least {creatures.ground.level_normal_z:bare} counts as level: a leaning body stands where its box does, not on the floor under its middle, so it does not sink off a ledge."
source = "ours"
see = "game::ground_lean::Lean::stand"
applies = ["kind:creature"]
