[chapter]
title = "Co-op Party"
order = 43
summary = """
Each player past the first controls a party member. The party enters
combat together, pauses together and leaves an area together.
"""

[seats]
title = "Party Members by Player"
summary = """
A player loses control of a party member that leaves the party, dies or
becomes the leader, or when the player drops. A player with no character
then takes the first party member no one controls, a conscious one before
an unconscious one. A player who drops keeps a reserved party member for
{party.seats.keep_ms:s}; meanwhile it fights on its own and no other player
can take it.
"""
applies = ["kind:companion"]

[seats.keep_ms]
name = "Reserved Party Member"
type = "u64"
value = 60_000
unit = "ms"
range = [0, 3600000]
summary = "A party member stays reserved for its player for {party.seats.keep_ms:s} after that player's last command."
source = "ours"
see = "sim::world::drivers::assign"
applies = ["kind:companion"]

[exits]
title = "Leaving an Area"
summary = """
Walking into an exit asks the party to leave. A player is ready after
walking into or using the exit, standing at it, or choosing Ready; a player
with no character is always ready. The party leaves when every player is
ready, or when the host forces it after {party.exits.force_after_ms:s}. The
party cannot leave during combat.
"""

[exits.force_after_ms]
name = "Force Exit"
type = "u64"
value = 5000
unit = "ms"
range = [0, 600000]
summary = "The host may force the party to leave {party.exits.force_after_ms:s} after a player asks to leave."
source = "ours"
see = "sim::world::party::ready"

[switch]
title = "Playing Another Character"
summary = """
When a scene has the player play a party member in their place, the
player's own character waits. In K1 it stays where it is, standing in the
area as a character nobody plays; in TSL it leaves the area and comes back
where the character played stands when the scene switches back.
"""

[switch.leaves_area_k1]
name = "Player Leaves the Area (K1)"
value = false
summary = "Whether, in K1, the player's own character leaves the area while the player plays another: {party.switch.leaves_area_k1}."
source = "K1's Leviathan scenes: the player waits in the torture room's cage the one who escapes opens (`k_plev_freeparty`) [verify in K1's executable]"
see = "sim::world::switch::leaves_area"

[switch.leaves_area_tsl]
name = "Player Leaves the Area (TSL)"
value = true
summary = "Whether, in TSL, the player's own character leaves the area while the player plays another: {party.switch.leaves_area_tsl}."
source = "TSL's executable (at a switch it saves the player's creature and deletes it, and makes it again on the way back)"
see = "sim::world::switch::leaves_area"

[return_to_ship]
title = "Returning to the Ebon Hawk"
summary = """
The map's return button takes the party to the Ebon Hawk and back, after a
question. It refuses where the area keeps the party from leaving, while a
party member stands more than {party.return_to_ship.together_m:bare} meters
from the leader, and during combat.
"""
applies = ["kind:companion"]

[return_to_ship.together_m]
name = "Party Together"
type = "f32"
value = 30.0
unit = "m"
range = [0.0, 1000.0]
summary = "The party may return to the Ebon Hawk only with every party member within {party.return_to_ship.together_m:bare} meters of the leader."
source = "K1's executable (the map page's check, the distance squared against 900)"
see = "sim::snapshot::Snapshot::transit_refusal"
applies = ["kind:companion"]
