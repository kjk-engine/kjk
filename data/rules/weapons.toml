[chapter]
title = "Weapons"
order = 11
summary = """
Each kind of ranged weapon has its own rate of fire, bolt speed and
spread. A bolt deals the damage of the weapon that fired it, with that
weapon's damage type and critical threat range.
"""
detail = """
In kjk, the damage of each hit depends on how fast the weapon fires. A
fast weapon deals small hits, and a slow weapon deals large ones. The
alternate fire button uses a ranged feat the character knows, such as
Rapid Shot, Power Blast or Sniper Shot. A character who knows none of
these feats fires normally with the alternate fire button.
"""

[bolt]
title = "Blaster Bolts"
summary = """
Unless a weapon's entry says otherwise, each shot fires one bolt. The bolt
flies in a straight line from a point just below and to the right of the
character's eyes. A lightsaber can block, deflect or reflect it.
"""
detail = """
A player's shot flies toward the center of the screen. An enemy's shot
flies along its line of sight.
"""

[bolt.muzzle]
name = "Muzzle"
value = [12.0, 6.0, -6.0]
labels = ["forward", "right", "up"]
unit = "units"
summary = "A bolt leaves the gun {weapons.bolt.muzzle[0]:m} in front of the character's eyes, {weapons.bolt.muzzle[1]:m} to the right and {weapons.bolt.muzzle[2]:m} up."
source = "JA: muzzle points"
see = "sim::combat::weapons::primary"

[bolt.spread]
name = "Spread"
value = 0.0
unit = "°"
range = [0.0, 45.0]
summary = "A bolt may stray from the aim by up to {weapons.bolt.spread:bare} degrees at random, in any direction."
source = "JA"
see = "sim::combat::weapons::primary"

[bolt.shards]
name = "Bolts per Shot"
type = "u8"
value = 1
range = [1, 20]
summary = "Each shot fires {weapons.bolt.shards} bolt."
source = "JA"
see = "sim::combat::weapons::primary"

[bolt.half_size]
name = "Bolt Width"
value = 0.0
unit = "units"
range = [0.0, 16.0]
summary = "A bolt hits anything within {weapons.bolt.half_size:m} of its path."
source = "JA"
see = "sim::combat::weapons::primary"

[bolt.blockable]
name = "Deflectable"
value = true
summary = "A blaster bolt {weapons.bolt.blockable:can} be deflected by a lightsaber."
source = "JA"
see = "sim::combat::weapons::primary"
applies = ["kind:lightsaber"]

[pistol]
title = "Blaster Pistols"
summary = "Blaster pistols, heavy blasters and hold-out blasters fire one slow, powerful shot at a time."
applies = ["kind:pistol", "baseitem:Blaster_Pistol", "baseitem:Heavy_Blaster", "baseitem:Hold_Out_Blaster"]

[pistol.refire_ms]
name = "Rate of Fire"
type = "u32"
value = 800
unit = "ms"
range = [50, 5000]
summary = "A blaster pistol fires once every {weapons.pistol.refire_ms:s}."
source = "JA (the Bryar's fire interval)"
see = "sim::combat::weapons::primary"

[pistol.pair_gap]
name = "Two Pistols Taking Turns"
type = "u32"
value = 500
unit = "‰"
range = [0, 1000]
summary = "A character with a pistol in each hand fires them in turn, right hand first. After one pistol fires, the other must wait at least {weapons.pistol.pair_gap:pct} of its own time between shots. With the trigger held, the pair therefore fires twice as often as a single pistol. During a Rapid Shot, each left-hand shot follows the right-hand shot after {weapons.pistol.pair_gap:pct} of the usual gap between burst shots."
detail = "In KOTOR, a character with two pistols attacks once with each hand every round."
source = "ours, after KOTOR's off hand's attack"
see = "sim::combat::pair::pull"

[pistol.pair_aim]
name = "Two Pistols' Aim"
value = 3
unit = "points"
range = [0, 10]
summary = "A character with a pistol in each hand gains +{weapons.pistol.pair_aim:bare} to hit with each pistol. This bonus offsets part of the two-weapon fighting penalties."
detail = "In playtests, two pistols missed too often under KOTOR's two-weapon fighting penalties alone. The owner asked for about 15% more hits. Each point of attack bonus adds 5% to the chance to hit, because the attack roll is a d20."
source = "the owner's playtest (2026-10-26)"
see = "sim::combat::passive::hand_attack"

[pistol.speed]
name = "Bolt Speed"
value = 1600.0
unit = "units/s"
range = [100.0, 10000.0]
summary = "A blaster pistol's bolt flies at {weapons.pistol.speed:m}."
source = "JA: projectile speed"
see = "sim::combat::weapons::primary"

