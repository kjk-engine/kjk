[chapter]
title = "Weapons"
order = 11
summary = """
Each kind of ranged weapon fires bolts at its own rate, speed and spread.
A bolt deals the weapon's own damage, with its own critical threat range
and damage type.
"""
detail = """
A weapon's rate of fire also sets the size of each hit: a fast weapon deals
light hits, a slow weapon heavy ones. The alternate fire of a ranged weapon
is a feat attack.
"""

[bolt]
title = "Blaster Bolts"
summary = """
Unless noted otherwise, a shot fires one bolt, which flies straight from
just below and to the right of the eye. A lightsaber can block, deflect or
reflect it.
"""
detail = """
A player's shot flies toward the center of the screen; a creature's along
its line of sight.
"""

[bolt.muzzle]
name = "Muzzle"
value = [12.0, 6.0, -6.0]
labels = ["forward", "right", "up"]
unit = "units"
summary = "A bolt leaves the gun {weapons.bolt.muzzle[0]:m} forward of the eye, {weapons.bolt.muzzle[1]:m} to the right and {weapons.bolt.muzzle[2]:m} up."
source = "JA: muzzle points"
see = "sim::combat::weapons::primary"

[bolt.spread]
name = "Spread"
value = 0.0
unit = "°"
range = [0.0, 45.0]
summary = "A bolt may stray up to {weapons.bolt.spread:bare} degrees at random, up or down and left or right."
source = "JA"
see = "sim::combat::weapons::primary"

[bolt.shards]
name = "Bolts per Shot"
type = "u8"
value = 1
range = [1, 20]
summary = "Bolts per shot: {weapons.bolt.shards}."
source = "JA"
see = "sim::combat::weapons::primary"

[bolt.half_size]
name = "Bolt Width"
value = 0.0
unit = "units"
range = [0.0, 16.0]
summary = "A bolt strikes anything within {weapons.bolt.half_size:m} of its path."
source = "JA"
see = "sim::combat::weapons::primary"

[bolt.blockable]
name = "Deflectable"
value = true
summary = "A blaster bolt {weapons.bolt.blockable:can} be deflected by a lightsaber."
source = "JA"
see = "sim::combat::weapons::primary"
applies = ["kind:lightsaber"]

[pistol]
title = "Blaster Pistols"
summary = "Blaster pistols, heavy blasters and hold-out blasters fire slow, single, heavy shots. The alternate fire is Power Blast."
applies = ["kind:pistol", "baseitem:Blaster_Pistol", "baseitem:Heavy_Blaster", "baseitem:Hold_Out_Blaster"]

[pistol.refire_ms]
name = "Rate of Fire"
type = "u32"
value = 800
unit = "ms"
range = [50, 5000]
summary = "A blaster pistol fires once every {weapons.pistol.refire_ms:s}."
source = "JA (the Bryar's fire interval)"
see = "sim::combat::weapons::primary"

[pistol.pair_gap]
name = "Two Pistols' Turns"
type = "u32"
value = 500
unit = "‰"
range = [0, 1000]
summary = "With a pistol in each hand the guns take turns, neither firing within {weapons.pistol.pair_gap:pct} of its refire after the other, and a Rapid Shot's left shots leave that share of a burst's gap after each right one."
detail = "KOTOR's two pistols attack with each hand in a round."
source = "ours, after KOTOR's off hand's attack"
see = "sim::combat::pair::pull"

[pistol.pair_aim]
name = "Two Pistols' Aim"
value = 3
unit = "points"
range = [0, 10]
summary = "With a pistol in each hand, each gun gains {weapons.pistol.pair_aim:bare} to hit against the two-weapon penalties."
detail = "Two pistols fire as one aimed pair, not two blades swung at once: the owner's playtest found the pair too inaccurate under KOTOR's two-weapon penalties alone, and asked for about 15% more hits (each point is 5% on the d20)."
source = "the owner's playtest (2026-10-26)"
see = "sim::combat::passive::hand_attack"

