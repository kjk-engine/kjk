[bloom]
title = "Bloom and Kick"
summary = """
A player's blaster becomes less accurate the longer it keeps firing. This
growing inaccuracy is called bloom. Each shot also kicks the aim up a
little. When the player stops firing, the bloom shrinks and the aim
settles back. The gap in the crosshair shows how far the next shot may
stray.
"""
detail = """
The first shot after a pause flies straight at the aim, unless the weapon
always spreads its shots. Characters that no player controls use their
own accuracy rules instead (see AI, Shot Spread).
"""

[bloom.stance]
name = "Bloom by Stance"
value = [2.5, 0.25, 0.6]
labels = ["in the air", "aiming", "crouched"]
unit = "×"
summary = "A shot's spread is multiplied by {weapons.bloom.stance[0]:bare} while the character is in the air. It is multiplied by {weapons.bloom.stance[1]:bare} while the character aims a Sniper Shot, and by {weapons.bloom.stance[2]:bare} while the character is crouched."
source = "kjk, after modern shooters' feel"
see = "sim::combat::bloom::cone"

[bloom.pace_spread]
name = "Spread on the Move"
value = [0.4, 1.0]
labels = ["walking", "running"]
unit = "°"
range = [0.0, 10.0]
summary = "A walking character's shots spread {weapons.bloom.pace_spread[0]:bare} degrees more, and a running character's shots spread {weapons.bloom.pace_spread[1]:bare} degrees more. This applies even when the character has not fired for a while."
source = "kjk, after modern shooters' feel"
see = "sim::combat::bloom::cone"

[bloom.kick_limit]
name = "Kick Limit"
value = [4.0, 12.0, 80.0]
labels = ["most", "recovery per second", "recovery after (ms)"]
unit = "°"
summary = "Kick raises the aim by at most {weapons.bloom.kick_limit[0]:bare} degrees. Once {weapons.bloom.kick_limit[2]:bare} ms pass without a shot, the aim settles back by {weapons.bloom.kick_limit[1]:bare} degrees per second."
source = "kjk, after modern shooters' feel"
see = "sim::combat::bloom::on_shot"

[pistol.bloom]
name = "Bloom"
value = [0.6, 2.5, 8.0]
labels = ["per shot", "most", "fall per second"]
unit = "°"
summary = "Each shot of a blaster pistol adds {weapons.pistol.bloom[0]:bare} degrees of spread, up to {weapons.pistol.bloom[1]:bare} degrees. When the character stops firing, the spread shrinks by {weapons.pistol.bloom[2]:bare} degrees per second."
source = "kjk, after modern shooters' feel"
see = "sim::combat::bloom::tune"

[pistol.bloom_rest_ms]
