[chapter]
title = "Weapons in Hand"
order = 71
summary = """
This chapter covers drawing, putting away and switching weapons. It also
covers getting up after a knockdown, and the saber moves that move the
character or slow it down. A character draws its weapon only in combat. The
character puts the weapon away a short time after its last attack.
"""

[change]
title = "Switching Weapons"
summary = """
Switching weapons takes two steps. First the character lowers the weapon in
hand, which takes {weapons_in_hand.change.drop_ms:s}. Then the character
raises the next weapon, which takes {weapons_in_hand.change.raise_ms:s}. The
character cannot attack during a switch. A character who puts a blaster
away lowers it in the same way. A character who attacks with a blaster that
is put away raises it first, and then fires.
"""
applies = ["kind:weapon", "kind:blaster"]

[change.drop_ms]
name = "Lower Weapon"
value = 200
unit = "ms"
range = [0, 2000]
summary = "A character takes {weapons_in_hand.change.drop_ms:s} to lower a weapon, when switching weapons or putting the weapon away."
source = "JA: weapon changes"
see = "sim::motion::Move::lower_weapon"

[change.raise_ms]
name = "Raise Weapon"
value = 250
unit = "ms"
range = [0, 2000]
summary = "A character takes {weapons_in_hand.change.raise_ms:s} to raise a weapon. This happens after a switch, after getting up, and when the character attacks with a blaster that is put away."
source = "JA: weapon changes"
see = "sim::motion::Move::raise_weapon"

[look]
title = "How a Weapon Looks"
summary = """
A weapon is always drawn solid. Some weapon textures are partly transparent
but come with no instructions for how to use the transparency. kjk draws
these textures solid instead of see-through.
"""
applies = ["kind:weapon"]

[look.solid]
name = "Solid Weapons"
value = true
summary = "A weapon texture that is partly transparent, with no instructions for the transparency, {weapons_in_hand.look.solid:can} be drawn solid instead of see-through."
detail = """
This is kjk's choice, not KOTOR's. The original game blends such a texture
over whatever lies behind the weapon. A texture can come with a small text
file (a TXI file) that tells the game the transparency is a shine mask.
Some texture mods, such as High Quality Blasters, leave out these files. The
world then showed through the guns of these mods. A texture whose TXI file
names an environment map, a bump map, a blending mode or a decal keeps its
own look. kjk changes only weapon models.
"""
source = "the owner's call, 2026-11-07 (issue 171)"
see = "game::material::weapon_surface"

[knockdown]
title = "Getting Up"
summary = """
A character who is knocked down lies on the ground until the knockdown
ends. After that, the player can press [Strafe left], [Strafe right],
[Forward] or [Backward] to roll to the character's feet in that direction.
The player can instead press [Jump] to get up with the Force. A character
with Force Jump at level 2 or higher springs up acrobatically instead. A
character whose player presses nothing gets up on its own
{weapons_in_hand.knockdown.lie_ms:s} after the knockdown ends. The character
raises its weapon once it stands.
"""
applies = ["kind:player", "kind:creature", "kind:force"]

[knockdown.lie_ms]
name = "Time Down"
type = "u64"
value = 4000
unit = "ms"
range = [0, 30000]
summary = "A knocked-down character gets up on its own {weapons_in_hand.knockdown.lie_ms:s} after the knockdown ends."
source = "JA: Force power upkeep"
see = "sim::motion::Move::hand_state"

[knockdown.force_getup_ms]
name = "Force Get-Up"
type = "u64"
value = 500
unit = "ms"
range = [0, 5000]
summary = "Getting up with the Force, by pressing [Jump], takes {weapons_in_hand.knockdown.force_getup_ms:s}. An acrobatic get-up takes the same time."
source = "JA: Force power upkeep"
see = "sim::motion::Move::hand_state"

[knockdown.plain_getup_ms]
name = "Normal Get-Up"
type = "u64"
value = 1000
unit = "ms"
range = [0, 5000]
summary = "A character who gets up on its own takes {weapons_in_hand.knockdown.plain_getup_ms:s} to stand."
source = "JA: Force power upkeep"
see = "sim::motion::Move::hand_state"

[knockdown.getup_lift]
name = "Acrobatic Get-Up"
value = 300.0
unit = "units/s"
range = [0.0, 1000.0]
summary = "In an acrobatic get-up, the character springs upward at {weapons_in_hand.knockdown.getup_lift:m}."
source = "JA: Force power upkeep"
see = "sim::motion::Move::hand_state"

[saber_speed]
title = "Movement while Attacking"
summary = """
A character who attacks with a lightsaber or a melee weapon moves slower
than normal. How much slower depends on the saber style and on the attack.
The character is slowest while backing off, faster in a spinning attack, and
fastest while attacking forward. In the strong style, the character also
moves slower between attacks.
"""
applies = ["kind:lightsaber", "kind:melee"]

[saber_speed.backing_off]
name = "Attacking while Backing Off"
value = [0.75, 0.6, 0.45]
labels = ["fast", "medium, dual and staff", "strong"]
unit = "×"
range = [0.0, 1.0]
summary = "A character who attacks while the player keeps [Backward] pressed moves at {weapons_in_hand.saber_speed.backing_off[0]:bare} times normal speed in the fast style. The character moves at {weapons_in_hand.saber_speed.backing_off[1]:bare} times normal speed in the medium, dual and staff styles, and at {weapons_in_hand.saber_speed.backing_off[2]:bare} times normal speed in the strong style."
source = "JA: movement speed"
see = "sim::motion::Move::saber_speed"

[saber_speed.spinning]
name = "Spinning Attack Movement"
value = [0.5, 0.3]
labels = ["other styles", "strong"]
unit = "×"
range = [0.0, 1.0]
summary = "A character in a spinning attack moves at {weapons_in_hand.saber_speed.spinning[0]:bare} times normal speed. In the strong style, the character moves at {weapons_in_hand.saber_speed.spinning[1]:bare} times normal speed."
source = "JA: movement speed"
see = "sim::motion::Move::saber_speed"

[saber_speed.attacking]
name = "Attacking Movement"
value = [0.85, 0.55]
labels = ["medium, dual and staff", "strong"]
unit = "×"
range = [0.0, 1.0]
summary = "A character who attacks with a blade moves at {weapons_in_hand.saber_speed.attacking[0]:bare} times normal speed in the medium, dual and staff styles, and at {weapons_in_hand.saber_speed.attacking[1]:bare} times normal speed in the strong style. The fast style does not slow the character."
source = "JA: movement speed"
see = "sim::motion::Move::saber_speed"

[saber_speed.strong_transition]
name = "Strong Style Recovery Movement"
value = [0.6, 0.4]
labels = ["going forward", "backing off"]
unit = "×"
range = [0.0, 1.0]
summary = "Between attacks in the strong style, a character moves at {weapons_in_hand.saber_speed.strong_transition[0]:bare} times normal speed going forward, and at {weapons_in_hand.saber_speed.strong_transition[1]:bare} times normal speed backing off."
source = "JA: movement speed"
see = "sim::motion::Move::saber_speed"

[moves]
title = "Saber Moves that Move the Character"
summary = """
Some saber moves take control of the character's movement while they play.
The character stands still during a back stab, the stab of a flip, and a
kick. Before a stab down, the character creeps forward onto the enemy lying
on the ground. A lunge pushes the character forward. A kata makes the
character step or hop. A jump attack or a butterfly throws the character
through the air. Each time below counts from the start of the move or back
from its end, as the rule says.
"""
applies = ["kind:lightsaber"]

[moves.creep]
name = "Creep Speed"
type = "i8"
value = 64
range = [0, 127]
summary = "A creeping character moves forward as if [Forward] were pressed {weapons_in_hand.moves.creep} out of 127, where 127 is a full press. A character creeps before a stab down, and in the double-bladed kata before its hop."
source = "JA: attack chains"
see = "sim::motion::Move::weapon_keys"

[moves.stab_down_still]
name = "Stab Down"
value = 800
unit = "ms"
range = [0, 5000]
summary = "A character in a stab down creeps forward until {weapons_in_hand.moves.stab_down_still:s} before the move ends. Then the character stands still for the stab."
source = "JA: the movement step"
see = "sim::motion::Move::weapon_keys"

[moves.lunge_drive]
name = "Lunge"
value = 500
unit = "ms"
range = [0, 5000]
summary = "A lunge pushes the character forward at full speed until {weapons_in_hand.moves.lunge_drive:s} before the lunge ends."
source = "JA: the movement step"
see = "sim::motion::Move::weapon_keys"

[moves.flip_turn]
name = "Flip Turn"
value = [900, 1600]
labels = ["from", "to"]
unit = "ms"
range = [0, 5000]
summary = """
A flip over an enemy turns the character around in mid-air at
{weapons_in_hand.moves.flip_turn_rate}. The turn lasts from
{weapons_in_hand.moves.flip_turn[1]:s} to {weapons_in_hand.moves.flip_turn[0]:s}
before the flip ends.
"""
source = "JA: the movement step"
see = "sim::motion::Move::weapon_keys"

[moves.flip_turn_rate]
name = "Flip Turn Rate"
value = 240.0
unit = "°/s"
range = [0.0, 1000.0]
summary = "A flip over an enemy turns the character around at {weapons_in_hand.moves.flip_turn_rate}."
source = "JA: the movement step"
see = "sim::motion::Move::weapon_keys"

[moves.hop]
name = "Hop"
value = 250.0
unit = "units/s"
range = [0.0, 1000.0]
summary = "The double-bladed kata, the dual jump attack, the double-bladed jump attacks and the right butterfly make the character hop upward at {weapons_in_hand.moves.hop:m}."
source = "JA: attack chains"
see = "sim::motion::Move::special_move_keys"

[moves.soulcal_roll]
name = "Double-Bladed Kata Roll"
value = [250, 700]
labels = ["from", "to"]
unit = "ms"
range = [0, 5000]
summary = "The double-bladed kata ends with a forward roll, as if the player pressed [Crouch]. The roll lasts from {weapons_in_hand.moves.soulcal_roll[1]:s} to {weapons_in_hand.moves.soulcal_roll[0]:s} before the kata ends."
source = "JA: attack chains"
see = "sim::motion::Move::kata_keys"

[moves.soulcal_creep]
