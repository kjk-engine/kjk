[chapter]
title = "Falling and Reviving"
order = 54
summary = """
A party member whose vitality points drop to 0 falls unconscious instead of
dying. It gets up when combat ends, or sooner if another party member
revives it. If every member of the party falls unconscious, the game is
over.
"""
detail = """
Every other creature dies at 0 vitality points. An unconscious character
cannot act. Enemies cannot attack it, and allies cannot heal it. No one
gains experience when a party member falls unconscious.
"""

[rising]
title = "Getting Up"
summary = """
When combat ends, an unconscious party member gets up if it has been down
for at least {downed.rising.down_min_ms:s}. It gets up with at least
{downed.rising.rise_hp:bare} hundredths of a vitality point. A character
that leaves the party while unconscious gets up at once.
"""
applies = ["kind:player", "kind:companion"]

[rising.down_min_ms]
name = "Time Unconscious"
type = "u64"
value = 2000
unit = "ms"
range = [0, 60000]
summary = "An unconscious party member stays down for at least {downed.rising.down_min_ms:s} before it can get up."
source = "ours"
see = "sim::world::falls::falls"
applies = ["kind:player", "kind:companion"]

[rising.rise_hp]
name = "Vitality on Rising"
type = "i32"
value = 100
range = [1, 100000]
summary = "A party member gets up with at least {downed.rising.rise_hp:bare} hundredths of a vitality point. One hundred hundredths make 1 vitality point."
source = "K1 [verify]"
see = "sim::world::falls::stand"
applies = ["kind:player", "kind:companion"]

[revive]
title = "Reviving"
summary = """
A party member can revive an unconscious ally by standing still beside it
and holding [Use]. A revive takes {downed.revive.ms:s}. Each rank the
reviver has in Treat Injury takes {downed.revive.rank_ms:s} off that time.
When the unconscious ally is a droid, the reviver's ranks in Repair count
instead. A revive never takes less than {downed.revive.least_ms:s}.
"""
detail = """
The revive stops if the reviver moves, attacks, is stunned, is knocked down
or is hit. Party members under computer control do not revive others.
"""
applies = ["skill:TreatInjury", "skill:Repair", "kind:player", "kind:companion"]

[revive.ms]
name = "Revive Time"
type = "u32"
value = 3000
unit = "ms"
range = [0, 60000]
summary = "A character with no ranks in Treat Injury revives an ally in {downed.revive.ms:s}."
source = "ours (\"a few seconds\")"
see = "sim::world::falls::revive_ms"
applies = ["kind:player", "kind:companion"]

[revive.rank_ms]
name = "Revive Time per Rank"
type = "u32"
value = 100
unit = "ms"
range = [0, 1000]
summary = "Each rank in Treat Injury takes {downed.revive.rank_ms:s} off the time a revive takes. When the unconscious ally is a droid, ranks in Repair count instead."
source = "ours (as `combat::items::heal_ms`)"
see = "sim::world::falls::revive_ms"
applies = ["skill:TreatInjury", "skill:Repair"]

[revive.least_ms]
name = "Shortest Revive"
type = "u32"
value = 1000
unit = "ms"
range = [0, 60000]
summary = "A revive always takes at least {downed.revive.least_ms:s}."
source = "ours"
see = "sim::world::falls::revive_ms"
applies = ["skill:TreatInjury", "skill:Repair"]
