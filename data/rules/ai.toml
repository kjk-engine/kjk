[gunners]
title = "Ranged Combat"
summary = """
A creature or party member with a ranged weapon moves within its weapon's
range, faces its target and fires while it can see it. Its first shots
spread wide and grow more accurate as it keeps firing. Every few seconds it
checks that it can still see its target. If it cannot, it runs to a spot
that can and pauses there before it fires again. It never backs away from a
melee attacker. In a cutscene, or in a fight between creatures outside the
party, it holds its ground.
"""
applies = ["kind:blaster", "kind:rifle", "kind:pistol", "kind:heavy", "kind:creature", "kind:companion"]

[gunners.aim]
title = "Accuracy"
summary = """
A creature's accuracy starts low against a new target. It improves by
{ai.gunners.aim.settle} every {ai.gunners.aim.every_ms[0]:s} to
{ai.gunners.aim.every_ms[1]:s} while the creature sees its target, and
changes by {ai.gunners.aim.lose} while it does not, from
{ai.gunners.aim.worst} to {ai.gunners.aim.best}. A shot strays up to
{ai.gunners.spread.base:bare} degrees + {ai.gunners.spread.per_aim:bare}
degrees for each point of accuracy below {ai.gunners.spread.par}, never less
than {ai.gunners.spread.floor:bare} degrees.
"""

[gunners.aim.best]
name = "Best Accuracy"
type = "i8"
value = 3
range = [-50, 6]
summary = "A creature's accuracy rises no higher than {ai.gunners.aim.best}."
source = "JA: the NPC stats' default"
see = "sim::combat::troop::Troop::adjust_aim"

[gunners.aim.worst]
