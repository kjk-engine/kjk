[blades.striking]
title = "Attacking"
summary = """
A creature that is not parrying attacks when its blade tip touches its
enemy, when its enemy is in view within {ai.blades.striking.in_view:m} of the
tip, or when the two close on each other quickly from
{ai.blades.striking.closing_from:m} away. Its swings chain as a player's do.
While attacking, it steps to one side 1 time in
{ai.blades.striking.sidestep_odds} + 1.
"""

[blades.striking.in_view]
name = "Striking Range"
value = 32.0
unit = "units"
range = [0.0, 256.0]
summary = "A creature attacks an enemy in view within {ai.blades.striking.in_view:m} of its blade tip."
source = "JA: a Jedi NPC's attack decision"
see = "sim::combat::pace::Pace::finish"

[blades.striking.closing_from]
name = "Closing Range"
value = 64.0
unit = "units"
