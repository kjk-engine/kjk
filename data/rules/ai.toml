[chapter]
title = "Combat Behavior"
order = 40
summary = """
A creature's scripts decide whom it attacks and which powers, feats and items
it uses. Its footwork, aim, swings and parries follow the rules below. A
creature with a melee weapon fences; a creature with a ranged weapon stands
and fires.
"""

[tempo]
title = "Combat Tempo"
summary = """
A creature decides what to do every {ai.tempo.think_ms:s} and keeps moving
as it decided until its next decision. It turns toward its target at a set
rate rather than at once.
"""

[tempo.think_ms]
name = "Decision Rate"
type = "u64"
value = 100
unit = "ms"
range = [16, 1000]
summary = "A creature in combat decides what to do every {ai.tempo.think_ms:s}. Each creature decides at its own moment, so a group never acts as one."
source = "JA: the server frame"
see = "sim::world::minds::fight, sim::world::minds::shoot"
applies = ["kind:creature", "kind:companion"]

[tempo.turn_rate]
name = "Melee Turn Rate"
value = 330.0
unit = "°/s"
range = [30.0, 3600.0]
summary = "A creature with a melee weapon turns to face its enemy at {ai.tempo.turn_rate:bare} degrees per second, up and down as well as side to side."
source = "JA: an NPC's turn speed"
see = "sim::combat::mind::turned"
applies = ["kind:lightsaber", "kind:melee", "kind:creature"]

[tempo.gun_turn_rate]
name = "Ranged Turn Rate"
value = 2760.0
unit = "°/s"
range = [30.0, 36000.0]
summary = "A creature with a ranged weapon turns to face its target at {ai.tempo.gun_turn_rate:bare} degrees per second: almost at once."
source = "JA: an NPC's turn speed"
see = "sim::world::minds::shoot"
applies = ["kind:blaster", "kind:creature"]

[hands]
title = "Attacking"
summary = """
Once a creature faces its target, a creature with a ranged weapon fires and
a creature with a melee weapon closes in and swings. A creature fighting
unarmed closes further and punches. In a cutscene or a duel between two
creatures outside the party, a creature's aim drifts slightly off its
target, except while a conversation holds the action.
"""

[hands.aim_error]
name = "Aim Drift"
value = 4.0
unit = "°"
range = [0.0, 30.0]
summary = "In a cutscene or a duel, a creature's aim drifts up to {ai.hands.aim_error:bare} degrees to either side of its target."
detail = "A creature with a ranged weapon in other fights does not drift. Its shots spread instead, by at least {ai.gunners.spread.floor:bare} degrees."
source = "ours"
see = "sim::combat::mind::engage"
applies = ["kind:creature"]

[hands.aim_every_ms]
name = "Aim Drift Interval"
type = "u64"
value = 320
unit = "ms"
range = [16, 5000]
summary = "A drifting aim changes direction every {ai.hands.aim_every_ms:s}."
source = "ours"
see = "sim::combat::mind::engage"
applies = ["kind:creature"]

[hands.pitch_share]
name = "Vertical Drift"
value = 0.5
unit = "×"
range = [0.0, 1.0]
summary = "A drifting aim moves up and down {ai.hands.pitch_share:bare} times as far as it moves side to side."
source = "ours"
see = "sim::combat::mind::engage"
applies = ["kind:creature"]

[hands.fire_cone]
name = "Firing Arc"
value = 8.0
unit = "°"
range = [0.0, 180.0]
summary = "A creature fires or swings only when it faces within {ai.hands.fire_cone:bare} degrees of its target. A creature still turning holds its attack."
source = "ours"
see = "sim::combat::mind::engage, sim::world::minds::shoot"
applies = ["kind:creature"]

[hands.reach]
name = "Melee Approach"
value = 56.0
unit = "units"
range = [16.0, 256.0]
summary = "In a cutscene or a duel, a creature with a melee weapon closes to {ai.hands.reach:m} from its target."
source = "ours"
see = "sim::combat::mind::engage"
applies = ["kind:melee", "kind:creature"]

[hands.strike]
name = "Striking Distance"
value = 96.0
unit = "units"
range = [16.0, 512.0]
summary = "In a cutscene or a duel, a creature with a melee weapon swings at a target within {ai.hands.strike:m}."
detail = "Two creatures outside the party begin a duel within this distance. A creature fighting in a cutscene stands its ground within it."
source = "ours"
see = "sim::combat::mind::engage, sim::world::minds::engage"
applies = ["kind:melee", "kind:lightsaber", "kind:creature"]

[hands.swing_every_ms]
name = "Swing Change Interval"
type = "u64"
value = 600
unit = "ms"
range = [50, 5000]
summary = "In a cutscene or a duel, a creature with a melee weapon changes the direction of its swing every {ai.hands.swing_every_ms:s}."
detail = "It swings forward, to either side or on a diagonal. Back swings and special attacks are left to the player."
source = "ours"
see = "sim::combat::mind::engage"
applies = ["kind:melee", "kind:creature"]

[hands.blow_share]
name = "Unarmed Approach"
value = 0.75
unit = "×"
range = [0.1, 1.0]
summary = "A creature fighting unarmed closes to {ai.hands.blow_share:bare} of its punch's reach before it attacks."
source = "ours"
see = "sim::combat::mind::engage"
applies = ["kind:unarmed", "kind:creature"]

[hands.scene_reach_m]
name = "Cutscene Fighting Distance"
value = 1.4
unit = "m"
range = [0.5, 5.0]
summary = "A creature fighting in a cutscene stops {ai.hands.scene_reach_m:bare} meters from its target."
source = "K1's appearance.2da prefatckdist"
see = "sim::world::minds::engage"
applies = ["kind:creature", "kind:melee", "kind:lightsaber"]

[hands.crosshair_above_eye]
name = "Crosshair Height"
value = 16.0
unit = "units"
range = [0.0, 64.0]
summary = "The crosshair sits {ai.hands.crosshair_above_eye:m} above the character's eyes. Shots fly along that line."
source = "JA: the third-person camera"
see = "sim::combat::mind::crosshair"
applies = ["kind:player", "kind:blaster"]

[blades]
title = "Melee Combat"
summary = """
A creature or party member with a lightsaber or melee weapon fences. It
advances, holds its ground or backs away by its Aggression and its distance
from the enemy, circles at a walk, parries or steps aside when the enemy
swings, and attacks within striking range. A creature that cannot reach its
enemy, or loses sight of it, runs after it. Cutscenes and duels between
creatures outside the party do not follow these rules.
"""
applies = ["kind:lightsaber", "kind:melee", "kind:creature", "kind:companion"]

[blades.rank]
name = "Fencing Rank"
type = "u8"
value = 3
range = [0, 9]
summary = "Every creature with a melee weapon fences at rank {ai.blades.rank}. At this rank it does not press forward while it parries."
source = "the owner's call, 2026-10-12"
see = "sim::combat::pace::Pace::decide"

[blades.blade_length]
name = "Blade Length"
value = 40.0
unit = "units"
range = [8.0, 128.0]
summary = "Every blade counts as {ai.blades.blade_length:m} long when a creature judges its distance from the enemy."
detail = "Distance is measured from the blade's tip. The tip lies the blade's length, {ai.blades.tip_widths:bare} body widths and {ai.blades.tip_margin:m} out from the wielder."
source = "JA: a Jedi NPC's read of its enemy"
see = "sim::combat::pace::TIP"

[blades.tip_widths]
name = "Tip Distance: Body"
value = 1.5
unit = "×"
range = [0.0, 4.0]
summary = "A blade's tip counts as {ai.blades.tip_widths:bare} half body widths out from the wielder, beyond the blade's length."
source = "JA: a Jedi NPC's read of its enemy"
see = "sim::combat::pace::TIP"

[blades.tip_margin]
name = "Tip Distance: Margin"
value = 16.0
unit = "units"
range = [0.0, 64.0]
summary = "A blade's tip counts as {ai.blades.tip_margin:m} farther out still."
source = "JA: a Jedi NPC's read of its enemy"
see = "sim::combat::pace::TIP"

[blades.lead_ms]
name = "Lead"
value = 300.0
unit = "ms"
range = [0.0, 2000.0]
summary = "A creature judges its distance from where its enemy will be in {ai.blades.lead_ms:s}."
source = "JA: a Jedi NPC's read of its enemy"
see = "sim::world::minds::sight_of"

[blades.block_widths]
name = "Parry Reach"
value = 5.0
unit = "×"
range = [0.0, 20.0]
summary = "A creature parries an enemy's swing at once when the enemy's blade comes within {ai.blades.block_widths:bare} half body widths of it."
source = "JA: a Jedi NPC's blocks"
see = "sim::combat::pace::BLOCK_GAP"

[blades.seen_lately_ms]
name = "Pursuit Delay"
type = "u64"
value = 500
unit = "ms"
range = [0, 10000]
summary = "A creature that has not seen its enemy for {ai.blades.seen_lately_ms:s} stops fencing and runs after it."
source = "ours"
see = "sim::world::minds::fight"

[blades.view]
name = "Field of View"
value = [30.0, 90.0]
unit = "°"
labels = ["to either side", "up or down"]
summary = "A creature sees an enemy for an attack within {ai.blades.view[0]:bare} degrees to either side and {ai.blades.view[1]:bare} degrees up or down."
source = "JA: an NPC's field of view"
see = "sim::world::minds::sight_of"

[blades.aggression]
title = "Aggression"
summary = """
Aggression governs how boldly a creature fights. A creature with high
Aggression closes in and holds its ground. A creature with low Aggression
backs away. Aggression is set anew against each new enemy, rises every few
seconds by the enemy's weapon, and changes as blows are blocked, parried and
landed.
"""

[blades.aggression.start]
name = "Starting Aggression"
type = "i8"
value = 3
range = [0, 10]
summary = "A creature starts with {ai.blades.aggression.start} Aggression before it meets its first enemy."
source = "JA: the NPC stats' default"
see = "sim::combat::pace::Pace::decide"

[blades.aggression.gun_near]
name = "Ranged Enemy: Near"
value = 256.0
unit = "units"
range = [0.0, 4096.0]
summary = "An enemy with a ranged weapon within {ai.blades.aggression.gun_near:m} counts as near. A creature charges a near gunman and hangs back from a far one."
source = "JA: a Jedi NPC's aggression and its rating of an enemy"
see = "sim::combat::pace::Pace"

[blades.aggression.enemy]
name = "Enemy Aggression"
type = "i64"
value = [3, 10]
labels = ["least", "most"]
range = [0, 20]
summary = "A creature hostile to the party has {ai.blades.aggression.enemy[0]} to {ai.blades.aggression.enemy[1]} Aggression."
source = "JA: a Jedi NPC's aggression"
see = "sim::combat::pace::Pace::aggression"

[blades.aggression.ally]
name = "Party Member Aggression"
type = "i64"
value = [1, 7]
labels = ["least", "most"]
range = [0, 20]
summary = "A party member has {ai.blades.aggression.ally[0]} to {ai.blades.aggression.ally[1]} Aggression."
source = "JA: a Jedi NPC's aggression; the owner's call, 2026-10-12"
see = "sim::combat::pace::Pace::aggression"
applies = ["kind:companion"]

[blades.aggression.rise_ms]
name = "Aggression Rise Interval"
type = "u64"
value = [2000, 5000]
labels = ["least", "most"]
unit = "ms"
range = [100, 60000]
summary = "Every {ai.blades.aggression.rise_ms[0]:s} to {ai.blades.aggression.rise_ms[1]:s}, a creature's Aggression rises by its enemy's weapon."
detail = "+{ai.blades.aggression.unlit_saber:bare} against an unlit lightsaber, +{ai.blades.aggression.lit_saber:bare} against a lit one. Against a ranged weapon, +1 while the enemy is not firing and +1 more within {ai.blades.aggression.gun_near:m}."
source = "JA: a Jedi NPC's combat timers"
see = "sim::combat::pace::Pace::decide"

[blades.aggression.unlit_saber]
name = "Unlit Lightsaber"
type = "i64"
value = 2
range = [-10, 10]
summary = "Aggression rises by {ai.blades.aggression.unlit_saber} against an enemy whose lightsaber is unlit."
source = "JA: a Jedi NPC's combat timers"
see = "sim::combat::pace::Pace::decide"

[blades.aggression.lit_saber]
name = "Lit Lightsaber"
type = "i64"
value = 1
range = [-10, 10]
summary = "Aggression rises by {ai.blades.aggression.lit_saber} against an enemy whose lightsaber is lit."
source = "JA: a Jedi NPC's combat timers"
see = "sim::combat::pace::Pace::decide"

[blades.rating]
title = "Judging an Enemy"
summary = """
Against a new enemy, a creature's Aggression becomes the average, rounded
up, of its vitality points out of {ai.blades.rating.health_full:bare} (times
a weight), the enemy's weapon's weight, and its Aggression before. Against a
ranged weapon beyond {ai.blades.aggression.gun_near:m}, the healthier the creature,
the more it hangs back.
"""

[blades.rating.health_full]
name = "Full Vitality"
value = 200.0
unit = "HP"
range = [1.0, 2000.0]
summary = "A creature with {ai.blades.rating.health_full:bare} vitality points counts its health in full when it judges a new enemy."
source = "JA: a Jedi NPC's rating of a new enemy"
see = "sim::combat::pace::Pace::rate"

[blades.rating.health_weight]
name = "Vitality Weight"
value = [6.0, 8.0]
labels = ["against a lightsaber", "against any other weapon"]
range = [0.0, 20.0]
summary = "A creature's health weighs {ai.blades.rating.health_weight[0]} against a lightsaber and {ai.blades.rating.health_weight[1]} against any other weapon."
source = "JA: a Jedi NPC's rating of a new enemy"
see = "sim::combat::pace::Pace::rate"

[blades.rating.weapon_weight]
name = "Weapon Weight"
value = [7.0, 8.0, 2.0, 6.0]
labels = ["a lightsaber", "a ranged weapon nearby", "a ranged weapon far away", "any other weapon"]
range = [0.0, 20.0]
summary = "The enemy's weapon weighs {ai.blades.rating.weapon_weight[0]} for a lightsaber, {ai.blades.rating.weapon_weight[1]} for a ranged weapon nearby, {ai.blades.rating.weapon_weight[2]} for a ranged weapon far away and {ai.blades.rating.weapon_weight[3]} for any other weapon."
source = "JA: a Jedi NPC's rating of a new enemy"
see = "sim::combat::pace::Pace::rate"

[blades.events]
title = "Blocks and Blows"
summary = """
A creature's Aggression changes when its swing is blocked, its parry is
broken, it parries a blow, or it is hurt. A lightsaber hit also stops it
from parrying for {ai.blades.parrying.hit_lock_ms:s}.
"""

[blades.events.blocked_odds]
name = "Blocked: Chance"
type = "i64"
value = 2
range = [0, 20]
summary = "When a creature's swing is blocked, its Aggression falls 1 time in {ai.blades.events.blocked_odds} + 1."
source = "JA"
see = "sim::combat::pace::Pace::events"

[blades.events.blocked]
name = "Blocked"
type = "i64"
value = -1
range = [-10, 10]
summary = "A blocked swing changes Aggression by {ai.blades.events.blocked}."
source = "JA"
see = "sim::combat::pace::Pace::events"

[blades.events.broken]
name = "Parry Broken"
type = "i64"
value = -2
range = [-10, 10]
summary = "A broken parry changes Aggression by {ai.blades.events.broken}."
source = "JA"
see = "sim::combat::pace::Pace::events"

[blades.events.parried_odds]
name = "Parried: Chance"
type = "i64"
value = 1
range = [0, 20]
summary = "When a creature parries a blow, its Aggression falls 1 time in {ai.blades.events.parried_odds} + 1."
source = "JA"
see = "sim::combat::pace::Pace::events"

[blades.events.parried]
name = "Parried"
type = "i64"
value = -1
range = [-10, 10]
summary = "A parried blow changes Aggression by {ai.blades.events.parried}."
source = "JA"
see = "sim::combat::pace::Pace::events"

[blades.events.cut_odds]
name = "Lightsaber Hit: Chance"
type = "i64"
value = 1
range = [0, 20]
summary = "When a lightsaber hits a creature, its Aggression falls 1 time in {ai.blades.events.cut_odds} + 1."
source = "JA: a Jedi NPC's reaction to pain"
see = "sim::combat::pace::Pace::events"

[blades.events.cut]
name = "Lightsaber Hit"
type = "i64"
value = -1
range = [-10, 10]
summary = "A lightsaber hit changes Aggression by {ai.blades.events.cut}."
source = "JA: a Jedi NPC's reaction to pain"
see = "sim::combat::pace::Pace::events"

[blades.events.hurt]
name = "Other Damage"
type = "i64"
value = 1
range = [-10, 10]
summary = "Damage from anything but a lightsaber changes Aggression by +{ai.blades.events.hurt:bare}."
source = "JA: a Jedi NPC's reaction to pain"
see = "sim::combat::pace::Pace::events"

[blades.distance]
title = "Fencing Distance"
summary = """
Distance is measured from the creature's blade tip to its enemy. Inside
{ai.blades.distance.inside:m}, a creature always backs away. At the tip, it
backs away below {ai.blades.distance.back_below} Aggression and holds its
ground and attacks at or above it. Within {ai.blades.distance.near:m}, it
backs away below {ai.blades.distance.back_below} Aggression, advances above
{ai.blades.distance.close_above} unless it is parrying or the enemy is in
the air, and otherwise holds still. Within {ai.blades.distance.far:m}, it
keeps its distance unless its Aggression is above
{ai.blades.distance.close_above}. Farther away, it advances at a run above
{ai.blades.distance.far_above} Aggression.
"""

[blades.distance.inside]
name = "Too Close"
value = -16.0
unit = "units"
range = [-128.0, 0.0]
summary = "A creature always backs away at a distance of {ai.blades.distance.inside:m} or less from its blade tip."
source = "JA: a Jedi NPC's fighting distance"
see = "sim::combat::pace::Pace::way"

[blades.distance.near]
name = "Near Distance"
value = 50.0
unit = "units"
range = [0.0, 512.0]
summary = "Within {ai.blades.distance.near:m} of its blade tip, a timid creature backs away and a bold one closes in."
source = "JA: a Jedi NPC's fighting distance"
see = "sim::combat::pace::Pace::way"

[blades.distance.far]
name = "Far Distance"
value = 256.0
unit = "units"
range = [0.0, 4096.0]
summary = "Beyond {ai.blades.distance.far:m} a creature advances. Within it, the creature keeps its distance."
source = "JA: a Jedi NPC's fighting distance"
see = "sim::combat::pace::Pace::way"

[blades.distance.back_below]
name = "Timid Below"
type = "i8"
value = 4
range = [0, 20]
summary = "A creature with less than {ai.blades.distance.back_below} Aggression backs away from a near enemy."
source = "JA: a Jedi NPC's fighting distance"
see = "sim::combat::pace::Pace::way"

[blades.distance.close_above]
name = "Bold Above"
type = "i8"
value = 5
range = [0, 20]
summary = "A creature with more than {ai.blades.distance.close_above} Aggression closes in. Between the two, it holds still."
source = "JA: a Jedi NPC's fighting distance"
see = "sim::combat::pace::Pace::way"

[blades.distance.far_above]
name = "Advance From Afar"
type = "i8"
value = 0
range = [0, 20]
summary = "A creature with more than {ai.blades.distance.far_above} Aggression advances on a distant enemy."
source = "JA: a Jedi NPC's fighting distance"
see = "sim::combat::pace::Pace::way"

[blades.circling]
title = "Circling"
summary = """
A creature not already circling steps to one side 1 time in
{ai.blades.circling.odds} + 1. It walks sideways for
{ai.blades.circling.strafe_ms[0]:s} to {ai.blades.circling.strafe_ms[1]:s},
then waits up to {ai.blades.circling.after_ms[1]:s} more before it tries
again. Otherwise it waits {ai.blades.circling.wait_ms[0]:s} to
{ai.blades.circling.wait_ms[1]:s}. A creature never circles toward a wall
or a ledge.
"""

[blades.circling.odds]
name = "Circling Chance"
type = "i64"
value = 4
range = [0, 50]
summary = "A creature begins to circle 1 time in {ai.blades.circling.odds} + 1."
source = "JA: a Jedi NPC's combat timers"
see = "sim::combat::pace::Pace::decide"

[blades.circling.strafe_ms]
name = "Circling Duration"
type = "u64"
value = [1000, 3000]
labels = ["least", "most"]
unit = "ms"
range = [0, 20000]
summary = "A creature circles for {ai.blades.circling.strafe_ms[0]:s} to {ai.blades.circling.strafe_ms[1]:s}."
source = "JA: a Jedi NPC's strafing"
see = "sim::combat::pace::Pace::decide"

[blades.circling.after_ms]
name = "Delay After Circling"
type = "u64"
value = [0, 4000]
labels = ["least", "most"]
unit = "ms"
range = [0, 20000]
summary = "After circling, a creature waits {ai.blades.circling.after_ms[0]:s} to {ai.blades.circling.after_ms[1]:s} before it circles again."
source = "JA: a Jedi NPC's strafing"
see = "sim::combat::pace::Pace::decide"

[blades.circling.wait_ms]
name = "Delay Without Circling"
type = "u64"
value = [1000, 3000]
labels = ["least", "most"]
unit = "ms"
range = [0, 20000]
summary = "A creature that chose not to circle waits {ai.blades.circling.wait_ms[0]:s} to {ai.blades.circling.wait_ms[1]:s} before it tries again."
source = "JA: a Jedi NPC's combat timers"
see = "sim::combat::pace::Pace::decide"

[blades.circling.turn_limit]
name = "Circling Turn Limit"
value = 60.0
unit = "°"
range = [0.0, 180.0]
summary = "A creature stops circling when it must turn more than {ai.blades.circling.turn_limit:bare} degrees the other way to face its enemy."
source = "JA: a Jedi NPC's timers"
see = "sim::combat::pace::Pace::finish"

[blades.holds]
title = "Footwork"
summary = """
A creature keeps to each direction it takes for a time. Forward or back
lasts {ai.blades.holds.along_ms[0]:s} to {ai.blades.holds.along_ms[1]:s},
and to a side {ai.blades.holds.across_ms[0]:s} to
{ai.blades.holds.across_ms[1]:s}. A creature that wants to reverse first
stands still in that direction for {ai.blades.holds.still_ms[0]:s} to
{ai.blades.holds.still_ms[1]:s}.
"""

[blades.holds.along_ms]
name = "Forward or Back"
type = "u64"
value = [500, 2000]
labels = ["least", "most"]
unit = "ms"
range = [0, 10000]
summary = "A creature moving forward or back keeps on for {ai.blades.holds.along_ms[0]:s} to {ai.blades.holds.along_ms[1]:s}."
source = "JA: a Jedi NPC's direction changes"
see = "sim::combat::pace::Pace::hold"

[blades.holds.across_ms]
name = "To the Side"
type = "u64"
value = [250, 1500]
labels = ["least", "most"]
unit = "ms"
range = [0, 10000]
summary = "A creature moving to one side keeps on for {ai.blades.holds.across_ms[0]:s} to {ai.blades.holds.across_ms[1]:s}."
source = "JA: a Jedi NPC's direction changes"
see = "sim::combat::pace::Pace::hold"

[blades.holds.still_ms]
name = "Pause Before Reversing"
type = "u64"
value = [1000, 2000]
labels = ["least", "most"]
unit = "ms"
range = [0, 10000]
summary = "A creature that wants to reverse direction stands still that way for {ai.blades.holds.still_ms[0]:s} to {ai.blades.holds.still_ms[1]:s}."
source = "JA: a Jedi NPC's direction changes"
see = "sim::combat::pace::Pace::hold"

[blades.holds.again_ms]
name = "Repeat Delay"
type = "u64"
value = [1000, 2000]
labels = ["least", "most"]
unit = "ms"
range = [0, 10000]
summary = "A creature cannot take the same direction again for {ai.blades.holds.again_ms[0]:s} to {ai.blades.holds.again_ms[1]:s}."
source = "JA: a Jedi NPC's direction changes"
