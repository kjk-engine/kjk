[chapter]
title = "Combat Behavior"
order = 40
summary = """
A creature's scripts choose which enemy it attacks and which Force powers,
feats and items it uses. The rules in this chapter decide how the creature
moves, aims, attacks and parries. A creature with a melee weapon steps in,
backs away, circles and parries as Jedi Academy's computer-controlled Jedi
do. A creature with a ranged weapon stands and fires.
"""

[tempo]
title = "Decisions and Turning"
summary = """
A creature in combat makes a new decision every {ai.tempo.think_ms:s}. Until
its next decision, it keeps doing what it decided. It turns toward its
target at a fixed speed, not instantly.
"""

[tempo.think_ms]
name = "Decision Interval"
type = "u64"
value = 100
unit = "ms"
range = [16, 1000]
summary = "A creature in combat makes a new decision every {ai.tempo.think_ms:s}. Each creature decides at a different moment, so a group of enemies never acts all at once."
source = "JA: the server frame"
see = "sim::world::minds::fight, sim::world::minds::shoot"
applies = ["kind:creature", "kind:companion"]

[tempo.turn_rate]
name = "Melee Turn Rate"
value = 330.0
unit = "°/s"
range = [30.0, 3600.0]
summary = "A creature with a melee weapon turns to face its enemy at {ai.tempo.turn_rate:bare} degrees per second. This speed applies to turning up and down as well as to the sides."
source = "JA: an NPC's turn speed"
see = "sim::combat::mind::turned"
applies = ["kind:lightsaber", "kind:melee", "kind:creature"]

[tempo.gun_turn_rate]
name = "Ranged Turn Rate"
value = 2760.0
unit = "°/s"
range = [30.0, 36000.0]
summary = "A creature with a ranged weapon turns to face its target at {ai.tempo.gun_turn_rate:bare} degrees per second. This is almost instant."
source = "JA: an NPC's turn speed"
see = "sim::world::minds::shoot"
applies = ["kind:blaster", "kind:creature"]

[hands]
title = "Aiming and Closing In"
summary = """
Once a creature faces its target, it attacks. A creature with a ranged
weapon fires. A creature with a melee weapon walks up to its target and
swings. A creature fighting unarmed walks closer still and punches.

In a cutscene, and in a duel, a creature's aim wanders slightly off its
target. A duel is a fight between two creatures that are both outside the
party. The aim does not wander while a conversation has stopped the action.
"""

[hands.aim_error]
name = "Aim Drift"
value = 4.0
unit = "°"
range = [0.0, 30.0]
summary = "In a cutscene or a duel, a creature's aim wanders up to {ai.hands.aim_error:bare} degrees to either side of its target."
detail = "In other fights, a creature with a ranged weapon aims straight at its target. Its shots spread instead, by at least {ai.gunners.spread.floor:bare} degrees."
source = "ours"
see = "sim::combat::mind::engage"
applies = ["kind:creature"]

[hands.aim_every_ms]
name = "Aim Drift Interval"
type = "u64"
value = 320
unit = "ms"
range = [16, 5000]
summary = "A wandering aim moves to a new direction every {ai.hands.aim_every_ms:s}."
source = "ours"
see = "sim::combat::mind::engage"
applies = ["kind:creature"]

[hands.pitch_share]
name = "Vertical Drift"
value = 0.5
unit = "×"
range = [0.0, 1.0]
summary = "A wandering aim moves up and down {ai.hands.pitch_share:bare} times as far as it moves to the sides."
source = "ours"
see = "sim::combat::mind::engage"
applies = ["kind:creature"]

[hands.fire_cone]
name = "Firing Arc"
value = 8.0
unit = "°"
range = [0.0, 180.0]
summary = "A creature fires or swings only when it faces within {ai.hands.fire_cone:bare} degrees of its target. A creature that is still turning toward its target does not attack yet."
source = "ours"
see = "sim::combat::mind::engage, sim::world::minds::shoot"
applies = ["kind:creature"]

[hands.reach]
name = "Melee Approach"
value = 56.0
unit = "units"
range = [16.0, 256.0]
summary = "In a duel, a creature with a melee weapon walks up to within {ai.hands.reach:m} of its target."
source = "ours"
see = "sim::combat::mind::engage"
applies = ["kind:melee", "kind:creature"]

[hands.strike]
name = "Striking Distance"
value = 96.0
unit = "units"
range = [16.0, 512.0]
summary = "In a cutscene or a duel, a creature with a melee weapon swings at a target within {ai.hands.strike:m}."
detail = "Two creatures outside the party start a duel when they come within this distance of each other. A creature fighting in a cutscene stands its ground once its target is within this distance."
source = "ours"
see = "sim::combat::mind::engage, sim::world::minds::engage"
applies = ["kind:melee", "kind:lightsaber", "kind:creature"]

[hands.swing_every_ms]
name = "Swing Change Interval"
type = "u64"
value = 600
unit = "ms"
range = [50, 5000]
summary = "In a duel, a creature with a melee weapon changes the direction of its swing every {ai.hands.swing_every_ms:s}."
detail = "The creature swings forward, to either side, or on one of the four diagonals. Swings straight back and special attacks are left to the player. In a cutscene, a creature swings while standing in place."
source = "ours"
see = "sim::combat::mind::engage"
applies = ["kind:melee", "kind:creature"]

[hands.blow_share]
name = "Unarmed Approach"
value = 0.75
unit = "×"
range = [0.1, 1.0]
summary = "A creature fighting unarmed walks up to {ai.hands.blow_share:bare} times its punch's reach before it attacks."
source = "ours"
see = "sim::combat::mind::engage"
applies = ["kind:unarmed", "kind:creature"]

[hands.scene_reach_m]
name = "Cutscene Fighting Distance"
value = 1.4
unit = "m"
range = [0.5, 5.0]
summary = "A creature fighting in a cutscene stops {ai.hands.scene_reach_m:bare} meters from its target, measured from centre to centre."
source = "K1's appearance.2da prefatckdist"
see = "sim::world::minds::engage"
applies = ["kind:creature", "kind:melee", "kind:lightsaber"]

[hands.crosshair_above_eye]
name = "Crosshair Height"
value = 16.0
unit = "units"
range = [0.0, 64.0]
summary = "The crosshair sits {ai.hands.crosshair_above_eye:m} above the player character's eyes. Shots fired by the player travel along the line through the crosshair."
source = "JA: the third-person camera"
see = "sim::combat::mind::crosshair"
applies = ["kind:player", "kind:blaster"]

[blades]
title = "Melee Combat"
summary = """
A creature or party member with a lightsaber or melee weapon fights as Jedi
Academy's computer-controlled Jedi do. It steps toward its enemy, stands its
ground or backs away. Which one it does depends on its Aggression and on its
distance from the enemy. It circles the enemy at a walk. When the enemy
swings, it parries or steps aside. When the enemy is within striking range,
it attacks.

A creature that cannot reach its enemy, or has lost sight of it, runs after
it. Cutscenes and duels between creatures outside the party do not follow
these rules.
"""
applies = ["kind:lightsaber", "kind:melee", "kind:creature", "kind:companion"]

[blades.rank]
name = "Melee Rank"
type = "u8"
value = 3
range = [0, 9]
summary = "In Jedi Academy, each computer-controlled fighter has a rank. Every creature with a melee weapon fights at rank {ai.blades.rank}. At this rank, a creature does not step toward its enemy while it parries."
source = "the owner's call, 2026-10-12"
see = "sim::combat::pace::Pace::decide"

[blades.blade_length]
name = "Blade Length"
value = 40.0
unit = "units"
range = [8.0, 128.0]
summary = "When a creature judges its distance from its enemy, every blade counts as {ai.blades.blade_length:m} long."
detail = "The distance is measured from the tip of the creature's blade. The tip counts as lying out from the creature's centre by the blade's length, plus {ai.blades.tip_widths:bare} half body widths, plus {ai.blades.tip_margin:m}."
source = "JA: a Jedi NPC's read of its enemy"
see = "sim::combat::pace::TIP"

[blades.tip_widths]
name = "Blade Tip Offset"
value = 1.5
unit = "×"
range = [0.0, 4.0]
summary = "A blade's tip counts as lying {ai.blades.tip_widths:bare} half body widths farther out from the creature, on top of the blade's length."
source = "JA: a Jedi NPC's read of its enemy"
see = "sim::combat::pace::TIP"

[blades.tip_margin]
name = "Blade Tip Margin"
value = 16.0
unit = "units"
range = [0.0, 64.0]
summary = "A blade's tip counts as lying a further {ai.blades.tip_margin:m} out from the creature."
source = "JA: a Jedi NPC's read of its enemy"
see = "sim::combat::pace::TIP"

[blades.lead_ms]
name = "Looking Ahead"
value = 300.0
unit = "ms"
range = [0.0, 2000.0]
summary = "A creature judges its distance from where its enemy will be in {ai.blades.lead_ms:s}, not from where the enemy is now."
source = "JA: a Jedi NPC's read of its enemy"
see = "sim::world::minds::sight_of"

[blades.block_widths]
name = "Parry Reach"
value = 5.0
unit = "×"
range = [0.0, 20.0]
summary = "A creature parries at once when its enemy swings and the enemy's blade comes within {ai.blades.block_widths:bare} half body widths of it. It does not do this while it is swinging itself."
source = "JA: a Jedi NPC's blocks"
see = "sim::combat::pace::BLOCK_GAP"

[blades.seen_lately_ms]
name = "Pursuit Delay"
type = "u64"
value = 500
unit = "ms"
range = [0, 10000]
summary = "A creature that has not seen its enemy for {ai.blades.seen_lately_ms:s} stops circling and parrying and runs after the enemy."
source = "ours"
see = "sim::world::minds::fight"

[blades.view]
name = "Field of View"
value = [30.0, 90.0]
unit = "°"
labels = ["to either side", "up or down"]
summary = "A creature can see an enemy well enough to attack it when the enemy is within {ai.blades.view[0]:bare} degrees to either side and {ai.blades.view[1]:bare} degrees up or down."
source = "JA: an NPC's field of view"
see = "sim::world::minds::sight_of"

[blades.aggression]
title = "Aggression"
summary = """
Aggression is a number that sets how boldly a creature fights. A creature
with high Aggression steps in and stands its ground. A creature with low
Aggression backs away.

A creature sets its Aggression anew each time it faces a new enemy. Its
Aggression then rises every few seconds, by an amount that depends on the
enemy's weapon. Its Aggression also changes when its swings are blocked,
when it parries, and when it is hurt.
"""

[blades.aggression.start]
name = "Starting Aggression"
type = "i8"
value = 3
range = [0, 10]
summary = "A creature has {ai.blades.aggression.start} Aggression before it meets its first enemy."
source = "JA: the NPC stats' default"
see = "sim::combat::pace::Pace::decide"

[blades.aggression.gun_near]
name = "Nearby Ranged Enemy"
value = 256.0
unit = "units"
range = [0.0, 4096.0]
summary = "An enemy with a ranged weapon counts as near when it is within {ai.blades.aggression.gun_near:m}. A creature charges a near enemy with a ranged weapon and stays back from a distant one."
source = "JA: a Jedi NPC's aggression and its rating of an enemy"
see = "sim::combat::pace::Pace"

[blades.aggression.enemy]
name = "Enemy Aggression"
type = "i64"
value = [3, 10]
labels = ["least", "most"]
range = [0, 20]
summary = "A creature hostile to the party has between {ai.blades.aggression.enemy[0]} and {ai.blades.aggression.enemy[1]} Aggression. Changes to its Aggression never take it outside these limits."
source = "JA: a Jedi NPC's aggression"
see = "sim::combat::pace::Pace::aggression"

[blades.aggression.ally]
name = "Party Member Aggression"
type = "i64"
value = [1, 7]
labels = ["least", "most"]
range = [0, 20]
summary = "A party member has between {ai.blades.aggression.ally[0]} and {ai.blades.aggression.ally[1]} Aggression. Changes to its Aggression never take it outside these limits."
source = "JA: a Jedi NPC's aggression; the owner's call, 2026-10-12"
see = "sim::combat::pace::Pace::aggression"
applies = ["kind:companion"]

[blades.aggression.rise_ms]
name = "Aggression Rise Interval"
type = "u64"
value = [2000, 5000]
labels = ["least", "most"]
unit = "ms"
range = [100, 60000]
summary = "Every {ai.blades.aggression.rise_ms[0]:s} to {ai.blades.aggression.rise_ms[1]:s}, a creature's Aggression rises by an amount that depends on its enemy's weapon."
detail = "Against an unlit lightsaber, Aggression rises by {ai.blades.aggression.unlit_saber:bare}. Against a lit lightsaber, it rises by {ai.blades.aggression.lit_saber:bare}. Against a ranged weapon, it rises by 1 while the enemy is not firing, and by 1 more while the enemy is within {ai.blades.aggression.gun_near:m}. Against any other weapon, it does not change."
source = "JA: a Jedi NPC's combat timers"
see = "sim::combat::pace::Pace::decide"

[blades.aggression.unlit_saber]
name = "Unlit Lightsaber"
type = "i64"
value = 2
range = [-10, 10]
summary = "Aggression rises by {ai.blades.aggression.unlit_saber} against an enemy whose lightsaber is unlit."
source = "JA: a Jedi NPC's combat timers"
see = "sim::combat::pace::Pace::decide"

[blades.aggression.lit_saber]
name = "Lit Lightsaber"
type = "i64"
value = 1
range = [-10, 10]
summary = "Aggression rises by {ai.blades.aggression.lit_saber} against an enemy whose lightsaber is lit."
source = "JA: a Jedi NPC's combat timers"
see = "sim::combat::pace::Pace::decide"

[blades.rating]
title = "Judging an Enemy"
summary = """
When a creature faces a new enemy, it sets its Aggression to the average of
three numbers, rounded up. The first is a score for its health. The second
is a score for the enemy's weapon. The third is its Aggression before.

The health score is the creature's vitality points divided by
{ai.blades.rating.health_full:bare}, then multiplied by a factor that
depends on the enemy's weapon. Against a ranged weapon farther away than
{ai.blades.aggression.gun_near:m}, the health score counts the vitality
points the creature is missing instead. A healthier creature therefore stays
farther back from a distant enemy with a ranged weapon.
"""

[blades.rating.health_full]
name = "Full Vitality"
value = 200.0
unit = "HP"
range = [1.0, 2000.0]
summary = "When a creature judges a new enemy, {ai.blades.rating.health_full:bare} vitality points count as full health."
source = "JA: a Jedi NPC's rating of a new enemy"
see = "sim::combat::pace::Pace::rate"

[blades.rating.health_weight]
name = "Health Factor"
value = [6.0, 8.0]
labels = ["against a lightsaber", "against any other weapon"]
range = [0.0, 20.0]
summary = "A creature's health score is multiplied by {ai.blades.rating.health_weight[0]} against a lightsaber and by {ai.blades.rating.health_weight[1]} against any other weapon."
source = "JA: a Jedi NPC's rating of a new enemy"
see = "sim::combat::pace::Pace::rate"

[blades.rating.weapon_weight]
name = "Weapon Score"
value = [7.0, 8.0, 2.0, 6.0]
labels = ["a lightsaber", "a ranged weapon nearby", "a ranged weapon far away", "any other weapon"]
range = [0.0, 20.0]
summary = "The enemy's weapon scores {ai.blades.rating.weapon_weight[0]} for a lightsaber, {ai.blades.rating.weapon_weight[1]} for a ranged weapon nearby, {ai.blades.rating.weapon_weight[2]} for a ranged weapon far away, and {ai.blades.rating.weapon_weight[3]} for any other weapon."
source = "JA: a Jedi NPC's rating of a new enemy"
see = "sim::combat::pace::Pace::rate"

[blades.events]
title = "Blocks and Hits"
summary = """
A creature's Aggression can change when its swing is blocked, when its parry
is broken, when it parries an attack, and when it is hurt. Being hurt while
its enemy wields a lightsaber also ends the creature's parry. The creature
then cannot start a new parry for {ai.blades.parrying.hit_lock_ms:s}.
"""

[blades.events.blocked_odds]
name = "Chance When Blocked"
type = "i64"
value = 2
range = [0, 20]
summary = "When a creature's swing is blocked, there is a 1 in ({ai.blades.events.blocked_odds} + 1) chance that its Aggression changes."
source = "JA"
see = "sim::combat::pace::Pace::events"

[blades.events.blocked]
name = "Change When Blocked"
type = "i64"
value = -1
range = [-10, 10]
summary = "When a blocked swing changes a creature's Aggression, the change is {ai.blades.events.blocked}."
source = "JA"
see = "sim::combat::pace::Pace::events"

[blades.events.broken]
name = "Parry Broken"
type = "i64"
value = -2
range = [-10, 10]
summary = "When a creature's parry is broken, its Aggression always changes by {ai.blades.events.broken}."
source = "JA"
see = "sim::combat::pace::Pace::events"

[blades.events.parried_odds]
name = "Chance When Parrying"
type = "i64"
value = 1
range = [0, 20]
summary = "When a creature parries an attack, there is a 1 in ({ai.blades.events.parried_odds} + 1) chance that its Aggression changes."
source = "JA"
see = "sim::combat::pace::Pace::events"

[blades.events.parried]
name = "Change When Parrying"
type = "i64"
value = -1
range = [-10, 10]
summary = "When parrying an attack changes a creature's Aggression, the change is {ai.blades.events.parried}."
source = "JA"
see = "sim::combat::pace::Pace::events"

[blades.events.cut_odds]
name = "Lightsaber Hit Chance"
type = "i64"
value = 1
range = [0, 20]
summary = "When a creature is hurt while its enemy wields a lightsaber, there is a 1 in ({ai.blades.events.cut_odds} + 1) chance that its Aggression changes."
source = "JA: a Jedi NPC's reaction to pain"
see = "sim::combat::pace::Pace::events"

[blades.events.cut]
name = "Lightsaber Hit"
type = "i64"
value = -1
range = [-10, 10]
summary = "When being hurt by an enemy with a lightsaber changes a creature's Aggression, the change is {ai.blades.events.cut}."
source = "JA: a Jedi NPC's reaction to pain"
see = "sim::combat::pace::Pace::events"

[blades.events.hurt]
name = "Other Damage"
type = "i64"
value = 1
range = [-10, 10]
summary = "When a creature is hurt while its enemy wields any weapon other than a lightsaber, its Aggression always changes by +{ai.blades.events.hurt:bare}."
source = "JA: a Jedi NPC's reaction to pain"
see = "sim::combat::pace::Pace::events"

[blades.distance]
title = "Melee Distance"
summary = """
A creature measures its distance from the tip of its own blade to its enemy.
What it does at each distance depends on its Aggression.

At a distance of {ai.blades.distance.inside:m} or less, the creature always
backs away. A negative distance means that the blade tip has already passed
the enemy.

When the blade tip touches the enemy, a creature with less than
{ai.blades.distance.back_below} Aggression backs away. Any other creature
stands its ground and attacks.

Within {ai.blades.distance.near:m}, a creature with less than
{ai.blades.distance.back_below} Aggression backs away. A creature with more
than {ai.blades.distance.close_above} Aggression moves in. Any other
creature neither moves in nor backs away.

Within {ai.blades.distance.far:m}, a creature with more than
{ai.blades.distance.close_above} Aggression moves in. Any other creature
keeps its distance.

Farther away, a creature with more than {ai.blades.distance.far_above}
Aggression runs toward its enemy.

A creature never moves in while it is parrying or while its enemy is in the
air.
"""

[blades.distance.inside]
name = "Too Close"
value = -16.0
unit = "units"
range = [-128.0, 0.0]
summary = "A creature always backs away when the distance from its blade tip to its enemy is {ai.blades.distance.inside:m} or less. A negative distance means that the tip has already passed the enemy."
source = "JA: a Jedi NPC's fighting distance"
see = "sim::combat::pace::Pace::way"

[blades.distance.near]
name = "Near Distance"
value = 50.0
unit = "units"
range = [0.0, 512.0]
summary = "Within {ai.blades.distance.near:m} of its blade tip, a creature with low Aggression backs away and a creature with high Aggression moves in."
source = "JA: a Jedi NPC's fighting distance"
see = "sim::combat::pace::Pace::way"

[blades.distance.far]
name = "Far Distance"
value = 256.0
unit = "units"
range = [0.0, 4096.0]
summary = "Beyond {ai.blades.distance.far:m} from its blade tip, a creature with enough Aggression runs toward its enemy. Closer than that, only a creature with high Aggression moves in, and any other creature keeps its distance."
source = "JA: a Jedi NPC's fighting distance"
see = "sim::combat::pace::Pace::way"

[blades.distance.back_below]
name = "Low Aggression"
type = "i8"
value = 4
range = [0, 20]
summary = "A creature with less than {ai.blades.distance.back_below} Aggression backs away from an enemy that is near its blade tip."
source = "JA: a Jedi NPC's fighting distance"
see = "sim::combat::pace::Pace::way"

[blades.distance.close_above]
name = "High Aggression"
type = "i8"
value = 5
range = [0, 20]
summary = "A creature with more than {ai.blades.distance.close_above} Aggression moves in on an enemy within the far distance. A creature with Aggression between the low and high limits neither moves in nor backs away."
source = "JA: a Jedi NPC's fighting distance"
see = "sim::combat::pace::Pace::way"

[blades.distance.far_above]
name = "Advance From Afar"
type = "i8"
value = 0
range = [0, 20]
summary = "A creature with more than {ai.blades.distance.far_above} Aggression runs toward an enemy that is beyond the far distance."
source = "JA: a Jedi NPC's fighting distance"
see = "sim::combat::pace::Pace::way"

[blades.circling]
title = "Circling"
summary = """
When a creature is not already circling, there is a 1 in
({ai.blades.circling.odds} + 1) chance that it starts. A circling creature
walks sideways for {ai.blades.circling.strafe_ms[0]:s} to
{ai.blades.circling.strafe_ms[1]:s}. It then waits up to
{ai.blades.circling.after_ms[1]:s} before it can circle again.

When the creature does not start circling, it waits
{ai.blades.circling.wait_ms[0]:s} to {ai.blades.circling.wait_ms[1]:s}
before it tries again. A creature never circles toward a wall or a ledge.
"""

[blades.circling.odds]
name = "Circling Chance"
type = "i64"
value = 4
range = [0, 50]
summary = "Each time a creature tries, there is a 1 in ({ai.blades.circling.odds} + 1) chance that it starts to circle."
source = "JA: a Jedi NPC's combat timers"
see = "sim::combat::pace::Pace::decide"

[blades.circling.strafe_ms]
name = "Circling Duration"
type = "u64"
value = [1000, 3000]
labels = ["least", "most"]
unit = "ms"
range = [0, 20000]
summary = "A circling creature walks sideways around its enemy for {ai.blades.circling.strafe_ms[0]:s} to {ai.blades.circling.strafe_ms[1]:s}."
source = "JA: a Jedi NPC's strafing"
see = "sim::combat::pace::Pace::decide"

[blades.circling.after_ms]
name = "Delay After Circling"
type = "u64"
value = [0, 4000]
labels = ["least", "most"]
unit = "ms"
range = [0, 20000]
summary = "After circling, a creature waits {ai.blades.circling.after_ms[0]:s} to {ai.blades.circling.after_ms[1]:s} before it circles again."
source = "JA: a Jedi NPC's strafing"
see = "sim::combat::pace::Pace::decide"

[blades.circling.wait_ms]
name = "Delay Without Circling"
type = "u64"
value = [1000, 3000]
labels = ["least", "most"]
unit = "ms"
range = [0, 20000]
summary = "A creature that chose not to circle waits {ai.blades.circling.wait_ms[0]:s} to {ai.blades.circling.wait_ms[1]:s} before it tries again."
source = "JA: a Jedi NPC's combat timers"
see = "sim::combat::pace::Pace::decide"

[blades.circling.turn_limit]
name = "Circling Turn Limit"
value = 60.0
unit = "°"
range = [0.0, 180.0]
summary = "A circling creature stops stepping sideways while it would have to turn more than {ai.blades.circling.turn_limit:bare} degrees against its circling direction to keep facing its enemy."
source = "JA: a Jedi NPC's timers"
see = "sim::combat::pace::Pace::finish"

[blades.holds]
title = "Footwork"
summary = """
Once a creature starts moving in a direction, it keeps moving that way for a
while. It keeps moving forward or back for {ai.blades.holds.along_ms[0]:s}
to {ai.blades.holds.along_ms[1]:s}. It keeps moving to a side for
{ai.blades.holds.across_ms[0]:s} to {ai.blades.holds.across_ms[1]:s}.

When a creature wants to reverse its direction, it first stops moving along
that line for {ai.blades.holds.still_ms[0]:s} to
{ai.blades.holds.still_ms[1]:s}.
"""

[blades.holds.along_ms]
name = "Forward or Back"
type = "u64"
value = [500, 2000]
labels = ["least", "most"]
unit = "ms"
range = [0, 10000]
summary = "A creature that starts moving forward or back keeps going for {ai.blades.holds.along_ms[0]:s} to {ai.blades.holds.along_ms[1]:s}."
source = "JA: a Jedi NPC's direction changes"
see = "sim::combat::pace::Pace::hold"

[blades.holds.across_ms]
name = "To the Side"
type = "u64"
value = [250, 1500]
labels = ["least", "most"]
unit = "ms"
range = [0, 10000]
summary = "A creature that starts moving to one side keeps going for {ai.blades.holds.across_ms[0]:s} to {ai.blades.holds.across_ms[1]:s}."
source = "JA: a Jedi NPC's direction changes"
see = "sim::combat::pace::Pace::hold"

[blades.holds.still_ms]
name = "Pause Before Reversing"
type = "u64"
value = [1000, 2000]
labels = ["least", "most"]
unit = "ms"
range = [0, 10000]
summary = "A creature that wants to reverse its direction first stops moving along that line for {ai.blades.holds.still_ms[0]:s} to {ai.blades.holds.still_ms[1]:s}."
source = "JA: a Jedi NPC's direction changes"
see = "sim::combat::pace::Pace::hold"

[blades.holds.again_ms]
name = "Repeat Delay"
type = "u64"
value = [1000, 2000]
labels = ["least", "most"]
unit = "ms"
range = [0, 10000]
summary = "After a creature has kept to a direction, it does not commit to the same direction again for {ai.blades.holds.again_ms[0]:s} to {ai.blades.holds.again_ms[1]:s}."
source = "JA: a Jedi NPC's direction changes"
see = "sim::combat::pace::Pace::hold"

[blades.striking]
title = "Melee Attacks"
summary = """
A creature that is not parrying attacks in three cases. It attacks when its
blade tip touches its enemy. It attacks when the enemy is in view and within
{ai.blades.striking.in_view:m} of the tip. It also attacks when the enemy is
at least {ai.blades.striking.closing_from:m} away, if the two are closing
fast enough to meet within a second.

A creature chains its swings the same way a player does. While attacking,
there is a 1 in ({ai.blades.striking.sidestep_odds} + 1) chance on each
decision that it also steps to one side.
"""

[blades.striking.in_view]
name = "Striking Range"
value = 32.0
unit = "units"
range = [0.0, 256.0]
summary = "A creature attacks an enemy that is in view and within {ai.blades.striking.in_view:m} of its blade tip."
source = "JA: a Jedi NPC's attack decision"
see = "sim::combat::pace::Pace::finish"

[blades.striking.closing_from]
name = "Closing Range"
value = 64.0
unit = "units"
range = [0.0, 1024.0]
summary = "A creature at least {ai.blades.striking.closing_from:m} from its enemy attacks when the two are closing fast enough to meet within a second."
source = "JA: a Jedi NPC's attack decision"
see = "sim::combat::pace::Pace::finish"

[blades.striking.sidestep_odds]
name = "Sidestep Chance"
type = "i64"
value = 3
range = [0, 50]
summary = "While attacking, there is a 1 in ({ai.blades.striking.sidestep_odds} + 1) chance on each decision that a creature also steps to one side."
source = "JA: a Jedi NPC's attack decision"
see = "sim::combat::pace::Pace::finish"

[blades.parrying]
title = "Parrying and Stepping Aside"
summary = """
A creature parries at once when its enemy swings within parry reach, unless
the creature is swinging itself. Otherwise, the creature may make a defense
roll against the enemy's blade. It tries more often when the enemy is
swinging and when the enemy comes straight at it.

A low roll does nothing. A middle roll makes the creature parry. A high roll
makes it run to one side. A parry keeps the creature's blade raised for
{ai.blades.parrying.parry_ms:s}, and the creature does not attack during
that time.
"""

[blades.parrying.parry_ms]
name = "Parry Duration"
type = "u64"
value = 200
unit = "ms"
range = [0, 2000]
summary = "A parry keeps a creature's blade raised for {ai.blades.parrying.parry_ms:s}."
source = "JA: a Jedi NPC's parry time"
see = "sim::combat::pace::Pace::parry"

[blades.parrying.half_odds]
name = "Short Parry Chance"
type = "i64"
value = 2
range = [0, 20]
summary = "There is a 1 in ({ai.blades.parrying.half_odds} + 1) chance that a parry lasts only half as long."
source = "JA: a Jedi NPC's parry time"
see = "sim::combat::pace::Pace::parry"

[blades.parrying.hit_lock_ms]
name = "Parry Recovery"
type = "u64"
value = 200
unit = "ms"
range = [0, 2000]
summary = "A creature hurt while its enemy wields a lightsaber cannot start a new parry for {ai.blades.parrying.hit_lock_ms:s}."
source = "JA"
see = "sim::combat::pace::Pace::events"

[blades.parrying.chance]
name = "Defense Chance"
type = "i64"
value = [90, 30]
labels = ["the enemy swings", "the enemy only advances"]
unit = "%"
range = [0, 100]
summary = "A creature tries a defense roll {ai.blades.parrying.chance[0]} of the time when its enemy swings, and {ai.blades.parrying.chance[1]} of the time when its enemy only moves toward it."
source = "JA: a Jedi NPC's evasion"
see = "sim::combat::pace::Pace::evade"

[blades.parrying.squareness]
name = "Approach Angle"
value = 0.25
range = [0.0, 1.0]
summary = "A creature tries a defense only against an enemy that comes at it fairly directly. On a scale where 1 is straight at the creature and 0 is straight across its path, the enemy must score more than {ai.blades.parrying.squareness}. The more directly the enemy comes, the more often the creature tries."
source = "JA: a Jedi NPC's evasion"
see = "sim::combat::pace::Pace::evade"

[blades.parrying.roll]
name = "Step Aside Roll"
type = "i64"
value = 10
range = [0, 100]
summary = "In some cases a creature can only step aside, and it does so only when a roll from 0 to {ai.blades.parrying.roll} equals or beats its Aggression. These cases are when the creature is swinging, when its enemy is beyond the defense reach, and when its enemy is not swinging. In the last two cases, the enemy must also be moving."
source = "JA: a Jedi NPC's evasion"
see = "sim::combat::pace::Pace::evade"

[blades.parrying.reach]
name = "Defense Reach"
value = 80.0
unit = "units"
range = [0.0, 512.0]
summary = "When the enemy is farther than {ai.blades.parrying.reach:m}, or is not swinging, a creature's only defense is to step aside."
source = "JA: a Jedi NPC's evasion"
see = "sim::combat::pace::Pace::evade"

[blades.parrying.facing]
name = "Facing Away"
value = 0.5
range = [-1.0, 1.0]
summary = "A creature counts as facing away from its enemy when its facing scores less than {ai.blades.parrying.facing}. On this scale, 1 is facing straight at the enemy and -1 is facing straight away. A creature facing away makes a different defense roll."
source = "JA: a Jedi NPC's evasion"
see = "sim::combat::pace::Pace::evade"

[blades.parrying.close]
name = "Close Defense"
value = 56.0
unit = "units"
range = [0.0, 512.0]
summary = "Within {ai.blades.parrying.close:m}, a creature's defense roll starts at its Aggression instead of at a fixed number. A creature with more Aggression is therefore less likely to roll too low to defend, and parries more often."
source = "JA: a Jedi NPC's evasion"
see = "sim::combat::pace::Pace::evade"

[blades.parrying.turned_away]
name = "Facing Away Roll"
type = "i64"
value = [5, 16]
labels = ["least", "most"]
range = [0, 100]
summary = "A creature facing away from its enemy rolls from {ai.blades.parrying.turned_away[0]} to {ai.blades.parrying.turned_away[1]} for its defense."
source = "JA: a Jedi NPC's evasion"
see = "sim::combat::pace::Pace::evade"

[blades.parrying.close_most]
name = "Close Defense Roll"
type = "i64"
value = 12
range = [0, 100]
summary = "A creature close to its enemy rolls from its Aggression up to {ai.blades.parrying.close_most} for its defense."
source = "JA: a Jedi NPC's evasion"
see = "sim::combat::pace::Pace::evade"

[blades.parrying.open]
name = "Defense Roll"
type = "i64"
value = [2, 16]
labels = ["least", "most"]
range = [0, 100]
summary = "In every other case, a creature rolls from {ai.blades.parrying.open[0]} to {ai.blades.parrying.open[1]} for its defense."
source = "JA: a Jedi NPC's evasion"
see = "sim::combat::pace::Pace::evade"

[blades.parrying.kick_most]
name = "No Defense"
type = "i64"
value = 3
range = [0, 100]
summary = "A defense roll of {ai.blades.parrying.kick_most} or less does nothing."
source = "JA: a Jedi NPC's evasion"
see = "sim::combat::pace::Pace::evade"

[blades.parrying.parry_most]
name = "Parry Roll"
type = "i64"
value = 12
range = [0, 100]
summary = "A defense roll above that, up to {ai.blades.parrying.parry_most}, makes the creature parry. A higher roll makes it step aside."
source = "JA: a Jedi NPC's evasion"
see = "sim::combat::pace::Pace::evade"

[blades.parrying.strafe_odds]
name = "Step Aside Chance"
type = "i64"
value = 5
range = [0, 50]
summary = "When a creature would step aside, there is a 1 in ({ai.blades.parrying.strafe_odds} + 1) chance that it does not."
source = "JA: a Jedi NPC's evasion"
see = "sim::combat::pace::Pace::evade"

[blades.parrying.strafe_ms]
name = "Step Aside Duration"
type = "u64"
value = [300, 1000]
labels = ["least", "most"]
unit = "ms"
range = [0, 10000]
summary = "A creature steps aside from a blade at a run for {ai.blades.parrying.strafe_ms[0]:s} to {ai.blades.parrying.strafe_ms[1]:s}."
source = "JA: a Jedi NPC's evasion"
see = "sim::combat::pace::Pace::evade"

[blades.parrying.after_ms]
name = "Delay After Stepping Aside"
type = "u64"
value = [0, 1000]
labels = ["least", "most"]
unit = "ms"
range = [0, 10000]
summary = "After stepping aside, a creature waits {ai.blades.parrying.after_ms[0]:s} to {ai.blades.parrying.after_ms[1]:s} before it steps aside again."
source = "JA: a Jedi NPC's evasion"
see = "sim::combat::pace::Pace::evade"

[gunners]
title = "Ranged Combat"
summary = """
A creature or party member with a ranged weapon moves until its target is
within its weapon's range. It then faces the target and fires while it can
see it. Its first shots spread wide, and they become more accurate as it
keeps firing.

Every few seconds, the creature checks that it can still see its target. If
it cannot, it runs to a spot with a view of the target and waits a moment
there before it fires again. It never backs away from an enemy with a melee
weapon. In a cutscene, and in a fight between creatures outside the party,
it stands its ground.
"""
applies = ["kind:blaster", "kind:rifle", "kind:pistol", "kind:heavy", "kind:creature", "kind:companion"]

[gunners.aim]
title = "Accuracy"
summary = """
A creature's accuracy is a number from {ai.gunners.aim.worst} to
{ai.gunners.aim.best}. It starts low against each new target. Every
{ai.gunners.aim.every_ms[0]:s} to {ai.gunners.aim.every_ms[1]:s}, accuracy
changes by {ai.gunners.aim.settle} while the creature can see its target,
and by {ai.gunners.aim.lose} while it cannot.

A shot can stray from the target by up to {ai.gunners.spread.base:bare}
degrees, plus {ai.gunners.spread.per_aim:bare} degrees for each point of
accuracy below {ai.gunners.spread.par}. However accurate the creature is, a
shot can always stray at least {ai.gunners.spread.floor:bare} degrees.
"""

[gunners.aim.best]
name = "Best Accuracy"
type = "i8"
value = 3
range = [-50, 6]
summary = "A creature's accuracy never rises above {ai.gunners.aim.best}."
source = "JA: the NPC stats' default"
see = "sim::combat::troop::Troop::adjust_aim"

[gunners.aim.worst]
name = "Worst Accuracy"
type = "i8"
value = -30
range = [-100, 0]
summary = "A creature's accuracy never falls below {ai.gunners.aim.worst}."
source = "JA"
see = "sim::combat::troop::Troop::adjust_aim"

[gunners.aim.foe_start]
name = "Enemy Starting Accuracy"
type = "i64"
value = [12, 3]
labels = ["most below the best", "least below the best"]
range = [0, 50]
summary = "Against a new target, a hostile creature's accuracy starts below its best. The shortfall is between {ai.gunners.aim.foe_start[1]} and {ai.gunners.aim.foe_start[0]} points, multiplied by {ai.gunners.aim.foe_times}."
source = "JA: an NPC's aim"
see = "sim::combat::troop::Troop::rate"

[gunners.aim.foe_times]
name = "Enemy Accuracy Penalty"
type = "i64"
value = 2
range = [0, 10]
summary = "A hostile creature's starting shortfall in accuracy is multiplied by {ai.gunners.aim.foe_times}."
source = "JA: an NPC's aim"
see = "sim::combat::troop::Troop::rate"

[gunners.aim.ally_start]
name = "Party Member Starting Accuracy"
type = "i64"
value = [5, 1]
labels = ["most below the best", "least below the best"]
range = [0, 50]
summary = "Against a new target, a party member's accuracy starts between {ai.gunners.aim.ally_start[1]} and {ai.gunners.aim.ally_start[0]} points below its best."
source = "JA: an NPC's aim"
see = "sim::combat::troop::Troop::rate"
applies = ["kind:companion"]

[gunners.aim.every_ms]
name = "Accuracy Interval"
type = "u64"
value = [700, 1700]
labels = ["least", "most"]
unit = "ms"
range = [50, 10000]
summary = "A creature's accuracy changes every {ai.gunners.aim.every_ms[0]:s} to {ai.gunners.aim.every_ms[1]:s}."
source = "JA: an NPC's aim"
see = "sim::combat::troop::Troop::adjust_aim"

[gunners.aim.settle]
name = "Accuracy Gain"
type = "i8"
value = 2
range = [-10, 10]
summary = "Each time a creature's accuracy changes, it changes by {ai.gunners.aim.settle} if the creature can see its target."
source = "JA: an NPC's aim"
see = "sim::world::minds::shoot"

[gunners.aim.lose]
name = "Accuracy Loss"
type = "i8"
value = -1
range = [-10, 10]
summary = "Each time a creature's accuracy changes, it changes by {ai.gunners.aim.lose} if the creature cannot see its target."
source = "JA: an NPC's aim"
see = "sim::world::minds::shoot"

[gunners.spread]
title = "Shot Spread"
summary = "How far a creature's shot can stray from its target depends on the creature's accuracy."

[gunners.spread.base]
name = "Base Spread"
value = 0.5
unit = "°"
range = [0.0, 30.0]
summary = "A shot fired at {ai.gunners.spread.par} accuracy can stray up to {ai.gunners.spread.base:bare} degrees."
source = "JA: an NPC's blaster spread"
see = "sim::combat::troop::spread"

[gunners.spread.par]
name = "Base Accuracy"
type = "i8"
value = 6
range = [-50, 50]
summary = "A shot fired at {ai.gunners.spread.par} accuracy strays only by the base spread."
source = "JA"
see = "sim::combat::troop::spread"

[gunners.spread.per_aim]
name = "Spread per Point"
value = 0.25
unit = "°"
range = [0.0, 5.0]
summary = "A shot can stray {ai.gunners.spread.per_aim:bare} degrees farther for each point of accuracy below {ai.gunners.spread.par}."
source = "JA"
see = "sim::combat::troop::spread"

[gunners.spread.floor]
name = "Least Spread"
value = 4.0
unit = "°"
range = [0.0, 30.0]
summary = "However accurate a creature is, its shots can always stray at least {ai.gunners.spread.floor:bare} degrees to either side."
source = "the owner's balance, 2026-10-12"
see = "sim::combat::troop::spread"

[gunners.spacing_ms]
name = "Rate of Fire"
type = "u64"
value = [1000, 750, 1000, 1000]
labels = ["pistol", "rifle and bowcaster", "repeating blaster (after a burst)", "disruptor, ion and sonic"]
unit = "ms"
range = [50, 10000]
summary = "A creature fires once every {ai.gunners.spacing_ms[0]:s} with a pistol, once every {ai.gunners.spacing_ms[1]:s} with a rifle or bowcaster, and once every {ai.gunners.spacing_ms[3]:s} with a disruptor, ion or sonic weapon. With a repeating blaster, it waits {ai.gunners.spacing_ms[2]:s} between bursts."
detail = "A player fires at the weapon's own rate."
source = "JA: NPC weapon changes"
see = "sim::combat::troop::spacing"
applies = ["baseitem:Blaster_Pistol", "baseitem:Heavy_Blaster", "baseitem:Hold_Out_Blaster", "baseitem:Ion_Blaster", "baseitem:Disrupter_Pistol", "baseitem:Sonic_Pistol", "baseitem:Blaster_Rifle", "baseitem:Ion_Rifle", "baseitem:Bowcaster", "baseitem:Blaster_Carbine", "baseitem:Disrupter_Rifle", "baseitem:Sonic_Rifle", "baseitem:Repeating_Blaster", "baseitem:Heavy_Repeating_Blaster"]

[gunners.burst]
name = "Repeating Blaster Burst"
type = "u8"
value = [3, 10]
labels = ["least", "most"]
unit = "shots"
range = [1, 50]
summary = "A creature with a repeating blaster fires bursts of {ai.gunners.burst[0]:bare} to {ai.gunners.burst[1]}."
source = "JA: NPC weapon changes"
see = "sim::combat::troop::spacing"
applies = ["baseitem:Repeating_Blaster", "baseitem:Heavy_Repeating_Blaster"]

[gunners.jitter_ms]
name = "Fire Rate Variance"
type = "i64"
value = 150
unit = "ms"
range = [0, 1000]
summary = "The time between a creature's shots can be up to {ai.gunners.jitter_ms:s} longer or shorter than normal."
source = "JA: NPC shooting"
see = "sim::combat::troop::Troop::fire"

[gunners.damage_share]
name = "Ranged Damage"
type = "u64"
value = 600
unit = "‰"
range = [100, 2000]
summary = "A creature's shots deal {ai.gunners.damage_share:pct} of the damage per second that the same creature would deal in KOTOR's rounds of combat."
source = "the owner's balance, 2026-10-12"
see = "sim::combat::troop::paced"

[gunners.pair_spacing]
name = "Two Pistols' Rate of Fire"
type = "u64"
value = 500
unit = "‰"
range = [100, 1000]
summary = "A creature with a pistol in each hand fires its two pistols in turn. The time between its shots is {ai.gunners.pair_spacing:pct} of the time between a single pistol's shots. Each shot deals the damage of a normal pistol shot."
detail = "In KOTOR, a character with two pistols makes one attack with each hand every round."
source = "KOTOR, the off hand's attack (reone's dual pistols)"
see = "sim::combat::troop::Troop::fire"

[gunners.sight_check_ms]
name = "Line of Sight Check"
type = "u64"
value = [3000, 7000]
labels = ["least", "most"]
unit = "ms"
range = [100, 60000]
summary = "Every {ai.gunners.sight_check_ms[0]:s} to {ai.gunners.sight_check_ms[1]:s}, a creature checks that it can see its target. If it cannot, it moves to a spot with a view of the target."
source = "JA: stormtroopers' AI"
see = "sim::world::minds::shoot"

[gunners.settle_ms]
name = "Firing Delay"
type = "u64"
value = [250, 500]
labels = ["least", "most"]
unit = "ms"
range = [0, 10000]
summary = "A creature that reaches a new firing position waits {ai.gunners.settle_ms[0]:s} to {ai.gunners.settle_ms[1]:s} before it fires."
source = "JA: stormtroopers' AI"
see = "sim::world::minds::shoot"

[gunners.replan_share]
name = "New Path"
value = 0.75
unit = "×"
range = [0.0, 1.0]
summary = "A creature moving into range plans a new path when its target has moved {ai.gunners.replan_share:bare} times its weapon's range."
source = "ours"
see = "sim::world::minds::shoot"

[gunners.spots]
title = "Firing Positions"
summary = """
A creature that cannot see its target looks for a new spot to fire from. It
checks sixteen directions around itself at several distances, nearest first.
A usable spot is open, reachable, in sight of the target, and no closer to
the target than {ai.gunners.spots.avoid:m}. A spot that the target cannot
see is chosen before a spot in the open.
"""

[gunners.spots.rings]
name = "Search Distance"
value = [128.0, 256.0, 384.0, 512.0, 768.0, 1024.0]
unit = "units"
range = [0.0, 8192.0]
summary = "A creature looks for a firing position at {ai.gunners.spots.rings:m} from itself, nearest first."
source = "ours"
see = "sim::world::minds::spot_for"

[gunners.spots.avoid]
name = "Distance From Target"
value = 200.0
unit = "units"
range = [0.0, 2048.0]
summary = "A firing position is never within {ai.gunners.spots.avoid:m} of the target."
source = "ours"
see = "sim::world::minds::spot_for"

[gunners.spots.taken]
name = "Occupied"
value = 1.5
unit = "×"
range = [0.0, 10.0]
summary = "A firing position within {ai.gunners.spots.taken:bare} body widths of another creature counts as taken."
source = "ours"
see = "sim::world::minds::spot_for"

[gunners.spots.reached]
name = "Arrival"
value = 2.0
unit = "×"
range = [0.5, 10.0]
summary = "A creature has reached its firing position when it is within {ai.gunners.spots.reached:bare} times its usual stopping distance of it."
source = "ours"
see = "sim::world::minds::SPOT_REACHED"

[duelling]
title = "Duelling Behavior"
summary = """
Under the Advanced rules, a creature with a melee weapon spends its Stamina
on special moves only while it keeps enough to stay out of a guard break.
"""
applies = ["kind:lightsaber", "kind:melee", "kind:creature"]

[duelling.special_keep]
name = "Stamina Kept Back"
type = "i32"
value = 40
unit = "points"
range = [0, 100]
summary = "A creature starts a special move only if it would still have at least {ai.duelling.special_keep:bare} Stamina after paying for it. A creature therefore does not tire itself out into a guard break by its own choice."
source = "the owner's call of 13 November 2026, docs/superpowers/specs/2026-11-13-advanced-enemy-pacing-design.md section 11"
see = "sim::combat::pace::ai_may_special"

[duelling.walk_within]
name = "Walking Distance"
value = 118.0
unit = "units"
range = [16.0, 512.0]
summary = "Under the Advanced rules, a creature within {ai.duelling.walk_within:m} of a target walks instead of running. The balance bench counts the time a fighter spends this close to the other side."
source = "the owner's call of 13 November 2026, docs/superpowers/specs/2026-11-13-advanced-enemy-pacing-design.md section 2"
see = "sim::combat::pace::WALK_WITHIN"
