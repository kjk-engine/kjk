summary = "A hostile creature's accuracy starts {ai.gunners.aim.foe_start[1]} to {ai.gunners.aim.foe_start[0]} below its best against a new target, multiplied by {ai.gunners.aim.foe_times}."
source = "JA: an NPC's aim"
see = "sim::combat::troop::Troop::rate"

[gunners.aim.foe_times]
