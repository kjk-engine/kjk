A companion chooses its own Force powers and grenades in a fight. Where no
scripts run, every creature chooses its own Force powers, items and grenades
in the same way. The companion scores each power and grenade it can use from 0 to 1. The score
depends on what the companion sees of its target, its allies and the fight.
The companion uses the power or grenade with the best score when that score
is at least {ai.choices.threshold:bare}. After each use the companion waits
before it uses another. Its tier sets how long it waits.
"""
applies = ["kind:creature", "kind:companion", "kind:force", "kind:grenade"]

[choices.threshold]
name = "Score Needed to Use a Choice"
value = 0.5
range = [0.0, 1.0]
summary = "A character uses a Force power, an item or a grenade of its own choice only when the choice scores at least {ai.choices.threshold:bare} out of 1."
source = "the designer's call of 18 November 2026, docs/superpowers/specs/2026-11-18-combat-ai-choices-design.md section The chooser"
see = "sim::combat::choose::choose"

[choices.tie]
name = "Scores That Tie"
value = 0.1
range = [0.0, 1.0]
summary = "Two choices whose scores differ by at most {ai.choices.tie:bare} count as equally good. The character then picks one of them at random, so that it does not always use the same one."
source = "the designer's call of 18 November 2026, docs/superpowers/specs/2026-11-18-combat-ai-choices-design.md section The chooser"
see = "sim::combat::choose::choose"

[choices.wait_ms]
title = "Wait After a Choice"
summary = """
A character that has used a Force power, an item or a grenade of its own
choice waits before it uses another. The wait is a time between a least and a
most number that its tier sets.
"""

[choices.wait_ms.ordinary]
name = "Wait of an Ordinary Creature"
type = "u64"
value = [8000, 12000]
labels = ["least", "most"]
unit = "ms"
range = [0, 120000]
summary = "An Ordinary creature waits {ai.choices.wait_ms.ordinary[0]:s} to {ai.choices.wait_ms.ordinary[1]:s} after a choice before it makes another."
source = "the designer's call of 18 November 2026, docs/superpowers/specs/2026-11-18-combat-ai-choices-design.md section Waits"
see = "sim::combat::choose::wait_ms"

