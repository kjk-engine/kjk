[blades.parrying]
title = "Parrying and Evading"
summary = """
A creature parries an enemy blade that swings within its parry reach, unless
it is swinging itself. Otherwise it rolls a defense against the enemy's
blade, more often when the enemy swings and when the enemy comes straight at
it. A low roll does nothing, a middle roll parries and a high roll steps
aside at a run. A parry holds the creature's blade up, with no attack, for
{ai.blades.parrying.parry_ms:s}.
"""

[blades.parrying.parry_ms]
name = "Parry Duration"
type = "u64"
value = 200
unit = "ms"
range = [0, 2000]
summary = "A parry holds a creature's blade up for {ai.blades.parrying.parry_ms:s}."
source = "JA: a Jedi NPC's parry time"
see = "sim::combat::pace::Pace::parry"

[blades.parrying.half_odds]
name = "Short Parry Chance"
type = "i64"
value = 2
range = [0, 20]
summary = "A parry lasts half as long 1 time in {ai.blades.parrying.half_odds} + 1."
source = "JA: a Jedi NPC's parry time"
see = "sim::combat::pace::Pace::parry"

[blades.parrying.hit_lock_ms]
