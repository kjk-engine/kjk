summary = "A creature attacks from {ai.blades.striking.closing_from:m} away when it and its enemy close on each other quickly."
source = "JA: a Jedi NPC's attack decision"
see = "sim::combat::pace::Pace::finish"

[blades.striking.sidestep_odds]
