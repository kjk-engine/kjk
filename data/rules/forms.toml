[costs]
title = "Force Forms II and IV: Force Potency and Force Mastery"
summary = """
Force powers used under Force Potency or Force Mastery cost
{forms.costs.multiplier:bare} times their normal Force points, rounded down. The
powers' increased effects are the powers' own.
"""
applies = ["spell:FORM_FORCE_II_POTENCY", "spell:FORM_FORCE_IV_MASTERY"]

[costs.multiplier]
name = "Potency and Mastery Cost"
value = 1.2
unit = "×"
range = [0, 5]
summary = "Force Potency and Force Mastery: Force powers cost {forms.costs.multiplier:bare} times as many Force points."
source = "TSL's executable (`CSWSpell::GetAdjustedForcePoints`)"
see = "sim::combat::forms::cost"
applies = ["spell:FORM_FORCE_II_POTENCY", "spell:FORM_FORCE_IV_MASTERY"]
