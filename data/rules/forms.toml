[chapter]
title = "Lightsaber Forms and Force Forms"
order = 32
summary = """
A Jedi learns lightsaber Forms and Force Forms from his or her class at
levels 11 to 14, and from the Masters. A Form is chosen from the Form slot
at any time. Changing Forms takes no action and costs no Force points.
"""
detail = """
A lightsaber Form has effect only while a lightsaber is wielded in the main
hand. A Force Form is always in effect.
"""

[shii_cho]
title = "Form I: Shii-Cho"
summary = """
The Determination Form. Attack Modifier: +{forms.shii_cho.to_hit:bare}
Defense vs. other attackers: +{forms.shii_cho.defence_others:bare}
"""
applies = ["spell:FORM_SABER_I_SHII_CHO"]

[shii_cho.to_hit]
name = "Shii-Cho Attack Modifier"
value = 1
range = [-20, 20]
summary = "Shii-Cho Attack Modifier: +{forms.shii_cho.to_hit:bare}"
source = "TSL's executable"
see = "sim::combat::forms::to_hit"
applies = ["spell:FORM_SABER_I_SHII_CHO"]

[shii_cho.defence_others]
name = "Shii-Cho Defense"
value = 3
range = [-20, 20]
summary = "Shii-Cho grants +{forms.shii_cho.defence_others:bare} Defense against every attacker but the character's current target."
source = "TSL's executable"
see = "sim::combat::forms::defence"
applies = ["spell:FORM_SABER_I_SHII_CHO"]

[makashi]
title = "Form II: Makashi"
summary = """
The Contention Form. Attack Modifier: +{forms.makashi.to_hit_saber:bare}
(only if target is wielding a lightsaber) Damage:
+{forms.makashi.damage:bare} Blaster Bolt Deflection:
{forms.makashi.deflection:bare}
"""
applies = ["spell:FORM_SABER_II_MAKASHI"]

[makashi.to_hit_saber]
name = "Makashi Attack Modifier"
value = 3
range = [-20, 20]
summary = "Makashi Attack Modifier: +{forms.makashi.to_hit_saber:bare}, only if the target is wielding a lightsaber."
source = "TSL's executable"
see = "sim::combat::forms::to_hit"
applies = ["spell:FORM_SABER_II_MAKASHI"]

[makashi.damage]
name = "Makashi Damage"
type = "i8"
value = 3
unit = "HP"
range = [-20, 20]
summary = "Makashi Damage: +{forms.makashi.damage:bare}"
source = "TSL's executable"
see = "sim::combat::forms::weapon"
applies = ["spell:FORM_SABER_II_MAKASHI"]

[makashi.deflection]
name = "Makashi Bolt Deflection"
type = "i8"
value = -5
range = [-20, 20]
summary = "Makashi Blaster Bolt Deflection: {forms.makashi.deflection:bare}"
source = "TSL's executable"
see = "sim::combat::forms::deflection"
applies = ["spell:FORM_SABER_II_MAKASHI"]

[soresu]
title = "Form III: Soresu"
summary = """
The Resilience Form. Defense vs. Current Target:
+{forms.soresu.defence_target:bare} Blaster Bolt Deflection:
+{forms.soresu.deflection:bare} Weapon Threat Range:
-{forms.soresu.threat:bare}
"""
detail = "The threat range never narrows past a natural 20."
applies = ["spell:FORM_SABER_III_SORESU"]

[soresu.defence_target]
name = "Soresu Defense"
value = 2
range = [-20, 20]
summary = "Soresu Defense vs. Current Target: +{forms.soresu.defence_target:bare}"
source = "TSL's executable"
see = "sim::combat::forms::defence"
applies = ["spell:FORM_SABER_III_SORESU"]

[soresu.threat]
name = "Soresu Threat Range"
type = "u8"
value = 1
range = [0, 19]
summary = "Soresu Weapon Threat Range: -{forms.soresu.threat:bare}"
source = "TSL's executable"
see = "sim::combat::forms::weapon"
applies = ["spell:FORM_SABER_III_SORESU"]

[soresu.deflection]
name = "Soresu Bolt Deflection"
type = "i8"
value = 4
range = [-20, 20]
summary = "Soresu Blaster Bolt Deflection: +{forms.soresu.deflection:bare}"
source = "TSL's executable"
see = "sim::combat::forms::deflection"
applies = ["spell:FORM_SABER_III_SORESU"]

