[chapter]
title = "Movement"
order = 70
summary = """
This chapter covers running, jumping, crouching, rolling and falling. Each
character walks and runs at its own speeds, both in combat and out of it (see
Movement Speed).
"""

[ground]
title = "On the Ground"
summary = """
On the ground, friction slows a character down, and moving speeds it up. A
character stops quickly once it stops trying to move.
"""
applies = ["kind:player", "kind:creature"]

[ground.stop_speed]
name = "Stopping Speed"
value = 100.0
unit = "units/s"
range = [1.0, 500.0]
summary = "Friction slows a character that moves slower than {movement.ground.stop_speed:m} as much as if it moved at {movement.ground.stop_speed:m}. This makes the character stop quickly."
source = "JA: ground friction"
see = "sim::motion::Move::friction"

[ground.friction]
name = "Ground Friction"
value = 6.0
range = [0.5, 20.0]
summary = "Each second, friction takes away {movement.ground.friction:bare} times a character's speed while it is on the ground."
detail = "A character that is being knocked back is not slowed by friction until the knockback ends."
source = "JA: ground friction"
see = "sim::motion::Move::friction"

[ground.still_below]
name = "Stopped"
value = 1.0
unit = "units/s"
range = [0.0, 10.0]
summary = "A character on the ground that moves slower than {movement.ground.still_below:bare} inch per second stops."
source = "JA: ground friction"
see = "sim::motion::Move::friction"

[ground.accelerate]
name = "Ground Acceleration"
value = 10.0
range = [1.0, 50.0]
summary = "On the ground, a character speeds up by at most {movement.ground.accelerate:bare} times the speed it is trying to reach, each second."
source = "JA: ground acceleration"
see = "sim::motion::Move::ground_move"

[ground.duck_scale]
name = "Crouching Speed"
value = 0.5
unit = "×"
range = [0.1, 1.0]
summary = "A crouching character moves at {movement.ground.duck_scale:bare} times its normal speed. So does a character getting up from a roll."
source = "JA: crouching"
see = "sim::motion::Move::ground_move"

[ground.backward]
name = "Running Backward"
value = 0.75
unit = "×"
range = [0.1, 1.0]
summary = "A character running backward moves at {movement.ground.backward:bare} times its running speed. A character walking backward is not slowed."
source = "JA: movement speed"
see = "sim::motion::Move::set_step_speed"

[ground.dead_slow]
name = "Corpse Slide"
value = 20.0
unit = "units/s"
range = [0.0, 200.0]
summary = "A dead body sliding on the ground loses an extra {movement.ground.dead_slow:m} of speed at each movement step. This makes it come to rest soon."
source = "JA: a dead body's movement"
see = "sim::motion::Move::corpse_slide"

[ground.base_speed]
name = "Run Speed"
value = 250.0
unit = "units/s"
range = [100.0, 600.0]
summary = "The base run speed is {movement.ground.base_speed:m}. The speeds for walking, crouching, running backward and Force Speed are all worked out from this speed. A character that has no walking speeds of its own runs at this speed."
detail = "When the Same Speed in Combat option is off, every character in combat runs at this speed."
source = "JA: base speed"
see = "collision::player::BASE_SPEED"
applies = ["kind:player", "kind:companion", "kind:creature"]

[ground.walkable_normal_z]
name = "Walkable Slope"
value = 0.7
range = [0.3, 1.0]
summary = "A character slides off a slope that is steeper than about 45 degrees. In numbers, the ground must face upward by at least {movement.ground.walkable_normal_z:bare}, where 1 is flat ground."
source = "JA: the player's body numbers"
see = "collision::player::WALKABLE_NORMAL_Z"

[air]
title = "In the Air"
summary = """
A character jumps off the ground at {movement.air.jump_speed:m}. In the air, a
character can change its direction only a little, and gravity pulls it down.
"""
applies = ["kind:player", "kind:creature"]

[air.air_accelerate]
name = "Air Control"
value = 1.0
range = [0.0, 20.0]
summary = "In the air, a character changes its speed by at most {movement.air.air_accelerate:bare} times the speed it is trying to reach, each second. A character that is knocked back on the ground steers the same way."
source = "JA: air acceleration"
see = "sim::motion::Move::air_move"

[air.jump_speed]
name = "Jump Speed"
value = 225.0
unit = "units/s"
range = [50.0, 600.0]
summary = "A character jumps off the ground at an upward speed of {movement.air.jump_speed:m}."
detail = "Holding the jump key down does not make the character jump again. A Force jump goes higher."
source = "JA: jumping"
see = "sim::motion::Move::jump_check"

[air.thrown_off]
name = "Leaving the Ground"
value = 10.0
unit = "units/s"
range = [0.0, 100.0]
summary = "A character that rises faster than {movement.air.thrown_off:m} leaves the ground, as it does in a jump."
source = "JA: ground contact"
see = "sim::motion::Move::find_ground"

[air.gravity]
name = "Gravity"
value = 800.0
unit = "units/s²"
range = [200.0, 2000.0]
summary = "Gravity adds {movement.air.gravity:bare} inches per second to a falling character's speed every second."
source = "JA: gravity"
see = "collision::player::GRAVITY"

[body]
title = "Body Size"
summary = """
A character that crouches or rolls is shorter. To stand up again, it needs
enough room above its head.
"""
applies = ["kind:player", "kind:creature"]

[body.crouch_height]
name = "Crouching Height"
value = 16.0
unit = "units"
range = [0.0, 40.0]
summary = "The top of a crouching or rolling character is {movement.body.crouch_height:m} above its center."
source = "JA: crouching"
see = "sim::motion::Move::settle_height"

[body.eye_height]
name = "Eye Height"
value = 36.0
unit = "units"
range = [0.0, 40.0]
summary = "The eyes of a standing or rolling character are {movement.body.eye_height:m} above its center."
source = "JA: view height"
see = "sim::motion::Move::settle_height"

[body.crouch_eye_height]
name = "Crouching Eye Height"
value = 12.0
unit = "units"
range = [-24.0, 36.0]
summary = "The eyes of a crouching character are {movement.body.crouch_eye_height:m} above its center."
source = "JA: crouching"
see = "sim::motion::Move::settle_height"

[body.pitch_max]
name = "View Angle"
type = "i16"
value = 16000
range = [0, 16383]
summary = "The view can tilt up or down by at most {movement.body.pitch_max:bare} out of 16384. A tilt of 16384 would look straight up or straight down."
source = "JA: the view's turn"
see = "sim::motion::view_of"

[body.step_height]
name = "Step Height"
value = 18.0
unit = "units"
range = [4.0, 48.0]
summary = "A character steps up onto a ledge of {movement.body.step_height:m} or less without jumping."
source = "JA: the player's body numbers"
see = "collision::player::STEP_HEIGHT"

[body.half_width]
name = "Body Width"
value = 15.0
unit = "units"
range = [8.0, 32.0]
summary = "A character's body reaches {movement.body.half_width:m} to each side of its center."
source = "JA (the player's body box)"
see = "collision::player::HALF_WIDTH"

[body.sole_z]
name = "Feet"
value = -24.0
unit = "units"
summary = "The soles of a character's feet are at {movement.body.sole_z:m} from its center. The minus sign means below the center."
source = "JA: the body box"
see = "collision::player::SOLE_Z"

[body.stand_height]
name = "Standing Height"
value = 40.0
unit = "units"
range = [20.0, 80.0]
summary = "The top of a standing character is {movement.body.stand_height:m} above its center. A crouching character needs this much room to stand up."
source = "JA: the body box"
see = "collision::player::STAND_HEIGHT"

[keys]
title = "Controls"
summary = "Each movement control reads a value from 0 to 127 in each direction."
applies = ["kind:player"]

[keys.jump_axis]
name = "Jump Pressed"
type = "i8"
value = 10
range = [1, 127]
summary = "The jump control counts as pressed at {movement.keys.jump_axis:bare} or more out of 127. Below that, it counts as released and can be pressed again."
source = "JA: jumping"
see = "sim::motion::Move::jump_check"

[keys.walk_axis]
name = "Walking"
type = "u8"
value = 64
range = [0, 127]
summary = "A movement control pushed past {movement.keys.walk_axis:bare} out of 127 makes the character run, even while the walk key is held down."
source = "JA: the movement step"
see = "sim::motion::Move::run"

[landing]
title = "Landing"
summary = """
The force of a landing is the character's falling speed in inches per second,
squared, then divided by 10,000. A soft landing makes no sound. A harder
landing makes the sound of a footstep. The hardest landings make the sound of
a fall. A crouching character that lands hard enough rolls.
"""
applies = ["kind:player", "kind:creature"]

[landing.soft]
name = "Soft Landing"
value = 1.0
range = [0.0, 10.0]
summary = "A landing with a force under {movement.landing.soft:bare} makes no sound and has no other effect."
source = "JA: landing"
see = "sim::motion::Move::land"

[landing.roll]
name = "Landing Roll"
value = 2.0
range = [0.0, 20.0]
summary = "A crouching character that lands with a force of {movement.landing.roll:bare} or more rolls in the direction it is moving, if there is room."
source = "JA: landing"
see = "sim::motion::Move::land"

[landing.hurt]
name = "Hard Fall"
value = 7.0
range = [1.0, 100.0]
summary = "A landing with a force over {movement.landing.hurt:bare} counts as a hard fall."
source = "JA: landing"
see = "sim::motion::Move::land"

[landing.crouched]
name = "Crouching Landing"
value = 2.0
unit = "×"
range = [1.0, 10.0]
summary = "The landing of a crouching character counts as {movement.landing.crouched:bare} times as hard."
source = "JA: landing"
see = "sim::motion::Move::land"

[landing.hold_speed]
name = "Landing Slide"
value = -200.0
unit = "units/s"
range = [-2000.0, 0.0]
summary = "A character that lands with an upward speed below {movement.landing.hold_speed:m} keeps sliding for {movement.landing.hold_ms:s}. A negative upward speed means the character is falling. Friction does not slow the character during the slide."
source = "JA: ground contact"
see = "sim::motion::Move::find_ground"

[landing.hold_ms]
name = "Landing Slide Time"
value = 250
unit = "ms"
range = [0, 2000]
summary = "After a hard landing, the character keeps its speed for {movement.landing.hold_ms:s}."
source = "JA: ground contact"
see = "sim::motion::Move::find_ground"

[landing.timer]
name = "Landing Animation"
value = 130
unit = "ms"
range = [0, 1000]
summary = "After a landing, the character's legs stay in the landing animation for {movement.landing.timer:s}."
source = "JA: landing"
see = "sim::motion::Move::land"

[landing.fall_drop]
name = "Falling Animation"
value = 64.0
unit = "units"
range = [0.0, 512.0]
summary = "A character that walks off an edge plays its falling animation only if the drop is {movement.landing.fall_drop:m} or more. Stairs and curbs do not make the character fall."
source = "JA: ground contact"
see = "sim::motion::Move::ground_missed"

[rolls]
title = "Rolls"
summary = """
A character rolls when it crouches while running, or when it lands while
crouching. It rolls forward, backward or to the side, in the direction it is
moving. A roll slows down as it ends. A backward roll is slower than the
others. A roll never goes faster than {movement.rolls.most_speed:m}.
"""
applies = ["kind:player", "kind:creature"]

[rolls.room]
name = "Room to Roll"
value = 64.0
unit = "units"
range = [0.0, 256.0]
summary = "A character needs {movement.rolls.room:m} of clear space in the direction of the roll."
source = "JA: rolling"
see = "sim::motion::Move::keyed_roll"

[rolls.from_speed_squared]
name = "Running Roll"
value = 40_000.0
range = [0.0, 1_000_000.0]
summary = "A running character that crouches rolls if its speed in inches per second, squared, is {movement.rolls.from_speed_squared:bare} or more."
source = "JA: walking"
see = "sim::motion::Move::footsteps"

[rolls.late_ms]
name = "End of a Roll"
value = 800
unit = "ms"
range = [0, 5000]
summary = "A roll slows down sharply in its last {movement.rolls.late_ms:s}."
source = "JA: movement speed"
see = "sim::motion::Move::set_step_speed"

[rolls.forward_divisors]
name = "Forward and Side Roll Speed"
type = "f64"
value = [1.5, 5.0]
labels = ["early", "late"]
range = [0.1, 50.0]
summary = "The speed of a forward or side roll is the time it has left, divided by {movement.rolls.forward_divisors[0]:bare}. Near the end of the roll, the time left is divided by {movement.rolls.forward_divisors[1]:bare} instead."
source = "JA: movement speed"
see = "sim::motion::Move::set_step_speed"

[rolls.back_divisors]
name = "Back Roll Speed"
type = "f64"
value = [2.5, 6.0]
labels = ["early", "late"]
range = [0.1, 50.0]
summary = "The speed of a backward roll is the time it has left, divided by {movement.rolls.back_divisors[0]:bare}. Near the end of the roll, the time left is divided by {movement.rolls.back_divisors[1]:bare} instead."
source = "JA: movement speed"
see = "sim::motion::Move::set_step_speed"

[rolls.least_speed]
name = "Slowed Roll"
value = 50.0
unit = "units/s"
range = [0.0, 250.0]
summary = "A character whose speed has been slowed to {movement.rolls.least_speed:m} or less rolls at that slowed speed."
source = "JA: movement speed"
see = "sim::motion::Move::set_step_speed"

[rolls.most_speed]
name = "Roll Top Speed"
value = 600.0
unit = "units/s"
range = [0.0, 2000.0]
summary = "A roll never goes faster than {movement.rolls.most_speed:m}."
source = "JA: movement speed"
see = "sim::motion::Move::set_step_speed"

[footsteps]
title = "Footsteps and Stances"
summary = """
A character stands, walks, runs, crouches or walks while crouched, depending
on how it moves. A character standing on uneven ground lifts one foot so that
both feet meet the floor.
"""
applies = ["kind:player", "kind:creature"]

[footsteps.still_below]
name = "Standing Still"
value = 5.0
unit = "units/s"
range = [0.0, 50.0]
summary = "A character that moves slower than {movement.footsteps.still_below:m}, while no movement key is pressed, stands still."
source = "JA: walking"
see = "sim::motion::Move::footsteps"

[footsteps.cycle]
name = "Footstep Rate"
value = [0.2, 0.4, 0.5]
labels = ["walking", "running", "crouching"]
range = [0.0, 2.0]
summary = "The footstep rate is {movement.footsteps.cycle[0]:bare} for walking, {movement.footsteps.cycle[1]:bare} for running and {movement.footsteps.cycle[2]:bare} for crouching. A higher rate means quicker footsteps."
detail = "A character spinning a staff takes its steps at the walking rate."
source = "JA: the walking bob"
see = "sim::motion::Move::footsteps"

[footsteps.slope_step]
name = "Uneven Ground Stance"
value = 4.0
unit = "units"
range = [1.0, 20.0]
summary = "A character has five stances for uneven ground. Each stance lifts one foot {movement.footsteps.slope_step:m} higher than the one before."
source = "JA: slopes"
see = "sim::motion::Move::slope_stance"

[footsteps.slope_ms]
name = "Uneven Ground Stance Change"
type = "u64"
value = 100
unit = "ms"
range = [0, 1000]
summary = "On uneven ground, the character's stance changes by one step every {movement.footsteps.slope_ms:s}."
source = "JA: slopes"
see = "sim::motion::Move::slope_stance"

[footsteps.slope_back_ms]
name = "Leaving an Uneven Stance"
type = "u64"
value = 8
unit = "ms"
range = [0, 1000]
summary = "When a character in an uneven ground stance starts to move, it lowers its foot by one step every {movement.footsteps.slope_back_ms:s}."
source = "JA: slopes"
see = "sim::motion::Move::slope_return"

[fine]
title = "Tight Spaces"
summary = """
A character caught in a crevice stands in it instead of sliding. A character
that is pushed into a wall is moved to the nearest free spot. A character
climbs a low step with a sloped edge as it would climb any other step.
"""
applies = ["kind:player", "kind:creature"]

[fine.crevice_units]
name = "Crevice"
value = 4.0
unit = "units"
range = [0.0, 32.0]
summary = "A character on a steep slope is in a crevice if it cannot slide {movement.fine.crevice_units:m} down the slope. A character in a crevice stands."
source = "ours, after a note in JA's ground-contact code"
see = "sim::motion::Move::crevice"

[fine.crevice_free]
name = "Crevice Slide"
value = 0.25
range = [0.0, 1.0]
summary = "A character that can slide {movement.fine.crevice_free:bare} of the crevice distance down a steep slope is not in a crevice."
source = "ours"
see = "sim::motion::Move::crevice"

[fine.crevice_heading]
name = "Crevice Heading"
value = 0.5
range = [-1.0, 1.0]
summary = "A character stands in a crevice only if it is standing still, or moving within 60 degrees of straight up the slope. In numbers, its heading up the slope must be {movement.fine.crevice_heading:bare} or more. A character moving any other way slides off."
source = "ours"
see = "sim::motion::Move::crevice"

[fine.unbury_reach]
name = "Freed from a Wall"
value = 48.0
unit = "units"
range = [0.0, 256.0]
summary = "A character that is pushed into a wall is moved to the nearest free spot within {movement.fine.unbury_reach:m}. The free spot can be up to one step higher."
source = "ours"
see = "sim::motion::Move::free_spot"

[fine.unbury_step]
name = "Free Spot Search"
value = 4.0
unit = "units"
range = [1.0, 64.0]
summary = "When a character is pushed into a wall, the game looks for a free spot every {movement.fine.unbury_step:m}, in sixteen directions."
source = "ours"
see = "sim::motion::Move::free_spot"

[fine.stride]
name = "Sloped Step"
value = 8.0
unit = "units"
range = [0.0, 32.0]
summary = "When a step is too steep to climb, the game checks again {movement.fine.stride:m} further ahead. If there is walkable floor there, the character climbs the step."
source = "ours"
see = "sim::motion::Move::stride"

[fine.stride_rise]
name = "Sloped Step Height"
value = 10.0
unit = "units"
range = [0.0, 18.0]
summary = "A character climbs a step with a sloped edge only if the step is at most {movement.fine.stride_rise:m} high. Such a step is a raised floor. Anything higher is a ledge."
source = "ours"
see = "sim::motion::Move::stride"
