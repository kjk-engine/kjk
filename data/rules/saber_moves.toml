[chapter]
title = "Saber Moves"
order = 21
summary = """
A blade's next move is chosen from [Attack], the movement keys and the
style in use. Feats decide which styles a character can use and what each
style's attacks carry. Swords, vibroblades and staves use the same moves as
lightsabers.
"""

[styles]
title = "Styles and Feats"
summary = """
Lightsaber or melee weapon proficiency grants the medium style, and
Critical Strike improves it. Flurry grants the fast style and Power Attack
the strong style. Two weapons fight in the dual style and a double-bladed
weapon in the staff style. A style's level is its offense in clashes and
saber locks.
"""
detail = """
Each style's attacks carry its feat: Power Attack in the strong style,
Critical Strike in the medium style, Flurry in the fast style, where the
extra attack is the style's speed. The dual and staff styles carry no feat,
and their offense is the character's Two-Weapon Fighting tier.
"""
applies = ["kind:lightsaber", "kind:melee", "feat:CRITICAL_STRIKE", "feat:FLURRY", "feat:POWER_ATTACK", "feat:TWO_WEAPON_FIGHTING"]

[styles.medium_levels]
name = "Medium Style Level"
type = "u8"
value = [2, 3, 3]
labels = ["Critical Strike", "Improved", "Master"]
range = [0, 3]
summary = "The medium style's level is {saber_moves.styles.medium_levels[0]} with Critical Strike, {saber_moves.styles.medium_levels[1]} with Improved Critical Strike and {saber_moves.styles.medium_levels[2]} with Master Critical Strike. Without the feat it is 1."
source = "I22 C8, ours"
see = "sim::combat::saber::Kit::level"
applies = ["feat:CRITICAL_STRIKE", "feat:IMPROVED_CRITICAL_STRIKE", "feat:MASTER_CRITICAL_STRIKE"]

[styles.dueling]
name = "Dueling Offense"
type = "u8"
value = 1
range = [0, 3]
summary = "Dueling adds +{saber_moves.styles.dueling} to offense in clashes and saber locks while wielding one blade and nothing in the off hand."
source = "I22 C8, ours"
see = "sim::combat::saber::Kit::offence"
applies = ["feat:DUELING", "feat:ADVANCED_DUELING", "feat:MASTER_DUELING"]

[styles.power_attack]
name = "Power Attack Damage"
type = "i8"
value = [5, 8, 10]
labels = ["Power Attack", "Improved", "Master"]
unit = "HP"
range = [0, 30]
summary = "The strong style adds +{saber_moves.styles.power_attack[0]:bare} damage with Power Attack, +{saber_moves.styles.power_attack[1]:bare} with Improved Power Attack and +{saber_moves.styles.power_attack[2]:bare} with Master Power Attack."
source = "KOTOR's Power Attack (I22 C8)"
see = "sim::combat::saber::Kit::swing"
applies = ["feat:POWER_ATTACK", "feat:IMPROVED_POWER_ATTACK", "feat:MASTER_POWER_ATTACK"]

[styles.power_attack_penalty]
name = "Power Attack Penalty"
type = "i8"
value = 3
range = [0, 10]
summary = "The strong style's Power Attack also has a -{saber_moves.styles.power_attack_penalty} to hit."
source = "KOTOR's Power Attack (I22 C8)"
see = "sim::combat::saber::Kit::swing"
applies = ["feat:POWER_ATTACK", "feat:IMPROVED_POWER_ATTACK", "feat:MASTER_POWER_ATTACK"]

[styles.critical_threat]
name = "Critical Strike Threat"
type = "u8"
value = 2
unit = "×"
range = [1, 5]
summary = "Critical Strike multiplies the medium style's critical threat range by {saber_moves.styles.critical_threat}, and by one more for each of Improved and Master Critical Strike."
source = "KOTOR's Critical Strike (I22 C8)"
see = "sim::combat::saber::Kit::swing"
applies = ["feat:CRITICAL_STRIKE", "feat:IMPROVED_CRITICAL_STRIKE", "feat:MASTER_CRITICAL_STRIKE"]

[styles.flurry_penalty]
name = "Flurry Penalty"
type = "i8"
value = [4, 2]
labels = ["Flurry", "Improved and Master"]
range = [0, 10]
summary = "The fast style's attacks have a -{saber_moves.styles.flurry_penalty[0]} to hit with Flurry and -{saber_moves.styles.flurry_penalty[1]} with Improved or Master Flurry."
source = "KOTOR's Flurry (I22 C8)"
see = "sim::combat::saber::Kit::swing"
applies = ["feat:FLURRY", "feat:IMPROVED_FLURRY"]

[styles.fast_transitions]
name = "Fast Style Recovery"
value = 1.5
unit = "×"
range = [0.25, 4.0]
summary = "The fast style moves between attacks at {saber_moves.styles.fast_transitions} speed."
source = "JA: saber move transitions"
see = "sim::motion::play_speed"

[styles.strong_transitions]
name = "Strong Style Recovery"
value = 0.75
unit = "×"
range = [0.25, 4.0]
summary = "The strong style moves between attacks at {saber_moves.styles.strong_transitions} speed."
source = "JA: saber move transitions"
see = "sim::motion::play_speed"

[costs]
title = "Special Attack Costs"
summary = """
Special attacks cost a percent of the character's maximum Force points, or
of stamina for a character without the Force. A special cannot be made
without enough points.
"""
applies = ["kind:lightsaber", "kind:melee"]

[costs.kata]
name = "Kata Cost"
type = "u16"
value = 50
unit = "%"
range = [0, 100]
summary = "A kata ([Attack] and [Alt attack] held, no movement keys) costs {saber_moves.costs.kata} of maximum Force points."
source = "JA (rulebook 2.12)"
see = "sim::motion::saber"

[costs.forward_back]
name = "Forward and Back Special Cost"
type = "u16"
value = 25
unit = "%"
range = [0, 100]
summary = "The lunge, the flip, Death from Above, the jump and spin attacks, the stab down, the roll stab and the back-flip attack each cost {saber_moves.costs.forward_back} of maximum Force points."
source = "JA (rulebook 2.12)"
see = "sim::motion::saber"

[costs.side]
name = "Side Special Cost"
type = "u16"
value = 10
unit = "%"
range = [0, 100]
summary = "A cartwheel or butterfly costs {saber_moves.costs.side} of maximum Force points."
source = "JA (rulebook 2.12)"
see = "sim::motion::saber"

[timing]
title = "Timing"
summary = """
A blade is ready for its next move when the last one's animation ends. A
parry holds the blade by the character's defense level.
"""
