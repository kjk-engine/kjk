[chapter]
title = "Saber Moves"
order = 21
summary = """
The player chooses a character's next move with [Attack], the movement keys
and the saber style the character is fighting in. A character's feats decide
which styles the character can use and which bonus each style adds to its
attacks. Swords, vibroblades and staves use the same moves as lightsabers.
"""

[styles]
title = "Styles and Feats"
summary = """
A character with proficiency in lightsabers or melee weapons can fight in the
medium style. Critical Strike raises the level of the medium style. Flurry
unlocks the fast style, and Power Attack unlocks the strong style. A
character with a weapon in each hand fights in the dual style. A character
with a double-bladed weapon fights in the staff style. A higher style level
helps a character when two blades clash and in a saber lock. A saber lock is
a contest in which two fighters' blades catch and each fighter pushes against
the other.
"""
detail = """
Each single-blade style adds one feat to its attacks. The strong style adds
Power Attack, the medium style adds Critical Strike and the fast style adds
Flurry. The dual and staff styles add the melee feat that the player chooses
with [Next feat attack]. Until the player chooses one, they add no feat. The
chosen feat does not change the moves of the dual and staff styles. The
level of the dual and staff styles is the character's level in Two-Weapon
Fighting.
"""
applies = ["kind:lightsaber", "kind:melee", "feat:CRITICAL_STRIKE", "feat:FLURRY", "feat:POWER_ATTACK", "feat:TWO_WEAPON_FIGHTING"]

[styles.medium_levels]
name = "Medium Style Level"
type = "u8"
value = [2, 3, 3]
labels = ["Critical Strike", "Improved", "Master"]
range = [0, 3]
summary = "The medium style is level {saber_moves.styles.medium_levels[0]} with Critical Strike, level {saber_moves.styles.medium_levels[1]} with Improved Critical Strike and level {saber_moves.styles.medium_levels[2]} with Master Critical Strike. A character with weapon proficiency but without Critical Strike fights in the medium style at level 1. A character without proficiency fights in it at level 0."
source = "ours"
see = "sim::combat::saber::Kit::level"
applies = ["feat:CRITICAL_STRIKE", "feat:IMPROVED_CRITICAL_STRIKE", "feat:MASTER_CRITICAL_STRIKE"]

[styles.dueling]
name = "Dueling Bonus"
type = "u8"
value = 1
range = [0, 3]
summary = "A character with a Dueling feat adds +{saber_moves.styles.dueling} to the style level in clashes and saber locks. The bonus applies only while the character fights with a single-bladed weapon and has no second blade in the other hand."
source = "ours"
see = "sim::combat::saber::Kit::offence"
applies = ["feat:DUELING", "feat:ADVANCED_DUELING", "feat:MASTER_DUELING"]

[styles.power_attack]
name = "Power Attack Damage"
type = "i8"
value = [5, 8, 10]
labels = ["Power Attack", "Improved", "Master"]
unit = "HP"
range = [0, 30]
summary = "An attack that uses Power Attack deals +{saber_moves.styles.power_attack[0]:bare} damage with Power Attack, +{saber_moves.styles.power_attack[1]:bare} with Improved Power Attack and +{saber_moves.styles.power_attack[2]:bare} with Master Power Attack. Every attack in the strong style uses Power Attack. Attacks in the dual or staff style use it when the player has chosen it."
source = "KOTOR's Power Attack"
see = "sim::combat::saber::Kit::swing"
applies = ["feat:POWER_ATTACK", "feat:IMPROVED_POWER_ATTACK", "feat:MASTER_POWER_ATTACK"]

[styles.power_attack_penalty]
name = "Power Attack Penalty"
type = "i8"
value = 3
range = [0, 10]
summary = "An attack that uses Power Attack also has a -{saber_moves.styles.power_attack_penalty} penalty to hit."
source = "KOTOR's Power Attack"
see = "sim::combat::saber::Kit::swing"
applies = ["feat:POWER_ATTACK", "feat:IMPROVED_POWER_ATTACK", "feat:MASTER_POWER_ATTACK"]

[styles.critical_threat]
name = "Critical Strike Threat"
type = "u8"
value = 2
unit = "×"
range = [1, 5]
summary = "An attack that uses Critical Strike scores a critical hit on a wider range of attack rolls. With Critical Strike, the range is {saber_moves.styles.critical_threat:bare} times the weapon's normal range. Improved Critical Strike and Master Critical Strike each raise the multiplier by 1 more. Every attack in the medium style uses Critical Strike. Attacks in the dual or staff style use it when the player has chosen it."
source = "KOTOR's Critical Strike"
see = "sim::combat::saber::Kit::swing"
applies = ["feat:CRITICAL_STRIKE", "feat:IMPROVED_CRITICAL_STRIKE", "feat:MASTER_CRITICAL_STRIKE"]

[styles.flurry_penalty]
name = "Flurry Penalty"
type = "i8"
value = [4, 2, 1]
labels = ["Flurry", "Improved", "Master"]
range = [0, 10]
summary = "An attack that uses Flurry has a -{saber_moves.styles.flurry_penalty[0]} penalty to hit with Flurry. The penalty is -{saber_moves.styles.flurry_penalty[1]} with Improved Flurry and -{saber_moves.styles.flurry_penalty[2]} with Master Flurry. Every attack in the fast style uses Flurry. Attacks in the dual or staff style use it when the player has chosen it."
detail = "These are KOTOR's numbers. In KOTOR 2, Master Flurry has no penalty."
source = "KOTOR's Flurry, Improved Flurry and Master Flurry descriptions"
see = "sim::combat::saber::Kit::swing"
applies = ["feat:FLURRY", "feat:IMPROVED_FLURRY", "feat:WHIRLWIND_ATTACK"]

[styles.flurry_defence]
name = "Flurry Defense Penalty"
type = "i8"
value = [4, 2, 1]
labels = ["Flurry", "Improved", "Master"]
range = [0, 10]
summary = "Each attack that uses Flurry lowers the attacker's Defense by {saber_moves.styles.flurry_defence[0]} for the next {combat.timing.round_ms:s}. The penalty is {saber_moves.styles.flurry_defence[1]} with Improved Flurry and {saber_moves.styles.flurry_defence[2]} with Master Flurry."
detail = "These are KOTOR's numbers. In KOTOR 2, the penalty is 2 with Flurry, 1 with Improved Flurry and none with Master Flurry. A lower Defense makes the attacker easier to hit, so enemies deal more damage to the attacker."
source = "KOTOR's Flurry, Improved Flurry and Master Flurry descriptions"
see = "sim::combat::saber::Kit::flurry_defence"
applies = ["feat:FLURRY", "feat:IMPROVED_FLURRY", "feat:WHIRLWIND_ATTACK"]

[styles.flurry_pace]
name = "Flurry Extra Attack"
type = "u32"
value = 2000
unit = "‰"
range = [1000, 3000]
summary = "A character fighting in the fast style deals {saber_moves.styles.flurry_pace:pct} of the normal damage with every attack. This stands in for the extra attack each round that Flurry allows in KOTOR."
detail = "In kjk, an attack's damage depends on how much time passes between attacks. Faster swings alone therefore add little damage. The extra damage makes up for Flurry's penalty to hit. The dual and staff styles deal the same extra damage when the player has chosen Flurry for them."
source = "ours, measured to match Critical Strike's gain (`kjk combat duel --only feat_worth`)"
see = "sim::combat::saber::Kit::paced"
applies = ["feat:FLURRY", "feat:IMPROVED_FLURRY"]

[styles.second_attack]
name = "Second Blade Attack"
type = "u16"
value = [1000, 600]
labels = ["Staff", "Dual"]
unit = "‰"
range = [0, 1000]
summary = "Under the Advanced combat rules, every attack in the staff style also attacks with the other end of the double-bladed weapon. That second attack deals {saber_moves.styles.second_attack[0]:pct} of its normal damage. Every attack in the dual style also attacks with the weapon in the off hand, and that attack deals {saber_moves.styles.second_attack[1]:pct} of its normal damage. Each second attack rolls to hit separately."
detail = "Both blades strike in the same swing, so kjk adds the second blade's attack to that swing. This stands in for the second attack each round that KOTOR allows with two weapons. Two-Weapon Fighting's penalties to hit apply to each hand. Two separate blades swing faster and reach farther than the two ends of a staff, so they hit more often. The off-hand attack of the dual style therefore deals less damage than the second attack of the staff style."
source = "KOTOR's two-weapon round (the staff's); the dual style's ours, measured with `kjk combat balance` to keep a pair's damage over a single blade's at KOTOR's"
see = "sim::combat::saber::Style::second_attack"
applies = ["feat:TWO_WEAPON_FIGHTING", "kind:lightsaber", "kind:melee"]

[styles.fast_transitions]
name = "Fast Style Recovery"
value = 1.5
unit = "×"
range = [0.25, 4.0]
summary = "In the fast style, the moves between attacks play at {saber_moves.styles.fast_transitions} the normal speed."
source = "JA: saber move transitions"
see = "sim::motion::play_speed"

[styles.strong_transitions]
name = "Strong Style Recovery"
value = 0.75
unit = "×"
range = [0.25, 4.0]
summary = "In the strong style, the moves between attacks play at {saber_moves.styles.strong_transitions} the normal speed."
source = "JA: saber move transitions"
see = "sim::motion::play_speed"

[costs]
title = "Special Attack Costs"
summary = """
Under Jedi Academy's rules, each special attack uses up a percentage of the
character's maximum Force points. A character without the Force uses up
stamina instead. Under the Advanced rules, every character uses up the same
percentage of their maximum Stamina, and no Force points. A character cannot
make a special attack without enough points left. Under the Advanced rules, a
tired character cannot make one either.
"""
applies = ["kind:lightsaber", "kind:melee"]

[costs.kata]
name = "Kata Cost"
type = "u16"
value = 50
unit = "%"
range = [0, 100]
summary = "A kata is a long special attack sequence. The player makes one by holding [Attack] and [Alt attack] together without a movement key. Under Jedi Academy's rules, a kata uses up {saber_moves.costs.kata} of the character's maximum Force points. Under the Advanced rules, it uses up {saber_moves.costs.kata} of the character's maximum Stamina."
source = "JA (rulebook 2.12)"
see = "sim::motion::saber"

[costs.forward_back]
name = "Forward and Back Special Cost"
type = "u16"
value = 25
unit = "%"
range = [0, 100]
summary = "The lunge, the flip attack, Death from Above, the jump attacks, the spin attacks, the stab down, the roll stab and the back-flip attack each use up {saber_moves.costs.forward_back} of the character's maximum Force points under Jedi Academy's rules, and of the character's maximum Stamina under the Advanced rules."
source = "JA (rulebook 2.12)"
see = "sim::motion::saber"

[costs.side]
name = "Side Special Cost"
type = "u16"
value = 10
unit = "%"
range = [0, 100]
summary = "Under Jedi Academy's rules, a cartwheel or a butterfly uses up {saber_moves.costs.side} of the character's maximum Force points. Under the Advanced rules, it uses up {saber_moves.costs.side} of the character's maximum Stamina."
source = "JA (rulebook 2.12)"
see = "sim::motion::saber"

[timing]
title = "Timing"
summary = """
A character can start the next move when the animation of the last move
ends. After a parry, the character must wait for a time that depends on the
character's defense level. With a lightsaber, the defense level is the
character's level in Jedi Defense. A character proficient with a melee
weapon has defense level 1 with it.
"""
applies = ["kind:lightsaber", "kind:melee"]

[timing.fire_time_ms]
name = "Move Delay"
value = 100
unit = "ms"
range = [0, 1000]
summary = "After a move that has no animation, the character can start the next move {saber_moves.timing.fire_time_ms:s} later."
source = "JA"
see = "sim::motion::saber"

[timing.parry_hold_ms]
name = "Parry Delay"
value = [500, 300, 150, 50]
labels = ["defense 0", "defense 1", "defense 2", "defense 3"]
unit = "ms"
range = [0, 2000]
summary = "After a parry, a character must wait before the next move. The wait is {saber_moves.timing.parry_hold_ms[0]:s} at defense level 0, {saber_moves.timing.parry_hold_ms[1]:s} at level 1, {saber_moves.timing.parry_hold_ms[2]:s} at level 2 and {saber_moves.timing.parry_hold_ms[3]:s} at level 3."
source = "JA (rulebook 2.2)"
see = "sim::motion::saber"
applies = ["feat:JEDI_DEFENSE", "feat:ADVANCED_JEDI_DEFENSE", "feat:MASTER_JEDI_DEFENSE"]

[timing.parry_debounce_ms]
name = "Parry Recovery"
value = 200
unit = "ms"
range = [0, 1000]
summary = "Every parry adds a further {saber_moves.timing.parry_debounce_ms:s} to that wait."
source = "JA: parry timing"
see = "sim::motion::saber"

[timing.chain_cap]
name = "Chain Count"
type = "u8"
value = 16
range = [1, 255]
summary = "A chain is a series of attacks made one after another without returning to the ready stance. The game counts the attacks in a chain up to {saber_moves.timing.chain_cap}. A longer chain still counts as {saber_moves.timing.chain_cap}."
source = "JA"
see = "sim::motion::saber"

[timing.roll_stab_ms]
name = "Roll Stab"
value = 250
unit = "ms"
range = [0, 1000]
summary = "Pressing [Attack] in the last {saber_moves.timing.roll_stab_ms:s} of a forward roll makes a stab."
source = "JA"
see = "sim::motion::saber"

[timing.flip_kick_ms]
name = "Flip Kick"
value = 250
unit = "ms"
range = [0, 1000]
summary = "A character with a double-bladed weapon kicks when the player presses [Alt attack] in the last {saber_moves.timing.flip_kick_ms:s} of a flip."
source = "JA: knock-back"
see = "sim::motion::saber"

[chains]
title = "Attack Chains"
summary = """
Each style ends a chain of attacks by different rules. The strong style ends a
chain after a few attacks, and sooner when an attack turns sharply from the
last one. The fast and medium styles may cut a long chain short when the next
attack is any normal swing except the straight downward swing. The medium
style also ends a chain after a few attacks. When a chain ends, the
character's blade returns to the ready stance instead of making the next
attack.
"""
applies = ["kind:lightsaber", "kind:melee"]

[chains.strong_single]
name = "Strong Chain from Ready"
value = [0, 1]
labels = ["least", "most"]
range = [0, 16]
summary = "In the strong style, a chain that starts from the ready stance or would end in it stops once it has more attacks than a roll of {saber_moves.chains.strong_single[0]} to {saber_moves.chains.strong_single[1]}."
source = "JA: attack chains"
see = "sim::motion::saber"

[chains.strong_limit]
name = "Strong Chain"
value = [2, 3]
labels = ["least", "most"]
range = [0, 16]
summary = "In the strong style, a chain stops once it has more attacks than a roll of {saber_moves.chains.strong_limit[0]} to {saber_moves.chains.strong_limit[1]}."
source = "JA: attack chains"
see = "sim::motion::saber"

[chains.strong_angles]
name = "Strong Chain Turns"
type = "u16"
value = [135, 215]
labels = ["least", "most"]
unit = "°"
range = [0, 360]
summary = "In the strong style, an attack that turns less than {saber_moves.chains.strong_angles[0]} or more than {saber_moves.chains.strong_angles[1]} away from the last attack ends the chain at once."
source = "JA: saber move transitions"
see = "sim::motion::saber"

[chains.strong_square]
name = "Strong Chain Reversal"
type = "u16"
value = 180
unit = "°"
range = [0, 360]
summary = "In the strong style, an attack that turns exactly {saber_moves.chains.strong_square} from the last attack ends the chain after {saber_moves.chains.strong_square_chain:bare} attack. An attack that turns by any other angle ends the chain after {saber_moves.chains.strong_other_chain:bare} attacks."
source = "JA: attack chains"
see = "sim::motion::saber"

[chains.strong_square_chain]
name = "Strong Chain Reversal Limit"
value = 1
range = [0, 16]
summary = "In the strong style, a chain ends after {saber_moves.chains.strong_square_chain} attack when the next attack reverses direction."
source = "JA: attack chains"
see = "sim::motion::saber"

[chains.strong_other_chain]
name = "Strong Chain Turn Limit"
value = 2
range = [0, 16]
summary = "In the strong style, a chain ends after {saber_moves.chains.strong_other_chain} attacks when the next attack turns by any other angle."
source = "JA: attack chains"
see = "sim::motion::saber"

[chains.tolerance]
name = "Long Chain Limit"
value = [5, 3]
labels = ["fast", "medium"]
range = [1, 16]
summary = "In the fast style, a chain of {saber_moves.chains.tolerance[0]} or more attacks may end when the next attack is any normal swing except the straight downward swing. In the medium style, the same applies to a chain of {saber_moves.chains.tolerance[1]} or more attacks. The game rolls a number from 1 to the length of the chain. The chain ends if the roll is higher than the number above."
source = "JA: attack chains"
see = "sim::motion::saber"

[chains.medium_limit]
name = "Medium Chain"
value = [2, 5]
labels = ["least", "most"]
range = [0, 16]
summary = "In the medium style, a chain stops once it has more attacks than a roll of {saber_moves.chains.medium_limit[0]} to {saber_moves.chains.medium_limit[1]}."
source = "JA: attack chains"
see = "sim::motion::saber"

[specials]
title = "Special Attacks"
summary = """
The player makes a special attack by pressing [Attack] together with a
movement key. The attack depends on the key, the character's style and the
weapon.

[Forward] with [Attack] makes one of the following attacks. A character in
the dual or staff style who jumps makes a jump attack. A character in the
medium style who jumps makes a flip attack. A character in the strong style
who jumps makes Death from Above. A crouching character makes a lunge in the
fast style, or a spin attack in the dual or staff style. A character on the
ground stabs down at an enemy who lies on the ground ahead.

[Backward] with [Attack] makes a back attack at an enemy behind the
character. A character in the staff style who jumps makes a back-flip attack
instead.

[Strafe left] or [Strafe right] with [Jump] and [Attack] makes a cartwheel.
A character with a double-bladed weapon makes a butterfly instead.

A character with two blades or a double-bladed weapon who fights in a
single-blade style can make only the lunge with [Forward].
"""
applies = ["kind:lightsaber", "kind:melee"]

[specials.jump_ground]
name = "Jump Attack Height"
value = 40.0
unit = "units"
range = [0.0, 128.0]
summary = "A jump attack with two blades or a double-bladed weapon, and the back-flip attack, can start only on the ground or within {saber_moves.specials.jump_ground:m} above it."
source = "JA: the attack chosen from movement"
see = "sim::motion::saber"

[specials.back_flip_jump]
