[timing.fire_time_ms]
name = "Move Delay"
value = 100
unit = "ms"
range = [0, 1000]
summary = "A move without an animation readies the blade after {saber_moves.timing.fire_time_ms:s}."
source = "JA"
see = "sim::motion::saber"

[timing.parry_hold_ms]
name = "Parry Delay"
value = [500, 300, 150, 50]
labels = ["defense 0", "defense 1", "defense 2", "defense 3"]
unit = "ms"
range = [0, 2000]
summary = "A parry holds the blade {saber_moves.timing.parry_hold_ms[0]:s} at defense level 0, {saber_moves.timing.parry_hold_ms[1]:s} at 1, {saber_moves.timing.parry_hold_ms[2]:s} at 2 and {saber_moves.timing.parry_hold_ms[3]:s} at 3."
source = "JA (rulebook 2.2)"
see = "sim::motion::saber"
applies = ["feat:JEDI_DEFENSE", "feat:ADVANCED_JEDI_DEFENSE", "feat:MASTER_JEDI_DEFENSE"]

[timing.parry_debounce_ms]
name = "Parry Recovery"
value = 200
unit = "ms"
range = [0, 1000]
summary = "Every parry holds the blade {saber_moves.timing.parry_debounce_ms:s} longer."
source = "JA: parry timing"
see = "sim::motion::saber"

[timing.chain_cap]
name = "Chain Count"
type = "u8"
value = 16
range = [1, 255]
summary = "Attacks in a chain are counted up to {saber_moves.timing.chain_cap}."
source = "JA"
see = "sim::motion::saber"

[timing.roll_stab_ms]
name = "Roll Stab"
value = 250
unit = "ms"
range = [0, 1000]
summary = "[Attack] in the last {saber_moves.timing.roll_stab_ms:s} of a forward roll makes a stab."
source = "JA"
see = "sim::motion::saber"

[timing.flip_kick_ms]
name = "Flip Kick"
value = 250
unit = "ms"
range = [0, 1000]
summary = "A double-bladed weapon kicks on [Alt attack] in the last {saber_moves.timing.flip_kick_ms:s} of a flip."
source = "JA: knock-back"
see = "sim::motion::saber"

[chains]
title = "Attack Chains"
summary = """
Each style ends a chain of attacks by its own limit. The strong style
stops after a few attacks, sooner for a sharp turn between them. The fast
and medium styles cut a long chain short when it goes on with a spinning
attack, and the medium style stops after a few attacks besides. When a
chain ends, the next attack returns the blade to ready.
"""
applies = ["kind:lightsaber", "kind:melee"]

[chains.strong_single]
name = "Strong Chain from Ready"
value = [0, 1]
labels = ["least", "most"]
range = [0, 16]
summary = "A strong style chain that starts from or ends at ready stops once it is longer than a roll of {saber_moves.chains.strong_single[0]}-{saber_moves.chains.strong_single[1]} attacks."
source = "JA: attack chains"
see = "sim::motion::saber"

[chains.strong_limit]
name = "Strong Chain"
value = [2, 3]
labels = ["least", "most"]
range = [0, 16]
summary = "A strong style chain stops once it is longer than a roll of {saber_moves.chains.strong_limit[0]}-{saber_moves.chains.strong_limit[1]} attacks."
source = "JA: attack chains"
see = "sim::motion::saber"

[chains.strong_angles]
name = "Strong Chain Turns"
type = "u16"
value = [135, 215]
labels = ["least", "most"]
unit = "°"
range = [0, 360]
summary = "A strong attack that turns less than {saber_moves.chains.strong_angles[0]} or more than {saber_moves.chains.strong_angles[1]} from the last one ends the chain at once."
source = "JA: saber move transitions"
see = "sim::motion::saber"

[chains.strong_square]
name = "Strong Chain Reversal"
type = "u16"
value = 180
unit = "°"
range = [0, 360]
summary = "A strong attack that turns exactly {saber_moves.chains.strong_square} from the last one ends the chain after {saber_moves.chains.strong_square_chain:bare} attack. Any other turn ends it after {saber_moves.chains.strong_other_chain:bare}."
source = "JA: attack chains"
see = "sim::motion::saber"

[chains.strong_square_chain]
name = "Strong Chain Reversal Limit"
value = 1
range = [0, 16]
summary = "A strong chain ends after {saber_moves.chains.strong_square_chain} attack when the next one reverses direction."
source = "JA: attack chains"
see = "sim::motion::saber"

[chains.strong_other_chain]
name = "Strong Chain Turn Limit"
value = 2
range = [0, 16]
summary = "A strong chain ends after {saber_moves.chains.strong_other_chain} attacks when the next one turns."
source = "JA: attack chains"
see = "sim::motion::saber"

[chains.tolerance]
name = "Spinning Attack Limit"
value = [5, 3]
labels = ["fast", "medium"]
range = [1, 16]
summary = "A fast chain of {saber_moves.chains.tolerance[0]} or more attacks, or a medium chain of {saber_moves.chains.tolerance[1]} or more, that goes on with a spinning attack ends when a roll of 1 to its length is higher than that number."
source = "JA: attack chains"
see = "sim::motion::saber"

[chains.medium_limit]
name = "Medium Chain"
value = [2, 5]
labels = ["least", "most"]
range = [0, 16]
summary = "A medium style chain stops once it is longer than a roll of {saber_moves.chains.medium_limit[0]}-{saber_moves.chains.medium_limit[1]} attacks."
source = "JA: attack chains"
see = "sim::motion::saber"

[specials]
title = "Special Attacks"
summary = """
[Attack] with a movement key makes a special attack. [Forward]: the jump
attack with two blades or a double-bladed weapon, the medium style's flip,
the strong style's Death from Above, the fast style's lunge (crouched; the
spin with two blades or a double-bladed weapon), or a stab down at an enemy
lying ahead. [Backward]: the back-flip attack with a double-bladed weapon,
or a back attack at an enemy behind. [Strafe left] or [Strafe right] with
[Jump]: a cartwheel, or a butterfly with a double-bladed weapon. Two blades
fought as one have only the lunge.
"""
applies = ["kind:lightsaber", "kind:melee"]

