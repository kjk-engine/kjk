value = [15.0, 15.0, 8.0]
labels = ["across", "along", "up"]
unit = "units"
range = [0.0, 64.0]
summary = "The back attack finds an enemy up to {saber_moves.specials.back_box[0]:m} to either side of the line behind the character, {saber_moves.specials.back_box[1]:m} along it, and {saber_moves.specials.back_box[2]:m} above or below it."
source = "JA: the attack chosen from movement"
see = "sim::motion::saber"

[specials.mirror_reach]
name = "Double Attack Range"
value = 100.0
unit = "units"
range = [0.0, 512.0]
summary = "A character with two blades attacks both sides at once, or the front and back at once, when an enemy stands within {saber_moves.specials.mirror_reach:m} on each side."
source = "JA: the attack chosen from movement"
see = "sim::motion::saber"

[specials.mirror_box]
name = "Double Attack Width"
value = 12.0
unit = "units"
range = [0.0, 64.0]
summary = "The double attack finds an enemy up to {saber_moves.specials.mirror_box:m} to either side of each line it attacks along."
source = "JA"
see = "sim::motion::saber"

[specials.cartwheel_rise]
name = "Cartwheel Rise"
value = 20.0
unit = "units/s"
range = [0.0, 500.0]
summary = "A character can make a cartwheel only while rising faster than {saber_moves.specials.cartwheel_rise:m}."
source = "JA: the attack chosen from movement"
see = "sim::motion::saber"

[specials.cartwheel_ground]
name = "Cartwheel Height"
value = 70.0
unit = "units"
range = [0.0, 256.0]
summary = "A character can make a cartwheel only within {saber_moves.specials.cartwheel_ground:m} of the ground."
source = "JA: the attack chosen from movement"
see = "sim::motion::saber"

[specials.cartwheel_speed]
name = "Cartwheel Speed"
value = 190.0
unit = "units/s"
range = [0.0, 1000.0]
summary = "A cartwheel or a butterfly moves the character sideways at {saber_moves.specials.cartwheel_speed:m}."
source = "JA"
see = "sim::motion::saber"

[specials.butterfly_lift]
name = "Butterfly Leap"
value = [350.0, 250.0]
labels = ["right", "left"]
unit = "units/s"
range = [0.0, 1000.0]
summary = "A butterfly to the right launches the character upward at {saber_moves.specials.butterfly_lift[0]:m}. A butterfly to the left launches the character upward at {saber_moves.specials.butterfly_lift[1]:m}."
source = "JA"
see = "sim::motion::saber"

[specials.arial_lift]
name = "Cartwheel Leap"
value = [300.0, 350.0]
labels = ["right", "left"]
