summary = "[Backward] with [Attack] makes a back attack only when an enemy stands within {saber_moves.specials.back_reach:m} behind the character. Otherwise the character makes a normal downward swing."
source = "JA: the attack chosen from movement"
see = "sim::motion::saber"

[specials.back_box]
