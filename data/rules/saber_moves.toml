summary = "The back-flip attack requires Force Jump at level {saber_moves.specials.back_flip_jump} or higher."
source = "JA's jump level 2"
see = "sim::motion::saber"
applies = ["feat:FORCE_JUMP", "feat:FORCE_JUMP_ADVANCED", "feat:FORCE_JUMP_MASTERY"]

[specials.back_flip_lift]
