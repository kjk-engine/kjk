[kicks]
title = "Kicks"
summary = """
A kick, a forward or back roll to the feet, or a hilt bash strikes the
first target in its path once. It deals {saber_moves.kicks.points[0]:bare}%
of the target's maximum vitality points ({saber_moves.kicks.points[1]:bare}%
one time in {saber_moves.kicks.hardest_one_in:bare}) and throws it back. A
target in the air, in the middle of an action or without a lightsaber is
also knocked down.
"""
detail = """
The spin kick strikes all around, the back-front kick to the front then the
back, the split kick to the right and left.
"""
