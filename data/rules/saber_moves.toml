value = 500.0
unit = "units/s"
range = [0.0, 1000.0]
summary = "The back-flip attack launches the character upward at {saber_moves.specials.back_flip_lift:m}."
source = "JA"
see = "sim::motion::saber"

[specials.leap_rise]
name = "Leap Attack Rise"
value = 100.0
unit = "units/s"
range = [0.0, 500.0]
summary = "A character can make the flip attack or Death from Above only while rising faster than {saber_moves.specials.leap_rise:m}."
source = "JA: the attack chosen from movement"
see = "sim::motion::saber"

[specials.leap_ground]
name = "Leap Attack Height"
value = 32.0
unit = "units"
range = [0.0, 128.0]
summary = "A character can make the flip attack or Death from Above only within {saber_moves.specials.leap_ground:m} of the ground."
source = "JA: the attack chosen from movement"
see = "sim::motion::saber"

[specials.flip_leap]
name = "Flip Leap"
value = [150.0, 400.0]
labels = ["forward", "up"]
unit = "units/s"
range = [0.0, 1000.0]
summary = "The flip attack of the medium style launches the character forward at {saber_moves.specials.flip_leap[0]:m} and upward at {saber_moves.specials.flip_leap[1]:m}."
source = "JA: the attack chosen from movement"
see = "sim::motion::saber"

[specials.strong_leap]
name = "Death from Above Leap"
value = [300.0, 280.0]
labels = ["forward", "up"]
unit = "units/s"
range = [0.0, 1000.0]
summary = "Death from Above launches the character forward at {saber_moves.specials.strong_leap[0]:m} and upward at {saber_moves.specials.strong_leap[1]:m}."
source = "JA: the attack chosen from movement"
see = "sim::motion::saber"

[specials.lunge_speed]
name = "Lunge Speed"
value = 150.0
unit = "units/s"
range = [0.0, 1000.0]
summary = "The lunge of the fast style moves the character forward at {saber_moves.specials.lunge_speed:m}."
source = "JA"
see = "sim::motion::saber"

[specials.stab_reach]
name = "Stab Down Range"
value = 164.0
unit = "units"
range = [0.0, 512.0]
summary = "A character stabs down only at an enemy who lies within {saber_moves.specials.stab_reach:m} straight ahead."
source = "JA: the downward stab"
see = "sim::motion::saber"

[specials.stab_box]
name = "Stab Down Width"
value = 15.0
unit = "units"
range = [0.0, 64.0]
summary = "The stab down finds an enemy up to {saber_moves.specials.stab_box:m} to either side of the line straight ahead."
