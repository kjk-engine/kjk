[creatures]
title = "Creature Attacks"
summary = """
A creature is any character that the computer controls. In a chain of
attacks, a creature usually starts its next attack from where its last attack
ended. The higher the creature's style level, the more often it does so. From
the ready stance, a creature chooses its attack by where its enemy stands.
"""
applies = ["kind:creature", "kind:lightsaber", "kind:melee"]

[creatures.across_one_in]
name = "Cross Attack"
value = 3
range = [1, 10]
summary = "When a creature's blade is at a corner or a side, the creature attacks straight across one time in {saber_moves.creatures.across_one_in}. Otherwise it makes one of the two other attacks that start from that position, each with an equal chance."
source = "JA: the attack chosen from the enemy's quarter"
see = "sim::motion::saber"

[creatures.bounce_one_in]
name = "Attack after Deflection"
value = 4
range = [1, 10]
summary = "After a creature's attack is deflected, the creature usually starts its next attack from where its blade ended. One time in {saber_moves.creatures.bounce_one_in}, it chooses its next attack another way."
source = "JA"
see = "sim::motion::saber"

[creatures.side_across]
