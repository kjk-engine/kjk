[chapter]
title = "Pazaak"
order = 81
summary = """
The object of Pazaak is to reach a total of {pazaak.sets.limit:bare} without
going over. Each player builds a side deck of {pazaak.deck.side_deck:bare}
cards. At the start of the match, {pazaak.deck.hand:bare} of these cards are
drawn at random to form the player's hand for the whole match. At the start of
each turn, the main deck deals one card to the player. The player may then
play one card from the hand, and either end the turn or stand. A player whose
total is over {pazaak.sets.limit:bare} at the end of a turn loses the set.
When both players stand, the player with the higher total wins the set. If the
totals are tied, the set is played again. The exception is a tie where only
one player played a Tie Breaker card, and that player wins the set. The first
player to win {pazaak.sets.sets_to_win:bare} sets wins the match.
"""

[deck]
title = "Decks"
summary = """
The main deck has {pazaak.deck.main_copies:bare} copies of each card from 1 to
{pazaak.deck.main_highest:bare}. It is shuffled again at the start of each
set. The side deck is made of the cards the player chooses. The player's hand
is drawn from the side deck.
"""
applies = ["baseitem:Pazaak_Card", "baseitem:Pazaak_Sideboard"]

[deck.side_deck]
name = "Side Deck"
type = "usize"
value = 10
range = [4, 20]
summary = "A side deck has {pazaak.deck.side_deck:bare} cards."
source = "KOTOR (the talk table's rules, 32842)"
see = "sim::pazaak::game::Match::apply"

[deck.hand]
name = "Hand"
type = "usize"
value = 4
range = [1, 10]
summary = "At the start of the match, {pazaak.deck.hand:bare} cards are drawn at random from the side deck. These cards are the player's hand for the whole match. Each card in the hand can be played once."
source = "KOTOR (the talk table's rules, 32842)"
see = "sim::pazaak::game::Match::apply"

[deck.main_copies]
name = "Main Deck Copies"
type = "u8"
value = 4
range = [1, 10]
summary = "The main deck has {pazaak.deck.main_copies:bare} copies of each card."
source = "KOTOR (the talk table's rules, 32842)"
see = "sim::pazaak::game::Match::begin_set"

[deck.main_highest]
name = "Main Deck Highest Card"
type = "u8"
value = 10
range = [1, 20]
summary = "The cards in the main deck go from 1 to {pazaak.deck.main_highest:bare}."
source = "KOTOR (the talk table's rules, 32842)"
see = "sim::pazaak::game::Match::begin_set"

[sets]
title = "Sets"
summary = "A match is played in sets. A player stands at once when their total reaches exactly {pazaak.sets.limit:bare}. A player also stands at once when they have {pazaak.sets.table:bare} cards on the table."

[sets.limit]
name = "Limit"
type = "i8"
value = 20
range = [1, 60]
summary = "A player whose total is over {pazaak.sets.limit:bare} at the end of a turn loses the set. A player whose total is exactly {pazaak.sets.limit:bare} stands at once."
source = "KOTOR (the talk table's rules, 32842)"
see = "sim::pazaak::game::Match::end_turn"

[sets.table]
name = "Full Table"
type = "usize"
value = 9
range = [1, 20]
summary = "A player can have at most {pazaak.sets.table:bare} cards on the table in a set. When the last space on the table is filled, the player stands at once."
source = "KOTOR (the talk table's rules, 32842)"
see = "sim::pazaak::game::Side::forced"

[sets.sets_to_win]
name = "Sets to Win"
type = "u8"
value = 3
range = [1, 10]
summary = "The first player to win {pazaak.sets.sets_to_win:bare} sets wins the match."
source = "KOTOR (the talk table's rules, 32842)"
see = "sim::pazaak::game::Match::finish_set"

[sets.opponent_ms]
name = "Opponent's Turn"
type = "u64"
value = 900
unit = "ms"
range = [0, 10000]
summary = "The opponent takes {pazaak.sets.opponent_ms:s} to play each turn."
source = "ours"
see = "sim::pazaak::game::Match::begin_turn"

[sets.set_ms]
name = "Set Result"
type = "u64"
value = 2500
unit = "ms"
range = [0, 10000]
summary = "A set's result is shown for {pazaak.sets.set_ms:s} before the next set begins."
source = "ours"
see = "sim::pazaak::game::Match::finish_set"

[sets.end_ms]
name = "Match Result"
type = "u64"
value = 3000
unit = "ms"
range = [0, 10000]
summary = "The match's result is shown for {pazaak.sets.end_ms:s} before the match ends."
source = "ours"
see = "sim::pazaak::game::Match::finish_set"

[opponent]
title = "Opponent"
summary = """
When the opponent's total goes over {pazaak.sets.limit:bare}, it plays a card
from its hand to bring the total back down, if it can. It picks the card that
brings the total closest to {pazaak.sets.limit:bare}. If the player has
already stood, the opponent stands as soon as its total is higher than the
player's. It also stands on a tie if its total is
{pazaak.opponent.tie_stand_at:bare} or more. Otherwise it plays a card that
puts it ahead of the player, if it has one. If the player has not stood yet,
the opponent plays a card only when that card takes its total above
{pazaak.opponent.stand_at:bare} without going over. It stands when its total
is {pazaak.opponent.stand_at:bare} or more.
"""

[opponent.stand_at]
name = "Opponent Stands"
type = "i16"
value = 18
range = [1, 20]
summary = "If the player has not stood yet, the opponent stands when its total is {pazaak.opponent.stand_at:bare} or more."
source = "ours"
see = "sim::pazaak::game::Match::choice"

[opponent.tie_stand_at]
name = "Opponent Accepts a Tie"
type = "i16"
value = 17
range = [1, 20]
summary = "If the player has stood and the totals are tied, the opponent stands when its total is {pazaak.opponent.tie_stand_at:bare} or more."
source = "ours"
see = "sim::pazaak::game::Match::choice"
