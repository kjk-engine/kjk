[chapter]
title = "Conversations"
order = 75
summary = """
This chapter covers how long each line of a conversation stays on screen,
which camera angle each line uses, how the party is brought together in
co-op, and how scripts count rounds and turns.
"""

[lines]
title = "Line Length"
summary = """
A voiced line lasts as long as its voice recording. A line with no voice, or
with a voice shorter than {dialogue.lines.min_voice_ms:s}, lasts as long as
its text takes to read. A line with its own delay lasts for that delay
instead. If such a line also has its wait flag set, it lasts at least as long
as its voice. In an animated cutscene, a line with no wait flag and no delay
lasts only as long as its animation.
"""

[lines.read_tenths_ms_per_char]
name = "Reading Time"
type = "u64"
value = 1125
range = [0, 10000]
summary = "A line with no voice stays on screen for {dialogue.lines.read_tenths_ms_per_char:bare} ten-thousandths of a second for each character of its text. Developer notes in braces are not counted, so a line that holds only a note passes at once."
source = "reone (the games' unvoiced line length)"
see = "sim::script::dialogue::line_ms"

[lines.min_voice_ms]
name = "Shortest Voice"
type = "u64"
value = 150
unit = "ms"
range = [0, 2000]
summary = "A voice recording shorter than {dialogue.lines.min_voice_ms:s} is ignored. The line then lasts as long as its text takes to read."
source = "reone"
see = "sim::script::dialogue::line_ms"

[lines.least_line_ms]
name = "Shortest Line"
type = "u64"
value = 10
unit = "ms"
range = [0, 1000]
summary = "A line lasts at least {dialogue.lines.least_line_ms:s}. The exception is a line in an animated cutscene that has no wait flag and no delay."
source = "reone"
see = "sim::script::dialogue::line_ms"

[lines.skip_after_ms]
name = "Skip Delay"
type = "u64"
value = 250
unit = "ms"
range = [0, 2000]
summary = "The player cannot skip a line until it has been on screen for {dialogue.lines.skip_after_ms:s}."
source = "ours"
see = "sim::script::dialogue"

[lines.bark_ms]
name = "Bark Length"
type = "u64"
value = 4000
unit = "ms"
range = [500, 20000]
summary = "A bark is a short line shown over a character's head. A bark with no voice stays on screen for {dialogue.lines.bark_ms:s}. A bark string set by a script always stays on screen this long."
source = "ours [verify in K1's executable]"
see = "sim::script::dialogue"

[lines.fade_starts_ms]
name = "Fade Head Start"
type = "u64"
value = 100
unit = "ms"
range = [0, 1000]
summary = "A line can wait for its own screen fade to finish. Such a line waits for the fade's delay plus the fade's length, minus {dialogue.lines.fade_starts_ms:s}. The fade's timer starts {dialogue.lines.fade_starts_ms:s} early."
source = "both executables (the letterbox starts a node's fade clock there)"
see = "sim::script::dialogue::fade_ms"

[lines.voice_variants]
name = "Alien Voice Variants"
type = "u8"
value = [1, 1, 2, 3, 1, 2, 1, 2, 2, 3, 3, 3, 1, 3, 2, 1, 3, 2, 2]
range = [1, 3]
summary = "In KOTOR 2, each race that speaks an alien language has three recordings. Each line in alien speech plays the next recording in this sequence: {dialogue.lines.voice_variants}."
source = "TSL's executable"
see = "sim::script::dialogue::Conversation::entry_variant"

[cameras]
title = "Camera Angles"
summary = """
A line with no camera angle of its own uses the next angle in a fixed
sequence. The conversation's name decides where in the sequence it starts.
Angle 1 is a close-up of the speaker. Angle 2 is a shot over the listener's
shoulder. Angle 3 is a wide shot of both. A speaker turns its head toward the
listener. It turns its body only as far as its head cannot turn.
"""

[cameras.default_angles]
name = "Default Angles"
type = "u8"
value = [1, 3, 1, 3, 2, 2, 1, 3, 1, 2, 1, 2, 1, 3, 2, 3, 1, 1, 1]
range = [1, 3]
summary = "A line with no camera angle of its own uses the next angle in this sequence: {dialogue.cameras.default_angles}."
source = "KOTOR's executable"
see = "sim::script::dialogue::angle_walk"

[cameras.first_default_angle]
name = "First Angle"
type = "u8"
value = 2
range = [1, 3]
summary = "The first line of a conversation and the first set of replies use angle {dialogue.cameras.first_default_angle:bare} if they have no angle of their own."
source = "KOTOR's executable"
see = "sim::script::dialogue"

[cameras.head_margin]
name = "Turning to the Listener"
value = 1.0
unit = "°"
range = [0.0, 45.0]
summary = "A speaker turns its body until the listener is {dialogue.cameras.head_margin} inside the farthest angle its head can turn to. Its head then turns the rest of the way."
source = "ours [verify the order against the exe]"
see = "sim::script::dialogue"

[cameras.every_camera_effect]
name = "Video Effects on Every Camera"
type = "bool"
value = [false, true]
labels = ["K1", "TSL"]
summary = "A video effect is a filter over the screen, such as the noise of a hologram. In KOTOR, every line's camera {dialogue.cameras.every_camera_effect[0]:can} set the video effect. In KOTOR 2, every line's camera {dialogue.cameras.every_camera_effect[1]:can} set it. Where every camera sets it, a line with no video effect clears the effect. Where they do not, only a line with a placed camera sets the effect, and a following line with no effect keeps it."
detail = """
Neither game changes the effect on a line with an animated camera. In KOTOR,
a line with a placed camera shows its own effect. If that line's effect is -1
or -2, the effect already on screen stays. A line with any other camera
clears the effect. In KOTOR 2, a line with any camera other than an animated
one shows its own effect. If that line's effect is -1 or -2, the effect is
cleared, unless a script turned on an effect with `EnableVideoEffect`.
"""
source = "K1's and TSL's Mac executables, 2026-11-06"
see = "game::video_effect::LineEffect"

[speakers]
title = "Who Says a Line"
summary = """
A line can name the tag of its speaker. The line is then said by the
character with that tag who is nearest to the conversation's owner, within
{dialogue.speakers.reach_m:bare} meters. In KOTOR 2, a character that a
script has marked with SetForceAlwaysUpdate is found however far away it is.
An example is a throne room shown from across the city. When no character
with that tag is present, such as a companion who is not in the party, the
line is skipped before its condition is checked. The conversation then moves
on to the next line.
"""

[speakers.reach_m]
name = "Speaker Search"
value = 1000.0
unit = "m"
range = [0.0, 10000.0]
summary = "The game looks for a line's speaker within {dialogue.speakers.reach_m:bare} meters of the conversation's owner."
source = "both executables (the radius their dialogue passes to the nearest-by-tag search)"
see = "sim::script::dialogue::Step::speaker_for"

[coop]
title = "Co-op Conversations"
summary = """
When a conversation begins, party members who are farther away than
{dialogue.coop.gather_beyond_m:bare} meters are brought to it. Only the host
can choose a reply that advances the story. A reply advances the story if it
adds a quest, awards plot experience, or runs a script that may do either.
The same is true if any of the next {dialogue.coop.story_depth:bare} lines it
leads to does one of these things.
"""
applies = ["kind:player", "kind:companion"]

[coop.gather_beyond_m]
name = "Gathering the Party"
value = 10.0
unit = "m"
range = [0.0, 100.0]
summary = "When a conversation begins, party members who are farther away than {dialogue.coop.gather_beyond_m:bare} meters are brought to it. When a Pazaak match begins, other players within {dialogue.coop.gather_beyond_m:bare} meters watch it."
source = "ours [verify against KOTOR's scene staging]"
see = "sim::world::coop_talk::gather"

[coop.interjection_wait_ms]
name = "Interjection Wait"
type = "u64"
value = 10_000
unit = "ms"
range = [0, 60000]
summary = "A line spoken by another player's character waits up to {dialogue.coop.interjection_wait_ms:s} for that player's own conversation to end. After that, the line plays without that player."
source = "ours"
see = "sim::script::dialogue"

[coop.story_depth]
name = "Story Replies"
type = "usize"
value = 4
range = [0, 20]
summary = "A reply advances the story if it adds a quest, awards plot experience, or runs a script that may do either. The same is true if any of the next {dialogue.coop.story_depth:bare} lines it leads to does one of these things."
source = "ours"
see = "sim::script::dialogue::story"

[clock]
title = "Rounds and Turns"
summary = """
Scripts count time in rounds, turns and hours. A round is
{dialogue.clock.round_s:bare} seconds. A turn is
{dialogue.clock.rounds_a_turn:bare} rounds. An hour lasts as many minutes as
the area sets. If the area sets none, an hour lasts
{scripts.clock.minutes_per_hour:bare} minutes.
"""

[clock.round_s]
name = "Round"
value = 3.0
unit = "s"
range = [0.5, 12.0]
summary = "A combat round lasts {dialogue.clock.round_s:bare} seconds."
source = "both games' executables (TimeConversions)"
see = "sim::script::presentation::seconds"

[clock.rounds_a_turn]
name = "Turn"
value = 10.0
range = [1.0, 100.0]
summary = "A turn lasts {dialogue.clock.rounds_a_turn:bare} rounds."
source = "both games' executables (TimeConversions)"
see = "sim::script::presentation::seconds"
