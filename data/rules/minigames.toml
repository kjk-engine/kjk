[chapter]
title = "Minigames"
order = 80
summary = """
This chapter covers swoop racing and turret gunnery. Each race and each
turret reads its speeds, guns, damage and obstacles from its own module.
"""

[swoop]
title = "Swoop"
summary = """
The swoop drifts sideways across the track as the player steers. Its
sideways speed is at most its steering force divided by
{minigames.swoop.drift_damping:bare}. With inertia on, the drift builds up
and dies away over time. With inertia off, the drift starts and stops at
once. In a TSL race the swoop can jump. In TSL, each point of the player's
Dexterity modifier also raises the swoop's steering by
{minigames.swoop.lateral_per_dex:bare} times the race's own steering.
"""

[swoop.drift_damping]
name = "Drift"
value = 4.0
range = [0.1, 50.0]
summary = "A swoop's sideways speed reaches its steering force divided by {minigames.swoop.drift_damping:bare}. With inertia on, the sideways speed moves toward that limit at {minigames.swoop.drift_damping:bare} times the remaining difference each second."
source = "ours [verify by feel]"
see = "sim::minigame::course::Course::steer"

[swoop.jump_gravity]
name = "Swoop Jump Gravity"
value = -45.8
unit = "m/s"
range = [-500.0, 0.0]
summary = "A swoop's jump in TSL falls back with a gravity of {minigames.swoop.jump_gravity:bare} meters per second, each second."
source = "TSL's executable"
see = "sim::minigame::course::Course::steer"

[swoop.lateral_per_dex]
name = "Dexterity Steering Bonus"
value = 0.3
range = [0.0, 5.0]
summary = "In TSL, each point of the player's Dexterity modifier raises the swoop's steering by {minigames.swoop.lateral_per_dex:bare} times the race's own steering. In KOTOR, Dexterity has no effect on the swoop."
source = "TSL's executable"
see = "sim::script::minigame"

[speed]
title = "Speed"
summary = """
In TSL, every swoop and turret starts at a speed of
{minigames.speed.start:bare}. Each race's start script then sets its own
speed. A turret keeps the starting speed, so the bolts its guns fire fly
that much faster than their module says.
"""

[speed.start]
name = "Starting Speed"
value = 100.0
unit = "m/s"
range = [0.0, 1000.0]
summary = "In TSL, the player's swoop or turret moves at {minigames.speed.start:bare} meters per second until a script sets its speed. Every race sets the speed as it begins. The player's bolts fly at their gun's speed plus the player's speed. At the Peragus hangar, a turret's slow bolts therefore fly at about this speed."
source = "TSL's executable"
see = "sim::minigame::course::Course::new"

[bumps]
title = "Collisions"
summary = """
In TSL races, the swoop can collide with mines and traffic. An obstacle
that the swoop hits takes the swoop's collision damage. The swoop is pushed
clear of the obstacle. Unless the swoop is invulnerable, it takes the
highest collision damage of the obstacles it hit. It is then invulnerable
for {minigames.bumps.invulnerable_times:bare} times its normal period of
invulnerability.
"""

[bumps.room]
name = "Collision Push"
value = 1.1
unit = "m"
range = [0.0, 10.0]
summary = "A collision pushes the swoop {minigames.bumps.room:bare} meters clear of what it hit."
source = "TSL's executable"
see = "sim::minigame::course::Course::bump"

[bumps.passes]
name = "Collision Checks"
type = "usize"
value = 3
range = [1, 10]
summary = "The game checks for collisions and pushes the swoop clear up to {minigames.bumps.passes:bare} times in each step of the race."
source = "TSL's executable"
see = "sim::minigame::course::Course::step_run"

[bumps.invulnerable_times]
name = "Collision Invulnerability"
type = "u64"
value = 2
unit = "×"
range = [0, 10]
summary = "After a collision, the swoop is invulnerable for {minigames.bumps.invulnerable_times:bare} times its normal invulnerability period."
source = "TSL's executable"
see = "sim::minigame::course::Course::bump"

[coop]
title = "Co-op Races"
summary = """
In co-op, each player races the course alone. When the first player
finishes, the game waits up to {minigames.coop.leave_wait_ms:s} for the
other players before it moves everyone to the next area.
"""
applies = ["kind:player"]

[coop.leave_wait_ms]
name = "Waiting for Racers"
type = "u64"
value = 20_000
unit = "ms"
range = [0, 120000]
summary = "Once the first player finishes, a co-op race waits up to {minigames.coop.leave_wait_ms:s} for the others."
source = "ours"
see = "sim::minigame::course::Leaving"
