[multipliers.fire]
name = "Fire on Materials"
type = "i32"
value = [2000, 2000, 1000, 1000, 1000, 1000, 1000, 2000, 1000]
labels = ["ceramic", "organic", "wood", "plastic", "metal", "electronic", "stone", "cloth", "debris"]
unit = "‰"
range = [0, 10000]
summary = "Fire counts {destruction.multipliers.fire} on each material: it cracks ceramic and burns plants and cloth."
