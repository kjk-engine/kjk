unit = "‰"
range = [0, 10000]
summary = "Slashing counts {destruction.multipliers.slashing} on each material: blades cut wood and cloth."
source = "ours (destruction design 2026-11-06)"
see = "sim::destruction::multiplier"

[multipliers.electrical]
