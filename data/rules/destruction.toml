type = "i32"
value = [333, 667]
labels = ["damaged", "wrecked"]
unit = "‰"
range = [0, 1000]
summary = "A prop is damaged once it has lost {destruction.stages.at[0]} of its hit points, and wrecked at {destruction.stages.at[1]}; a prop that breaks goes when it has lost them all."
source = "ours (destruction design 2026-11-06)"
see = "sim::destruction::stage"
