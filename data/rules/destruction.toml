[chapter]
title = "Destruction"
order = 15
summary = """
Weapons, grenades and Force powers break the props a room is furnished
with: jars, chairs, crates, plants. Consoles, machinery, statues and banners
only show damage. Anything the story needs (plot items, containers, things
you use or talk to, anything a script names) never breaks.
"""
detail = """
Which kinds of prop break, show damage or stay intact, and what each is made
of and how big it is, is `data/destruction/props.csv`. A blow counts only
for its damage above the prop's hardness; the damage's type and an area
blow change how much that is. Everyone's blows count, the enemies' too.
Breaking a prop gives no experience and makes nobody hostile.
"""

[hardness]
title = "Hardness"
summary = "A blow counts only for the damage above what the prop is made of shrugs off."

[hardness.by_material]
name = "Hardness by Material"
type = "i32"
value = [0, 0, 1, 1, 1, 1, 5, 0, 2]
labels = ["ceramic", "organic", "wood", "plastic", "metal", "electronic", "stone", "cloth", "debris"]
unit = "HP"
range = [0, 50]
summary = "Each blow on a prop loses {destruction.hardness.by_material} hit points, by what it is made of, before it counts."
detail = "So a pistol only marks stone, and fists never break metal."
source = "ours (destruction design 2026-11-06)"
see = "sim::destruction::hardness"

[hit_points]
title = "Hit points"
summary = "How much a prop takes before it breaks, by its size; the file's own hit points are not used."

[hit_points.by_size]
name = "Hit Points by Size"
type = "i32"
value = [5, 20, 75]
labels = ["small", "medium", "large"]
unit = "HP"
range = [1, 1000]
summary = "A prop breaks after {destruction.hit_points.by_size} hit points of damage, by its size."
detail = "The toolset gave nearly every placeable the same 15 HP, so size decides instead."
source = "ours (destruction design 2026-11-06)"
see = "sim::destruction::most_hp"

[hit_points.damage_times]
name = "Damage-Only Toughness"
type = "i32"
value = 4
unit = "×"
range = [1, 100]
summary = "Consoles, machinery, stone and cloth, which only show damage, take {destruction.hit_points.damage_times} times as much to wreck."
source = "ours (destruction design 2026-11-06)"
see = "sim::destruction::most_hp"

