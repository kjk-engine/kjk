see = "sim::destruction::stage"

[powers]
title = "Force powers"
summary = "Force powers that strike or throw reach the props in their way: the ones that strike one thing hit the first prop along their aim, the ones that fill an area every prop around the caster in sight."
detail = "Each power's ranks share its line's reach and damage. A damage type is a damage-type row; the Force's own damage is universal (row 3), which no material resists more than another."

