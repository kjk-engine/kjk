see = "sim::combat::grenades::effect"

[poison.points]
name = "Poison Damage"
type = "u8"
value = 4
unit = "HP"
range = [0, 255]
summary = "Secondary: Poison, {grenades.poison.points:bare} pts every {grenades.poison.every_ms:s} for {grenades.poison.for_ms:s}."
source = "the item's description"
see = "sim::combat::grenades::effect"

[poison.every_ms]
