[chapter]
title = "Grenades"
order = 14
summary = """
Hold the grenade button to charge a throw, and release it to throw. A
grenade falls, bounces and explodes when its fuse runs out or when it
strikes a body. Everyone within its radius and in its line of sight, the
thrower included, suffers its damage and secondary effect. A successful
Reflex save halves the damage.
"""
detail = """
A natural 20 always saves, and a natural 1 always fails. Stuns, paralysis
and entanglement last no longer than {force.crowd.hold_ms:s}, followed by
{force.crowd.immune_ms:s} of immunity. Creatures sometimes throw grenades
at targets 4 to 12 meters away.
"""

[throw]
title = "Throwing"
summary = """
Hold the grenade button to charge a throw, and release it to throw the
grenade chosen from the item menu, or else the first kind carried. The longer the charge, the farther the
throw.
"""

[throw.charge_ms]
name = "Full Charge"
type = "u64"
value = 900
unit = "ms"
range = [1, 10000]
summary = "A throw reaches full strength after a charge of {grenades.throw.charge_ms:s}."
source = "JA (the thermal detonator)"
see = "sim::combat::grenades::strength"

[throw.min_strength]
name = "Weakest Throw"
value = 0.15
unit = "×"
range = [0.0, 1.0]
summary = "A throw released at once flies at {grenades.throw.min_strength:bare} times the speed of a full throw."
source = "JA (the thermal detonator)"
see = "sim::combat::grenades::strength"

[throw.speed]
name = "Throw Speed"
value = 900.0
unit = "units/s"
range = [0.0, 5000.0]
summary = "A full-strength throw flies at {grenades.throw.speed:m}."
source = "JA (the thermal detonator)"
see = "sim::combat::grenades::SPEED"

[throw.lift]
name = "Throw Lift"
value = 120.0
unit = "units/s"
range = [0.0, 1000.0]
summary = "Every throw also rises at {grenades.throw.lift:m}."
source = "JA (the thermal detonator)"
see = "sim::combat::grenades::LIFT"

[throw.muzzle]
name = "Release Point"
value = [12.0, 0.0, -4.0]
labels = ["forward", "right", "up"]
unit = "units"
summary = "A grenade leaves the hand {grenades.throw.muzzle[0]:m} forward of the eye, {grenades.throw.muzzle[1]:m} to the right and {grenades.throw.muzzle[2]:m} up."
source = "JA (the thermal detonator)"
see = "sim::combat::grenades::MUZZLE"

[throw.refire_ms]
name = "Throw Recovery"
type = "i32"
value = 800
unit = "ms"
range = [0, 10000]
summary = "After a throw, the character's weapon cannot fire for {grenades.throw.refire_ms:s}."
source = "JA (the thermal detonator)"
see = "sim::combat::grenades::REFIRE_MS"

[throw.half_size]
name = "Grenade Size"
value = 3.0
unit = "units"
range = [0.0, 16.0]
summary = "A grenade in flight strikes anything within {grenades.throw.half_size:m} of its path."
source = "JA (the thermal detonator)"
see = "sim::combat::grenades::HALF_SIZE"

[flight]
title = "Flight and Fuse"
summary = """
A grenade falls, bounces off walls and floors, and comes to rest on a floor
once it slows. It explodes when its fuse runs out, or at once when it
strikes a body.
"""

[flight.fuse_ms]
name = "Fuse"
type = "u64"
value = 3500
unit = "ms"
range = [0, 30000]
summary = "A grenade explodes {grenades.flight.fuse_ms:s} after it is thrown."
source = "JA (the thermal detonator)"
see = "sim::combat::grenades::FUSE_MS"

[flight.bounce]
name = "Bounce"
value = 0.65
unit = "×"
range = [0.0, 1.0]
summary = "Each bounce leaves a grenade {grenades.flight.bounce:bare} times its speed."
source = "JA (the thermal detonator)"
see = "sim::combat::grenades::bounce"

[flight.rest_speed]
name = "Rest Speed"
value = 40.0
unit = "units/s"
range = [0.0, 1000.0]
summary = "A grenade that bounces on a floor at less than {grenades.flight.rest_speed:m} comes to rest."
source = "JA (the thermal detonator)"
see = "sim::combat::grenades::bounce"

[flight.floor]
name = "Floor Slope"
value = 0.2
range = [-1.0, 1.0]
summary = "A surface level above {grenades.flight.floor}, on a scale from 0 (a wall) to 1 (a level floor), is a floor a grenade can rest on. A grenade always bounces off a steeper surface."
source = "JA (the thermal detonator)"
see = "sim::combat::grenades::bounce"

[blast]
title = "Blast"
summary = "Everyone within the blast radius and in its line of sight is caught. A successful Reflex save halves the damage, and negates the secondary effect where noted."

[blast.radius_m]
name = "Blast Radius"
value = 4.0
unit = "m"
range = [0.0, 50.0]
summary = "Area of Effect: {grenades.blast.radius_m:bare} meter radius."
source = "KOTOR (`k_sup_grenade`'s 4 m)"
see = "sim::combat::grenades::RADIUS"

[blast.dc]
name = "Reflex DC"
type = "u8"
value = 15
range = [0, 60]
summary = "Save: DC {grenades.blast.dc} Reflex, unless noted otherwise."
source = "the grenades' descriptions"
see = "sim::combat::grenades::effect"

[blast.save_divides]
name = "Save Reduction"
type = "u16"
value = 2
range = [1, 10]
summary = "A successful Reflex save divides the blast's damage by {grenades.blast.save_divides}."
source = "KOTOR (the grenades' descriptions: half damage on a save)"
see = "sim::combat::damage::assess"

[fragmentation]
title = "Fragmentation Grenade"
summary = "Deals piercing damage. A successful save halves the damage."
applies = ["spell:ITEM_ABILITY_GRENADE_FRAGMENTATION", "spell:ITEM_ABILITY_GRENADE_LAUNCHED_FRAGMENTATION"]

[fragmentation.points]
name = "Damage"
type = "u16"
value = 20
unit = "points"
range = [0, 1000]
summary = "Damage: Piercing, {grenades.fragmentation.points:bare}pts."
source = "the item's description"
see = "sim::combat::grenades::effect"

[stun]
title = "Concussion Grenade"
summary = "Deals no damage. A target that fails its save is stunned."
applies = ["spell:ITEM_ABILITY_GRENADE_STUN", "spell:ITEM_ABILITY_GRENADE_LAUNCHED_STUN"]

[stun.hold_ms]
name = "Stun Duration"
type = "u64"
value = 9000
unit = "ms"
range = [0, 60000]
summary = "Secondary: Stun for {grenades.stun.hold_ms:s}. No stun lasts longer than {force.crowd.hold_ms:s}."
source = "the item's description"
see = "sim::combat::grenades::effect"

[thermal_detonator]
title = "Thermal Detonator"
summary = "Deals energy damage and knocks targets down. A successful save halves the damage and prevents the knockdown."
applies = ["spell:ITEM_ABILITY_GRENADE_THERMAL_DETONATOR", "spell:ITEM_ABILITY_GRENADE_LAUNCHED_THERMAL_DETONATOR"]

[thermal_detonator.points]
name = "Damage"
type = "u16"
value = 60
unit = "points"
range = [0, 1000]
summary = "Damage: Energy, {grenades.thermal_detonator.points:bare}pts."
source = "the item's description"
see = "sim::combat::grenades::effect"

[poison]
title = "Poison Grenade"
summary = "Deals no damage of its own. A target that fails a harder save is poisoned. Knight Valor, Master Valor and Improved Energy Resistance grant immunity to poison."
applies = ["spell:ITEM_ABILITY_GRENADE_POISON", "spell:ITEM_ABILITY_GRENADE_LAUNCHED_POISON"]

[poison.dc]
