[chapter]
title = "Stealth and Awareness"
order = 50
summary = """
An opponent sees a character in Stealth Mode only if it succeeds at a spot
check. It hears the character only if it succeeds at a listen check. Each
check compares the opponent's Awareness plus a roll against the
character's Stealth skill plus a roll. An attack made from Stealth Mode is
a sneak attack.
"""
detail = """
Only a character with at least one rank in Stealth, Security or Demolitions
can use that skill.
"""

[mode]
title = "Stealth Mode"
summary = """
To enter Stealth Mode, a character needs ranks in the Stealth skill and a
stealth unit equipped. A character cannot enter Stealth Mode during combat.
A character in Stealth Mode cannot run. Stealth Mode ends when the
character attacks, uses a Force power, throws a grenade, enters combat,
removes the stealth unit or starts a conversation.
"""
detail = """
Disarming, recovering or setting a mine does not end Stealth Mode. Opening
doors and using objects do not end it either. Party members under computer
control never enter Stealth Mode.
"""
applies = ["kind:stealth", "skill:Stealth", "baseitem:Stealth_Unit"]

[mode.opener_ms]
name = "Sneak Attack Window"
type = "u64"
value = 1500
unit = "ms"
range = [0, 10000]
summary = """
An attack that hits within {stealth.mode.opener_ms:s} after the character
leaves Stealth Mode is a sneak attack. This only works against a target
that has not yet noticed the attacker.
"""
source = "ours, agreed with the owner 2026-10-04"
see = "sim::world::covert::covert"
applies = ["kind:stealth", "skill:Stealth"]

[mode.walk_axis]
name = "Stealth Walk"
type = "i8"
value = 64
range = [1, 127]
summary = """
A character in Stealth Mode, or wearing an item with Special Walk, can only
walk. The walk is {stealth.mode.walk_axis:bare} out of 127 on the movement
scale, where 127 is a full run.
"""
source = "JA's walk command"
see = "sim::world::move_actors"
applies = ["kind:stealth", "skill:Stealth"]

[pace]
title = "Standing, Walking and Running"
summary = """
For spot and listen checks, a character moving slower than
{stealth.pace.still_speed:m} counts as standing still. A character moving
faster than {stealth.pace.run_speed:m} counts as running.
"""

[pace.still_speed]
name = "Standing Still"
type = "f32"
value = 20.0
unit = "units/s"
range = [0.0, 126.0]
summary = "A character moving slower than {stealth.pace.still_speed:m} counts as standing still."
source = "ours"
see = "sim::stealth::pace"
applies = ["kind:stealth"]

[pace.run_speed]
name = "Running"
type = "f32"
value = 180.0
unit = "units/s"
range = [126.0, 250.0]
summary = "A character moving faster than {stealth.pace.run_speed:m} counts as running."
source = "ours"
see = "sim::stealth::pace"
applies = ["kind:stealth"]

[rolls]
title = "Stealth Rolls"
summary = """
Each character rolls a Stealth roll against sight and a second Stealth
roll against hearing. Each of these rolls is {stealth.rolls.sneak_base:bare}
plus a random number from 1 to {stealth.rolls.sneak_die:bare}. Each
character also rolls a spot roll and a listen roll, and each of these is a
random number from 1 to {stealth.rolls.watch_die:bare}. All four rolls are
made again every {stealth.rolls.every_ms:s}.
"""
applies = ["kind:stealth", "skill:Stealth", "skill:Awareness"]

[rolls.every_ms]
name = "Roll Duration"
type = "u64"
value = 20000
unit = "ms"
range = [1000, 120000]
summary = "A character keeps its Stealth, spot and listen rolls for {stealth.rolls.every_ms:s}. Then it rolls them again."
source = "K1's executable"
see = "sim::stealth::Rolls::due"
applies = ["kind:stealth", "skill:Stealth", "skill:Awareness"]

[rolls.sneak_base]
name = "Stealth Roll Base"
type = "u8"
value = 10
range = [0, 30]
summary = "A Stealth roll is {stealth.rolls.sneak_base:bare} plus a random number from 1 to {stealth.rolls.sneak_die:bare}."
source = "K1's executable"
see = "sim::stealth::Rolls::draw"
applies = ["kind:stealth", "skill:Stealth"]

[rolls.sneak_die]
name = "Stealth Roll Die"
type = "u32"
value = 10
range = [1, 40]
summary = "A Stealth roll adds a random number from 1 to {stealth.rolls.sneak_die:bare} to its base."
source = "K1's executable"
see = "sim::stealth::Rolls::draw"
applies = ["kind:stealth", "skill:Stealth"]

[rolls.watch_die]
name = "Awareness Roll Die"
type = "u32"
value = 20
range = [1, 40]
summary = "A spot roll or a listen roll is a random number from 1 to {stealth.rolls.watch_die:bare}."
source = "K1's executable"
see = "sim::stealth::Rolls::draw"
applies = ["kind:stealth", "skill:Awareness"]

[spot]
title = "Spot Check"
summary = """
An opponent sees a character in Stealth Mode within its line of sight if
the opponent's Awareness plus its spot roll is higher than the character's
Stealth skill plus its Stealth roll. The opponent suffers
-{stealth.spot.running:bare} to the check while it runs. It suffers
-{stealth.spot.in_combat:bare} while it is in combat. An enemy suffers
-{stealth.spot.behind:bare} when a player's character is behind it. The
opponent suffers -{stealth.spot.still_sneaker:bare} if the character is
standing still. The opponent gains +{stealth.spot.still_watcher:bare} while
it is standing still itself. Distance also lowers the check. The first
{stealth.spot.free_points:bare} steps of {stealth.spot.metres_a_point:bare}
meters are free, and every further {stealth.spot.metres_a_point:bare}
meters is -1.
"""
detail = """
Anyone with a line of sight to a character who is not in Stealth Mode sees
that character. An opponent with True Seeing always sees a character in
Stealth Mode.
"""
applies = ["kind:stealth", "skill:Stealth", "skill:Awareness"]

[spot.running]
name = "Running Penalty"
type = "i32"
value = 5
unit = "points"
range = [0, 20]
summary = "An opponent who is running suffers -{stealth.spot.running:bare} to its spot check."
source = "K1's executable"
see = "sim::stealth::spot_score"
applies = ["kind:stealth", "skill:Awareness"]

[spot.behind]
name = "Behind Penalty"
type = "i32"
value = 5
unit = "points"
range = [0, 20]
summary = "An enemy suffers -{stealth.spot.behind:bare} to its spot check against a player's character who is behind it."
source = "K1's executable"
see = "sim::stealth::spot_score"
applies = ["kind:stealth", "skill:Stealth"]

[spot.behind_cos]
name = "Behind Arc"
type = "f32"
value = -0.707
range = [-1.0, 0.0]
summary = """
A character counts as behind an opponent when the cosine of the angle
between the opponent's facing and the direction to the character is
{stealth.spot.behind_cos:bare} or less. With the standard value, this is
the quarter circle directly behind the opponent.
"""
source = "K1's executable"
see = "sim::stealth::spot_score"
applies = ["kind:stealth", "skill:Stealth"]

[spot.in_combat]
name = "Combat Penalty"
type = "i32"
value = 10
unit = "points"
range = [0, 30]
summary = "An opponent in combat suffers -{stealth.spot.in_combat:bare} to its spot check."
source = "K1's executable"
see = "sim::stealth::spot_score"
applies = ["kind:stealth", "skill:Awareness"]

[spot.still_sneaker]
name = "Standing Still Bonus"
type = "i32"
value = 5
unit = "points"
range = [0, 20]
summary = "When a character in Stealth Mode stands still, the opponent suffers -{stealth.spot.still_sneaker:bare} to its spot check."
source = "K1's executable"
see = "sim::stealth::spot_score"
applies = ["kind:stealth", "skill:Stealth"]

[spot.still_watcher]
name = "Watching Bonus"
type = "i32"
value = 5
unit = "points"
range = [0, 20]
summary = "An opponent who is standing still gains +{stealth.spot.still_watcher:bare} to its spot check."
source = "K1's executable"
see = "sim::stealth::spot_score"
applies = ["kind:stealth", "skill:Awareness"]

[spot.metres_a_point]
name = "Spot Distance"
type = "f32"
value = 3.0
unit = "m"
range = [0.5, 20.0]
summary = "Every {stealth.spot.metres_a_point:bare} meters of distance is -1 to the spot check, except for the first few steps (see Spot Distance Free)."
source = "K1's executable"
see = "sim::stealth::spot_score"
applies = ["kind:stealth", "skill:Stealth"]

[spot.free_points]
name = "Spot Distance Free"
type = "i32"
value = 2
range = [0, 20]
summary = """
The first {stealth.spot.free_points:bare} steps of
{stealth.spot.metres_a_point:bare} meters of distance cause no penalty to
the spot check.
"""
source = "K1's executable"
see = "sim::stealth::spot_score"
applies = ["kind:stealth", "skill:Stealth"]

[listen]
title = "Listen Check"
summary = """
An opponent hears a character in Stealth Mode within its hearing if the
opponent's Awareness plus its listen roll is higher than the character's
Stealth skill plus its Stealth roll. Every
{stealth.listen.metres_a_point:bare} meters of distance is -1 to the
check. Each meter of wall between them is -{stealth.listen.wall_a_metre:bare}
to the check. Large creatures are easier to hear, and small ones are harder
to hear. Some areas raise or lower all listen checks.
"""
detail = """
Nobody can hear a character whose items have the Dampen Sound property. A
blinded creature can neither see nor hear.
"""
applies = ["kind:stealth", "skill:Stealth", "skill:Awareness"]

[listen.metres_a_point]
name = "Listen Distance"
type = "f32"
value = 3.0
unit = "m"
range = [0.5, 20.0]
summary = "Every {stealth.listen.metres_a_point:bare} meters of distance is -1 to the listen check."
source = "K1's executable"
see = "sim::stealth::listen_score"
applies = ["kind:stealth", "skill:Stealth"]

[listen.size]
name = "Size"
type = "i32"
value = [-8, -4, 0, 4, 8]
unit = "points"
labels = ["Tiny", "Small", "Medium", "Large", "Huge"]
range = [-30, 30]
summary = "A creature's size changes the listen check against it. From Tiny to Huge, the change is {stealth.listen.size}."
source = "K1's executable"
see = "sim::stealth::listen_score"
applies = ["kind:stealth", "skill:Stealth", "kind:creature"]

[listen.wall_a_metre]
name = "Wall Penalty"
type = "f32"
value = 5.0
unit = "points"
range = [0.0, 50.0]
summary = "Each meter of wall between the opponent and the character is -{stealth.listen.wall_a_metre:bare} to the listen check."
source = "K1's executable"
see = "sim::stealth::listen_score"
applies = ["kind:stealth", "skill:Stealth"]

[perception]
title = "Perception"
summary = """
An active creature checks what it can see and hear at random intervals.
Each wait lasts at least {stealth.perception.active_least_ms:s}, plus up to
{stealth.perception.active_spread_ms:s} more. A creature in a conversation
checks only every {stealth.perception.idle_ms:s}. A creature checks what it
hears before it checks what it sees.
"""
applies = ["kind:stealth", "skill:Awareness", "kind:creature"]

[perception.active_least_ms]
name = "Perception Rate"
type = "u64"
value = 300
unit = "ms"
range = [50, 5000]
summary = "An active creature waits at least {stealth.perception.active_least_ms:s} between checks of what it can see and hear."
source = "K1's executable (the owner's choice 2026-10-04)"
see = "sim::world::scripts::perceive"
applies = ["kind:stealth", "skill:Awareness"]

[perception.active_spread_ms]
name = "Perception Spread"
type = "u32"
value = 400
unit = "ms"
range = [1, 5000]
summary = "Each wait between perception checks lasts up to {stealth.perception.active_spread_ms:s} longer, at random."
source = "K1's executable"
see = "sim::world::scripts::perceive"
applies = ["kind:stealth", "skill:Awareness"]

[perception.idle_ms]
name = "Perception in Conversation"
type = "u64"
value = 4000
unit = "ms"
range = [300, 30000]
summary = "A creature in a conversation checks what it can see and hear every {stealth.perception.idle_ms:s}."
source = "K1's executable"
see = "sim::world::scripts::perceive"
applies = ["kind:stealth", "skill:Awareness"]

[stealth_xp]
title = "Stealth Experience"
summary = """
Some areas award experience for getting through them unseen. Each time a
hostile creature spots a party member, the area lowers
this award by a set amount. The award drops {stealth.stealth_xp.loss_after_ms:s}
after the creature sees the party member. It drops at once if the creature
attacks a party member before then.
"""
applies = ["kind:stealth", "skill:Stealth"]

[stealth_xp.loss_after_ms]
name = "Stealth Experience Loss"
type = "u64"
value = 6000
unit = "ms"
range = [0, 60000]
summary = "The area's stealth experience award drops {stealth.stealth_xp.loss_after_ms:s} after a hostile creature sees a party member."
source = "K1's executable"
see = "sim::world::scripts::stealth_loss"
applies = ["kind:stealth", "skill:Stealth"]
