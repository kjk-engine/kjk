[chapter]
title = "Feats"
order = 12
summary = """
A character's feats apply wherever the rules call for them. They affect
weapon training, fighting with two weapons, saving throws, skills and
toughness. A character who knows Power Blast, Rapid Shot or Sniper Shot
uses it with the alternate fire of a ranged weapon.
"""
detail = """
Each tier of a feat replaces the tier before it. Scoundrel's Luck, Jedi
Sense and the droid Logic Upgrades add to Defense as class bonuses.
"""

[weapon]
title = "Weapon Training"
summary = """
You need a weapon's proficiency feat to equip it. Weapon Focus grants
+{feats.weapon.focus:bare} to hit with that weapon type; Weapon
Specialization grants +{feats.weapon.specialization:bare} to damage.
"""
applies = ["kind:weapon"]

[weapon.focus]
name = "Weapon Focus"
type = "i32"
value = 1
unit = "points"
range = [0, 10]
summary = "Grants +{feats.weapon.focus:bare} to hit with this weapon type."
source = "the feats' descriptions"
see = "sim::combat::damage::attack_bonus"
applies = ["feat:WEAPON_FOCUS_BLASTER", "feat:WEAPON_FOCUS_BLASTER_RIFLE", "feat:WEAPON_FOCUS_HEAVY_WEAPONS", "feat:WEAPON_FOCUS_LIGHTSABER", "feat:WEAPON_FOCUS_MELEE_WEAPONS"]

[weapon.not_proficient]
name = "Nonproficiency Penalty"
type = "i32"
value = 4
unit = "points"
range = [0, 20]
summary = "Lets you equip this weapon type (fighting without proficiency inflicts -{feats.weapon.not_proficient:bare} to hit). Proficiency All covers every weapon."
detail = "Player characters cannot equip a weapon without its proficiency. Creatures that spawn with one equipped fight with it at this penalty."
source = "KOTOR's d20 rules (reone)"
see = "sim::combat::damage::attack_bonus"
applies = ["feat:WEAPON_PROF_BLASTER", "feat:WEAPON_PROF_BLASTER_RIFLE", "feat:WEAPON_PROF_HEAVY_WEAPONS", "feat:WEAPON_PROF_LIGHTSABER", "feat:WEAPON_PROF_MELEE_WEAPONS", "feat:PROFICIENCY_ALL"]

[weapon.specialization]
name = "Weapon Specialization"
type = "i64"
value = 2
unit = "points"
range = [0, 20]
summary = "Grants +{feats.weapon.specialization:bare} damage with this weapon type."
source = "the feats' descriptions"
see = "sim::combat::damage::weapon_roll"
applies = ["feat:WEAPON_SPEC_BLASTER", "feat:WEAPON_SPEC_BLASTER_RIFLE", "feat:WEAPON_SPEC_HEAVY_WEAPONS", "feat:WEAPON_SPEC_LIGHTSABER", "feat:WEAPON_SPEC_MELEE_WEAPONS"]

[two_weapon]
title = "Two-Weapon Fighting and Dueling"
summary = """
Dual-wielding or using a double weapon inflicts a hit penalty
({feats.two_weapon.main_hand[0]:bare}/{feats.two_weapon.off_hand[0]:bare}
untrained, {feats.two_weapon.main_hand[1]:bare}/{feats.two_weapon.off_hand[1]:bare}
with Two-Weapon Fighting, {feats.two_weapon.main_hand[2]:bare}/{feats.two_weapon.off_hand[2]:bare}
Improved, {feats.two_weapon.main_hand[3]:bare}/{feats.two_weapon.off_hand[3]:bare}
Master). A balanced off-hand weapon (such as a short sword or short
lightsaber) or a double weapon reduces the main-hand penalty by
{feats.two_weapon.balanced:bare}. Fighting with a single one-handed weapon
and an empty off hand gains Dueling instead: +1 / +2 / +3 to hit and
Defense.
"""
detail = "Double weapons: double-bladed sword, double-bladed vibroblade, double-bladed lightsaber, quarterstaff, gaffi stick, Wookiee warblade, and force pike. The equip page shows main-hand numbers for one end and off-hand for the other; in real-time combat, every swing counts as a main-hand attack."
applies = ["feat:TWO_WEAPON_FIGHTING", "feat:TWO_WEAPON_ADVANCED", "feat:TWO_WEAPON_MASTERY", "feat:DUELING", "feat:ADVANCED_DUELING", "feat:MASTER_DUELING", "kind:melee", "kind:lightsaber"]

[two_weapon.main_hand]
name = "Main Hand Penalty"
value = [-6, -6, -4, -2]
labels = ["untrained", "Two-Weapon Fighting", "Improved", "Master"]
unit = "points"
range = [-20, 0]
summary = "Main-hand hit penalty: {feats.two_weapon.main_hand[0]:bare} (untrained), {feats.two_weapon.main_hand[1]:bare} (Two-Weapon Fighting), {feats.two_weapon.main_hand[2]:bare} (Improved), {feats.two_weapon.main_hand[3]:bare} (Master)."
source = "the feats' descriptions"
see = "sim::combat::passive::hand_attack"

[two_weapon.off_hand]
name = "Off Hand Penalty"
value = [-10, -6, -4, -2]
labels = ["untrained", "Two-Weapon Fighting", "Improved", "Master"]
unit = "points"
range = [-20, 0]
summary = "Off-hand hit penalty: {feats.two_weapon.off_hand[0]:bare} (untrained), {feats.two_weapon.off_hand[1]:bare} (Two-Weapon Fighting), {feats.two_weapon.off_hand[2]:bare} (Improved), {feats.two_weapon.off_hand[3]:bare} (Master)."
source = "the feats' descriptions"
see = "sim::combat::passive::hand_attack"

[two_weapon.balanced]
name = "Balanced Weapon"
value = 2
unit = "points"
range = [0, 10]
summary = "A balanced off-hand weapon or a double weapon reduces the main-hand penalty by {feats.two_weapon.balanced:bare}."
source = "the feats' descriptions (the game's \"Balanced\"); both games' attack rolls count a weapon with weaponwield 3 as its own balanced off-hand weapon"
see = "sim::combat::passive::hand_attack"

[two_weapon.superior_main]
name = "Superior Two-Weapon Fighting, Main Hand"
value = [1, 2, 2]
labels = ["I", "II", "III"]
unit = "points"
range = [0, 10]
summary = "Reduces the main-hand dual-wield penalty by {feats.two_weapon.superior_main[0]:bare} (rank I) or {feats.two_weapon.superior_main[1]:bare} (ranks II and III). Rank III also reduces the off-hand penalty by {feats.two_weapon.superior_off[2]:bare}."
detail = "KOTOR 2 Jedi Weapon Master / Sith Marauder feats. Applies to blasters as well as melee weapons and lightsabers."
source = "TSL's executable (its melee and ranged attack bonuses: +1 with the first feat, +2 with the second or third) and the feats' descriptions"
see = "sim::combat::passive::hand_attack"
applies = ["feat:SUPER_WEAPON_FOCUS_2_WEAPON_I", "feat:SUPER_WEAPON_FOCUS_2_WEAPON_II", "feat:SUPER_WEAPON_FOCUS_2_WEAPON_III"]

[two_weapon.superior_off]
name = "Superior Two-Weapon Fighting, Off Hand"
value = [0, 0, 1]
labels = ["I", "II", "III"]
unit = "points"
range = [0, 10]
summary = "Superior Two-Weapon Fighting III reduces the off-hand penalty by {feats.two_weapon.superior_off[2]:bare}."
source = "TSL's executable (its melee and ranged attack bonuses: +1 to the off hand with the third feat only) and the feats' descriptions"
see = "sim::combat::passive::hand_attack"

[saves]
title = "Saving Throws"
summary = """
Conditioning, Improved Conditioning, and Master Conditioning grant +1 / +2
/ +3 to all saving throws.
"""
applies = ["feat:CONDITIONING", "feat:IMPROVED_CONDITIONING", "feat:MASTER_CONDITIONING"]

[saves.uncanny_dodge]
name = "Uncanny Dodge Grenade Bonus"
type = "i32"
value = 2
unit = "points"
range = [0, 10]
summary = "Grants +{feats.saves.uncanny_dodge:bare} to Reflex saves against grenades (for both Uncanny Dodge 1 and 2)."
source = "the feats' descriptions"
see = "sim::combat::passive::grenade_save_bonus"
applies = ["feat:UNCANNY_DODGE_1", "feat:UNCANNY_DODGE_2", "kind:grenade"]

[skills]
title = "Skill Feats"
summary = """
Caution boosts Demolitions and Stealth; Empathy boosts Persuade, Awareness,
and Treat Injury; Gear Head boosts Repair, Security, and Computer Use;
Perceptive boosts Stealth and Awareness; Skill Focus boosts its named
skill. Skill bonuses apply even with 0 ranks, except for trained-only
skills (Demolitions, Stealth, and Security).
"""

[skills.line_per_tier]
name = "Skill Feat Bonus"
value = [1, 1, 1, 2]
labels = ["Caution", "Empathy", "Gear Head", "Perceptive"]
unit = "points"
range = [0, 10]
summary = "Grants +{feats.skills.line_per_tier[0]:bare} per tier (Caution), +{feats.skills.line_per_tier[1]:bare} per tier (Empathy), +{feats.skills.line_per_tier[2]:bare} per tier (Gear Head), or +{feats.skills.line_per_tier[3]:bare} (Perceptive) to each of its skills."
source = "the feats' descriptions"
see = "sim::combat::passive::skill_bonus"
applies = ["feat:CAUTIOUS", "feat:IMPROVED_CAUTION", "feat:MASTER_CAUTION", "feat:EMPATHY", "feat:IMPROVED_EMPATHY", "feat:MASTER__EMPATHY", "feat:GEAR_HEAD", "feat:GEAR_HEAD_ADEPT", "feat:GEAR_HEAD_MASTER", "feat:XXXX_PERCEPTIVE"]

[skills.skill_focus]
name = "Skill Focus"
type = "i32"
value = 2
unit = "points"
range = [0, 10]
summary = "Grants +{feats.skills.skill_focus:bare} to this skill."
source = "the feats' descriptions"
see = "sim::combat::passive::skill_bonus"
applies = ["feat:XXXX_SKILL_FOCUS_COMPUTER_USE", "feat:XXXX_SKILL_FOCUS_DEMOLITIONS", "feat:XXXX_SKILL_FOCUS_STEALTH", "feat:XXXX_SKILL_FOCUS_AWARENESS", "feat:XXXX_SKILL_FOCUS_PERSUADE", "feat:XXXX_SKILL_FOCUS_REPAIR", "feat:XXXX_SKILL_FOCUS_SECURITY", "feat:XXXX_SKILL_FOCUS_TREAT_INJURY"]

[toughness]
title = "Toughness"
summary = """
Toughness and Master Toughness each add +1 Vitality per level
(retroactively). Improved Toughness reduces incoming damage by
{feats.toughness.improved_k1:bare} (physical hits in KOTOR 1) or by 1 per
{feats.toughness.improved_tsl_share:bare} damage above
{feats.toughness.improved_tsl_over:bare} (KOTOR 2). Wookiee Toughness I /
II / III adds +{feats.toughness.wookiee_hp[1]:bare} /
+{feats.toughness.wookiee_hp[2]:bare} /
+{feats.toughness.wookiee_hp[3]:bare} Vitality per level and reduces every
hit by {feats.toughness.wookiee_flat[0]:bare} /
{feats.toughness.wookiee_flat[1]:bare} /
{feats.toughness.wookiee_flat[2]:bare} (plus 1 per
{feats.toughness.wookiee_share[0]:bare} /
{feats.toughness.wookiee_share[1]:bare} remaining damage at ranks II /
III).
"""
detail = """
In KOTOR 1, Improved Toughness reduces only physical damage (bludgeoning,
piercing, and slashing). Damage reduction never lowers a hit below 0.
"""
applies = ["feat:TOUGHNESS", "feat:MASTER_TOUGHNESS", "feat:IMPROVED_TOUGHNESS", "feat:WOOKIE_ENDURANCE", "feat:WOOKIEE_TOUGHNESS_II", "feat:WOOKIEE_TOUGHNESS_III"]

[toughness.wookiee_hp]
name = "Wookiee Toughness Vitality"
value = [0, 2, 3, 4]
labels = ["none", "Wookiee Toughness", "II", "III"]
unit = "HP"
range = [0, 20]
summary = "Adds +{feats.toughness.wookiee_hp[1]:bare} (rank I), +{feats.toughness.wookiee_hp[2]:bare} (rank II), or +{feats.toughness.wookiee_hp[3]:bare} (rank III) Vitality per level."
source = "the feats' descriptions"
see = "sim::combat::passive::hp_per_level"

[toughness.improved_k1]
name = "Improved Toughness (KOTOR)"
type = "i64"
value = 2
unit = "points"
range = [0, 20]
summary = "In KOTOR 1, reduces physical damage from every hit by {feats.toughness.improved_k1:bare}."
source = "K1's description"
see = "sim::combat::passive::toughness"

[toughness.improved_tsl_over]
name = "Improved Toughness Threshold (KOTOR 2)"
type = "i64"
value = 20
unit = "points"
range = [0, 100]
summary = "In KOTOR 2, reduces every hit by 1 per {feats.toughness.improved_tsl_share:bare} damage above {feats.toughness.improved_tsl_over:bare}."
source = "TSL's description"
see = "sim::combat::passive::toughness"

[toughness.improved_tsl_share]
name = "Improved Toughness Reduction (KOTOR 2)"
type = "i64"
value = 10
range = [1, 100]
summary = "In KOTOR 2, reduces every hit by 1 per {feats.toughness.improved_tsl_share:bare} damage above {feats.toughness.improved_tsl_over:bare}."
source = "TSL's description"
see = "sim::combat::passive::toughness"

[toughness.wookiee_flat]
name = "Wookiee Toughness Reduction"
type = "i64"
value = [2, 5, 8]
labels = ["Wookiee Toughness", "II", "III"]
unit = "points"
range = [0, 50]
summary = "Reduces every hit by {feats.toughness.wookiee_flat[0]:bare} (rank I), {feats.toughness.wookiee_flat[1]:bare} (rank II), or {feats.toughness.wookiee_flat[2]:bare} (rank III)."
source = "the feats' descriptions (K1's; TSL's II and III)"
see = "sim::combat::passive::toughness"

[toughness.wookiee_share]
name = "Wookiee Toughness Extra Reduction"
type = "i64"
value = [20, 10]
labels = ["II", "III"]
range = [1, 100]
summary = "Reduces remaining damage by 1 per {feats.toughness.wookiee_share[0]:bare} (rank II) or 1 per {feats.toughness.wookiee_share[1]:bare} (rank III)."
source = "TSL's descriptions"
see = "sim::combat::passive::toughness"

[force_sensitive]
title = "Force Sensitive"
summary = "Grants +{feats.force_sensitive.points:bare} Force points once when learned."
applies = ["feat:FORCE_SENSITIVE"]

[force_sensitive.points]
name = "Force Sensitive Points"
type = "u16"
value = 40
unit = "FP"
range = [0, 500]
summary = "Grants +{feats.force_sensitive.points:bare} Force points."
source = "TSL's description"
see = "sim::combat::passive::learn"

[force_focus]
title = "Force Focus"
summary = "Adds +{feats.force_focus.dc[0]:bare} (Force Focus), +{feats.force_focus.dc[1]:bare} (Advanced), or +{feats.force_focus.dc[2]:bare} (Mastery) to your Force power save DCs. Only your highest rank applies."
applies = ["feat:FORCE_FOCUS", "feat:FORCE_FOCUS_ADVANCED", "feat:FORCE_FOCUS_MASTERY", "kind:force"]

[force_focus.dc]
name = "Force Focus DC Bonus"
value = [1, 2, 4]
labels = ["Force Focus", "Advanced", "Mastery"]
unit = "points"
range = [0, 20]
summary = "Adds +{feats.force_focus.dc[0]:bare} (Force Focus), +{feats.force_focus.dc[1]:bare} (Advanced), or +{feats.force_focus.dc[2]:bare} (Mastery) to Force power save DCs."
source = "the feats' descriptions"
see = "sim::combat::force"

[specials]
title = "Feat Attacks for Ranged Weapons"
summary = """
Press [Saber throw/kata/ranged feat] with a ranged weapon to use your
selected feat attack (Power Blast, Rapid Shot, or Sniper Shot), regardless
of gun type. Press [Next feat attack] to switch (remembered per gun type;
defaults to the first you know in that order). Feat attack penalties last
one round ({combat.timing.round_ms:s}). If you lack stamina or any ranged
feat, it fires normally.
"""
applies = ["kind:blaster"]

[specials.cost_percent]
name = "Feat Attack Cost"
type = "u16"
value = 15
unit = "%"
range = [0, 100]
summary = "Costs {feats.specials.cost_percent} of your max Stamina (never Force points). Under Jedi Academy rules, Force users pay nothing."
source = "ours; Force users pay nothing under Jedi Academy's rules since Discord 2026-11-17 (feat attacks took Force points)"
see = "sim::combat::specials::cost"
applies = ["kind:stamina"]

[specials.power_blast]
title = "Power Blast"
summary = """
Hold [Saber throw/kata/ranged feat] to charge (up to
{feats.specials.power_blast.steps:bare} steps of
{feats.specials.power_blast.step_ms:s}; auto-fires at
{feats.specials.power_blast.limit_ms:s}), then release to fire a single
charged shot. Grants +{feats.specials.power_blast.damage[0]:bare} (Power
Blast), +{feats.specials.power_blast.damage[1]:bare} (Improved), or
+{feats.specials.power_blast.damage[2]:bare} (Master) damage at a
-{feats.specials.power_blast.attack_penalty:bare} penalty to hit.
"""
applies = ["feat:POWER_BLAST", "feat:IMPROVED_POWER_BLAST", "feat:MASTER_POWER_BLAST", "kind:pistol"]

[specials.power_blast.step_ms]
name = "Charge Step"
type = "u64"
value = 200
unit = "ms"
range = [10, 2000]
summary = "Charges in steps of {feats.specials.power_blast.step_ms:s}."
detail = "The shot's damage counts the charge's whole steps as part of the attack's time, along with the weapon's time between shots. A shot let go before the first step ends counts no charge time, so tapping [Saber throw/kata/ranged feat] deals no more damage per second than holding it."
source = "JA (the Bryar's charge)"
see = "sim::combat::specials::pull"

[specials.power_blast.steps]
name = "Charge Steps"
type = "u64"
value = 5
range = [1, 20]
summary = "Charges for up to {feats.specials.power_blast.steps:bare} steps."
source = "JA (the Bryar's charge)"
see = "sim::combat::specials::pull"

[specials.power_blast.limit_ms]
name = "Maximum Charge"
type = "u64"
value = 5000
unit = "ms"
range = [100, 30000]
summary = "Auto-fires after {feats.specials.power_blast.limit_ms:s} of charging."
source = "JA: weapon charge"
see = "sim::combat::specials::pull"

[specials.power_blast.damage]
name = "Power Blast Damage"
type = "i8"
value = [5, 8, 10]
labels = ["Power Blast", "Improved", "Master"]
unit = "points"
range = [0, 50]
summary = "+{feats.specials.power_blast.damage[0]:bare} (Power Blast), +{feats.specials.power_blast.damage[1]:bare} (Improved), or +{feats.specials.power_blast.damage[2]:bare} (Master) damage."
source = "the feats' descriptions"
see = "sim::combat::specials::Special::shot"

[specials.power_blast.attack_penalty]
name = "Power Blast Penalty"
type = "i8"
value = 3
unit = "points"
range = [0, 20]
summary = "Inflicts -{feats.specials.power_blast.attack_penalty:bare} to hit."
source = "the feats' descriptions"
see = "sim::combat::specials::Special::shot"

[specials.rapid_shot]
title = "Rapid Shot"
summary = """
Press [Saber throw/kata/ranged feat] to fire a burst of
{feats.specials.rapid_shot.shots:bare} shots (Rapid Shot / Improved) or
{feats.specials.rapid_shot.multi_shots:bare} shots (Master), spaced
{feats.specials.rapid_shot.gap_ms:s} apart. For one round afterward, you
take {feats.specials.rapid_shot.penalty[0]:bare} (Rapid Shot),
{feats.specials.rapid_shot.penalty[1]:bare} (Improved), or
{feats.specials.rapid_shot.penalty[2]:bare} (Master) to attack and Defense
(reduced by 1 per equipped item with a Rapid Shot bonus).
"""
applies = ["feat:RAPID_SHOT", "feat:IMPROVED_RAPID_SHOT", "feat:MULTI_SHOT", "kind:rifle"]

[specials.rapid_shot.gap_ms]
name = "Burst Interval"
type = "u32"
value = 150
unit = "ms"
range = [10, 2000]
summary = "Shots in a burst fire {feats.specials.rapid_shot.gap_ms:s} apart (or faster if the weapon's own fire rate is faster)."
source = "JA (the E-11's alternate refire)"
see = "sim::combat::specials::pull"

[specials.rapid_shot.shots]
name = "Rapid Shot Burst"
type = "u8"
value = 3
range = [1, 10]
summary = "Rapid Shot and Improved Rapid Shot fire {feats.specials.rapid_shot.shots:bare} shots."
detail = "In KOTOR, these feats allow one extra attack. The owner asked for more shots on 2 November 2026, because a single extra shot was worth little after its penalty to hit (`kjk combat duel --only gun_worth`)."
source = "ours, after the feats' descriptions (an extra attack)"
see = "sim::combat::specials::Special::burst"

[specials.rapid_shot.multi_shots]
name = "Master Rapid Shot Burst"
type = "u8"
value = 4
range = [1, 10]
summary = "Master Rapid Shot fires {feats.specials.rapid_shot.multi_shots:bare} shots."
detail = "In KOTOR, this feat allows two extra attacks. kjk adds one more shot, as it does for Rapid Shot (2 November 2026)."
source = "ours, after the feats' descriptions (two extra attacks)"
see = "sim::combat::specials::Special::burst"

[specials.rapid_shot.penalty]
name = "Rapid Shot Penalty"
type = "i8"
value = [-4, -2, -1]
labels = ["Rapid Shot", "Improved", "Master"]
unit = "points"
range = [-20, 0]
summary = "For one round after a burst, inflicts {feats.specials.rapid_shot.penalty[0]:bare} (Rapid Shot), {feats.specials.rapid_shot.penalty[1]:bare} (Improved), or {feats.specials.rapid_shot.penalty[2]:bare} (Master) to attack and Defense."
source = "the feats' descriptions"
see = "sim::combat::specials::Special::exposure"

[specials.sniper_shot]
title = "Sniper Shot"
summary = """
Hold [Saber throw/kata/ranged feat] for
{feats.specials.sniper_shot.steady_ms[0]:s}
({feats.specials.sniper_shot.steady_ms[1]:s} while aiming) to steady your
shot, then release to fire with no spread (fires both pistols if
dual-wielding). Grants +{feats.specials.sniper_shot.attack_bonus[0]:bare} /
+{feats.specials.sniper_shot.attack_bonus[1]:bare} /
+{feats.specials.sniper_shot.attack_bonus[2]:bare} to hit and
{feats.specials.sniper_shot.threat_times[0]:bare}× /
{feats.specials.sniper_shot.threat_times[1]:bare}× /
{feats.specials.sniper_shot.threat_times[2]:bare}× critical threat range
(Sniper / Improved / Master). While steadying, you walk and cannot jump;
for one round after firing, you take
{feats.specials.sniper_shot.defence_penalty:bare} Defense. Does not stun.
"""
applies = ["feat:SNIPER_SHOT", "feat:IMPROVED_SNIPER_SHOT", "feat:MASTER_SNIPER_SHOT"]

[specials.sniper_shot.steady_ms]
name = "Sniper Shot Steadying"
type = "u64"
value = [500, 250]
labels = ["from the hip", "while aiming"]
unit = "ms"
range = [0, 5000]
summary = "Steadies in {feats.specials.sniper_shot.steady_ms[0]:s} from the hip, or {feats.specials.sniper_shot.steady_ms[1]:s} while aiming."
source = "the owner's design, 2026-11-17"
see = "sim::combat::specials::pull, sim::combat::ai::choose_special"

[specials.sniper_shot.threat_times]
name = "Sniper Shot Threat Range"
type = "u8"
value = [2, 3, 4]
labels = ["Sniper Shot", "Improved", "Master"]
unit = "×"
range = [1, 20]
summary = "Multiplies critical threat range by {feats.specials.sniper_shot.threat_times[0]:bare}× (Sniper), {feats.specials.sniper_shot.threat_times[1]:bare}× (Improved), or {feats.specials.sniper_shot.threat_times[2]:bare}× (Master)."
source = "the feats' descriptions"
see = "sim::combat::specials::Special::shot"

[specials.sniper_shot.attack_bonus]
name = "Sniper Shot Accuracy"
type = "i8"
value = [4, 6, 8]
labels = ["Sniper Shot", "Improved", "Master"]
unit = "points"
range = [0, 20]
summary = "Grants +{feats.specials.sniper_shot.attack_bonus[0]:bare} (Sniper), +{feats.specials.sniper_shot.attack_bonus[1]:bare} (Improved), or +{feats.specials.sniper_shot.attack_bonus[2]:bare} (Master) to hit."
detail = "The owner asked on 2 November 2026 for Sniper Shot to be much more accurate. With only KOTOR's larger critical threat range, a Sniper Shot was just a few percent better than a normal shot (`kjk combat duel --only gun_worth`)."
source = "ours"
see = "sim::combat::specials::Special::shot"

[specials.sniper_shot.defence_penalty]
name = "Sniper Shot Penalty"
type = "i8"
value = -5
unit = "points"
range = [-20, 0]
summary = "Inflicts {feats.specials.sniper_shot.defence_penalty:bare} Defense for one round after firing."
source = "the feats' descriptions"
see = "sim::combat::specials::Special::exposure"

[sneak_attack]
title = "Sneak Attack"
summary = """
Each rank adds 1–{feats.sneak_attack.die:bare} extra damage within
{feats.sneak_attack.reach_m:bare} m when the target cannot defend itself:
from behind (unless they have Uncanny Dodge), while stunned, knocked down,
or choked, or before they notice you. Not multiplied on critical hits, and
blocked by immunity to critical hits or sneak attacks.
"""
detail = "Counts as behind when within the target's rear 90° arc. Your first attack out of Stealth Mode also triggers Sneak Attack."
applies = ["feat:SNEAK_ATTACK_1D6", "feat:SNEAK_ATTACK_2D6", "feat:SNEAK_ATTACK_3D6", "feat:SNEAK_ATTACK_4D6", "feat:SNEAK_ATTACK_5D6", "feat:SNEAK_ATTACK_6D6", "feat:SNEAK_ATTACK_7D6", "feat:SNEAK_ATTACK_8D6", "feat:SNEAK_ATTACK_9D6", "feat:SNEAK_ATTACK_10D6", "feat:UNCANNY_DODGE_1", "feat:UNCANNY_DODGE_2", "kind:stealth"]

[sneak_attack.die]
name = "Sneak Attack Die"
type = "u8"
value = 6
range = [1, 20]
summary = "Each Sneak Attack rank adds 1–{feats.sneak_attack.die:bare} extra damage."
source = "the feats' descriptions"
see = "sim::combat::damage::weapon_damage"

[sneak_attack.reach_m]
name = "Sneak Attack Range"
value = 10.0
unit = "m"
range = [0.0, 100.0]
summary = "Only triggers within {feats.sneak_attack.reach_m:bare} m."
source = "the feats' descriptions (KOTOR's 10 m)"
see = "sim::combat::specials::sneak_dice"

[targeting]
title = "Targeting"
summary = """
Grants +{feats.targeting.attack[0]:bare} (Targeting I) up to
+{feats.targeting.attack[7]:bare} (Targeting VIII) to hit with ranged
weapons (+1 per rank; highest rank applies).
"""
detail = "Granted automatically to Scouts at class levels."
applies = ["feat:TARGETING_1", "feat:TARGETING_2", "feat:TARGETING_3", "feat:TARGETING_4", "feat:TARGETING_5", "feat:TARGETING_6", "feat:TARGETING_7", "feat:TARGETING_8", "kind:blaster"]

[targeting.attack]
name = "Targeting Bonus"
value = [1, 2, 3, 4, 5, 6, 7, 8]
labels = ["Targeting I", "Targeting II", "Targeting III", "Targeting IV", "Targeting V", "Targeting VI", "Targeting VII", "Targeting VIII"]
unit = "points"
range = [0, 20]
summary = "Grants +{feats.targeting.attack[0]:bare} to +{feats.targeting.attack[7]:bare} to hit with ranged weapons (Targeting I–VIII)."
source = "KOTOR 2's feat descriptions (\"Level 1 scouts have a +1 attack bonus with ranged weapons\", up to +8 at level 29)"
see = "sim::combat::damage::attack_bonus"

[finesse]
title = "Finesse"
summary = """
Uses your Dexterity modifier instead of Strength to hit if it is higher
(Strength still sets damage). Finesse: Lightsabers applies to lightsabers;
Finesse: Melee Weapons applies to all other melee weapons (not unarmed).
"""
applies = ["feat:FINESSE_LIGHTSABERS", "feat:FINESSE_MELEE_WEAPONS", "kind:melee", "kind:lightsaber"]

[precise_shot]
title = "Precise Shot"
summary = """
Adds +{feats.precise_shot.damage[0]:bare} /
+{feats.precise_shot.damage[1]:bare} / +{feats.precise_shot.damage[2]:bare}
/ +{feats.precise_shot.damage[3]:bare} /
+{feats.precise_shot.damage[4]:bare} ranged weapon damage (ranks I–V) and
inflicts -{feats.precise_shot.deflect_penalty[0]:bare} /
-{feats.precise_shot.deflect_penalty[1]:bare} /
-{feats.precise_shot.deflect_penalty[2]:bare} /
-{feats.precise_shot.deflect_penalty[3]:bare} /
-{feats.precise_shot.deflect_penalty[4]:bare} to enemy blaster deflection.
Does not apply to grenades or thrown lightsabers.
"""
detail = "A deflected bolt becomes the deflector's own, using their Precise Shot penalty if deflected again."
applies = ["feat:PRECISE_SHOT_I", "feat:PRECISE_SHOT_II", "feat:PRECISE_SHOT_III", "feat:PRECISE_SHOT_IV", "feat:PRECISE_SHOT_V", "kind:blaster"]

[precise_shot.damage]
name = "Precise Shot Damage"
type = "i64"
value = [1, 2, 4, 6, 8]
labels = ["Precise Shot I", "Precise Shot II", "Precise Shot III", "Precise Shot IV", "Precise Shot V"]
unit = "points"
range = [0, 20]
summary = "Adds +{feats.precise_shot.damage[0]:bare} / +{feats.precise_shot.damage[1]:bare} / +{feats.precise_shot.damage[2]:bare} / +{feats.precise_shot.damage[3]:bare} / +{feats.precise_shot.damage[4]:bare} ranged damage (ranks I–V)."
source = "KOTOR 2's feat descriptions (\"increases the damage done with ranged weapons by +1\", +2, +4, +6 and +8)"
see = "sim::combat::damage::weapon_roll"

[precise_shot.deflect_penalty]
name = "Precise Shot Deflection Penalty"
type = "i8"
value = [2, 4, 6, 8, 10]
labels = ["Precise Shot I", "Precise Shot II", "Precise Shot III", "Precise Shot IV", "Precise Shot V"]
unit = "points"
range = [0, 20]
summary = "Inflicts -{feats.precise_shot.deflect_penalty[0]:bare} / -{feats.precise_shot.deflect_penalty[1]:bare} / -{feats.precise_shot.deflect_penalty[2]:bare} / -{feats.precise_shot.deflect_penalty[3]:bare} / -{feats.precise_shot.deflect_penalty[4]:bare} to enemy blaster deflection (ranks I–V)."
source = "KOTOR 2's feat descriptions (\"applies a -2 penalty to any attempt to deflect the blaster bolt\", up to -10)"
see = "sim::combat::passive::deflect_penalty"

[close_combat]
title = "Close Combat"
summary = """
Grants +{feats.close_combat.attack[0]:bare} (Close Combat) or
+{feats.close_combat.attack[1]:bare} (Improved) to hit with ranged weapons
against targets within {feats.close_combat.short_range_m:bare} m.
"""
detail = """
In KOTOR 2 these feats also lower a melee-vs-ranged attacker bonus; kjk has
no such bonus, so only the short-range attack bonus applies.
"""
applies = ["feat:CLOSE_COMBAT", "feat:IMPROVED_CLOSE_COMBAT", "kind:blaster"]

[close_combat.attack]
name = "Close Combat Bonus"
value = [1, 2]
labels = ["Close Combat", "Improved Close Combat"]
unit = "points"
range = [0, 10]
summary = "Grants +{feats.close_combat.attack[0]:bare} (Close Combat) or +{feats.close_combat.attack[1]:bare} (Improved) to hit at short range."
source = "KOTOR 2's feat descriptions (\"When the character's target is at short range, they receive a +1 attack bonus\", +2 with Improved Close Combat)"
see = "sim::combat::passive::close_combat"

[close_combat.short_range_m]
name = "Short Range"
value = 10.0
unit = "m"
range = [0.0, 100.0]
summary = "Short range for Close Combat is within {feats.close_combat.short_range_m:bare} m."
source = "both games' ranges.2da (row WeaponRngShrt)"
see = "sim::combat::passive::close_combat"

[dual_strike]
title = "Dual Strike"
summary = """
Grants +{feats.dual_strike.attack[0]:bare} (Dual Strike),
+{feats.dual_strike.attack[1]:bare} (Improved), or
+{feats.dual_strike.attack[2]:bare} (Master) to hit an enemy that an ally
is already attacking.
"""
detail = "Counts when another member of your party (or side) is targeting the same enemy."
applies = ["feat:DUAL_STRIKE", "feat:IMPROVED_DUAL_STRIKE", "feat:MASTER_DUAL_STRIKE"]

[dual_strike.attack]
name = "Dual Strike Bonus"
value = [2, 4, 6]
labels = ["Dual Strike", "Improved Dual Strike", "Master Dual Strike"]
unit = "points"
range = [0, 20]
summary = "Grants +{feats.dual_strike.attack[0]:bare} / +{feats.dual_strike.attack[1]:bare} / +{feats.dual_strike.attack[2]:bare} to hit an enemy an ally is attacking."
source = "KOTOR 2's feat descriptions (\"the character gets a +2 bonus to hit\", +4 and +6)"
see = "sim::combat::passive::dual_strike"

[unarmed_specialist]
title = "Unarmed Specialist"
summary = """
Adds {feats.unarmed_specialist.dice[0]:bare}d{feats.unarmed_specialist.die:bare}
(rank I) up to
{feats.unarmed_specialist.dice[7]:bare}d{feats.unarmed_specialist.die:bare}
(rank VIII) extra damage to unarmed attacks (+1 die per rank; highest rank
applies).
"""
detail = "Granted automatically to Jedi classes at class levels."
applies = ["feat:UNARMED_SPECIALIST_I", "feat:UNARMED_SPECIALIST_II", "feat:UNARMED_SPECIALIST_III", "feat:UNARMED_SPECIALIST_IV", "feat:UNARMED_SPECIALIST_V", "feat:UNARMED_SPECIALIST_VI", "feat:UNARMED_SPECIALIST_VII", "feat:UNARMED_SPECIALIST_VIII"]

[unarmed_specialist.dice]
name = "Unarmed Specialist Dice"
type = "u8"
value = [1, 2, 3, 4, 5, 6, 7, 8]
labels = ["Unarmed Specialist I", "Unarmed Specialist II", "Unarmed Specialist III", "Unarmed Specialist IV", "Unarmed Specialist V", "Unarmed Specialist VI", "Unarmed Specialist VII", "Unarmed Specialist VIII"]
unit = "dice"
range = [0, 20]
summary = "Adds {feats.unarmed_specialist.dice[0]:bare} to {feats.unarmed_specialist.dice[7]:bare} extra damage dice to unarmed attacks (ranks I–VIII)."
source = "KOTOR 2's feat descriptions (\"adding 1-4 to damage to all unarmed attacks\", then 2-8, 3-12 and so on up to 8-32)"
see = "sim::combat::damage::weapon_roll"

[unarmed_specialist.die]
name = "Unarmed Specialist Die"
type = "u8"
value = 4
range = [1, 20]
summary = "Each die adds 1–{feats.unarmed_specialist.die:bare} damage."
source = "KOTOR 2's feat descriptions (\"adding 1-4 to damage\")"
see = "sim::combat::damage::weapon_roll"

[evasion]
title = "Evasion"
summary = """
You take no damage from grenades on a successful Reflex save (instead of
half).
"""
detail = """
Mines and Force powers are handled by the games' own scripts, which check
Evasion themselves. The engine applies Evasion to grenade blasts it
resolves directly.
"""
applies = ["feat:EVASION", "kind:grenade"]

[class_skill]
title = "Class Skill Feats"
summary = """
Turns this skill into a class skill: ranks cost
{progression.levels.skill_cost[0]:bare} skill point instead of
{progression.levels.skill_cost[1]:bare}, with the full class-skill rank
cap.
"""
detail = """
In KOTOR 1, a class can only pick a Class Skill feat for a skill that is
not already a class skill.
"""
applies = ["feat:CLASS_SKILL_AWARENESS", "feat:CLASS_SKILL_COMPUTER_USE", "feat:CLASS_SKILL_DEMOLITIONS", "feat:CLASS_SKILL_REPAIR", "feat:CLASS_SKILL_SECURITY", "feat:CLASS_SKILL_STEALTH", "feat:CLASS_SKILL_TREAT_INJURY"]
