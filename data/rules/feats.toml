[chapter]
title = "Feats"
order = 12
summary = """
A character's feats apply wherever the rules call for them. They affect
weapon training, fighting with two weapons, saving throws, skills and
toughness. A character who knows Power Blast, Rapid Shot or Sniper Shot
uses it with the alternate fire of a ranged weapon.
"""
detail = """
Each tier of a feat replaces the tier before it. Scoundrel's Luck, Jedi
Sense and the droid Logic Upgrades add to Defense as class bonuses.
"""

[weapon]
title = "Weapon Training"
summary = """
A character needs a weapon's proficiency feat to equip it. Weapon Focus
adds a bonus to hit with that type of weapon. Weapon Specialization adds a
bonus to its damage.
"""
applies = ["kind:weapon"]

[weapon.focus]
name = "Weapon Focus"
type = "i32"
value = 1
unit = "points"
range = [0, 10]
summary = "Weapon Focus adds a +{feats.weapon.focus:bare} bonus to hit with weapons of the feat's type."
source = "the feats' descriptions"
see = "sim::combat::damage::attack_bonus"
applies = ["feat:WEAPON_FOCUS_BLASTER", "feat:WEAPON_FOCUS_BLASTER_RIFLE", "feat:WEAPON_FOCUS_HEAVY_WEAPONS", "feat:WEAPON_FOCUS_LIGHTSABER", "feat:WEAPON_FOCUS_MELEE_WEAPONS"]

[weapon.not_proficient]
name = "Nonproficiency Penalty"
type = "i32"
value = 4
unit = "points"
range = [0, 20]
summary = "A character using a weapon without the matching proficiency feat suffers a -{feats.weapon.not_proficient:bare} penalty to hit. The Proficiency All feat counts as every proficiency."
detail = "A player character cannot equip such a weapon. A creature that already has one equipped fights with it at this penalty."
source = "KOTOR's d20 rules (reone)"
see = "sim::combat::damage::attack_bonus"
applies = ["feat:WEAPON_PROF_BLASTER", "feat:WEAPON_PROF_BLASTER_RIFLE", "feat:WEAPON_PROF_HEAVY_WEAPONS", "feat:WEAPON_PROF_LIGHTSABER", "feat:WEAPON_PROF_MELEE_WEAPONS", "feat:PROFICIENCY_ALL"]

[weapon.specialization]
name = "Weapon Specialization"
type = "i64"
value = 2
unit = "points"
range = [0, 20]
summary = "Weapon Specialization adds a +{feats.weapon.specialization:bare} bonus to damage with weapons of the feat's type."
source = "the feats' descriptions"
see = "sim::combat::damage::weapon_roll"
applies = ["feat:WEAPON_SPEC_BLASTER", "feat:WEAPON_SPEC_BLASTER_RIFLE", "feat:WEAPON_SPEC_HEAVY_WEAPONS", "feat:WEAPON_SPEC_LIGHTSABER", "feat:WEAPON_SPEC_MELEE_WEAPONS"]

[two_weapon]
title = "Two-Weapon Fighting and Dueling"
summary = """
A character fighting with a double weapon, or with a weapon in each hand,
suffers a penalty to hit with both hands. Two-Weapon Fighting, Improved
Two-Weapon Fighting and Master Two-Weapon Fighting reduce this penalty. A
balanced weapon in the off hand further reduces the main hand's penalty. A
small weapon, such as a short sword or a short lightsaber, is balanced. A
double weapon counts as its own balanced off-hand weapon. A character
fighting with a single one-handed weapon and nothing in the other hand
gains the Dueling bonus instead. The three tiers of Dueling add +1, +2 and
+3 to hit and to Defense.
"""
detail = "The double weapons are the double-bladed sword, the double-bladed vibroblade, the double-bladed lightsaber, the quarterstaff, the gaffi stick, the Wookiee warblade and the force pike. The equip page shows the main-hand numbers for one end of a double weapon and the off-hand numbers for the other end. In a real-time fight, every swing with a double weapon counts as a main-hand attack."
applies = ["feat:TWO_WEAPON_FIGHTING", "feat:TWO_WEAPON_ADVANCED", "feat:TWO_WEAPON_MASTERY", "feat:DUELING", "feat:ADVANCED_DUELING", "feat:MASTER_DUELING", "kind:melee", "kind:lightsaber"]

[two_weapon.main_hand]
name = "Main Hand Penalty"
value = [-6, -6, -4, -2]
labels = ["untrained", "Two-Weapon Fighting", "Improved", "Master"]
unit = "points"
range = [-20, 0]
summary = "The main hand suffers a {feats.two_weapon.main_hand[0]:bare} penalty to hit without training, {feats.two_weapon.main_hand[1]:bare} with Two-Weapon Fighting, {feats.two_weapon.main_hand[2]:bare} with Improved Two-Weapon Fighting and {feats.two_weapon.main_hand[3]:bare} with Master Two-Weapon Fighting."
source = "the feats' descriptions"
see = "sim::combat::passive::hand_attack"

[two_weapon.off_hand]
name = "Off Hand Penalty"
value = [-10, -6, -4, -2]
labels = ["untrained", "Two-Weapon Fighting", "Improved", "Master"]
unit = "points"
range = [-20, 0]
summary = "The off hand suffers a {feats.two_weapon.off_hand[0]:bare} penalty to hit without training, {feats.two_weapon.off_hand[1]:bare} with Two-Weapon Fighting, {feats.two_weapon.off_hand[2]:bare} with Improved Two-Weapon Fighting and {feats.two_weapon.off_hand[3]:bare} with Master Two-Weapon Fighting."
source = "the feats' descriptions"
see = "sim::combat::passive::hand_attack"

[two_weapon.balanced]
name = "Balanced Weapon"
value = 2
unit = "points"
range = [0, 10]
summary = "A balanced weapon in the off hand, or a double weapon, reduces the main hand's penalty by {feats.two_weapon.balanced:bare}."
source = "the feats' descriptions (the game's \"Balanced\"); both games' attack rolls count a weapon with weaponwield 3 as its own balanced off-hand weapon"
see = "sim::combat::passive::hand_attack"

[two_weapon.superior_main]
name = "Superior Two-Weapon Fighting, Main Hand"
value = [1, 2, 2]
labels = ["I", "II", "III"]
unit = "points"
range = [0, 10]
summary = "In KOTOR 2, Superior Two-Weapon Fighting I reduces the main hand's penalty by {feats.two_weapon.superior_main[0]:bare} more. Superior Two-Weapon Fighting II and III reduce it by {feats.two_weapon.superior_main[1]:bare} more."
detail = "These feats belong to the Jedi Weapon Master and the Sith Marauder. They apply to blasters as well as to melee weapons and lightsabers."
source = "TSL's executable (its melee and ranged attack bonuses: +1 with the first feat, +2 with the second or third) and the feats' descriptions"
see = "sim::combat::passive::hand_attack"
applies = ["feat:SUPER_WEAPON_FOCUS_2_WEAPON_I", "feat:SUPER_WEAPON_FOCUS_2_WEAPON_II", "feat:SUPER_WEAPON_FOCUS_2_WEAPON_III"]

[two_weapon.superior_off]
name = "Superior Two-Weapon Fighting, Off Hand"
value = [0, 0, 1]
labels = ["I", "II", "III"]
unit = "points"
range = [0, 10]
summary = "In KOTOR 2, Superior Two-Weapon Fighting III reduces the off hand's penalty by {feats.two_weapon.superior_off[2]:bare}. The first two ranks leave the off hand's penalty as it is."
source = "TSL's executable (its melee and ranged attack bonuses: +1 to the off hand with the third feat only) and the feats' descriptions"
see = "sim::combat::passive::hand_attack"
applies = ["feat:SUPER_WEAPON_FOCUS_2_WEAPON_I", "feat:SUPER_WEAPON_FOCUS_2_WEAPON_II", "feat:SUPER_WEAPON_FOCUS_2_WEAPON_III"]

[saves]
title = "Saving Throws"
summary = """
Conditioning, Improved Conditioning and Master Conditioning add +1, +2 and
+3 to all saving throws. Uncanny Dodge 1 and Uncanny Dodge 2 add a bonus to
saving throws against grenades.
"""
applies = ["feat:CONDITIONING", "feat:IMPROVED_CONDITIONING", "feat:MASTER_CONDITIONING"]

[saves.uncanny_dodge]
name = "Uncanny Dodge Grenade Bonus"
type = "i32"
value = 2
unit = "points"
range = [0, 10]
summary = "Uncanny Dodge 1 and Uncanny Dodge 2 each add +{feats.saves.uncanny_dodge:bare} to Reflex saves against grenades."
source = "the feats' descriptions"
see = "sim::combat::passive::grenade_save_bonus"
applies = ["feat:UNCANNY_DODGE_1", "feat:UNCANNY_DODGE_2", "kind:grenade"]

[skills]
title = "Skill Feats"
summary = """
Caution adds to Demolitions and Stealth. Empathy adds to Persuade,
Awareness and Treat Injury. Gear Head adds to Repair, Security and Computer
Use. Each tier of these feats adds its bonus again. Perceptive adds to
Stealth and Awareness, and each Skill Focus feat adds to its own skill. A
skill feat adds to a skill even when the character has no ranks in it.
Demolitions, Stealth and Security are the exception. Only a character who
has ranks in these skills can use them, so without ranks their total is 0.
Both games' executables work this way.
"""

[skills.line_per_tier]
name = "Skill Feat Bonus"
value = [1, 1, 1, 2]
labels = ["Caution", "Empathy", "Gear Head", "Perceptive"]
unit = "points"
range = [0, 10]
summary = "Each tier of Caution adds +{feats.skills.line_per_tier[0]:bare} to each of its skills. Each tier of Empathy adds +{feats.skills.line_per_tier[1]:bare}, and each tier of Gear Head adds +{feats.skills.line_per_tier[2]:bare}. Perceptive adds +{feats.skills.line_per_tier[3]:bare}."
source = "the feats' descriptions"
see = "sim::combat::passive::skill_bonus"
applies = ["feat:CAUTIOUS", "feat:IMPROVED_CAUTION", "feat:MASTER_CAUTION", "feat:EMPATHY", "feat:IMPROVED_EMPATHY", "feat:MASTER__EMPATHY", "feat:GEAR_HEAD", "feat:GEAR_HEAD_ADEPT", "feat:GEAR_HEAD_MASTER", "feat:XXXX_PERCEPTIVE"]

[skills.skill_focus]
name = "Skill Focus"
type = "i32"
value = 2
unit = "points"
range = [0, 10]
summary = "Skill Focus adds a +{feats.skills.skill_focus:bare} bonus to its skill."
source = "the feats' descriptions"
see = "sim::combat::passive::skill_bonus"
applies = ["feat:XXXX_SKILL_FOCUS_COMPUTER_USE", "feat:XXXX_SKILL_FOCUS_DEMOLITIONS", "feat:XXXX_SKILL_FOCUS_STEALTH", "feat:XXXX_SKILL_FOCUS_AWARENESS", "feat:XXXX_SKILL_FOCUS_PERSUADE", "feat:XXXX_SKILL_FOCUS_REPAIR", "feat:XXXX_SKILL_FOCUS_SECURITY", "feat:XXXX_SKILL_FOCUS_TREAT_INJURY"]

[toughness]
title = "Toughness"
summary = """
Toughness and Master Toughness each add +1 vitality point per level. This
includes the levels the character gained before learning the feat. Wookiee
Toughness adds more vitality points per level. Improved Toughness and
Wookiee Toughness also reduce the damage of every hit.
"""
detail = """
In KOTOR, Improved Toughness reduces only physical damage, which is
bludgeoning, piercing and slashing damage. Damage reduction never removes
more damage than the hit deals.
"""
applies = ["feat:TOUGHNESS", "feat:MASTER_TOUGHNESS", "feat:IMPROVED_TOUGHNESS", "feat:WOOKIE_ENDURANCE", "feat:WOOKIEE_TOUGHNESS_II", "feat:WOOKIEE_TOUGHNESS_III"]

[toughness.wookiee_hp]
name = "Wookiee Toughness Vitality"
value = [0, 2, 3, 4]
labels = ["none", "Wookiee Toughness", "II", "III"]
unit = "HP"
range = [0, 20]
summary = "Wookiee Toughness adds +{feats.toughness.wookiee_hp[1]:bare} vitality points per level. Wookiee Toughness II adds +{feats.toughness.wookiee_hp[2]:bare} and Wookiee Toughness III adds +{feats.toughness.wookiee_hp[3]:bare}."
source = "the feats' descriptions"
see = "sim::combat::passive::hp_per_level"

[toughness.improved_k1]
name = "Improved Toughness (KOTOR)"
type = "i64"
value = 2
unit = "points"
range = [0, 20]
summary = "In KOTOR, Improved Toughness reduces the physical damage of every hit by {feats.toughness.improved_k1:bare} points."
source = "K1's description"
see = "sim::combat::passive::toughness"

[toughness.improved_tsl_over]
name = "Improved Toughness Threshold (KOTOR 2)"
type = "i64"
value = 20
unit = "points"
range = [0, 100]
summary = "In KOTOR 2, Improved Toughness reduces every hit by 1 point for every {feats.toughness.improved_tsl_share:bare} points of damage above {feats.toughness.improved_tsl_over:bare}."
source = "TSL's description"
see = "sim::combat::passive::toughness"

[toughness.improved_tsl_share]
name = "Improved Toughness Reduction (KOTOR 2)"
type = "i64"
value = 10
range = [1, 100]
summary = "In KOTOR 2, Improved Toughness reduces every hit by 1 point for every {feats.toughness.improved_tsl_share:bare} points of damage above {feats.toughness.improved_tsl_over:bare}."
source = "TSL's description"
see = "sim::combat::passive::toughness"

[toughness.wookiee_flat]
name = "Wookiee Toughness Reduction"
type = "i64"
value = [2, 5, 8]
labels = ["Wookiee Toughness", "II", "III"]
unit = "points"
range = [0, 50]
summary = "Wookiee Toughness reduces the damage of every hit by {feats.toughness.wookiee_flat[0]:bare} points. Wookiee Toughness II reduces it by {feats.toughness.wookiee_flat[1]:bare} points and Wookiee Toughness III by {feats.toughness.wookiee_flat[2]:bare} points."
source = "the feats' descriptions (K1's; TSL's II and III)"
see = "sim::combat::passive::toughness"

[toughness.wookiee_share]
name = "Wookiee Toughness Extra Reduction"
type = "i64"
value = [20, 10]
labels = ["II", "III"]
range = [1, 100]
summary = "Wookiee Toughness II also reduces the damage that remains by 1 point for every {feats.toughness.wookiee_share[0]:bare} points. Wookiee Toughness III reduces it by 1 point for every {feats.toughness.wookiee_share[1]:bare} points."
source = "TSL's descriptions"
see = "sim::combat::passive::toughness"

[force_sensitive]
title = "Force Sensitive"
summary = "Force Sensitive grants Force points once, when the character learns the feat."
applies = ["feat:FORCE_SENSITIVE"]

[force_sensitive.points]
name = "Force Sensitive Points"
type = "u16"
value = 40
unit = "FP"
range = [0, 500]
summary = "Force Sensitive grants {feats.force_sensitive.points:bare} Force points."
source = "TSL's description"
see = "sim::combat::passive::learn"

[force_focus]
title = "Force Focus"
summary = "Force Focus, Advanced Force Focus and Force Focus Mastery make a character's Force powers harder to resist. Only the highest of these feats counts."
applies = ["feat:FORCE_FOCUS", "feat:FORCE_FOCUS_ADVANCED", "feat:FORCE_FOCUS_MASTERY", "kind:force"]

[force_focus.dc]
name = "Force Focus DC Bonus"
value = [1, 2, 4]
labels = ["Force Focus", "Advanced", "Mastery"]
unit = "points"
range = [0, 20]
summary = "Force Focus adds +{feats.force_focus.dc[0]:bare} to the DC of the character's Force powers. Advanced Force Focus adds +{feats.force_focus.dc[1]:bare} and Force Focus Mastery adds +{feats.force_focus.dc[2]:bare}. Only the highest of these bonuses counts."
source = "the feats' descriptions"
see = "sim::combat::force"

[specials]
title = "Feat Attacks for Ranged Weapons"
summary = """
With a ranged weapon in hand, [Saber throw/kata/ranged feat] fires a feat
attack that the character knows. The feat attacks are Power Blast, Rapid
Shot and Sniper Shot. The type of gun does not decide which one is used.
[Next feat attack] switches between the feat attacks the character knows,
and each type of gun remembers its own choice. Until the character makes a
choice, the first feat attack the character knows is used, in the order
Power Blast, Rapid Shot, Sniper Shot. While [Saber throw/kata/ranged feat]
is held, [Attack] does nothing. A character without any of these feats, or
without enough stamina, fires normally with [Saber throw/kata/ranged feat].
The penalties of a feat attack last for one round
({combat.timing.round_ms:s}).
"""
applies = ["kind:blaster"]

[specials.cost_percent]
name = "Feat Attack Cost"
type = "u16"
value = 15
unit = "%"
range = [0, 100]
summary = "A feat attack uses up {feats.specials.cost_percent} of the character's maximum stamina. It never uses Force points. Under the Advanced rules every character has Stamina and pays it. Under Jedi Academy's rules only a character who does not use the Force has stamina, so a Force user's feat attacks cost nothing there."
source = "ours; Force users pay nothing under Jedi Academy's rules since Discord 2026-11-17 (feat attacks took Force points)"
see = "sim::combat::specials::cost"
applies = ["kind:stamina"]

[specials.power_blast]
title = "Power Blast"
summary = """
Keep [Saber throw/kata/ranged feat] pressed to charge a Power Blast, and
release it to fire one shot. The shot deals bonus damage and suffers a penalty to hit. The longer
the charge, the stronger the shot.
"""
applies = ["feat:POWER_BLAST", "feat:IMPROVED_POWER_BLAST", "feat:MASTER_POWER_BLAST", "kind:pistol"]

[specials.power_blast.step_ms]
name = "Charge Step"
type = "u64"
value = 200
unit = "ms"
range = [10, 2000]
summary = "A Power Blast charges in steps of {feats.specials.power_blast.step_ms:s}."
detail = "The shot's damage counts the charge's whole steps as part of the attack's time, along with the weapon's time between shots. A shot let go before the first step ends counts no charge time, so tapping [Saber throw/kata/ranged feat] deals no more damage per second than holding it."
source = "JA (the Bryar's charge)"
see = "sim::combat::specials::pull"

[specials.power_blast.steps]
name = "Charge Steps"
type = "u64"
value = 5
range = [1, 20]
summary = "A Power Blast charges for up to {feats.specials.power_blast.steps:bare} steps."
source = "JA (the Bryar's charge)"
see = "sim::combat::specials::pull"

[specials.power_blast.limit_ms]
name = "Maximum Charge"
type = "u64"
value = 5000
unit = "ms"
range = [100, 30000]
summary = "A Power Blast that is charged for {feats.specials.power_blast.limit_ms:s} fires by itself."
source = "JA: weapon charge"
see = "sim::combat::specials::pull"

[specials.power_blast.damage]
name = "Power Blast Damage"
type = "i8"
value = [5, 8, 10]
labels = ["Power Blast", "Improved", "Master"]
unit = "points"
range = [0, 50]
summary = "Power Blast adds +{feats.specials.power_blast.damage[0]:bare} damage. Improved Power Blast adds +{feats.specials.power_blast.damage[1]:bare} and Master Power Blast adds +{feats.specials.power_blast.damage[2]:bare}."
source = "the feats' descriptions"
see = "sim::combat::specials::Special::shot"

[specials.power_blast.attack_penalty]
name = "Power Blast Penalty"
type = "i8"
value = 3
unit = "points"
range = [0, 20]
summary = "A Power Blast suffers a -{feats.specials.power_blast.attack_penalty:bare} penalty to hit."
source = "the feats' descriptions"
see = "sim::combat::specials::Special::shot"

[specials.rapid_shot]
title = "Rapid Shot"
summary = """
[Saber throw/kata/ranged feat] shoots a burst of shots as soon as the
weapon is ready.
The weapon is ready to fire again one normal shot's time after the first
shot of the burst, or when the burst ends if that is later. Every shot
after the first is therefore an extra attack. For the round after the
burst, the character suffers a penalty to attacks and Defense.
"""
applies = ["feat:RAPID_SHOT", "feat:IMPROVED_RAPID_SHOT", "feat:MULTI_SHOT", "kind:rifle"]

[specials.rapid_shot.gap_ms]
name = "Burst Interval"
type = "u32"
value = 150
unit = "ms"
range = [10, 2000]
summary = "The shots of a burst are {feats.specials.rapid_shot.gap_ms:s} apart. They are closer together if the weapon's own rate of fire is faster."
source = "JA (the E-11's alternate refire)"
see = "sim::combat::specials::pull"

[specials.rapid_shot.shots]
name = "Rapid Shot Burst"
type = "u8"
value = 3
range = [1, 10]
summary = "Rapid Shot and Improved Rapid Shot fire a burst of {feats.specials.rapid_shot.shots:bare} shots."
detail = "In KOTOR, these feats allow one extra attack. The owner asked for more shots on 2 November 2026, because a single extra shot was worth little after its penalty to hit (`kjk combat duel --only gun_worth`)."
source = "ours, after the feats' descriptions (an extra attack)"
see = "sim::combat::specials::Special::burst"

[specials.rapid_shot.multi_shots]
name = "Master Rapid Shot Burst"
type = "u8"
value = 4
range = [1, 10]
summary = "Master Rapid Shot fires a burst of {feats.specials.rapid_shot.multi_shots:bare} shots."
detail = "In KOTOR, this feat allows two extra attacks. kjk adds one more shot, as it does for Rapid Shot (2 November 2026)."
source = "ours, after the feats' descriptions (two extra attacks)"
see = "sim::combat::specials::Special::burst"

[specials.rapid_shot.penalty]
name = "Rapid Shot Penalty"
type = "i8"
value = [-4, -2, -1]
labels = ["Rapid Shot", "Improved", "Master"]
unit = "points"
range = [-20, 0]
summary = "For the round after a burst, the character suffers a {feats.specials.rapid_shot.penalty[0]:bare} penalty to attacks and Defense with Rapid Shot, {feats.specials.rapid_shot.penalty[1]:bare} with Improved Rapid Shot and {feats.specials.rapid_shot.penalty[2]:bare} with Master Rapid Shot. Each equipped item with a Rapid Shot bonus reduces these penalties by 1."
source = "the feats' descriptions"
see = "sim::combat::specials::Special::exposure"

[specials.sniper_shot]
title = "Sniper Shot"
summary = """
Hold [Saber throw/kata/ranged feat] to steady the gun, then let go to fire
one shot. A
character with a pistol in each hand fires both pistols at once. The shot
has no spread. It gets a bonus to hit, and its critical threat range is
multiplied. The critical threat range is the set of d20 rolls that can
score a critical hit. The character can start to steady the gun while it
is still cooling down after the last shot. If the character lets go once
the gun is steady but before it is ready to fire again, the shot leaves as
soon as the gun is ready. Until the shot leaves, the character moves at
walking speed and cannot jump. Letting go before the gun is steady fires
nothing and uses nothing. For the round after the shot, the character suffers a
penalty to Defense. In kjk, Sniper Shot does not stun.
"""
applies = ["feat:SNIPER_SHOT", "feat:IMPROVED_SNIPER_SHOT", "feat:MASTER_SNIPER_SHOT"]

[specials.sniper_shot.steady_ms]
name = "Sniper Shot Steadying"
type = "u64"
value = [500, 250]
labels = ["from the hip", "while aiming"]
unit = "ms"
range = [0, 5000]
summary = "A character steadies a Sniper Shot for {feats.specials.sniper_shot.steady_ms[0]:s} before it can fire. A character who is already aiming steadies it for {feats.specials.sniper_shot.steady_ms[1]:s}."
source = "the owner's design, 2026-11-17"
see = "sim::combat::specials::pull, sim::combat::ai::choose_special"

[specials.sniper_shot.threat_times]
name = "Sniper Shot Threat Range"
type = "u8"
value = [2, 3, 4]
labels = ["Sniper Shot", "Improved", "Master"]
unit = "×"
range = [1, 20]
summary = "Sniper Shot multiplies the critical threat range by {feats.specials.sniper_shot.threat_times[0]:bare}. Improved Sniper Shot multiplies it by {feats.specials.sniper_shot.threat_times[1]:bare} and Master Sniper Shot by {feats.specials.sniper_shot.threat_times[2]:bare}."
source = "the feats' descriptions"
see = "sim::combat::specials::Special::shot"

[specials.sniper_shot.attack_bonus]
name = "Sniper Shot Accuracy"
type = "i8"
value = [4, 6, 8]
labels = ["Sniper Shot", "Improved", "Master"]
unit = "points"
range = [0, 20]
summary = "A Sniper Shot gets +{feats.specials.sniper_shot.attack_bonus[0]:bare} to hit with Sniper Shot, +{feats.specials.sniper_shot.attack_bonus[1]:bare} with Improved Sniper Shot and +{feats.specials.sniper_shot.attack_bonus[2]:bare} with Master Sniper Shot."
detail = "The owner asked on 2 November 2026 for Sniper Shot to be much more accurate. With only KOTOR's larger critical threat range, a Sniper Shot was just a few percent better than a normal shot (`kjk combat duel --only gun_worth`)."
source = "ours"
see = "sim::combat::specials::Special::shot"

[specials.sniper_shot.defence_penalty]
name = "Sniper Shot Penalty"
type = "i8"
value = -5
unit = "points"
range = [-20, 0]
summary = "For the round after a Sniper Shot, the character suffers a {feats.specials.sniper_shot.defence_penalty:bare} penalty to Defense."
source = "the feats' descriptions"
see = "sim::combat::specials::Special::exposure"

[sneak_attack]
title = "Sneak Attack"
summary = """
Each Sneak Attack feat adds 1-{feats.sneak_attack.die:bare} points of extra
damage when the target cannot defend itself against the attacker. This
applies to attacks from behind, unless the target has Uncanny Dodge. It
also applies to attacks against targets that are stunned, knocked down or
choked, and to attacks against targets that are not yet in combat or have
not yet noticed the attacker. Sneak Attack works only if the target is
within {feats.sneak_attack.reach_m:bare} meters. A critical hit does not
multiply the extra damage. A target that is immune to critical hits or to
sneak attacks takes no extra damage.
"""
detail = "An attack counts as coming from behind if the attacker stands within the rear 90 degrees of the target. The first attack a character makes out of Stealth Mode also receives the bonus."
applies = ["feat:SNEAK_ATTACK_1D6", "feat:SNEAK_ATTACK_2D6", "feat:SNEAK_ATTACK_3D6", "feat:SNEAK_ATTACK_4D6", "feat:SNEAK_ATTACK_5D6", "feat:SNEAK_ATTACK_6D6", "feat:SNEAK_ATTACK_7D6", "feat:SNEAK_ATTACK_8D6", "feat:SNEAK_ATTACK_9D6", "feat:SNEAK_ATTACK_10D6", "feat:UNCANNY_DODGE_1", "feat:UNCANNY_DODGE_2", "kind:stealth"]

[sneak_attack.die]
name = "Sneak Attack Die"
type = "u8"
value = 6
range = [1, 20]
summary = "Each Sneak Attack feat adds 1-{feats.sneak_attack.die:bare} points of extra damage."
source = "the feats' descriptions"
see = "sim::combat::damage::weapon_damage"

[sneak_attack.reach_m]
name = "Sneak Attack Range"
value = 10.0
unit = "m"
range = [0.0, 100.0]
summary = "Sneak Attack works only if the target is within {feats.sneak_attack.reach_m:bare} meters."
source = "the feats' descriptions (KOTOR's 10 m)"
see = "sim::combat::specials::sneak_dice"

[targeting]
title = "Targeting"
summary = """
Targeting adds a bonus to hit with ranged weapons. Targeting I adds
+{feats.targeting.attack[0]:bare}, and each tier after it adds 1 more, up
to +{feats.targeting.attack[7]:bare} with Targeting VIII. Each tier
replaces the one before it.
"""
detail = "A Scout is granted the tiers of Targeting at its class levels, as the feats' table says."
applies = ["feat:TARGETING_1", "feat:TARGETING_2", "feat:TARGETING_3", "feat:TARGETING_4", "feat:TARGETING_5", "feat:TARGETING_6", "feat:TARGETING_7", "feat:TARGETING_8", "kind:blaster"]

[targeting.attack]
name = "Targeting Bonus"
value = [1, 2, 3, 4, 5, 6, 7, 8]
labels = ["Targeting I", "Targeting II", "Targeting III", "Targeting IV", "Targeting V", "Targeting VI", "Targeting VII", "Targeting VIII"]
unit = "points"
range = [0, 20]
summary = "Targeting I to VIII add +{feats.targeting.attack[0]:bare} to +{feats.targeting.attack[7]:bare} to hit with ranged weapons, one more for each tier."
source = "KOTOR 2's feat descriptions (\"Level 1 scouts have a +1 attack bonus with ranged weapons\", up to +8 at level 29)"
see = "sim::combat::damage::attack_bonus"

[finesse]
title = "Finesse"
summary = """
Finesse: Lightsabers and Finesse: Melee Weapons let a character use the
Dexterity modifier instead of the Strength modifier to hit, whichever is
higher. Finesse: Lightsabers applies to lightsabers. Finesse: Melee Weapons
applies to every other melee weapon, but not to unarmed attacks. The
Strength modifier still adds to the damage.
"""
applies = ["feat:FINESSE_LIGHTSABERS", "feat:FINESSE_MELEE_WEAPONS", "kind:melee", "kind:lightsaber"]

[precise_shot]
title = "Precise Shot"
summary = """
Precise Shot adds to the damage of every ranged weapon attack. It also
makes the attack's blaster bolts harder to deflect: the deflection bonus
of the lightsaber or Force power that tries to turn a bolt suffers a
penalty. Each tier replaces the one before it. Grenades and thrown
lightsabers get neither bonus.
"""
detail = "A bolt that a character turned counts as that character's own from then on. The penalty against turning it again is that character's Precise Shot's."
applies = ["feat:PRECISE_SHOT_I", "feat:PRECISE_SHOT_II", "feat:PRECISE_SHOT_III", "feat:PRECISE_SHOT_IV", "feat:PRECISE_SHOT_V", "kind:blaster"]

[precise_shot.damage]
name = "Precise Shot Damage"
type = "i64"
value = [1, 2, 4, 6, 8]
labels = ["Precise Shot I", "Precise Shot II", "Precise Shot III", "Precise Shot IV", "Precise Shot V"]
unit = "points"
range = [0, 20]
summary = "Precise Shot I to V add +{feats.precise_shot.damage[0]:bare}, +{feats.precise_shot.damage[1]:bare}, +{feats.precise_shot.damage[2]:bare}, +{feats.precise_shot.damage[3]:bare} and +{feats.precise_shot.damage[4]:bare} to the damage of ranged weapons."
source = "KOTOR 2's feat descriptions (\"increases the damage done with ranged weapons by +1\", +2, +4, +6 and +8)"
see = "sim::combat::damage::weapon_roll"

[precise_shot.deflect_penalty]
name = "Precise Shot Deflection Penalty"
type = "i8"
value = [2, 4, 6, 8, 10]
labels = ["Precise Shot I", "Precise Shot II", "Precise Shot III", "Precise Shot IV", "Precise Shot V"]
unit = "points"
range = [0, 20]
summary = "Precise Shot I to V take {feats.precise_shot.deflect_penalty[0]:bare}, {feats.precise_shot.deflect_penalty[1]:bare}, {feats.precise_shot.deflect_penalty[2]:bare}, {feats.precise_shot.deflect_penalty[3]:bare} and {feats.precise_shot.deflect_penalty[4]:bare} points off the deflection bonus of anyone who tries to turn the character's blaster bolts."
source = "KOTOR 2's feat descriptions (\"applies a -2 penalty to any attempt to deflect the blaster bolt\", up to -10)"
see = "sim::combat::passive::deflect_penalty"

[close_combat]
title = "Close Combat"
summary = """
Close Combat and Improved Close Combat train a character to fight with a
ranged weapon at close quarters. The character gains a bonus to hit with a
ranged weapon when the target is at short range. Improved Close Combat
replaces Close Combat.
"""
detail = """
In KOTOR 2 the feats also lower a bonus that melee attackers have against
a character who fights with a ranged weapon. This game gives melee
attackers no such bonus, so that part of the feats does nothing here.
"""
applies = ["feat:CLOSE_COMBAT", "feat:IMPROVED_CLOSE_COMBAT", "kind:blaster"]

[close_combat.attack]
name = "Close Combat Bonus"
value = [1, 2]
labels = ["Close Combat", "Improved Close Combat"]
unit = "points"
range = [0, 10]
summary = "Close Combat adds +{feats.close_combat.attack[0]:bare} and Improved Close Combat +{feats.close_combat.attack[1]:bare} to hit with a ranged weapon at a target at short range."
source = "KOTOR 2's feat descriptions (\"When the character's target is at short range, they receive a +1 attack bonus\", +2 with Improved Close Combat)"
see = "sim::combat::passive::close_combat"

[close_combat.short_range_m]
name = "Short Range"
value = 10.0
unit = "m"
range = [0.0, 100.0]
summary = "A target counts as at short range for Close Combat when it is within {feats.close_combat.short_range_m:bare} meters."
source = "both games' ranges.2da (row WeaponRngShrt)"
see = "sim::combat::passive::close_combat"

[dual_strike]
title = "Dual Strike"
summary = """
Dual Strike, Improved Dual Strike and Master Dual Strike add a bonus to
hit an enemy that another member of the character's side is also
attacking. Each tier replaces the one before it.
"""
detail = "Another member of the side attacks an enemy when that enemy is its target. For the player's party, the side is the party."
applies = ["feat:DUAL_STRIKE", "feat:IMPROVED_DUAL_STRIKE", "feat:MASTER_DUAL_STRIKE"]

[dual_strike.attack]
name = "Dual Strike Bonus"
value = [2, 4, 6]
labels = ["Dual Strike", "Improved Dual Strike", "Master Dual Strike"]
unit = "points"
range = [0, 20]
summary = "Dual Strike adds +{feats.dual_strike.attack[0]:bare}, Improved Dual Strike +{feats.dual_strike.attack[1]:bare} and Master Dual Strike +{feats.dual_strike.attack[2]:bare} to hit an enemy that another member of the character's side is attacking."
source = "KOTOR 2's feat descriptions (\"the character gets a +2 bonus to hit\", +4 and +6)"
see = "sim::combat::passive::dual_strike"

[unarmed_specialist]
title = "Unarmed Specialist"
summary = """
Unarmed Specialist adds extra damage to every unarmed attack. Unarmed
Specialist I adds {feats.unarmed_specialist.dice[0]:bare} die of
1-{feats.unarmed_specialist.die:bare}, and each tier after it adds one die
more, up to {feats.unarmed_specialist.dice[7]:bare} dice with Unarmed
Specialist VIII. Each tier replaces the one before it.
"""
detail = "The Jedi classes are granted the tiers of Unarmed Specialist at their class levels, as the feats' table says."
applies = ["feat:UNARMED_SPECIALIST_I", "feat:UNARMED_SPECIALIST_II", "feat:UNARMED_SPECIALIST_III", "feat:UNARMED_SPECIALIST_IV", "feat:UNARMED_SPECIALIST_V", "feat:UNARMED_SPECIALIST_VI", "feat:UNARMED_SPECIALIST_VII", "feat:UNARMED_SPECIALIST_VIII"]

[unarmed_specialist.dice]
name = "Unarmed Specialist Dice"
type = "u8"
value = [1, 2, 3, 4, 5, 6, 7, 8]
labels = ["Unarmed Specialist I", "Unarmed Specialist II", "Unarmed Specialist III", "Unarmed Specialist IV", "Unarmed Specialist V", "Unarmed Specialist VI", "Unarmed Specialist VII", "Unarmed Specialist VIII"]
unit = "dice"
range = [0, 20]
summary = "Unarmed Specialist I to VIII add {feats.unarmed_specialist.dice[0]:bare} to {feats.unarmed_specialist.dice[7]:bare} dice of extra damage to unarmed attacks."
source = "KOTOR 2's feat descriptions (\"adding 1-4 to damage to all unarmed attacks\", then 2-8, 3-12 and so on up to 8-32)"
see = "sim::combat::damage::weapon_roll"

[unarmed_specialist.die]
name = "Unarmed Specialist Die"
type = "u8"
value = 4
range = [1, 20]
summary = "Each die of Unarmed Specialist adds 1-{feats.unarmed_specialist.die:bare} points of damage."
source = "KOTOR 2's feat descriptions (\"adding 1-4 to damage\")"
see = "sim::combat::damage::weapon_roll"

[evasion]
title = "Evasion"
summary = """
A character with Evasion takes no damage from a grenade's blast when the
Reflex save succeeds, where a character without it takes half.
"""
detail = """
The games' own scripts decide the damage of mines and Force powers, and
they check for Evasion themselves where they do. The engine applies
Evasion only to the blasts it sizes itself.
"""
applies = ["feat:EVASION", "kind:grenade"]

[class_skill]
title = "Class Skill Feats"
summary = """
A Class Skill feat makes its skill a class skill for the character. A rank
in the skill then takes {progression.levels.skill_cost[0]:bare} skill
point instead of {progression.levels.skill_cost[1]:bare}, and the skill may
have as many ranks as any class skill.
"""
detail = """
In KOTOR 1 a class may pick a Class Skill feat only when the skill is not
one of its own class skills. KOTOR 1 and KOTOR 2 give their classes
different class skills, so KOTOR 1's own skills table decides which
classes may pick which feats.
"""
applies = ["feat:CLASS_SKILL_AWARENESS", "feat:CLASS_SKILL_COMPUTER_USE", "feat:CLASS_SKILL_DEMOLITIONS", "feat:CLASS_SKILL_REPAIR", "feat:CLASS_SKILL_SECURITY", "feat:CLASS_SKILL_STEALTH", "feat:CLASS_SKILL_TREAT_INJURY"]
