[chapter]
title = "Force Power Effects"
order = 31
summary = """
This chapter covers the lasting effects of Force powers. It covers the
Defense bonus and extra attacks of the speed powers, and the Defense and
saving throw bonus of Force Aura, Force Shield and Force Armor. It also
covers Valor, Energy Resistance, Slow, Affliction, Plague, Force
Suppression, Force Breach, Fury and Force Body.
"""
detail = """
When a power's script applies effects of its own, the game uses the
script's values instead of these. The same bonus never counts twice.
"""

[speed]
title = "Burst of Speed, Knight Speed and Master Speed"
summary = """
Grants +{force_effects.speed.defence[0]:bare} Defense (Burst of Speed) or
+{force_effects.speed.defence[1]:bare} Defense (Knight and Master Speed).
Knight Speed adds {force_effects.speed.attacks[1]:bare} extra attack per
round, and Master Speed adds {force_effects.speed.attacks[2]:bare}.
"""
detail = "Each extra attack adds a full extra attack's damage to every weapon hit."
applies = ["spell:FORCE_POWER_SPEED_BURST", "spell:FORCE_POWER_KNIGHT_SPEED", "spell:FORCE_POWER_SPEED_MASTERY"]

[speed.defence]
name = "Speed Defense Bonus"
type = "i8"
value = [2, 4, 4]
labels = ["Burst of Speed", "Knight Speed", "Master Speed"]
range = [0, 20]
summary = """
+{force_effects.speed.defence[0]:bare} Defense (Burst of Speed),
+{force_effects.speed.defence[1]:bare} (Knight Speed), and
+{force_effects.speed.defence[2]:bare} (Master Speed).
"""
source = "K1's descriptions (`spells.2da` `spelldesc`)"
see = "sim::combat::effects::sheet_now"

[speed.attacks]
name = "Speed Extra Attacks"
value = [0, 1, 2]
labels = ["Burst of Speed", "Knight Speed", "Master Speed"]
range = [0, 5]
summary = """
Knight Speed adds {force_effects.speed.attacks[1]:bare} extra attack per
round, and Master Speed adds {force_effects.speed.attacks[2]:bare}.
"""
detail = "Each extra attack adds a full extra attack's damage to every weapon hit."
source = "K1's descriptions (`spells.2da` `spelldesc`)"
see = "sim::combat::effects::extra_attacks"

[protect]
title = "Force Aura, Force Shield and Force Armor"
summary = """
Grants +{force_effects.protect.bonus[0]:bare} (Force Aura),
+{force_effects.protect.bonus[1]:bare} (Force Shield), or
+{force_effects.protect.bonus[2]:bare} (Force Armor) to Defense and all
saving throws.
"""
applies = ["spell:FORCE_POWER_FORCE_AURA", "spell:FORCE_POWER_FORCE_SHIELD", "spell:FORCE_POWER_FORCE_ARMOR"]

[protect.bonus]
name = "Defense and Save Bonus"
type = "i8"
value = [2, 4, 6]
labels = ["Force Aura", "Force Shield", "Force Armor"]
range = [0, 20]
summary = """
+{force_effects.protect.bonus[0]:bare} (Force Aura),
+{force_effects.protect.bonus[1]:bare} (Force Shield), or
+{force_effects.protect.bonus[2]:bare} (Force Armor) to Defense and all
saving throws.
"""
source = "K1's descriptions (`spells.2da` `spelldesc`)"
see = "sim::combat::effects::sheet_now"

[valor]
title = "Force Valor, Knight Valor and Master Valor"
summary = """
Lasts {force_effects.valor.length_ms:s}. Grants
+{force_effects.valor.bonus[0]:bare} (Force Valor),
+{force_effects.valor.bonus[1]:bare} (Knight Valor), or
+{force_effects.valor.bonus[2]:bare} (Master Valor) to Strength, Dexterity,
Constitution, and all saving throws for you and every party member within
{force_effects.valor.party_reach_m:bare} m. Knight Valor and Master Valor
also grant poison immunity. Will not overwrite a stronger Valor.
"""
detail = """
Force Suppression ends Force Valor and Knight Valor; Force Breach ends all
three. Computer-controlled Jedi keep Valor active.
"""
applies = ["spell:FORCE_POWER_FORCE_VALOR", "spell:FORCE_POWER_KNIGHT_VALOR", "spell:FORCE_POWER_MASTER_VALOR"]

[valor.bonus]
name = "Valor Bonus"
type = "u8"
value = [2, 3, 5]
labels = ["Force Valor", "Knight Valor", "Master Valor"]
range = [0, 20]
summary = "+{force_effects.valor.bonus[0]:bare} (Force Valor), +{force_effects.valor.bonus[1]:bare} (Knight Valor), or +{force_effects.valor.bonus[2]:bare} (Master Valor) to Strength, Dexterity, Constitution, and all saving throws."
source = "K1's descriptions (`spells.2da` `spelldesc`)"
see = "sim::combat::effects::sheet_now"

[valor.length_ms]
name = "Valor Duration"
type = "u64"
value = 20_000
unit = "ms"
range = [1000, 600_000]
summary = "Lasts {force_effects.valor.length_ms:s}."
source = "K1's descriptions (`spells.2da` `spelldesc`)"
see = "sim::world::powers::Cast::bless"

[valor.party_reach_m]
name = "Party Power Radius"
value = 20.0
unit = "m"
range = [0, 100]
summary = "Valor and Improved Energy Resistance reach party members within {force_effects.valor.party_reach_m:bare} m."
source = "K1's descriptions (`spells.2da` `spelldesc`)"
see = "sim::world::powers::Cast::bless"

[energy_resistance]
title = "Energy Resistance and Improved Energy Resistance"
summary = """
Lasts {force_effects.energy_resistance.length_ms:s}. Absorbs the first
{force_effects.energy_resistance.resistance:bare} points of sonic, fire,
cold, and electrical damage from every attack. Improved Energy Resistance
affects every party member within {force_effects.valor.party_reach_m:bare}
m and also grants poison immunity.
"""
detail = "When the power's own script runs, it protects against the five damage types named by the script."
applies = ["spell:FORCE_POWER_RESIST_ENERGY_1", "spell:FORCE_POWER_RESIST_ENERGY_2"]

[energy_resistance.resistance]
name = "Damage Absorbed"
type = "u8"
value = 15
unit = "HP"
range = [0, 100]
summary = "Absorbs the first {force_effects.energy_resistance.resistance:bare} points of each damage type from every attack."
source = "K1's descriptions (`spells.2da` `spelldesc`)"
see = "sim::combat::effects::sheet_now"

[energy_resistance.length_ms]
name = "Energy Resistance Duration"
type = "u64"
value = 120_000
unit = "ms"
range = [1000, 600_000]
summary = "Lasts {force_effects.energy_resistance.length_ms:s}."
source = "K1's descriptions (`spells.2da` `spelldesc`)"
see = "sim::world::powers::Cast::bless"

[slow]
title = "Slow, Affliction and Plague"
summary = """
Single target; does not affect droids or targets that resist the Force.
Slow inflicts -{force_effects.slow.penalty:bare} to Defense, Reflex saves,
and attack rolls for {force_effects.slow.length_ms:s} (Will save negates).
Affliction (Fortitude save DC {force_effects.slow.affliction_dc:bare}) and
Plague (no save) cut movement speed to {force_effects.slow.movement:bare}×
and drain 1 Strength, Dexterity, and Constitution every
{force_effects.slow.sap_every_ms[0]:s} up to
{force_effects.slow.sap_most[0]:bare} (Affliction) or every
{force_effects.slow.sap_every_ms[1]:s} up to
{force_effects.slow.sap_most[1]:bare} (Plague); lost attributes return when
the effect ends.
"""
detail = """
Affliction and Plague count as poisons (blocked by Knight/Master Valor and
Improved Energy Resistance). Computer-controlled Jedi use Slow on enemies.
"""
applies = ["spell:FORCE_POWER_SLOW", "spell:FORCE_POWER_AFFLICTION", "spell:FORCE_POWER_PLAGUE"]

[slow.penalty]
name = "Slow Penalty"
type = "i8"
value = 2
range = [0, 20]
summary = "Inflicts -{force_effects.slow.penalty:bare} to Defense, Reflex saves, and attack rolls."
source = "K1's description (`spells.2da` `spelldesc`)"
see = "sim::combat::effects::sheet_now"

[slow.length_ms]
name = "Slow Duration"
type = "u64"
value = 30_000
unit = "ms"
range = [1000, 600_000]
summary = "Lasts {force_effects.slow.length_ms:s}."
source = "K1's description (`spells.2da` `spelldesc`)"
see = "sim::world::powers::Cast::slow"

[slow.movement]
name = "Slowed Movement"
value = 0.5
unit = "×"
range = [0.1, 1]
summary = "Cuts the target's movement speed to {force_effects.slow.movement:bare}×."
source = "K1's descriptions (`spells.2da` `spelldesc`)"
see = "sim::world::powers::Cast::upkeep"

[slow.sap_most]
name = "Attribute Loss"
type = "u8"
value = [7, 12]
labels = ["Affliction", "Plague"]
range = [0, 30]
summary = "Drains up to {force_effects.slow.sap_most[0]:bare} (Affliction) or {force_effects.slow.sap_most[1]:bare} (Plague) from Strength, Dexterity, and Constitution."
source = "K1's descriptions (`spells.2da` `spelldesc`)"
see = "sim::combat::effects::Effects::sap"

[slow.sap_every_ms]
name = "Attribute Loss Rate"
type = "u32"
value = [3000, 1000]
unit = "ms"
labels = ["Affliction", "Plague"]
range = [100, 60_000]
summary = "Drains 1 point immediately, then every {force_effects.slow.sap_every_ms[0]:s} (Affliction) or {force_effects.slow.sap_every_ms[1]:s} (Plague)."
source = "K1's descriptions (`spells.2da` `spelldesc`)"
see = "sim::combat::effects::Effects::sap"

[slow.affliction_dc]
name = "Affliction DC"
value = 20
range = [0, 60]
summary = "Fortitude save DC {force_effects.slow.affliction_dc:bare} negates Affliction."
source = "K1's description (`spells.2da` `spelldesc`)"
see = "sim::world::powers::Cast::slow"

[dispel]
title = "Force Suppression and Force Breach"
summary = """
These powers affect a single target and cannot be resisted. Force
Suppression ends the target's active Force powers of rank
{force_effects.dispel.supressed_rank:bare} or lower. Force Breach ends all of
them, whatever their rank. The powers they end are the speed powers, Force
Aura, Force Shield, Force Armor, Force Resistance, Force Immunity, Valor and
Energy Resistance.
"""
detail = "Characters controlled by the computer use these powers only on enemies who have an active Force power that the power can end."
applies = ["spell:FORCE_POWER_SUPRESS_FORCE", "spell:FORCE_POWER_FORCE_BREACH"]

[dispel.supressed_rank]
name = "Powers Force Suppression Ends"
type = "u8"
value = 2
unit = "rank"
range = [1, 3]
summary = "Force Suppression ends the target's active Force powers of rank {force_effects.dispel.supressed_rank:bare} or lower. A character controlled by the computer uses Force Suppression only on a target with such a power."
source = "KOTOR's Force Suppression description: it ends first- and second-tier powers"
see = "sim::combat::effects::dispel_ends, sim::combat::choose::does_something"
applies = ["spell:FORCE_POWER_SUPRESS_FORCE"]

[fury]
title = "Fury"
summary = """
Each kill while Fury is active adds +1 weapon damage (up to
+{force_effects.fury.most:bare}), stacking above item bonus caps. Resets
when Fury ends.
"""
applies = ["spell:FORCE_POWER_FURY", "spell:FORCE_POWER_IMPROVED_FURY", "spell:FORCE_POWER_MASTER_FURY", "spell:WOOKIEE_RAGE_I", "spell:WOOKIEE_RAGE_II", "spell:WOOKIEE_RAGE_III"]

[fury.most]
name = "Fury Maximum Bonus"
type = "u8"
value = 6
unit = "HP"
range = [0, 50]
summary = "Kill damage bonus caps at +{force_effects.fury.most:bare}."
source = "TSL's executable"
see = "sim::combat::effects::sheet_now"

[force_body]
title = "Force Body"
summary = """
Splits Force power costs between Force points and Vitality (using temporary
Vitality first): {force_effects.force_body.share[0]} each with Force Body,
{force_effects.force_body.share[1]} each with Improved Force Body, or
{force_effects.force_body.share[2]} each with Master Force Body (rounded
down). Cannot cast a power that would leave you at
{force_effects.force_body.least_hp_left:bare} Vitality or less.
"""
applies = ["spell:FORCE_POWER_FORCE_BODY", "spell:FORCE_POWER_IMPROVED_FORCE_BODY", "spell:FORCE_POWER_MASTER_FORCE_BODY"]

[force_body.share]
name = "Force Body Cost"
value = [50, 40, 30]
unit = "%"
labels = ["Force Body", "Improved Force Body", "Master Force Body"]
range = [0, 100]
summary = "Takes {force_effects.force_body.share[0]} (Force Body), {force_effects.force_body.share[1]} (Improved), or {force_effects.force_body.share[2]} (Master) of a power's cost from Force and the same amount from Vitality."
source = "TSL's executable"
see = "sim::combat::effects::force_body_share"

[force_body.least_hp_left]
name = "Force Body Minimum Vitality"
value = 1
unit = "HP"
range = [0, 100]
summary = "Cannot cast a power that would leave you with {force_effects.force_body.least_hp_left:bare} Vitality or less."
source = "TSL's executable (`HasSpell`)"
see = "sim::combat::effects::can_pay"

[states]
title = "Stun, Paralysis and Mind Trick"
summary = """
Mind Trick and Droid Trick end immediately if the target is attacked,
damaged, or spots an enemy within about 3.2 m. When multiple hold effects
overlap, Mind Trick takes priority over horror, and horror over stun.
"""
detail = "The proximity check compares squared distance against {force_effects.states.fragile_reach_squared} (√10 ≈ 3.2 m)."
applies = ["spell:FORCE_POWER_MIND_TRICK", "spell:FORCE_POWER_FORCE_CRUSH", "spell:FORCE_POWER_DROID_TRICK"]

[states.fragile_reach_squared]
name = "Mind Trick Range"
value = 10.0
unit = "m²"
range = [0, 1000]
summary = "Mind Trick and Droid Trick end if the target spots an enemy within about 3.2 m (squared distance {force_effects.states.fragile_reach_squared})."
source = "TSL's executable (it compares the squared distance)"
see = "sim::combat::effects::state::fragile"

[lasting]
title = "Lasting Effects"
summary = """
Bonuses or penalties from the same source do not stack (only the strongest
applies); effects from different sources stack. Movement speed effects
cannot drop you below {force_effects.lasting.speed_least} or raise you
above {force_effects.lasting.speed_most} of normal speed.
"""
detail = "The movement bonus from a speed power's own script does not stack with the speed bonus the power grants while active."
applies = ["kind:force"]

[lasting.speed_least]
name = "Minimum Movement Speed"
value = 10
unit = "%"
range = [0, 100]
summary = "Movement speed effects cannot slow a character below {force_effects.lasting.speed_least} of normal speed."
source = "ours"
see = "sim::world::powers::Cast::upkeep"

[lasting.speed_most]
name = "Maximum Movement Speed"
value = 300
unit = "%"
range = [100, 1000]
summary = "Movement speed effects cannot raise a character above {force_effects.lasting.speed_most} of normal speed."
source = "ours"
see = "sim::world::powers::Cast::upkeep"

[haste]
title = "Haste"
summary = """
Increases movement speed by {force_effects.haste.speed:bare}% and grants
+{force_effects.haste.defence:bare} Defense (no extra attacks).
"""
detail = "Applied by scripts via `EffectHaste`."

[haste.speed]
name = "Haste Movement Bonus"
value = 50
unit = "%"
range = [0, 200]
summary = "Haste raises movement speed by {force_effects.haste.speed}."
source = "TSL's executable (`OnApplyHasteInternal`: a movement speed of 150 %)"
see = "sim::script::engine::Engine::call"

[haste.defence]
name = "Haste Defense Bonus"
type = "i8"
value = 4
range = [0, 20]
summary = "Haste grants a +{force_effects.haste.defence:bare} dodge bonus to Defense."
source = "TSL's executable (`OnApplyHasteInternal`: an AC increase of 4, dodge)"
see = "sim::script::engine::Engine::call"

[knockdown]
title = "Knockdown"
summary = """
Knocks the target to the ground for the effect's duration plus
{force_effects.knockdown.extra_ms:s} (unless immune to knockdown).
"""
detail = "Applied by scripts via `EffectKnockdown`."

[knockdown.extra_ms]
name = "Knockdown Extra Time"
type = "u64"
value = 1500
unit = "ms"
range = [0, 10000]
summary = "A knockdown lasts {force_effects.knockdown.extra_ms:s} longer than its effect's duration."
source = "TSL's executable (`OnApplyKnockdown`: the hold lasts the duration plus 1.5 s)"
see = "sim::world::harm"

[damage_shield]
title = "Damage Shield"
summary = """
Strikes back at every melee attacker with the shield's base damage plus its
damage bonus.
"""
detail = "Applied by scripts via `EffectDamageShield`. Bonuses 1–5 add flat points; 6–10 roll dice in (count, size) pairs: {force_effects.damage_shield.bonus_dice}."

[damage_shield.bonus_dice]
name = "Shield Bonus Dice"
type = "u8"
value = [1, 4, 1, 6, 1, 8, 1, 10, 2, 6]
labels = ["1d4 number of dice", "1d4 die size", "1d6 number of dice", "1d6 die size", "1d8 number of dice", "1d8 die size", "1d10 number of dice", "1d10 die size", "2d6 number of dice", "2d6 die size"]
range = [1, 20]
summary = "A damage shield's bonus of 6 to 10 (`DAMAGE_BONUS_1d4` to `DAMAGE_BONUS_2d6`) rolls dice. The values come in pairs, the number of dice followed by the die size: {force_effects.damage_shield.bonus_dice}."
source = "TSL's executable (`ResolveDamageShields`: a bonus of 6 or more reads its row's NumDice and Die from the damage cost table), as nwscript.nss names the rows [verify the table's cells]"
see = "sim::world::harm"

[damage_shield.flat_below]
name = "Shield Bonus Points"
type = "u8"
value = 6
range = [1, 11]
summary = "A damage shield's bonus below {force_effects.damage_shield.flat_below:bare} adds that many points of damage."
source = "TSL's executable (`ResolveDamageShields`: a bonus under 6 is added as it is)"
see = "sim::world::harm"

[damage_shield.most_points]
name = "Shield Most Points"
type = "i32"
value = 10000
range = [1, 100000]
summary = "If a script asks for a damage shield of more than {force_effects.damage_shield.most_points:bare} points, or of less than 0 points, the shield deals 1 point instead."
source = "TSL's executable (`EffectDamageShield`: the points against 10001, unsigned)"
see = "sim::script::engine::Engine::call"

[damage_shield.last_type]
name = "Shield Last Type"
type = "i32"
value = 8192
range = [1, 65536]
summary = "If a script sets a damage shield's damage type above {force_effects.damage_shield.last_type:bare}, or below 0, the shield deals universal damage."
source = "TSL's executable (`EffectDamageShield`: the type against its poison damage flag)"
see = "sim::script::engine::Engine::call"
