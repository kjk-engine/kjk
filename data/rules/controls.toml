[chapter]
title = "Controls"
order = 5
summary = """
This chapter lists the keys for movement, attacks, special attacks, Force
powers, grenades and items. Each key is shown by the name of the action it is
bound to.
"""
detail = """
Under Jedi Academy's rules, each character has a second bar in addition to its
vitality bar. For a Force user, the second bar shows Force points. For any other
character, it shows stamina. A special attack uses up part of this second bar.
Under the Advanced rules, every character has a Stamina bar, and a Force user
also has a Force points bar. A special attack uses up part of the Stamina bar.
"""

[keys]
title = "Keys"
summary = """
Move with [Forward], [Backward], [Strafe left] and [Strafe right]. [Jump]
jumps. [Crouch] crouches, or rolls while the character is running. [Walk]
makes the character walk.

[Attack] fires or swings the weapon in hand. [Alt attack] uses the weapon's
second mode. For a lightsaber it is a throw or a kick. With a blaster in
hand, [Alt attack] does nothing. [Aim] raises the blaster instead, and
[Saber throw/kata/ranged feat] fires a feat attack. [Use] uses the object in front of the
character. Holding [Use] over an unconscious party member revives them.

Some objects offer more than one action. A mine offers Disarm Mine and
Recover Mine. A locked door offers Open and Security. The mouse wheel chooses
which action [Use] does. On a controller, press left or right on the D-pad
to choose. While a controller is in use, the target's panel shows
those two buttons beside its actions.

[Draw or holster weapon] takes the weapon in hand, or puts it away.
[Switch weapons] changes to the other weapon set. [Right hand] and
[Left hand] choose which hand to use.

The action bar has ten slots. [Action bar slot 1] to [Action bar slot 10] use
them. The screen always shows the first six slots. It shows a slot after the
sixth only when that slot or a later slot contains something. On a controller the bar has four slots, used with LB held and A, B, X or
Y. A slot contains a Force power, a feat attack, mines, stealth mode, or one
kind of item: medpacs, stims, energy shields or grenades. Hold [Power wheel]
to open the power wheel. The wheel lists what the character can use that is
not on the bar and that the player has not hidden. An item kind on the bar
stays on the wheel while the character carries two or more different items
of that kind. The player points at an entry and lets go of [Power wheel] to
use it. The Action bar button on the
Abilities page opens the action bar setup screen. On that screen the player
puts Force powers, feat attacks, items, mines and stealth mode on the bar.
[Stealth mode] acts at once.

[Saber style] changes the lightsaber style. [Next feat attack] changes the
feat attack of the weapon in hand. [Next Form] changes the lightsaber Form.
[Solo mode] makes the companions stay where they stand instead of following,
until the key is pressed again. [First person] switches to the first person
view and back.
"""

[swings]
title = "Swings"
summary = """
Hold [Attack] to swing. The movement keys held down at the same time choose
the direction of the swing.

[Strafe right] and [Forward] swing from top left to bottom right. 
[Strafe right] and [Backward] swing from bottom left to top right. [Strafe right]
alone swings from left to right. [Strafe left] and [Forward] swing from top
right to bottom left. [Strafe left] and [Backward] swing from bottom right to
top left. [Strafe left] alone swings from right to left. [Forward] alone
swings from top to bottom. So does no movement key, when the character starts
from the ready stance. During a chain of swings, holding no movement key
continues with the next swing of the chain.
"""
detail = """
A swing deals its full damage when the blade passes
{sabers.sweep.nominal:m} through the target's body. A shorter cut that still
gets through deals at least {sabers.sweep.least_share:pct} of the full
damage.
"""
applies = ["kind:lightsaber", "kind:melee"]

[styles]
title = "Saber Styles"
summary = """
[Saber style] changes the style of a single lightsaber. There are three
styles. The fast style requires Flurry. The medium style requires Critical
Strike, or only proficiency with the weapon. The strong style requires Power
Attack.

With a double-bladed lightsaber, [Saber style] turns the second blade off and
on. With one blade lit, it fights like a single lightsaber. It then has no
special attacks except the fast style's lunge. A character with two weapons
always fights in the dual style.

A style change made during a swing takes effect when the swing ends. 
[Next feat attack] chooses which melee feat a character with two weapons or a
double-bladed lightsaber uses. Each press moves on to the next feat the
character knows, and then to no feat.
"""
applies = ["kind:lightsaber", "feat:FLURRY", "feat:CRITICAL_STRIKE", "feat:POWER_ATTACK"]

[specials]
title = "Special Attacks"
summary = """
Each special attack uses up part of the second bar when it starts. A kata
uses {saber_moves.costs.kata} of the maximum. A forward or backward special
attack uses {saber_moves.costs.forward_back}. A side special attack uses
{saber_moves.costs.side}. If the second bar is too low, the character makes a
normal swing instead.
"""
applies = ["kind:lightsaber", "kind:melee"]

[specials.kata]
title = "Kata"
summary = """
Press [Attack] and [Alt attack] together while standing on the ground with no
movement key held. This works from the ready stance or at the start of a
swing. Each style has its own kata. A character with two weapons spins to
protect itself, but only if it is a Force user. A double-bladed lightsaber
makes the Soulcal attack. The character can walk during the fast style's
kata. The other katas move the character's body on their own. A kata uses up
{saber_moves.costs.kata} of the second bar.
"""

[specials.lunge]
title = "Lunge and Spin Attacks"
summary = """
Press [Crouch], [Forward] and [Attack] while on the ground with the blade
ready. In the fast style, the character lunges. With a double-bladed
lightsaber or two weapons, the character makes a spin attack and can walk
during it. This attack uses up {saber_moves.costs.forward_back} of the second
bar.
"""

[specials.flip]
title = "Flip Slash and Death from Above"
summary = """
Press [Forward] and [Attack] just after a jump, close to the ground. In the
medium style, the character flips over the opponent and slashes. In the
strong style, the character leaps and strikes down. This attack uses up
{saber_moves.costs.forward_back} of the second bar.
"""

[specials.jump_attack]
title = "Jump Attack"
summary = """
Press [Forward], [Jump] and [Attack] while on the ground or just above it,
with the blade ready. A character with two weapons or a double-bladed
lightsaber makes a jump attack. This attack uses up
{saber_moves.costs.forward_back} of the second bar.
"""

[specials.stab_down]
title = "Stab Down"
summary = """
Press [Forward] and [Attack] while a knocked down opponent is within
{saber_moves.specials.stab_reach:m}. The character stabs down at the opponent
on the ground. This attack uses up {saber_moves.costs.forward_back} of the
second bar.
"""

[specials.back]
title = "Back Attacks"
summary = """
Press [Backward] and [Attack] while an opponent is behind the character within
{saber_moves.specials.back_reach:m}. In the fast style, and with a
double-bladed lightsaber, the character stabs backward. In other styles, the
character swings backward, and the swing is low if the character is
crouching. This attack uses up none of the second bar.
"""

[specials.back_flip]
title = "Back Flip Attack"
summary = """
Press [Backward], [Jump] and [Attack] while on the ground with the blade
ready. The character needs Force Jump II or higher. A character with a
double-bladed lightsaber flips backward over the opponent. This attack uses
up {saber_moves.costs.forward_back} of the second bar.
"""
applies = ["feat:FORCE_JUMP_ADVANCED"]

[specials.cartwheel]
title = "Cartwheel and Butterfly"
summary = """
Press [Strafe left] or [Strafe right] with [Jump] and [Attack], just after a
jump. The character cartwheels to that side. With a double-bladed lightsaber,
the character makes the butterfly attack instead. This attack uses up
{saber_moves.costs.side} of the second bar.
"""

[specials.mirror]
title = "Mirror Attacks"
summary = """
A character with two weapons can strike two opponents at once. A side swing
strikes both if there are opponents on both sides within
{saber_moves.specials.mirror_reach:m}. A forward or backward swing does the
same with opponents in front and behind. This attack uses up none of the
second bar.
"""

[specials.leap]
title = "Force Leap"
summary = """
Start an ordinary swing with a lightsaber, then press [Jump] within
{saber_moves.specials.leap_window_ms:s}. The character needs Force Jump. If an
enemy stands in front of the character, more than
{saber_moves.specials.leap_least:m} away and within the leap's range, with
nothing in the way, the character leaps across the distance and strikes once.
The range is {saber_moves.specials.leap_most[0]:m} with Force Jump,
{saber_moves.specials.leap_most[1]:m} with Advanced Force Jump and
{saber_moves.specials.leap_most[2]:m} with Force Jump Mastery. The blow gets
+{saber_moves.specials.leap_bonus[1]:bare} to hit and to damage with Advanced
Force Jump and +{saber_moves.specials.leap_bonus[2]:bare} with Force Jump
Mastery. The leap costs no Force points. A kata, a lunge or another special
attack does not lead into a leap.
"""
applies = ["feat:FORCE_JUMP", "feat:FORCE_JUMP_ADVANCED", "feat:FORCE_JUMP_MASTERY"]
[specials.roll_stab]
title = "Roll Stab"
summary = """
Hold [Attack] in the last {saber_moves.timing.roll_stab_ms:s} of a forward
roll. The character rises out of the roll with a stab. This attack uses up
{saber_moves.costs.forward_back} of the second bar.
"""

[kicks]
title = "Kicks"
summary = """
Under Jedi Academy's rules, press [Alt attack] or [Kick] with a movement key
while standing with a double-bladed lightsaber ready. The character kicks in
that direction. In the air, the character makes an air kick, or kicks when it
lands. A kick knocks the target back and may knock it down. A kick uses up
none of the second bar. Under the Advanced rules only [Kick] kicks, and
[Alt attack] throws the lightsaber instead.
"""
applies = ["baseitem:Double_Bladed_Lightsaber"]

[duel]
title = "Blocks and Kicks Under the Advanced Rules"
summary = """
The Advanced combat rules are kjk's own. The player picks them on the
Combat Options page. Under the Advanced rules, the blade blocks only while 
[Block (Advanced rules)] is held down. Pressing [Attack] while holding 
[Block (Advanced rules)] starts a short window for a perfect block. [Kick] kicks
with any weapon in hand. A kick to the left or to the right becomes a split
kick when another character stands on each side of the kicking character,
within {saber_moves.specials.mirror_reach:m}. The split kick kicks both of
them at once, whether they are enemies or companions. Under Jedi Academy's rules, [Block (Advanced rules)]
does nothing, and [Kick] kicks only with a double-bladed lightsaber, as
[Alt attack] does there.

By default, [Block (Advanced rules)] and [Alt attack] are on the same mouse
button. Under the Advanced rules, that button blocks instead of using
[Alt attack] while the character has a lightsaber or a melee blade in hand, such as
a sword, a vibroblade or a staff. Holding the button takes out a weapon that
is put away and turns on a lightsaber that is off. The button works as
[Alt attack] with any other weapon, or under Jedi Academy's rules.
[Aim] is on the same button by default. It raises a blaster and does
nothing with any other weapon.
A player who binds [Block (Advanced rules)] to a separate key has both actions on
their own keys.

The block works the same way for a companion that the player controls. While
the player controls a companion, that companion blocks only while the player
holds [Block (Advanced rules)]. It does not block by itself as other characters
do.

[Saber throw/kata/ranged feat] is the alternate attack on a key of its own. It
works even while the shared button blocks. Under the Advanced rules it never
kicks. Pressed alone, it throws a lightsaber of any kind, a double-bladed
lightsaber included. With a melee weapon or with empty hands it does nothing.
Pressed together with [Attack], it starts the kata of the saber style and
throws nothing. Under Jedi Academy's rules it does what [Alt attack] does.
With a blaster in hand it fires a feat attack instead, as the Blasters entry
describes. On a controller, its default chord is LB held with the right
trigger. With anything other than a blaster in hand, that chord only attacks
while blocking, and it throws nothing.
"""
applies = ["kind:lightsaber"]

[throw]
title = "Lightsaber Throw"
summary = """
Press [Alt attack] with a single lightsaber ready. The character must know
the Throw Lightsaber power and have the Force points to use it. The
lightsaber flies out and comes back, and it damages every target it passes
through. Hold [Alt attack] to keep the lightsaber out and steer it with the
crosshair. Release [Alt attack] to call it back. While the character is
knocked down, hold [Attack] to call it back. Under Jedi Academy's rules a
character with a double-bladed lightsaber cannot throw it this way. Under the
Advanced rules it can.
"""
applies = ["spell:FORCE_POWER_LIGHT_SABER_THROW", "spell:FORCE_POWER_LIGHT_SABER_THROW_ADVANCED"]

[guns]
title = "Blasters"
summary = """
[Attack] fires. [Alt attack] does nothing with a blaster in hand.

Hold [Aim] to raise the gun to the eye. The gun is fully raised
{weapons.aim.in_ms:s} after the player presses [Aim]. Once it is fully
raised, the spread of its shots is multiplied by
{weapons.bloom.stance[1]:bare}. While the gun is raised, the character moves
at walking speed and cannot run, roll or jump.

[Saber throw/kata/ranged feat] makes a feat attack that the character knows. The feat attack
uses up {feats.specials.cost_percent} of the character's stamina and never
uses Force points. Under Jedi Academy's rules only a character who does not
use the Force has stamina, so a Force user's feat attacks cost nothing
there. While [Saber throw/kata/ranged feat] is held, [Attack] does nothing.
With Power Blast, hold [Saber throw/kata/ranged feat] to charge the shot and
release it to fire. With Rapid Shot or Multi Shot,
[Saber throw/kata/ranged feat] fires a burst of shots. With Sniper Shot, hold
[Saber throw/kata/ranged feat] to steady the gun and release it to
fire one shot. The gun is steady after
{feats.specials.sniper_shot.steady_ms[0]:s}, or after
{feats.specials.sniper_shot.steady_ms[1]:s} while the character aims. The
character can start to steady the gun while it is still cooling down after
the last shot. If the gun is steady but not yet ready to fire again, the
shot leaves as soon as the gun is ready. While the character steadies the
gun, it moves at walking speed and cannot jump.
A Sniper Shot has no spread. It gets
+{feats.specials.sniper_shot.attack_bonus[0]:bare} to hit with Sniper Shot,
+{feats.specials.sniper_shot.attack_bonus[1]:bare} with Improved Sniper Shot
and +{feats.specials.sniper_shot.attack_bonus[2]:bare} with Master Sniper
Shot. Its critical threat range is multiplied by
{feats.specials.sniper_shot.threat_times[0]:bare} with Sniper Shot,
{feats.specials.sniper_shot.threat_times[1]:bare} with Improved Sniper Shot
and {feats.specials.sniper_shot.threat_times[2]:bare} with Master Sniper
Shot. For the round after the shot, the character suffers a
{feats.specials.sniper_shot.defence_penalty:bare} penalty to Defense.

[Next feat attack] chooses among the feat attacks the character knows. Each
type of gun remembers its own choice. If the character knows none of these
feats, or its second bar is too low, [Saber throw/kata/ranged feat] fires
like [Attack].
"""
applies = ["kind:blaster", "feat:POWER_BLAST", "feat:RAPID_SHOT", "feat:MULTI_SHOT", "feat:SNIPER_SHOT"]

[force]
title = "Force Powers"
summary = """
A Force power is used from a slot of the action bar or from the power wheel.
Some powers, such as Speed, turn on with one press of the slot's key and off
with the next. Grip, Lightning and Drain use the best version of the power
the character knows. They last while the slot's key is held down, and they use
up their Force point cost again for each second it is held. A power chosen on
the power wheel is used once, in the same way as a slot's key that is pressed
and let go at once.
Hold [Jump] while rising to make a Force jump.

The bar and the wheel offer every Force power the character knows that the
game's own menus offer. This includes powers such as Force Barrier, Battle
Meditation and Breath Control. A power used on oneself, such as Force
Barrier, is cast on the character. A power used on enemies, such as Crush
Opposition, is cast on the enemy in the crosshair. Passive powers, such as
Force Camouflage, are never offered.
"""
applies = ["kind:force"]

[bar]
title = "The Action Bar and the Power Wheel"
summary = """
Each character has its own action bar of ten slots. A slot contains a Force
power, a feat attack, mines, stealth mode, or one kind of item: medpacs,
stims, energy shields or grenades. On a controller only the first four slots
can be used.

A new character's bar fills its first four slots by itself. It takes the
character's attack powers first, in the order the game lists them, then the
feat attacks that fit the weapon in hand, then grenades, then medpacs. When
the character learns a new attack power, the power goes into the first empty
slot of the four. A higher version of a power on the bar, such as Force
Lightning after Shock, takes the lower version's slot. A new feat attack goes
into the first empty slot of the four only when the character knows no Force
powers. The game changes no other slot.

The power wheel is one ring. It lists, in this order, offensive powers,
defensive powers, medpacs, grenades, stims, energy shields, mines, stealth
mode and the feat attacks that fit the weapon in hand. A power used on an
enemy, such as Force Lightning, is offensive. Every other power is
defensive. A small gap separates the offensive powers, the defensive powers,
the item kinds, and the last group of mines, stealth mode and feat attacks.

The wheel leaves out the powers the player hid and what is on the bar. An
item kind on the bar is the one exception. It stays on the wheel while the
character carries two or more different items of that kind. Mines show only
while the party carries a mine and the character has at least 1 rank in
Demolitions. A lower version of a power the character knows, such as Shock
for a character who knows Force Lightning, is hidden until the player shows
it. A right click on a power on the action bar setup screen hides it from
the wheel or shows it again.

The ring shows up to 28 entries at once, and it grows larger as the number
of entries grows. When the character has more than 28 entries, each notch of
the mouse wheel turns the ring by one entry. On a controller, RB held keeps
the wheel open, and each press of LB turns the ring on by one entry. No
button turns it back. The ring turns only
while the wheel points at no item kind with an outer arc, because the same
controls step through that arc.

When the character carries two or more different items of one kind, the
wheel opens an outer arc beside that kind's entry. The arc lists every item
of that kind the character carries. The item the player uses from the arc
becomes the one that kind's bar slot uses. The kind's slot and its wheel
entry show a stack of frames behind the icon.

On the bar and on the wheel, an entry the character cannot use at the moment
is drawn grey and faded. This happens when the character has too few Force
points, has no items of that kind left, or holds a weapon that cannot make
that feat attack. On the action bar setup screen, grey means only that a
power is hidden from the wheel.
"""

[bar.wheel_slow]
name = "Power Wheel Speed"
type = "f32"
value = 0.25
unit = "×"
range = [0.05, 1.0]
summary = """
While the power wheel is open in a game that was started with one player
seat, the world moves at {controls.bar.wheel_slow:bare} times its normal
speed. A game that was started with two or more player seats never slows
down, even while a seat is still empty. The number of seats is set when the
game starts and does not change when a player joins.
"""
source = "the action bar and power wheel design, 2026-11-14"
see = "game::wheel_view::SLOW"

[items]
title = "Grenades and Items"
summary = """
Items are used from a slot of the action bar or from the power wheel.

A grenade is readied before it is thrown. The grenades' slot key, or the
grenades' entry on the power wheel, readies the grenade that the slot uses.
When the character carries two or more different grenades, the slot readies
the grenade when its key is let go, because holding the key and turning the
mouse wheel chooses another grenade. Choosing another grenade in that way
readies it at once. The character puts the weapon in hand
away and holds the grenade. Hold [Attack] to charge the throw, and let go of
it to throw the grenade. The throw reaches full strength after
{grenades.throw.charge_ms:s}. After the throw, the character draws the weapon
that readying put away. A weapon that was already in its holster stays there.

[Alt attack] puts a readied grenade away without throwing it. Choosing
grenades again on the bar or the wheel also puts it away. So do [Draw or
holster weapon], [Switch weapons], and using a Force power, a feat attack,
another kind of item, mines or stealth mode. The grenade is also put away
when the character runs out of grenades or goes down, when the player takes
control of another party member, and when a conversation, a cutscene or a
movie starts. After [Draw or holster weapon], after going down, and after a
change of party member, the weapon stays in its holster. In every other case
the character draws the weapon again if readying put it away.

The medpacs' slot uses an antidote, a medpac, a repair kit or a squad stim,
whichever the character needs. The stims' slot uses a stim, and the energy
shields' slot uses an energy shield.

Each kind of item has one item chosen, which its slot and its wheel entry use.
When that item runs out, the slot uses the next item of the same kind. To
choose another item, hold the slot's key and turn the mouse wheel. On a
controller, hold the slot's buttons and press left or right on the D-pad.
Letting go after choosing uses nothing.
"""
applies = ["kind:grenade", "kind:medpac", "kind:stim", "kind:shield"]

[unarmed]
title = "Fists"
summary = """
With no weapon in hand, hold [Attack] to punch. The character punches with
the left fist, then the right. Fists have no swing directions. Under Jedi
Academy's rules the character throws one punch each round, and fists have
no special attacks.

Under the Advanced rules the character punches again as soon as the last
punch ends. Each press of [Attack] throws a punch, and holding [Attack]
keeps punching. A press made during a punch is remembered, and the next
punch follows as soon as the current one ends. Each punch deals a smaller
share of damage, so the punches of one round deal as much damage together
as the single punch of Jedi Academy's rules. Weapon effects that trigger on
a hit trigger by the same share, so they do not trigger more often in a
round.

With a stun baton or a plasma torch in hand, hold [Attack] to swing it. The
character swings first one way and then the other, and each swing flows into
the next. The character can walk while swinging. A baton swings about four
times a round, and each hit deals about a quarter of a round's damage.

[Next feat attack] chooses which melee feat the fists or a stun baton use:
Power Attack, Critical Strike or Flurry. Each press moves on to the next
feat the character knows, and then to no feat. Every punch uses the chosen
feat. Flurry makes every punch come sooner, under both rule sets.

Under the Advanced rules, a character with no weapon can also kick. Press
[Kick] right after a punch to follow it with a spinning kick. The player can
press [Kick] from the moment the fist is fully out until
{duel.kicks.spin_window_ms:s} after the punch ends. This works whether or not
the punch hit anyone. The spinning kick hits
every enemy around the character. The next punch waits until the spinning
kick is over. A spinning kick after a punch never adds a second blow of
that punch.

Press [Kick] with [Strafe left] or [Strafe right] while another character
stands on each side of the kicking character, within
{saber_moves.specials.mirror_reach:m}. The kicking character then does a split
kick, which kicks both of them at once, whether they are enemies or
companions. The split
kick plays at {duel.kicks.split_speed_pct:bare}% of its normal speed. Every
kick, the spinning kick and the split kick included, uses up
{duel.kicks.uses:bare} Stamina. A kick with no weapon in hand also deals
the character's Strength modifier and Unarmed Specialist dice as extra
damage. Under Jedi Academy's rules, a character with
no weapon cannot kick.
"""
applies = ["kind:unarmed", "kind:baton", "feat:FLURRY", "feat:CRITICAL_STRIKE", "feat:POWER_ATTACK"]

[grab]
title = "Grabs (Advanced rules)"
summary = """
Under the Advanced rules, a character with no weapon in hand grabs the enemy
in front with [Alt attack]. The enemy must stand within a punch's reach. A
grab uses {duel.grab.uses:bare} Stamina, and a character with less cannot
grab. Beasts and droids cannot be grabbed.

A grab is rolled like an attack. It holds far more often on an enemy that
has less than {duel.grab.hurt_below_pct:bare}% of its health left. Such an
enemy counts its Defense {duel.grab.hurt_defence:bare} lower. Any other enemy
counts its Defense {duel.grab.healthy_defence:bare} higher. A grab that misses
leaves the character stumbling for a moment, unable to act.

A grab that holds plays a finisher on both characters. A movement key picks
the finisher. The key held when the grab reaches the enemy picks it. When
no key is held then, the key held when [Alt attack] was pressed picks it.
When no key is held at either moment, the first finisher plays. No key or
[Forward] punches the enemy and knocks it down. [Strafe left] or
[Strafe right] catches its kick by the foot, swings it over and slams it to
the ground. The slam always kills it. [Backward] chokes it and throws it to
the ground. Each blow of a finisher deals the damage of
a whole round of punches, and it always hits. An enemy that a blow would
kill dies when the finisher lets it go. After [Backward], such an enemy
dies as it is thrown and flies limp. While a finisher plays, neither
character can attack, change weapons or use anything. Knocking the grabber down breaks the grab. Pushing
the two apart breaks it too, once they stand about 40% farther apart than
the finisher placed them. Enemies with bare hands grab too, but only a character
below {duel.grab.hurt_below_pct:bare}% of its health.
"""
applies = ["kind:unarmed"]

[moving]
title = "Rolls, Getting Up and Stealth"
summary = """
While running, press [Crouch] to roll in the direction held, if there is
room. While knocked down, press a movement key to roll up, or press [Jump] to
spring up. A character with Force Jump II or higher springs up with a flip.
If the player presses neither, the character gets up on its own.

[Stealth mode] requires a stealth unit and ranks in the Stealth skill, and
works only out of combat. Attacking ends Stealth Mode. A mines slot on the
action bar, or the mines entry on the power wheel, lays the best mine in the
inventory. It works only while the character stands still.
Holding [Use] over an unconscious party member revives them.
"""
