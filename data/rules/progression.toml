type = "u8"
value = [1, 2]
unit = "points"
labels = ["class skill", "cross-class skill"]
range = [1, 10]
summary = "One rank in a class skill takes {progression.levels.skill_cost[0]:bare} skill point. One rank in a cross-class skill takes {progression.levels.skill_cost[1]:bare} skill points."
source = "K1's executable (D20's rule)"
see = "sim::levels::Classes::take"
applies = ["kind:player", "kind:companion"]

[levels.rank_cap_over]
