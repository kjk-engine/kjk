[chapter]
title = "Experience and Levels"
order = 60
summary = """
The party shares one pool of experience. A character with enough experience
gains a level in one of its classes. In TSL, party members lean toward the
player's alignment as far as their influence allows.
"""

[experience]
title = "Experience"
summary = """
Every player character and every available party member shares the party's
experience. A defeated enemy gives experience by the main character's level
and the enemy's challenge rating. Quests and conversations give experience
as the story advances. In K1, level 2 requires 1,000 XP and level 20
requires 190,000 XP.
"""
detail = """
Every gain or loss of experience is shown to every player. In KOTOR II a
defeated enemy's experience reads the row of the level the main character's
experience reaches and the enemy's rating, each at most
{progression.experience.tsl_most:bare}; an enemy scaled to the party rates
as the main character's level when it appeared plus its scaling's change;
the result is scaled by the game's experience percentage and rounded up.
"""

[experience.tsl_most]
name = "KOTOR II Experience Table Limit"
type = "usize"
value = 30
range = [1, 50]
summary = "KOTOR II reads a defeated enemy's experience at level and challenge rating {progression.experience.tsl_most:bare} at most."
source = "TSL's executable (CSWSCreature::CalculateDeathExperience: xptable.2da's row min(level - 1, 30), column min(rating + 1, 31) past `level`)"
see = "sim::script::xp::Experience::tsl_kill"

[levels]
title = "Gaining a Level"
summary = """
Each level adds the class's hit die + Constitution modifier + Toughness to
maximum vitality points, at least {progression.levels.least_hp:bare}, and
the class's Force die to maximum Force points. Base attack bonus, saving
throws and Defense rise by the class's tables. Every
{progression.levels.ability_every:bare}th level adds +1 to an ability
score.

A level gives the class's skill points + Intelligence modifier
(÷ {progression.levels.k1_points_divisor:bare} in K1), at least
{progression.levels.least_skill_points:bare}; a character's first level
gives {progression.levels.first_level_times:bare} times as many. A rank
costs {progression.levels.skill_cost[0]:bare} point in a class skill and
{progression.levels.skill_cost[1]:bare} in a cross-class skill. A class
skill may have at most the character's level +
{progression.levels.rank_cap_over:bare} ranks, a cross-class skill that
maximum ÷ {progression.levels.cross_class_cap_divisor:bare}.
"""
detail = """
Feats and Force powers are offered by the class's tables. Automatic level
up raises the class's primary ability and takes the recommended skills,
feats and powers.
"""
applies = ["kind:player", "kind:companion"]

[levels.ability_every]
name = "Ability Score Increase"
type = "u8"
value = 4
range = [1, 20]
summary = "Every {progression.levels.ability_every:bare}th level, a character adds +1 to an ability score."
source = "K1's executable (D20's rule)"
see = "sim::levels::Classes::offer"
applies = ["kind:player", "kind:companion"]

[levels.first_level_times]
name = "First Level Skill Points"
type = "i32"
value = 4
unit = "×"
range = [1, 10]
summary = "A character's first level gives {progression.levels.first_level_times:bare} times the skill points of a level."
source = "character creation, as reone's screen and TSL's level-up stats count it"
see = "sim::levels::Classes::skill_points"
applies = ["kind:player"]

[levels.k1_points_divisor]
name = "K1 Skill Points"
type = "i32"
value = 2
range = [1, 4]
summary = "In K1, a level's skill points (the class's + Intelligence modifier) are divided by {progression.levels.k1_points_divisor:bare}."
source = "K1's level-up screen"
see = "sim::levels::Classes::skill_points"
applies = ["kind:player", "kind:companion"]

[levels.least_skill_points]
name = "Fewest Skill Points"
type = "i32"
value = 1
unit = "points"
range = [0, 10]
summary = "A level gives at least {progression.levels.least_skill_points:bare} skill point, whatever the Intelligence modifier."
source = "K1's level-up screen"
see = "sim::levels::Classes::skill_points"
applies = ["kind:player", "kind:companion"]

[levels.skill_cost]
name = "Skill Rank Cost"
type = "u8"
value = [1, 2]
unit = "points"
labels = ["class skill", "cross-class skill"]
range = [1, 10]
summary = "A rank costs {progression.levels.skill_cost[0]:bare} skill point in a class skill and {progression.levels.skill_cost[1]:bare} in a cross-class skill."
source = "K1's executable (D20's rule)"
see = "sim::levels::Classes::take"
applies = ["kind:player", "kind:companion"]

[levels.rank_cap_over]
name = "Maximum Ranks"
type = "u8"
value = 3
range = [0, 40]
summary = "A class skill may have at most the character's level + {progression.levels.rank_cap_over:bare} ranks."
source = "K1's executable (D20's rule)"
see = "sim::levels::Classes::most"
applies = ["kind:player", "kind:companion"]

[levels.cross_class_cap_divisor]
name = "Maximum Cross-Class Ranks"
type = "u8"
value = 2
range = [1, 4]
summary = "A cross-class skill may have at most the class skill maximum ÷ {progression.levels.cross_class_cap_divisor:bare}."
source = "K1's executable (D20's rule)"
see = "sim::levels::Classes::most"
applies = ["kind:player", "kind:companion"]

[levels.least_hp]
name = "Fewest Vitality Points"
type = "i32"
value = 1
unit = "HP"
range = [0, 20]
summary = "A level adds at least {progression.levels.least_hp:bare} vitality point, whatever the Constitution modifier."
source = "K1's executable (D20's rule)"
see = "sim::levels::Classes::take"
applies = ["kind:player", "kind:companion"]

[tsl_grants]
title = "Granted Forms and Powers"
summary = """
In TSL, a Jedi gains a Form at total Jedi level
{progression.tsl_grants.first_form_level:bare} and at each of the next three
levels; prestige class levels count. Each prestige class grants its own
powers at set class levels.
"""
detail = """
Jedi Guardian: Shii-Cho, Makashi, Soresu, Force Focus. Jedi Consular:
Shii-Cho, Force Focus, Makashi, Soresu. Jedi Sentinel: Shii-Cho, Soresu,
Force Focus, Makashi. Jedi Master and Sith Lord gain powers at levels 1, 5,
9, 13 and 17; Jedi Watchman and Sith Assassin at 1, 7 and 13; Sith Marauder
at 1, 5 and 9.
"""
applies = ["spell:FORM_SABER_I_SHII_CHO", "spell:FORM_SABER_II_MAKASHI", "spell:FORM_SABER_III_SORESU", "spell:FORM_FORCE_I_FOCUS", "class:JediGuardian", "class:JediConsular", "class:JediSentinel", "class:JediMaster", "class:JediWatchman", "class:SithMarauder", "class:SithLord", "class:SithAssassin"]

[tsl_grants.first_form_level]
name = "First Form"
type = "u32"
value = 11
range = [1, 50]
summary = "A Jedi gains a first Form at total Jedi level {progression.tsl_grants.first_form_level:bare}."
source = "TSL's executable"
see = "sim::levels::granted_powers"
applies = ["spell:FORM_SABER_I_SHII_CHO", "class:JediGuardian", "class:JediConsular", "class:JediSentinel"]

[creation]
title = "Character Creation"
summary = """
A new character has {progression.creation.points} to spend on ability
scores. Each score starts at {progression.creation.lowest:bare} and may be
raised to {progression.creation.highest:bare}. Raising a score costs its
modifier in points, at least {progression.creation.raise_cost[0]:bare} and
at most {progression.creation.raise_cost[1]:bare}. A new character starts
at alignment {progression.creation.neutral:bare}.
"""
detail = "A new character knows no Force powers and starts with no equipment."
applies = ["kind:player"]

[creation.points]
name = "Ability Points"
type = "u8"
value = 30
unit = "points"
range = [0, 120]
summary = "A new character has {progression.creation.points} to spend on ability scores."
source = "K1's character creation"
see = "sim::creation::sheet"
applies = ["kind:player"]

[creation.lowest]
name = "Lowest Score"
type = "u8"
value = 8
range = [1, 18]
summary = "Each ability score starts at {progression.creation.lowest:bare}, the lowest it may be."
source = "K1's character creation"
see = "sim::creation::spent"
applies = ["kind:player"]

[creation.highest]
name = "Highest Score"
type = "u8"
value = 18
range = [8, 40]
summary = "At creation, an ability score may be raised to at most {progression.creation.highest:bare}."
source = "K1's character creation"
see = "sim::creation::spent"
applies = ["kind:player"]

[creation.neutral]
name = "Starting Alignment"
type = "u8"
value = 50
range = [0, 100]
summary = "A new character starts at alignment {progression.creation.neutral:bare}, between the Dark Side (0) and the Light Side (100)."
source = "K1's character creation"
see = "sim::creation::unmade"
applies = ["kind:player"]

[creation.raise_cost]
name = "Score Cost"
type = "i32"
value = [1, 3]
unit = "points"
labels = ["least", "most"]
range = [0, 10]
summary = "Raising an ability score costs its modifier in points, at least {progression.creation.raise_cost[0]:bare} and at most {progression.creation.raise_cost[1]:bare}."
source = "K1's character creation"
see = "sim::creation::cost"
applies = ["kind:player"]

[party]
title = "Party Size"
summary = """
The party is the leader and up to {progression.party.followers:bare} party
members. In TSL, puppets such as Bao-Dur's remote follow their owners, up to
{progression.party.puppets_joined:bare} at once.
"""
detail = "A party member who leaves keeps its items, levels and experience."
applies = ["kind:companion"]

[party.followers]
name = "Party Members"
type = "usize"
value = 2
range = [0, 11]
summary = "Up to {progression.party.followers:bare} party members travel with the leader."
source = "K1's executable"
see = "sim::script::party::Party"
applies = ["kind:companion"]

[party.puppets_joined]
name = "Puppets"
type = "usize"
value = 2
range = [0, 3]
summary = "In TSL, up to {progression.party.puppets_joined:bare} puppets may be in the party at once."
source = "TSL's executable"
see = "sim::script::party::Party"
applies = ["kind:companion"]

[influence]
title = "Influence"
summary = """
In TSL, a party member's alignment moves toward the player's while its
influence is high and away from it while low, by how far the player stands
from neutral. Influence starts at {progression.influence.start:bare} and is
at most {progression.influence.most:bare}. The player's Charisma modifier
×{progression.influence.charisma_times:bare} adds to influence. A Sith Lord
with Dark Side Corruption (alignment {progression.influence.dark_at_most:bare}
or less) or a Jedi Master with Light Side Enlightenment
({progression.influence.light_at_least:bare} or more) pulls harder as the
prestige class rises.
"""
detail = "Kreia's alignment does not change."
applies = ["feat:DARK_SIDE_CORRUPTION", "feat:LIGHT_SIDE_ENLIGHTENMENT", "class:SithLord", "class:JediMaster", "kind:companion"]

[influence.start]
name = "Starting Influence"
type = "u8"
value = 50
range = [0, 100]
summary = "A party member's influence starts at {progression.influence.start:bare}."
source = "TSL's executable (`CSWPartyTable`)"
see = "sim::script::engine"
applies = ["kind:companion"]

[influence.most]
name = "Maximum Influence"
type = "u8"
value = 100
range = [1, 255]
summary = "A party member's influence is at most {progression.influence.most:bare}."
source = "TSL's executable"
see = "sim::script::engine"
applies = ["kind:companion"]

[influence.charisma_times]
name = "Charisma Bonus"
type = "i32"
value = 3
unit = "×"
range = [0, 10]
summary = "The player's Charisma modifier {progression.influence.charisma_times} adds to each party member's influence."
source = "TSL's executable"
see = "sim::script::influence::Presence::push"
applies = ["kind:companion"]

[influence.dark_at_most]
name = "Dark Side Pull"
type = "u8"
value = 40
range = [0, 100]
summary = "Dark Side Corruption pulls party members harder while the player's alignment is {progression.influence.dark_at_most:bare} or less."
source = "TSL's executable"
see = "sim::script::influence::Presence::push"
applies = ["feat:DARK_SIDE_CORRUPTION", "class:SithLord"]

[influence.light_at_least]
name = "Light Side Pull"
type = "u8"
value = 60
range = [0, 100]
summary = "Light Side Enlightenment pulls party members harder while the player's alignment is {progression.influence.light_at_least:bare} or more."
source = "TSL's executable"
see = "sim::script::influence::Presence::push"
applies = ["feat:LIGHT_SIDE_ENLIGHTENMENT", "class:JediMaster"]

[influence.prestige_levels]
name = "Pull Levels"
type = "u8"
value = [6, 10, 14, 18]
labels = ["first step", "second", "third", "fourth"]
range = [1, 50]
summary = "A Sith Lord's or Jedi Master's pull grows at class levels {progression.influence.prestige_levels}."
source = "TSL's executable's steps"
see = "sim::script::influence::by_level"
applies = ["class:SithLord", "class:JediMaster"]

[influence.prestige_push]
name = "Pull Strength"
type = "f32"
value = [1.2, 1.4, 1.6, 1.8, 2.0]
unit = "×"
labels = ["to the first step", "to the second", "to the third", "to the fourth", "past it"]
range = [1.0, 10.0]
summary = "A Sith Lord's or Jedi Master's pull on party members, by class level: {progression.influence.prestige_push}."
source = "TSL's executable's steps"
see = "sim::script::influence::by_level"
applies = ["class:SithLord", "class:JediMaster", "feat:DARK_SIDE_CORRUPTION", "feat:LIGHT_SIDE_ENLIGHTENMENT"]
