type = "u8"
value = 3
range = [0, 40]
summary = "A class skill can have at most as many ranks as the character's level plus {progression.levels.rank_cap_over:bare}."
source = "K1's executable (D20's rule)"
see = "sim::levels::Classes::most"
applies = ["kind:player", "kind:companion"]

[levels.cross_class_cap_divisor]
