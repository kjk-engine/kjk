[party]
title = "Party Size"
summary = """
The party is the leader and up to {progression.party.followers:bare} party
members. In KOTOR 2, some party members have a puppet that follows them,
such as Bao-Dur's remote. Up to {progression.party.puppets_joined:bare}
puppets can be in the party at once.
"""
detail = "A party member who leaves the party keeps its items, levels and experience."
applies = ["kind:companion"]

[party.followers]
name = "Party Members"
type = "usize"
value = 2
range = [0, 11]
summary = "Up to {progression.party.followers:bare} party members travel with the leader."
source = "K1's executable"
see = "sim::script::party::Party"
applies = ["kind:companion"]

[party.puppets_joined]
name = "Puppets"
type = "usize"
value = 2
range = [0, 3]
summary = "In KOTOR 2, up to {progression.party.puppets_joined:bare} puppets can be in the party at once."
source = "TSL's executable"
see = "sim::script::party::Party"
applies = ["kind:companion"]

[influence]
title = "Influence"
summary = """
In KOTOR 2, each party member has an influence score with the player.
While a party member's influence is above 50, its alignment moves toward
the player's alignment. While its influence is below 50, its alignment
moves away from the player's alignment. The farther the player's alignment
is from neutral, the stronger this effect is. Influence starts at
{progression.influence.start:bare} and can be at most
{progression.influence.most:bare}. The player's Charisma modifier,
multiplied by {progression.influence.charisma_times:bare}, is added to
every party member's influence for this purpose.

A Sith Lord with Dark Side Corruption pulls party members harder while the
player's alignment is {progression.influence.dark_at_most:bare} or less. A
Jedi Master with Light Side Enlightenment pulls party members harder while
the player's alignment is {progression.influence.light_at_least:bare} or
more. This pull grows as the player gains levels in the prestige class.
"""
detail = "Kreia's alignment never changes."
applies = ["feat:DARK_SIDE_CORRUPTION", "feat:LIGHT_SIDE_ENLIGHTENMENT", "class:SithLord", "class:JediMaster", "kind:companion"]

