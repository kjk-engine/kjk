value = 2
range = [1, 4]
summary = "A cross-class skill can have at most the class skill maximum divided by {progression.levels.cross_class_cap_divisor:bare}."
source = "K1's executable (D20's rule)"
see = "sim::levels::Classes::most"
applies = ["kind:player", "kind:companion"]

[levels.least_hp]
name = "Fewest Vitality Points"
type = "i32"
value = 1
unit = "HP"
range = [0, 20]
summary = "A level adds at least {progression.levels.least_hp:bare} vitality point, however low the Constitution modifier is."
source = "K1's executable (D20's rule)"
see = "sim::levels::Classes::take"
applies = ["kind:player", "kind:companion"]

[tsl_grants]
title = "Granted Forms and Powers"
summary = """
In KOTOR 2, a Jedi learns a lightsaber or Force form at Jedi level
{progression.tsl_grants.first_form_level:bare}. The Jedi learns another form
at each of the next three levels. Levels in a prestige class count toward
the Jedi level. Each prestige class also grants its own powers at certain
class levels.
"""
detail = """
A Jedi Guardian learns Shii-Cho, Makashi, Soresu and Force Focus, in that
order. A Jedi Consular learns Shii-Cho, Force Focus, Makashi and Soresu. A
Jedi Sentinel learns Shii-Cho, Soresu, Force Focus and Makashi. A Jedi
Master and a Sith Lord gain powers at class levels 1, 5, 9, 13 and 17. A
Jedi Watchman and a Sith Assassin gain powers at class levels 1, 7 and 13.
A Sith Marauder gains powers at class levels 1, 5 and 9.
"""
applies = ["spell:FORM_SABER_I_SHII_CHO", "spell:FORM_SABER_II_MAKASHI", "spell:FORM_SABER_III_SORESU", "spell:FORM_FORCE_I_FOCUS", "class:JediGuardian", "class:JediConsular", "class:JediSentinel", "class:JediMaster", "class:JediWatchman", "class:SithMarauder", "class:SithLord", "class:SithAssassin"]

[tsl_grants.first_form_level]
name = "First Form"
type = "u32"
value = 11
range = [1, 50]
summary = "A Jedi learns a first form at Jedi level {progression.tsl_grants.first_form_level:bare}."
source = "TSL's executable"
see = "sim::levels::granted_powers"
applies = ["spell:FORM_SABER_I_SHII_CHO", "class:JediGuardian", "class:JediConsular", "class:JediSentinel"]

[creation]
title = "Character Creation"
summary = """
A new character has {progression.creation.points} to spend on ability
scores. Each score starts at {progression.creation.lowest:bare} and can be
raised to at most {progression.creation.highest:bare}. Raising a score by 1
takes as many points as the score's current modifier. This is at least
{progression.creation.raise_cost[0]:bare} point and at most
{progression.creation.raise_cost[1]:bare} points. A new character starts at
alignment {progression.creation.neutral:bare}.
"""
detail = "A new character knows no Force powers and starts with no equipment."
applies = ["kind:player"]

