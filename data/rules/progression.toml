type = "i32"
value = 2
range = [1, 4]
summary = "In KOTOR, the skill points of a level are divided by {progression.levels.k1_points_divisor:bare}. The skill points of a level are the class's skill points plus the Intelligence modifier."
source = "K1's level-up screen"
see = "sim::levels::Classes::skill_points"
applies = ["kind:player", "kind:companion"]

[levels.least_skill_points]
name = "Fewest Skill Points"
type = "i32"
value = 1
unit = "points"
range = [0, 10]
summary = "A level grants at least {progression.levels.least_skill_points:bare} skill point, however low the Intelligence modifier is."
source = "K1's level-up screen"
see = "sim::levels::Classes::skill_points"
applies = ["kind:player", "kind:companion"]

[levels.skill_cost]
