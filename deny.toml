# `cargo deny check licenses bans sources`: every crate kjk is built from
# carries a licence on this list, and comes from crates.io. The same list is
# `about.toml`'s, which writes the binaries' THIRD-PARTY-LICENSES.html.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    # clipboard-win and error-code: the system clipboard on Windows.
    "BSL-1.0",
    # File-level copyleft: symphonia and triple_buffer, unmodified, with a
    # link to their source in THIRD-PARTY-LICENSES.html.
    "MPL-2.0",
]

# Our own crates are MIT and never published.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
